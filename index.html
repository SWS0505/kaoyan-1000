  {id:303,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"下列现象中掩盖资本主义剥削关系实质或程度的有",options:["A. 工资表现为“劳动的价格”","B. 剩余价值取得了利润的形态","C. 利润转化为平均利润","D. 资本家与工人形式上的“自由”“平等”的关系"],answer:"ABCD",explanation:"精 讲P 7 ~ 7 考 点 7 在资本主义制度下，工人的工资是劳 动力的价值或价格，这是资本主义工资的本 质。资本家购买工人的劳动力是以货币工 资形式支付的，工资表现为“劳动的价格” 或工人全部劳动的报酬，这就模糊了工人 必要劳动和剩余劳动的界限，掩盖了资本 主义剥削关系。A 正确。在现实的资本主 义经济生活中，资本家并不把剩余价值看作 可变资本的产物，而是把它看作全部预付资 本的产物或增加额，剩余价值便取得了利润 的形态。剩余价值是利润的本质，利润是剩 余价值的转化形式。当剩余价值转化为利 润时，剩余价值和可变资本的关系便被掩 盖了。B正确。利润转化为平均利润，实际 上是全社会的剩余价值在各部门的资本家 之间重新分配的过程。剩余价值在各个生 产部门之间重新分配的结果，表现为等量资 本获得等量利润。利润转化为平均利润进 一步掩盖了资本主义的剥削关系。C 正确。 与以往的剥削制度不同，资本家与雇佣工人 的关系不是完全占有，也不是人身依附，而 是基于劳动者人身自由基础上的“平等”关 系，剥削带有一定的隐蔽性。D 正确。"},
  {id:304,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"在现实的资本主义经济生活中，资本家把剩余价值看作全部预付资本的产物或增加额，这就使得",options:["A. 剩余价值转化为利润","B. 商品价值转化为生产价格","C. 剩余价值与可变资本的关系被掩盖了","D. 利润率总是大于剩余价值率"],answer:"AC",explanation:"利润转化为平均利润，价值才转化为 生产价格。B 错误。利润率是剩余价值与 全部预付资本之比[m/(c+v)], 剩余价值率 是剩余价值与可变资本之比( m/v) 。 因为 全部预付资本总是大于可变资本(c+v>0), 使得利润率总是小于剩余价值率。D 错误。 A、C正确。"},
  {id:305,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"资本主义生产的目的是获得利润。不同生产部门的资本家之间为了得到尽可能多的利润必然展 开激烈的竞争从而导致利润平均化。平均利润形成后",options:["A. 商品价值就转化为生产价格","B. 价值规律的实现形式发生了变化","C. 生产价格不再随着商品价值的变化而变动","D. 每一个部门获得的利润都等于该部门生产的剩余价值"],answer:"AB",explanation:"利润转化为平均利润，价值也就转化 为生产价格。生产价格是商品价值的转化 形式，是生产成本与平均利润之和。A 正 确。生产价格随着商品价值的变化而变动， 生产商品的社会必要劳动时间减少，生产价 格就会降低；反之，生产价格就会提高。C 错误。生产价格是价值的转化形式，商品按 照生产价格而不是价值出售并不违背价值 规律，而是价值规律的实现形式发生了变 化。虽然从个别部门来看，资本家获得的平 均利润与本部门工人创造的剩余价值可能 不一致，但从全社会来看，整个资本家阶级 获得的利润总额与雇佣工人所创造的剩余 价值总额是相等的。B 正确，D错误。"},
  {id:306,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"马克思通过分析剩余价值的生产、积累、流通以及分配过程，揭示了痢余价值的运动规律及其 作用，创立了剩余价值理论。剩余价值理论",options:["A. 深刻揭露了资本主义生产关系的剥削本质","B. 阐明了资产阶级与无产阶级之间阶级斗争的经济根源","C. 指出了无产阶级革命的历史必然性","D. 是“理解政治经济学的枢纽”"],answer:"ABC",explanation:"剩余价值理论深刻揭露了资本主义 生产关系的剥削本质，阐明了资产阶级与 无产阶级之间阶级斗争的经济根源，指出 了无产阶级革命的历史必然性。剩余价值 理论是马克思经济学说的核心内容和基石， 是无产阶级反对资产阶级、揭示资本主义制 度剥削本质的锐利武器。由于唯物史观和 剩余价值理论的发现，社会主义由空想变为 科学。A、B、C正确。劳动二重性理论是“理 解政治经济学的枢纽”。D 错误。"},
  {id:307,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"“要赢得选举，需要两样东西，一是金钱，第二个我就记不得了。”100多年前美国竞选专家 马克 ·汉纳的话，不仅道出了当初的真相，而且至今依然不断被事实所证明。据统计，2024 年美国总统选举竞选总开销至少达到159亿美元，是美国史上最贵选举。以上材料说明",options:["A. 资本主义的民主是金钱操纵下的民主","B. 资本主义政治制度中的选举事实上是有钱人的游戏","C. 法律名义上的平等掩盖着事实上的不平等","D. 资本主义政治制度始终阻碍着社会进步和社会生产力的大幅度发展"],answer:"ABC",explanation:"资本主义政治制度的形成和发展在 人类社会历史的发展进程中曾经起过重要 的进步作用，D 错误(不是“始终阻碍”)。 A、B、C正确。"},
  {id:308,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"资本主义国家法律制度的核心是宪法，资本主义宪法所依据的基本原则有",options:["A. 私有制原则","B. 主权在民原则","C. 分权制衡原则","D. 人权原则"],answer:"ABCD",explanation:"· 定时期内背离生产价格和价值。但是，从全 社会看，整个社会商品的价值仍然是由生产 它们的社会必要劳动时间决定的，垄断价格 既不能增加也不能减少整个社会所生产的 价值总量，它只是对商品价值和剩余价值作 了有利于垄断资本的再分配。A、B、C 正确， D错误。"},
  {id:309,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"资产阶级在长期的反对封建专制主义和宗教神学的斗争中逐步形成和发展起来的各种资产阶级 的思想理论和观念，在资本主义国家产生之后由统治阶级根据自己政治统治的需要，形成了资 本主义国家的意识形态。资本主义国家的意识形态",options:["A. 是全体社会成员的共同意识","B. 大部分内容是没有阶级性的","C. 为资本主义的经济基础服务","D. 是资产阶级的阶级意识的集中体现"],answer:"CD",explanation:"资本主义意识形态是资本主义社会的 观念上层建筑，是为资本主义的经济基础和 资本主义国家的政治上层建筑服务的。资本 主义意识形态是资产阶级的阶级意识的集中 体现，它把资产阶级的阶级意识内化为本阶 级成员的基本信念。C、D正确，A、B 错误。 垄断组织操纵价格带来的结果是抑 制了市场上价格的自由波动，垄断价格一"},
  {id:310,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"关于生产集中和资本集中及其后果，以下认识正确的有",options:["A. 生产集中和资本集中是资本家追求剩余价值的结果","B. 生产集中和资本集中发展到一定阶段必然引起垄断","C. 生产集中和资本集中是最简单的、初级的垄断组织形式","D. 自由竞争引起生产集中和资本集中"],answer:"ABD",explanation:"垄断组织操纵价格带来的结果是抑 制了市场上价格的自由波动，垄断价格一定 时期内背离生产价格和价值。但是，从全社 会看，整个社会商品的价值仍然是由生产它 A、B、D 正确。最简单的、初级的垄 断组织形式是短期价格协定，即几个企业在 短期内订立一种或几种产品的售价协定，所 有参加方必须遵守协定所规定的商品销售 价格。C 错误。"},
  {id:311,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"垄断并不能消除竞争，反而使竞争变得更加复杂和剧烈。垄断条件下的竞争包括",options:["A. 垄断组织内部的竞争","B. 垄断组织之间的竞争","C. 垄断组织同非垄断组织之间的竞争","D. 垄断资本家集团之间的竞争"],answer:"ABCD",explanation:"们的社会必要劳动时间决定的，垄断价格 既不能增加也不能减少整个社会所生产的 价值总量，它只是对商品价值和剩余价值作 了有利于垄断资本的再分配。从全社会看， 商品的价格总额仍然等于商品的价值总额。 所以，垄断价格的产生没有否定价值规律， 它是价值规律在垄断资本主义阶段作用的 具体体现。A、C、D 正确。垄断高价和垄断 低价都是垄断组织通过强行规定获取的垄 断利润，不存在数额相等的问题。垄断组 织通过垄断高价和垄断低价获得的是一些 其他企业特别是非垄断企业的利润。 B 错误。"},
  {id:312,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"金融资本是由工业垄断资本和银行垄断资本融合在一起而形成的一种垄断资本。金融资本形成 的主要途径包括",options:["A. 金融联系","B. 资本参与","C. 行政干预","D. 人事参与"],answer:"ABD",explanation:"（本题解析见原书解析分册）"},
  {id:313,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"垄断资本所获得的高额利润，归根到底来自无产阶级和其他劳动人民所创造的剩余价值，具体 来说，垄断利润的来源包括",options:["A. 加强对本国无产阶级和其他劳动人民的剥削","B. 通过控制市场获得一些其他企业特别是非垄断企业的利润","C. 加强对其他国家劳动人民的剥削和掠夺","D. 通过资本主义国家政权进行有利于垄断资本的再分配"],answer:"ABCD",explanation:"67 考研政治 1000题 解析分册 ·"},
  {id:314,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"垄断利润主要是通过垄断组织制定的垄断价格来实现的。垄断价格包括垄断高价和垄断低价两 种形式。垄断高价是指垄断组织出售商品时规定的高于生产价格的价格，垄断低价是指垄断组 织在购买非垄断企业所生产的原材料等生产资料时规定的低于生产价格的价格。垄断组织操纵 价格带来的结果是",options:["A. 抑制了市场上价格的自由波动","B. 垄断价格一定时期内背离生产价格和价值","C. 对商品价值和剩余价值作了有利于垄断资本的再分配","D. 整个社会商品的价值不再是由生产它们的社会必要劳动时间决定"],answer:"ABC",explanation:"（本题解析见原书解析分册）"},
  {id:315,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"垄断利润主要是通过垄断组织制定的垄断价格来实现的。但是，垄断价格的产生没有否定价值 规律，这是因为，从全社会看",options:["A. 整个社会商品的价值仍然是由生产它们的社会必要劳动时间决定的","B. 垄断低价低于原材料生产价格的部分仍然等于垄断高价高于出售商品生产价格的部分","C. 垄断价格既不能增加也不能减少整个社会所生产的价值总量","D. 商品的价格总额仍然等于商品的价值总额"],answer:"ACD",explanation:"（本题解析见原书解析分册）"},
  {id:316,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"国家垄断资本主义是国家政权和私人垄断资本融合在一起的垄断资本主义。国家垄断资本主义 的形成和发展不是偶然的，它产生的原因主要是",options:["A. 社会生产力的发展，要求资本主义生产资料在更大范围内被支配","B. 经济波动和经济危机的深化，推动国家垄断资本主义的产生","C. 社会主义阵营初步显示的优越性，迫使资产阶级对资本主义制度进行改良","D. 缓和社会矛盾、协调利益关系的需求，促使国家垄断资本主义的产生"],answer:"ABD",explanation:"A、B、D正确。垄断是在自由竞争中形 成的，是作为自由竞争的对立面产生的。 C错误。 A、B、D 正确。“社会主义制度初步 显示的优越性对资本主义产生了重要影响” 是第二次世界大战后资本主义发生变化的 原因之一，与题干无关。而且，早在第一次 世界大战期间国家垄断资本主义就已经产 生，而社会主义阵营是在二战后才形成的。 C 错误。"},
  {id:317,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"国家垄断资本主义的主要形式有",options:["A. 国家所有并直接经营企业","B. 国家与私人共有、合营企业","C. 国家通过多种形式参与私人垄断资本的再生产过程","D. 宏观调节和微观规制"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:318,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"国家垄断资本主义是国家政权和私人垄断资本融合在一起的垄断资本主义。第二次世界大战 后，在所有发达资本主义国家，国家垄断资本主义无论在广度上还是深度上都有了更迅速、更 普遍的发展。国家通过多种形式参与私人垄断资本的再生产过程是国家垄断资本主义的主要形 式之一，其方式主要包括",options:["A. 国家运用财政政策、货币政策等经济手段，对社会总供给和总需求进行调节","B. 国家向私人垄断企业大量订货，为私人垄断企业提供有保证的国家市场","C. 国家通过各种形式的津贴和补助，直接、间接地资助私人垄断企业","D. 国家通过社会福利开支扩大消费需求，为私人垄断企业创造市场条件"],answer:"BCD",explanation:"A 项是宏观调节的内容，不符合题目 所问的“国家通过多种形式参与私人垄断资 本的再生产过程”,正确答案是B、C、D。"},
  {id:319,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"20世纪70年代初，由于资本主义发展不平衡的加深和国际货币体系内在矛盾的激化，布雷顿 森林体系崩溃。随后，西方国家普遍走上金融自由化和金融创新的道路。金融垄断资本通过形 形色色的金融衍生工具在金融市场呼风唤雨、巧取豪夺，使财富以惊人的速度膨胀。在金融垄 断资本的推动下",options:["A. 金融业在国民经济中的地位大幅上升","B. 实体经济部门不得不把利润的一部分投向金融领域","C. 制造业就业人数严重减少，以金融为核心的服务业就业人数逐步增加","D. 虚拟经济越来越脱离实体经济"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:320,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"垄断资本在国内建立了垄断统治后，必然要把其统治势力扩展到国外，建立国际垄断统治。垄 断资本向世界范围扩展的基本形式有",options:["A. 技术资本输出","B. 借贷资本输出","C. 生产资本输出","D. 商品资本输出"],answer:"BCD",explanation:"垄断资本向世界范围扩展的基本形 式有三种：第一种是借贷资本输出，即由资 本主义国家的政府、银行、企业把资本贷给 其他国家的政府、银行、企业。第二种是生 产资本输出，即在国外直接投资，独立创办 企业，与国外资本合营，或者收购国外已有 的企业等。第三种是商品资本输出，即把商 品卖到世界各地，不断扩大市场，获取高额 利润。从输出资本的主体看，主要有两 种：一种是私人资本输出，另一种是国家 资本输出。B、C、D正确，A错误。"},
  {id:321,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"垄断资本在国内建立了垄断统治后，必然要把其统治势力扩展到国外，建立国际垄断统治。垄 断资本向世界范围扩展的主要经济动因是",options:["A. 将国内过剩的资本输出，以便在国外谋求高额利润","B. 将部分非要害的技术转移到国外，以取得在别国的垄断优势","C. 争夺商品销售市场，确保原材料和能源的可靠来源","D. 转移经济危机风险，化解生产社会化与生产资料资本主义私人占有之间的矛盾"],answer:"ABC",explanation:"垄断资本在国内建立了垄断统治后， 必然要把其统治势力扩展到国外，建立国际 垄断统治。垄断资本向世界范围扩展的主 要经济动因包括：1将国内过剩的资本输 出，以便在国外谋求高额利润；②将部分非 要害的技术转移到国外，以取得在别国的垄 断优势，攫取高额垄断利润；3争夺商品销 售市场；4 确保原材料和能源的可靠来源。 这些经济上的动因与垄断资本主义在政治 上、文化上、外交上的利益紧密联系在一起， 交织发挥作用，共同促进了垄断资本向世界 范围的扩展。A、B、C正确。D 错误。"},
  {id:322,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"各资本主义国家的垄断组织，通过订立协议建立起国际垄断资本的联盟，即国际垄断同盟，以 便在世界范围形成垄断，并在经济上瓜分世界。以下说法正确的有",options:["A. 国际垄断同盟在经济上瓜分世界是通过垄断组织间的协议实现的","B. 早期的国际垄断同盟主要是跨国公司","C. 当代国际垄断同盟的形式以国际卡特尔和国家垄断资本主义的国际联盟为主","D. 国家垄断资本主义的国际联盟是由一些资本主义国家的政府出面缔结协定所组成的国际经 济集团"],answer:"AD",explanation:"早期的国际垄断同盟主要是国际卡 特尔。B 错误。当代国际垄断同盟的形式 以国家垄断资本主义的国际联盟为主，国家 垄断资本主义的国际联盟是由一些资本主 义国家的政府出面缔结协定所组成的国际 经济集团。C 错误。A、D正确。"},
  {id:323,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"导致经济全球化迅猛发展的因素主要有",options:["A. 科学技术的进步和生产力的发展","B. 跨国公司的发展","C. 各国经济体制的变革和国际经济组织的发展","D. 发展中国家的斗争"],answer:"ABC",explanation:"（本题解析见原书解析分册）"},
  {id:324,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"第二次世界大战后，资本主义生产资料所有制发生了新的变化，国家资本所有制形成并发挥重 要作用。国家资本所有制",options:["A. 取代法人资本所有制成为居主导地位的资本所有制形式","B. 主要存在于基础设施和公共事业部门","C. 对整个社会经济的发展有着重要的影响","D. 体现着总资本家剥削雇佣劳动者的关系"],answer:"BCD",explanation:"国家资本所有制在整个资本主义经 济中所占的比重并不大，但是由于主要存在 于基础设施和公共事业部门，所以对整个社 会经济的发展有着重要的影响。国家资本 所有制就其性质而言仍然是资本主义形式， 体现着总资本家剥削雇佣劳动者的关系。 B、C、D正确。第二次世界大战后，资本主义 生产资料所有制发生了新的变化，这就是国 家资本所有制形成并发挥重要作用，法人资 本所有制崛起并成为居主导地位的资本所 有制形式。A 错误。"},
  {id:325,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"第二次世界大战后，资本主义生产资料所有制发生了新的变化，法人资本所有制崛起并成为居 主导地位的资本所有制形式。法人资本所有制",options:["A. 主要存在于当代资本主义经济生活中居支配地位的巨型公司中","B. 主要特点是资本占有主体多元化，公司资本的所有权与控制权不再统一","C. 在性质上是一种基于资本雇佣劳动的垄断资本集体所有制","D. 体现了资本剥削雇佣劳动的关系"],answer:"ACD",explanation:"马克思主义基本原理 · 多项选择题"},
  {id:326,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"第二次世界大战后资本主义国家在劳资关系和分配关系上出现的变化有",options:["A. 职工参与决策","B. 终身雇佣、职工持股","C. 建立并实施了普及化、全民化的社会福利制度","D. 建立职工选举管理者制度"],answer:"ABC",explanation:"资本主义国家没有也不可能建立职 工选举管理者制度，D错误。A、B、C正确。"},
  {id:327,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"第二次世界大战后，资本主义国家为尽快恢复国民经济，在继续发挥市场机制主导性作用的同 时，开始对经济进行全面干预。但是，从20世纪70年代起，随着资本主义经济陷入滞胀和新 自由主义思潮的泛滥，西方国家普遍走上强化市场调节、弱化政府干预的道路，即",options:["A. 通过国有企业私有化来提升经济竞争力","B. 通过福利制度改革，减少政府的财政负担","C. 通过政治制度多元化，扩大公民权利","D. 通过放松对经济和金融的管制，释放经济活力"],answer:"ABD",explanation:"从20世纪70年代起，随着资本主义 经济陷入滞胀和新自由主义思潮的泛滥，西 方国家普遍走上强化市场调节、弱化政府干 预的道路，即通过国有企业私有化来提升经 济竞争力；通过福利制度改革，减少政府的 财政负担；通过放松对经济和金融的管制， 释放经济活力。A、B、D 正确。“政治制度 出现多元化的趋势，公民权利有所扩大”属 于“政治制度的变化”的内容，C错误。"},
  {id:328,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"从20世纪70年代起，随着资本主义经济陷入滞胀和新自由主义思潮的泛滥，西方国家普遍走 上强化市场机制、弱化政府干预的道路。与此同时，经济危机呈现新的特点，包括",options:["A. 去工业化和产业空心化日趋严重","B. 两极分化和社会对立加剧","C. 周期性危机与结构性危机交织在一起","D. 虚拟经济与实体经济严重脱节"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:329,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"第二次世界大战后，由于多种社会因素的影响，资本主义发生了一系列变化。其中在政治制度 上的变化有",options:["A. 政治制度出现多元化的趋势，公民权利有所扩大","B. 通过建立政策咨询机构等方式允许民众直接参与政策的制定和执行","C. 普遍加强了法治建设，以便协调社会各阶级、阶层的利益","D. 改良主义政党在政治舞台上的影响日益扩大"],answer:"ACD",explanation:"A、C、D 正确。通过建立政策咨询机 构等方式对政府的政策施加影响体现的是 金融寡头(不是普通民众)对垄断资本主义 国家的控制和影响，B 错误。"},
  {id:330,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"第二次世界大战后资本主义出现的变化原因是多方面的，主要有",options:["A. 科学技术革命和生产力的发展，是资本主义发生变化的根本推动力量","B. 工人阶级争取自身权利和利益的斗争，是推动资本主义发生变化的重要力量","C. 社会主义制度初步显示的优越性对资本主义产生了重要影响","D. 主张改良主义的政党对资本主义制度的改革触动了资本主义基本经济制度"],answer:"ABC",explanation:"A、B、C 正确。主张改良主义的政党 对资本主义制度的改革，是在不触动资本主 义基本经济制度的前提下，对资本主义生产 关系的个别环节进行了改良，D错误。"},
  {id:331,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"第二次世界大战后，资本主义的变化是客观事实，正视这些变化，深刻分析这些变化的实质， 对于我们正确认识资本主义的本质，把握资本主义发展的趋势，具有重要的意义。从第二次世 界大战后资本主义发展的实际情况来看",options:["A. 资本主义生产关系的根本性质没有改变","B. 资本追逐剩余价值的本性没有改变","C. 获取剩余价值的方式和方法没有改变","D. 导致财富占有两极分化的制度基础没有改变"],answer:"ABD",explanation:"· A、B、D正确。从当代资本主义发展 的实际情况来看，生产资料私有制依然是资 本主义的基本经济制度，作为资本主义生产 方式本质特征的雇佣劳动制度依然存在并 运行着。资本追逐剩余价值的本性并没有 改变，改变的只是获取剩余价值的方式和方 法。C 错误。"},
  {id:332,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"进入21世纪以来，资本主义呈现出一些新变化、新特征，表现在",options:["A. 科技创新加速资本主义生产方式变化","B. 国际金融垄断资本主义影响日益显现","C. 社会阶级层级结构呈现复杂性、多样化","D. 发达资本主义国家凭借经济、科技、文化传播等超级优势，在世界范围内推行霸权主义和 强权政治"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:333,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"进入21世纪以来，资本主义呈现出一些新变化、新特征。科技创新加速资本主义生产方式变 化，这表现在",options:["A. 产业结构的调整","B. 生产组织和劳动形式的变化","C. 社会阶级层级结构呈现复杂性、多样化","D. 新经济形态的出现"],answer:"ABD",explanation:"科技创新加速资本主义生产方式变 化，表现在：①产业结构的调整。一般制造 业占比逐渐下降，高新技术产业和金融业所 占比重日趋上升。②生产组织和劳动形式 的变化。数据成为一种新的生产要素，数字 劳动在生产中的地位愈加突出。3新经济 形态的出现。数字经济、智能经济、共享经 69 20 考研政治1000 题 解析分册 · 济等已成为近年来全球经济发展的新形态。 A、B、D 正确。“社会阶级层级结构呈现复 杂性、多样化”和“科技创新加速资本主义生 产方式变化”并列，是进入21世纪以来资本 主义呈现出的4点新变化、新特征的内容， C错误。"},
  {id:334,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"进入21世纪以来，资本主义呈现出一些新变化、新特征。国际金融垄断资本主义影响日益显 现 ，国际金融资本的垄断成为当代资本主义最突出、最鲜明、最主要的特征，这表现在",options:["A. 金融垄断寡头化","B. 金融垄断国际化","C. 经济虚拟化","D. 产业空心化"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:335,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"当前，百年变局加速演进，国际格局和国际体系深刻调整，全球治理体系深刻变革，国际力量 对比正在发生近代以来最具革命性的变化，世界进入新的动荡变革期。资本主义社会问题加速 积累，资本主义国家内部的矛盾和冲突日益明显，表现为",options:["A. 经济发展失调","B. 政治体制失灵","C. 社会融合机制失效","D. 生态领域失控"],answer:"ABC",explanation:"（本题解析见原书解析分册）"},
  {id:336,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"2008年国际金融危机以来，西方主要资本主义国家采取各种措施应对危机，虽暂时避免了金 融秩序崩溃，但对推动经济复苏效果有限，经济发展仍然面临一系列问题，具体表现为",options:["A. 福利风险增加","B. 债务负担沉重","C. 社会流动性退化","D. 虚拟经济与实体经济发展失衡"],answer:"ABD",explanation:"A、B、D 正确。C 是社会融合机制失 效的表现，不符合题意。"},
  {id:337,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"社会主义从空想发展到科学，是因为马克思、恩格斯在新的历史条件下创立了",options:["A. 唯物史观","B. 剩余价值学说","C. 无产阶级革命学说","D. 无产阶级政党学说"],answer:"AB",explanation:"（本题解析见原书解析分册）"},
  {id:338,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"19世纪初期以圣西门、傅立叶 、欧文为代表的批判的空想社会主义者，他们",options:["A. 在理论上致力于对社会制度的分析","B. 对资本主义旧制度的辛辣批判，包含着许多切中要害的见解","C. 对社会主义新制度的描绘，闪烁着诸多天才的火花","D. 阐明了资本主义制度下雇佣奴隶制的本质，为启发工人觉悟提供了极为宝贵的材料"],answer:"ABC",explanation:"以三大空想社会主义者为代表人物 的空想社会主义学说，在理论上致力于对社 会制度的分析。他们对资本主义旧制度的 辛辣批判，包含着许多切中要害的见解；对 社会主义新制度的描绘，闪烁着诸多天才的 火花。空想社会主义是早期无产阶级意识 和利益的先声，反映了早期无产阶级迫切要 求改造现存社会、建立理想的新社会的愿 望。A、B、C正确。 但空想社会主义“没有能够指出真正的 出路。它既不会阐明资本主义制度下雇佣 奴隶制的本质，又不会发现资本主义发展的 规律，也不会找到能够成为新社会的创造者 的社会力量”。空想社会主义虽然“提供了 启发工人觉悟的极为宝贵的材料”,但并不 是科学的思想体系。马克思主义是关于无 产阶级和人类解放的科学。D 错误。"},
  {id:339,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"科学社会主义自产生之后，逐步与工人运动相结合，指导无产阶级政党的革命斗争，并在这个 过程中不断完善和发展。1864年，国际工人协会(第一国际)应运而生。1871年巴黎公社革 命爆发。巴黎公社革命",options:["A. 是第一国际精神的产儿","B. 是无产阶级夺取政权的第一次伟大尝试","C. 证明了社会主义革命可以首先在一个或者几个国家获得胜利","D. 使社会主义从理想变为现实"],answer:"AB",explanation:"1871年爆发的巴黎公社革命，是第 一国际精神的产儿，是无产阶级夺取政权 的第一次伟大尝试。马克思高度评价巴黎 公社的意义，认为公社的原则是永存的。A、 B正确。社会主义革命可以首先在一个或 者几个国家获得胜利是列宁提出的。C 错 误。十月革命的胜利，实现了社会主义从理 想到现实的伟大飞跃，开辟了人类历史的新 纪元，苏维埃俄国成为世界上第一个社会主 义国家。D 错误。"},
  {id:340,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"1848年欧洲革命后，资本主义在各国得到了迅速发展，无产阶级力量不断壮大。到19世纪50 年代末60年代初，各国工人运动重新活跃起来，并表现出加强国际联系的愿望。1864年，国 际工人协会(第一国际)应运而生。马克思是第一国际的灵魂。在马克思指导下，第一国际",options:["A. 大力支援各国的工人运动，支持反封建的民主运动和民族解放运动","B. 促进了马克思主义的传播及其与国际工人运动的结合","C. 初步确立了马克思主义在工人运动中的指导地位","D. 发动并领导了巴黎公社革命"],answer:"ABC",explanation:"1871年爆发的巴黎公社革命，是第 一国际精神的产儿，并不是第一国际发动 的，更不是第一国际领导的。巴黎公社革命 是在法国同普鲁士之间发生战争、民族矛盾 和阶级斗争激化的情况下爆发的。D 错误。 A、B、C 正确。"},
  {id:341,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"1871年爆发的巴黎公社革命，是无产阶级夺取政权的第一次伟大尝试。巴黎公社采取的用以 防止国家机关工作人员由社会公仆变为社会主人的重要措施是",options:["A. 废除资产阶级议会制，建立苏维埃代表大会制度","B. 建立无产阶级政党，发挥党的政治领导作用","C. 规定所有公职人员无论职位高低，实行全面的选举制和撤换制","D. 取消高薪制，规定任何工作人员年薪不得超过熟练工人的工薪水平"],answer:"CD",explanation:"巴黎公社革命起义胜利后，巴黎人民 立即开始了建立无产阶级政权的尝试。他 们摧毁资产阶级的国家机构，废除资产阶级"},
  {id:342,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"从1918年夏到1921年春，列宁领导的苏维埃政权实行了战时共产主义政策。这一政策的主要 特征是",options:["A. 实行余粮收集制","B. 实行粮食税制","C. 取消商品货币关系","D. 实行租让制"],answer:"AC",explanation:"从1918年夏到1921年春，列宁领导 的苏维埃政权实行了以余粮收集制和取消 商品货币关系为主要特征的战时共产主义 政策，在经济上采取一系列特殊又带有强制 性的非常措施。A、C 正确。B、D 是新经济 政策时期实行的政策，不符合题意。"},
  {id:343,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"1921年3月， 俄共(布) 召开十大，毅然决定从战时共产主义政策过渡到实行新经济政策。 俄共(布)十大决定实行新经济政策，是因为",options:["A. 国家从战争转入和平经济建设时期，战时共产主义政策无法调动生产者尤其是农民的积极性","B. 国民经济已濒临崩溃，国内发生严重的经济和政治危机","C. 如不改变政策，执政党将会失去广大群众，丢掉阶级基础","D. 需要为实行农业集体化摸索经验"],answer:"ABC",explanation:"（本题解析见原书解析分册）"},
  {id:344,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"1921年3月，俄共(布)召开十大，毅然决定从战时共产主义政策过渡到实行新经济政策。 这一决定，表明列宁的社会主义建设思想发生了重大转变，对俄国这样一个小农占优势的国家 如何走向社会主义又有了新的认识，标志着列宁正在探索一条符合俄国国情的建设社会主义的 道路。新经济政策的主要内容有",options:["A. 取消粮食税制以调动农民的积极性","B. 允许私人自由贸易，恢复商品货币关系","C. 允许私人小工业企业发展","D. 采取一些国家资本主义的形式来发展生产"],answer:"BCD",explanation:"1921 年3月，俄共(布)召开十大，毅 然决定从战时共产主义政策过渡到实行以 发展商品经济为主要特征的新经济政策。 · 多 进"},
  {id:345,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"1921年3月， 俄共(布)召开十大， 毅然决定从战时共产主义政策过渡到实行以发展商品经 济为主要特征的新经济政策。新经济政策的实施",options:["A. 完成了农业合作化，在广大农村建立起了社会主义的制度基础","B. 扭转了国家的严重危机，改善了工人、农民和其他劳动者的物质文化生活","C. 活跃了苏维埃的城乡经济，发展了生产，大大加强了苏维埃的社会主义经济基础","D. 标志着苏联模式开始形成"],answer:"BC",explanation:"新经济政策的实施，扭转了国家的严 重危机，活跃了苏维埃的城乡经济，发展了 生产，大大加强了苏维埃的社会主义经济基 础，也改善了工人、农民和其他劳动者的物 质文化生活。B、C正确。苏联的农业合作化 是在20世纪30年代前中期完成的，苏联模 式也是在这个时期形成的。A、D 错误。 所有公职人员无论职位高低，实行全面的 选举制和撤换制；二是取消高薪制，规定 任何工作人员年薪不得超过熟练工人的工 薪水平。C、D正确，A、B 错误。"},
  {id:346,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"在俄国社会主义革命取得胜利的初期，特别是实行新经济政策期间，列宁对苏维埃俄国如何建 设社会主义进行了深刻的理论思考，提出了许多精辟的论述，主要包括",options:["A. 把建设社会主义作为一个长期探索、不断实践的过程","B. 把大力发展生产力、提高劳动生产率放在首要地位","C. 在多种经济成分并存的条件下，利用商品、货币和市场发展经济","D. 利用资本主义建设社会主义"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:347,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"在俄国社会主义革命取得胜利的初期，特别是实行新经济政策期间，列宁对苏维埃俄国如何建 设社会主义进行了深刻的理论思考，提出了许多精辟的论述。列宁对马克思主义的重大贡献， 也是他留给后人的最宝贵的思想遗产是",options:["A. 能够正视国情，面对一系列新情况和新问题，不拘泥于书本上已有的结论，而是“根据经 验来谈论社会主义”","B. 一切从实际出发，尊重千百万群众的实践，勇于探索，大胆创新","C. 努力把马克思主义基本原理同俄国的具体实际相结合，探索出一条适合俄国国情的社会主 义道路","D. 实现了工业化和农业集体化，形成了建设社会主义的苏联模式"],answer:"ABC",explanation:"A、B、C 正确。苏联模式的形成在列 宁逝世之后，D错误。"},
  {id:348,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"列宁晚年虽然病魔缠身，但仍然没有停止对社会主义事业的思考。他在口授的《日记摘录》 《论合作社》《论我国革命》《我们怎样改组工农检查院》《宁肯少些，但要好些》等被人们称 为“政治遗嘱”的文章和书信中，对十月革命以来所走过的道路进行了深入的思考，提出了建 设社会主义的新构想。这些思想主要包括",options:["A. 用合作社的形式将农民引向社会主义道路","B. 发展大工业，实现工业化和电气化","C. 学习和利用资本主义的一切东西","D. 进行文化革命，大力发展文化教育事业"],answer:"ABD",explanation:"A、B、D正确。列宁提出的是“学习 和利用资本主义一切有价值的东西”,而不 是“学习和利用资本主义的一切东西”,C 错误。 1920年底，苏维埃俄国击退外国武 装干涉者，取得了国内战争的胜利，1921年 初转入和平经济建设时期。这时，再实行以 余粮收集制和取消商品货币关系为主要特 征的战时共产主义政策，无法调动生产者尤 其是农民的积极性，国民经济已濒临崩溃， 国内发生严重的经济和政治危机。在这种 形势下，列宁深感如不改变政策将会失去广 大群众，丢掉阶级基础。A、B、C 正确。实行 以发展商品经济为主要特征的新经济政策， 与后来实行农业集体化没有关系，更谈不上 摸索经验。D 错误。"},
  {id:349,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"从16世纪初期兴起的社会主义思潮算起，社会主义运动至今已经有500多年的历史。社会主 义是在曲折中发展、在开拓中前进的。站在新时代中国特色社会主义新的历史起点上，学习掌 握科学社会主义基本原则，深入总结社会主义运动的历史经验，对于我们推进世界社会主义事 业具有重要意义。科学社会主义基本原则",options:["A. 是社会主义事业发展规律的集中体现","B. 是马克思主义政党领导人民进行社会主义革命、建设、改革的基本遵循","C. 规定了各个国家的无产阶级政党与自己国家实际相结合的具体制度和革命方法","D. 在后来的社会主义革命和建设中得到了证实、丰富和发展"],answer:"ABD",explanation:"科学社会主义基本原则是社会主义 事业发展规律的集中体现，是马克思主义 政党领导人民进行社会主义革命、建设、 改革的基本遵循。马克思、恩格斯在创立科 学社会主义理论并用以指导国际工人运动 的过程中，逐步形成了科学社会主义基本原 则。这些原则在后来的社会主义革命和建 设中得到了证实、丰富和发展。A、B、D 正 确。马克思、恩格斯揭示了科学社会主义的 基本原则，但是他们并没有规定未来社会的 各种具体制度和实施方案，更不可能规定各 国自己的具体制度和革命方法。C 错误。"},
  {id:350,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"马克思、恩格斯在《共产党宣言》1872年德文版序言中指出，“不管最近25年来的情况发生 了多大的变化，这个宣言中所阐述的一般原理整个说来直到现在还是完全正确的……这些原理 的实际运用，正如宣言中所说的，随时随地都要以当时的历史条件为转移”。这一论述为无产 阶级政党正确认识和对待科学社会主义基本原则提供了科学的方法指导。正确认识和对待科学 社会主义基本原则，必须",options:["A. 始终坚持科学社会主义基本原则，反对任何背离科学社会主义基本原则的错误倾向","B. 善于把科学社会主义基本原则与本国实际和时代特征相结合，创造性地回答和解决社会主 义革命、建设、改革中的重大问题","C. 严格遵循科学社会主义提供的解决特殊问题的具体方案，在实践中准确无误地贯彻这些 方案","D. 紧跟时代和实践的发展，在不断总结新鲜经验中进一步丰富和发展科学社会主义基本原则"],answer:"ABD",explanation:"（本题解析见原书解析分册）"},
  {id:351,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"“由于历史进程的曲折而不得不开始社会主义革命的那个国家愈落后，它由旧的资本主义关系 过渡到社会主义关系就愈困难。”列宁的这段话说明，无 产阶级及其政党可以在经济文化相对 落后的国家取得政权，建立起崭新的社会主义制度，但是，在这样的国家建设社会主义必然具 有长期性。其原因主要有",options:["A. 生产力发展状况的制约","B. 经济基础和上层建筑发展状况的制约","C. 国际环境的严峻挑战","D. 改良主义政党在政治舞台上的影响日益扩大"],answer:"ABC",explanation:"在经济文化相对落后的国家建设社 会主义具有长期性，主要原因有四点：①生 产力发展状况的制约。2经济基础和上层 建筑发展状况的制约。3国际环境的严峻 挑战。4 马克思主义执政党对社会主义发 展道路的探索和对社会主义建设规律的认 识，需要一个长期的过程。A、B、C 正确。 “改良主义政党在政治舞台上的影响日益扩 大”属于“第二次世界大战后资本主义的变 化”这个知识点中的“政治制度的变化”的 内容。D 错误。"},
  {id:352,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"“‘履不必同，期于适足；治不必同，期于利民。’世界上没有放之四海而皆准的发展道路。只 有能够持续造福人民的发展道路，才是最有生命力的。”社会主义发展道路多样性的原因有",options:["A. 各国人口因素和自然地理环境的不同是造成社会主义发展道路多样性的决定因素","B. 历史文化传统的差异性是造成不同国家社会主义发展道路多样性的重要条件","C. 各国生产力发展状况和社会发展阶段决定了社会主义发展道路具有不同的特点","D. 时代和实践的不断发展是造成社会主义发展道路多样性的现实原因"],answer:"BCD",explanation:"A是人口和地理决定论的观点，是错 误选项。B、C、D正确。"},
  {id:353,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"社会主义发展道路具有多样性，无产阶级执政党必须领导本国人民，努力探索适合自己国情的 社会主义发展道路。探索社会主义发展道路，必须",options:["A. 坚持对待马克思主义的科学态度","B. 从当时当地的历史条件出发，坚持“走自己的路”","C. 充分吸收人类一切优秀文明成果","D. 坚持问题导向，从马克思主义经典作家的著作中寻找具体问题的答案"],answer:"ABC",explanation:"A、B、C正确。科学社会主义基本原 则无疑具有实践指导意义，但它只是指明一 般的规律和主要的原则，并不能为具体问题 提供现成答案。任何一个国家的社会主义 者，都不能简单套用书本上的结论，也不能 简单照搬他国的经验，而必须从本国国情和 需要出发去进行探索。D 错误。"},
  {id:354,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"习近平指出：“社会主义从来都是在开拓中前进的。”这是对社会主义历史进程的全面总结，也 是对社会主义事业发展的深刻启示。社会主义在开拓中前进，是因为",options:["A. 社会主义是亿万人民群众的伟大实践","B. 社会主义是崭新的事业，社会主义实践是一个不断探索的过程","C. 实践探索中出现某种曲折并不改变社会主义的前进趋势","D. 推进社会主义实践发展必须有开拓奋进的精神状态"],answer:"ABCD",explanation:"第七章"},
  {id:355,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"恩格斯在评论《资本论》第一卷出版时说过：一些读者可能会以为他将从这本书里得知共产主 义的千年王国到底是什么样子，谁指望得到这种乐趣，谁就大错特错了。这说明",options:["A. 探索社会主义发展道路，必须坚持对待马克思主义的科学态度","B. 马克思主义经典作家并没有给我们提供各国社会主义发展道路的现成方案","C. 马克思、恩格斯并没有对未来社会进行展望","D. 马克思主义的基本立场、观点、方法会随着时代的发展而发生根本变化"],answer:"AB",explanation:"马克思、恩格斯站在无产阶级立场 上，运用科学的方法，致力于研究人类社会 特别是资本主义社会，第一次揭示了社会发 展的一般规律和资本主义社会发展的特殊 规律，从而对共产主义社会作出了科学的展 望。C 错误。探索社会主义发展道路，必须 坚持对待马克思主义的科学态度。坚持以 马克思主义为指导，最重要的是坚持马克思 主义对于研究未来社会制度的科学方法。 马克思主义经典作家并没有给我们提供各 国社会主义发展道路的现成方案。A、B 正 确。经典作家的个别表述可能会随着时代 的变迁而过时，但马克思主义的基本立场、 观点、方法具有穿越时空的普遍意义和永 恒价值。D 错误。"},
  {id:356,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"马克思、恩格斯关于未来社会的预测，是在科学地批判和剖析资本主义社会的过程中作出的。 马克思、恩格斯对资本主义批判的高明之处在于",options:["A. 不是只看到资本主义社会的弊端，而是进一步揭示出弊端的根源和资本主义发展中自我否 定的力量","B. 发现资本主义的矛盾运动中孕育着的新社会因素，并以此对未来社会特点作出预见","C. 既从资本主义社会中寻找灵感，更从社会主义社会的建设与发展中寻找启示","D. 先指出未来社会的一般特征，再对各种细节作具体描绘"],answer:"AB",explanation:"从历史上看，人们对未来社会的设 想，往往源于对现实问题的思考与批判。马 克思、恩格斯对资本主义批判的高明之处在 于 ，他们不是只看到资本主义社会的弊端， 而是进一步揭示出弊端的根源，揭示出资本 主义发展中自我否定的力量，发现资本主义 的矛盾运动中孕育着的新社会因素，并以此 对未来社会特点作出预见。A、B正确。 列宁领导了十月革命，建立起世界上第 一个社会主义国家并探索了在俄国建设社 会主义的道路，取得了预见未来社会的实践 经验。他将社会主义社会与共产主义社会 作了区分，这本身就是对共产主义社会的新 认识。马克思、恩格斯的时代还没有出现社 会主义社会，C错误。马克思主义经典作家 立足于揭示未来社会的一般特征，而不对各 种细节作具体描绘。马克思、恩格斯在展望 未来社会时，总是只限于指出未来社会发展 的方向、原则和基本特征，而把具体情形留 给后来的实践去回答。D 错误。"},
  {id:357,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"实现人的自由而全面的发展，是马克思主义追求的根本价值目标，也是共产主义社会的根本特 征。共产主义社会中人的自由而全面的发展指的是",options:["A. 全体社会成员的发展，即每一个人的发展","B. 社会不存在矛盾，人与人之间形成事实上的平等","C. 社会发展与个人发展实现了真正的统一","D. 社会发展不再以牺牲某些个人的发展为代价"],answer:"ACD",explanation:"共产主义社会中人的自由而全面的 发展指的是全体社会成员的发展，即每一 个人的发展，而不是只有一部分人的发展。"},
  {id:358,chapter:"马原",sub:"马克思主义基本原理",type:"multi",question:"1894年，恩格斯在回答意大利人卡内帕提出的要求尽量用简短的字句来表述未来的社会主义 纪元的基本思想时指出，除了从《共产党宣言》中摘出下面一段话外，再也找不出合适的了， 这就是：“代替那存在着阶级和阶级对立的资产阶级旧社会的，将是这样一个联合体，在那里， 每个人的自由发展是一切人的自由发展的条件。”这里所说的自由发展是指",options:["A. 建立在个体高度自由自觉基础上的全面发展","B. 实现了人的“自由个性”的发展","C. 摆脱了自然经济条件下对“人的依赖关系”和商品经济条件下对“物的依赖性”","D. 随心所欲、不受任何限制的发展 1."],answer:"ABC",explanation:"（本题解析见原书解析分册）"},
  {id:359,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"中国共产党的历史，是一部不断推进马克思主义中国化时代化的历史，是一部不断推进理论创 新、进行理论创造的历史。标志着“马克思主义的中国化”这一命题正式提出的是",options:["A. 遵义会议","B. 党的六届六中全会","C. 瓦窑堡会议","D. 党的七大"],answer:"B",explanation:"1938年，毛泽东在党的六届六中全会 上作了《论新阶段》的报告，强调：“没有抽象的 马克思主义，只有具体的马克思主义……马克 思主义的中国化，使之在其每一表现中带着中 国的特性，即是说，按照中国的特点去应用它， 成为全党亟待了解并亟须解决的问题。”这标 志着“马克思主义的中国化”这一命题的正 式提出。B正确，A、C、D 错误。"},
  {id:360,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"马克思主义中国化时代化的理论成果是一脉相承又与时俱进的关系。它们都是 ① 关于中国革命、建设、改革的正确的理论原则和经验总结 ②马克思列宁主义在中国的运用和发展 ③全国各族人民团结奋斗的共同思想基础 ④党和国家必须长期坚持的指导思想",options:["A. ①②③","B. ①②④","C. ①③④","D. ②③④"],answer:"D",explanation:"马克思主义中国化时代化的理论成果 是一脉相承又与时俱进的关系。它们都是马 克思列宁主义在中国的运用和发展，都以独 创性的理论成果丰富和发展了马克思主义的 理论宝库，都是党和国家必须长期坚持的指 导思想，都是全国各族人民团结奋斗的共同 思想基础。②③④正确。毛泽东思想是被实 践证明了的关于中国革命和建设的正确的理 论原则和经验总结，它的形成与改革开放无 关；中国特色社会主义理论体系的形成与革命 无关。①错误。因此，本题选D。"},
  {id:361,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"毛泽东思想是在我国新民主主义革命、社会主义革命和社会主义建设的实践过程中，在总结我国 革命和建设正反两方面历史经验的基础上，逐步形成和发展起来的。标志着毛泽东思想开始萌芽 的是",options:["A. 关于新民主主义革命基本思想的提出","B. 关于农村包围城市、武装夺取政权的思想的提出","C. 反对本本主义的提出","D. 马克思主义中国化命题的明确提出"],answer:"A",explanation:"大革命时期，毛泽东在《中国社会各阶 级的分析》《湖南农民运动考察报告》等著作 中提出的关于新民主主义革命的基本思想， 标志着毛泽东思想开始萌芽。A 正确。毛泽 东提出并深入阐述的农村包围城市、武装夺取 政权的思想，对红军和农村革命根据地的建 立、巩固和发展发挥着根本指导作用，标志着 毛泽东思想的初步形成；《反对本本主义》是毛 泽东写于1930年土地革命战争时期(不是大 革命时期)的著作；1938年在党的六届六中全 会上毛泽东明确提出了马克思主义中国化的 命题。B、C、D错误。"},
  {id:362,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"毛泽东思想是在总结我国革命和建设正反两方面历史经验的基础上，逐步形成和发展起来的。毛 泽东思想初步形成的标志是提出并深入阐述",options:["A. 实事求是的思想路线","B. 农村包围城市、武装夺取政权的思想","C. 新民主主义理论","D. 中国革命的首要问题"],answer:"B",explanation:"土地革命战争时期，以毛泽东同志为主 要代表的中国共产党人，坚持马克思列宁主义 必须与中国革命具体实际相结合的基本原则， 在探索中国革命新道路的具体实践中，在同党 内一度盛行的把马克思主义教条化、把共产国 际决议和苏联经验神圣化错误倾向的斗争中， 逐步认识和把握中国革命发展的客观规律，成 功地把党的工作重点由城市转入农村，开辟了 农村包围城市、武装夺取政权的革命道路。毛 泽东提出并深入阐述的农村包围城市、武装 夺取政权的思想，对红军和农村革命根据地 的建立、巩固和发展发挥着根本指导作用， 标志着毛泽东思想的初步形成。B 正确。 考研政治1 0 0 题 >>> 解析分册 ·"},
  {id:363,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"毛泽东思想是马克思主义中国化时代化第一次历史性飞跃的理论成果，以独创性的理论丰富和发 展了马克思列宁主义。最能体现毛泽东思想理论本质特点的思想内容是",options:["A. 贯穿于毛泽东思想科学体系中的立场、观点和方法","B. 毛泽东思想在表达方式上具有的鲜明民族特色","C. 毛泽东思想所确立的马克思主义中国化时代化的前进方向","D. 全心全意为人民服务的根本宗旨和自力更生、艰苦奋斗的革命精神"],answer:"A",explanation:"贯穿于毛泽东思想科学体系中的立场、 观点和方法是最能体现毛泽东思想理论本质 特点的思想内容，属于哲学层面的概括和总 结。实事求是、群众路线、独立自主是毛泽东 把辩证唯物主义和历史唯物主义运用到中国 革命和建设实践中所形成的具有中国共产党 人鲜明特色的立场、观点、方法，是我们党进行 革命、建设和改革的出发点、根本点和立足点， 为党和人民事业发展提供了科学指引。A 正 确，B、C、D不符合题意。"},
  {id:364,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"毛泽东思想不是在个别的方面，而是在许多方面以其独创性理论丰富和发展了马克思列宁主义， 构成一个博大精深的科学思想体系。它紧紧围绕的主题是",options:["A. 战争与革命","B. 什么是社会主义、怎样建设社会主义","C. 中国特色社会主义","D. 中国革命和建设"],answer:"D",explanation:"毛泽东思想紧紧围绕中国革命和建设 的主题，提出了一系列相互关联的重要理论观 点，构成了一个完整的科学思想体系。D 正 确。19世纪末20世纪初，世界进入帝国主义 和无产阶级革命时代，战争与革命成为时代主 题。A、B、C不符合题意。"},
  {id:365,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"独立自主是毛泽东思想的活的灵魂三个基本方面的内容之一。坚持独立自主也是中国共产党百年 奋斗的十大历史经验之一。独立自主是",options:["A. 中华民族精神之魂","B. 中国共产党的最大政治优势","C. 一个国家、一个民族发展进步的不竭动力","D. 中国共产党区别于其他政党的显著标志"],answer:"A",explanation:"坚持独立自主是《中共中央关于党的百 年奋斗重大成就和历史经验的决议》总结的十 大历史经验之一。独立自主是中华民族精神 之魂，是我们立党立国的重要原则。A 正确。 中国共产党的最大政治优势是密切联系群众， 党执政后的最大危险是脱离群众。创新是一 个国家、一个民族发展进步的不竭动力。勇于 自我革命是中国共产党区别于其他政党的显 著标志。B、C、D 错误。"},
  {id:366,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"独立自主是中国共产党、中华人民共和国立党立国的重要原则。是我们党从中国实际出发、依靠 党和人民力量进行革命、建设、改革的必然结论。毛泽东独立自主思想最初的明确表述来自",options:["A. 《星星之火，可以燎原》","B. 《反对本本主义》","C. 《中国社会各阶级的分析》","D. 《 湖南农民运动考察报告》"],answer:"B",explanation:"坚持独立自主原则，是毛泽东针对党内 存在的“左”倾教条主义倾向，从中国革命遭受 挫折的教训中提出的正确思想主张。早在 1930年，毛泽东在《反对本本主义》一文中 就指出：“中国革命斗争的胜利要靠中国同志 了解中国情况。”这是独立自主思想的最初的 明确表述。B正确。"},
  {id:367,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"认清中国国情，是解决中国革命问题的基本前提。近代中国最基本的国情是",options:["A. 中国是一个半殖民地半封建的社会","B. 中国的政治经济发展不平衡","C. 中国是东方的大国","D. 中国是一个农民占人口多数的国家"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:368,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"认清中国国情，是解决中国革命问题的基本前提。1939 年毛泽东在《中国革命和中国共产党》 中指出，中国是在许多帝国主义国家的统治或半统治之下，实际上处于长期的不统一状态，再 加上土地广大，其结果是",options:["A. 帝国主义侵略势力日益成为直接统治中国的决定性力量","B. 封建经济在社会经济生活中占着显然的优势","C. 经济、政治和文化的发展表现出极端的不平衡","D. 资产阶级成为资本-帝国主义压迫、奴役中国人民的社会基础"],answer:"C",explanation:"1939年毛泽东在《中国革命和中国共 产党》中指出，中国是在许多帝国主义国家的 统治或半统治之下，实际上处于长期的不统 一状态，再加上土地广大，其结果是中国的经"},
  {id:369,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"解放战争时期，毛泽东在《在晋绥干部会议上的讲话》中对新民主主义革命的总路线作了完整 的概括。这里所说的“完整”是指在革命对象中增加了",options:["A. 帝国主义","B. 封建主义","C. 民族资本主义","D. 官僚资本主义"],answer:"D",explanation:"（本题解析见原书解析分册）"},
  {id:370,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"中国民主主义革命经历了旧民主主义革命和新民主主义革命两个阶段. “旧”阶段转变到“新” 阶段的根本标志是",options:["A. 中国革命领导阶级的变化","B. 中国革命主要对象的变化","C. 中国革命基本性质的变化","D. 中国社会主要矛盾的变化"],answer:"A",explanation:"无产阶级的领导权是中国革命的中心 问题，也是新民主主义革命理论的核心问 题 。区别新、旧两种不同范畴的民主主义革 命的根本标志：革命的领导权是掌握在无产阶 级手中还是掌握在资产阶级手中。A 正确。"},
  {id:371,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"中国革命的中心问题是",options:["A. 农民土地问题","B. 统一战线问题","C. 武装斗争问题","D. 领导权问题"],answer:"D",explanation:"（本题解析见原书解析分册）"},
  {id:372,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"“因为中国资产阶级根本上与剥削农民的豪绅地主相联结相混合，中国革命要推翻豪绅地主阶 级 ，便不能不同时推翻资产阶级。”这一观点属于",options:["A. “ 毕其功于一役”的观点 B .“二次革命论”的观点","C. 民主主义革命是社会主义革命必要准备的观点","D. 中国革命分“两步走”的观点"],answer:"A",explanation:"1939年，毛泽东在《中国革命和中国 共产党》一文中，第一次提出了新民主主义革 命的科学概念和总路线的内容，指出“所谓新 民主主义革命，就是在无产阶级领导之下的 人民大众的反帝反封建的革命”。1948年， 毛泽东在《在晋绥干部会议上的讲话》中完整 地总结和概括了总路线的内容，指出“无产阶 级领导的，人民大众的，反对帝国主义、封建 主义和官僚资本主义的革命，这就是中国的 新民主主义的革命，这就是中国共产党在当 前历史阶段的总路线和总政策”。D 正确。 精讲P108 考点6-5-拓展与点拨 题干这句话就是主张在反封建的同 时，也要反对资产阶级，这就混淆了民主革命 与社会主义革命的界限，也就是主张“毕其 功于一役”。A 符合题意。“二次革命论” 是割裂了民主革命与社会主义革命的联系， 主张在民主革命之后，建立资本主义共和国， 发展资本主义，然后再进行社会主义革命，实 际上是没有分清新、旧民主主义的区别，放弃 无产阶级对民主革命的领导权，是右倾错误。 B不符合题意。中国革命分“两步走”是毛 泽东的正确主张，既看到民主革命与社会主 义革命的区别，又指出民主革命与社会主义 革命的联系。主张中国革命分“两步走”,第 一步是民主主义革命，第二步是社会主义革 命，民主主义革命是社会主义革命的必要准 备，社会主义革命是民主主义革命的必然趋 势。C、D也不符合题意。"},
  {id:373,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"“统帅革命的资产阶级，联合革命的无产阶级，实行资产阶级民主革命。”这一观点的错误实质 在于",options:["A. 抹杀农民阶级的革命性","B. 夸大资产阶级的作用","C. 放弃无产阶级的领导权","D. 忽视武装斗争的重要性"],answer:"C",explanation:"题干引述的是陈独秀的一句话。陈独 秀认为，资产阶级民主革命应该由资产阶级 “统帅”,无产阶级只能是“革命的资产阶级” 的“联合”对象，这就完全放弃了无产阶级的 领导权。这是这句话的错误的实质所在，因"},
  {id:374,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"新民主主义革命时期，党内犯“左”倾错误的人提出“毕其功于一役”的主张，搞所谓的“无 间断”革命，这种错误倾向实质上是",options:["A. 混淆了新民主主义革命和社会主义革命的界限","B. 割裂了新民主主义革命和社会主义革命的联系","C. 混淆了新民主主义革命和资产阶级革命的界限","D. 割裂了新民主主义革命和资产阶级革命的联系"],answer:"A",explanation:"精 讲P 1 0 考点6-5- 拓展与点拨"},
  {id:375,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"新民主主义革命的主要内容是",options:["A. 从根本上推翻反动腐朽的政治上层建筑，变革阻碍生产力发展的生产关系","B. 没收官僚资产阶级的垄断资本归新民主主义国家所有","C. 没收封建地主阶级的土地归农民所有","D. 推翻帝国主义、封建主义和官僚资本主义的统治"],answer:"C",explanation:"没收封建地主阶级的土地归农民所 有，是新民主主义经济纲领的三项内容之 一 ，是新民主主义革命的主要内容。C 正 确。推翻帝国主义、封建主义和官僚资本主 义的统治，从根本上推翻反动腐朽的政治上 层建筑，变革阻碍生产力发展的生产关系，是 近代中国革命的根本任务的内容；没收官僚 资本归新民主主义国家所有，也是新民主主 义经济纲领的三项内容之一，但不是新民主 主义革命的主要内容。A、B、D错误。"},
  {id:376,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"在半殖民地半封建的中国，地主占有土地、将土地出租给农民，通过收取地租来剥削农民，土 地制度极不合理。因此，要改变中国贫穷落后的面貌，必须进行土地革命。土地改革的主要和 直接任务，就是",options:["A. 限制富农剥削，发展农村生产力","B. 没收地主土地归国家所有，分配给农民使用","C. 把农民组织起来，开展互助合作","D. 满足贫雇农群众的要求"],answer:"D",explanation:"党在民主革命时期，逐步认识到土地 革命的极端重要性，形成了土地革命路线，这 就是依靠贫雇农，团结中农，有步骤、有分别 地消灭封建剥削制度，发展农业生产。土地 改革所依靠的基本力量，只能和必须是贫农。 这个贫农阶层，和雇农在一起，占了当时中国 农村人口的70%左右。土地改革的主要和直 接任务，就是满足贫雇农群众的要求。D 正 确。土地改革是没收地主土地分配给农民使 用，把土地变为农民的私产，归农民所有，归 农民使用。B 错误。把农民组织起来，开展 互助合作，是土地改革完成、农民分到土地以 后的事情，而不是土地改革的主要和直接任 务。C 错误。土地改革当然也不是限制富农 剥削的问题，而是废除封建地主土地所有制 的问题。A 错误。"},
  {id:377,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"1940年，毛泽东在《新民主主义论》中，阐述了新民主主义的政治、经济和文化。1945年， 他在党的七大所作的政治报告《论联合政府》中，进一步把新民主主义的政治、经济和文化与 党的基本纲领联系起来，进行了具体阐述，形成了新民主主义的基本纲领。新民主主义经济纲 领中极具特色的一项内容是",options:["A. 没收封建地主阶级的土地归农民所有","B. 没收官僚资产阶级的垄断资本归新民主主义的国家所有","C. 没收帝国主义在华资本归新民主主义的国家所有","D. 保护民族工商业"],answer:"D",explanation:"保护民族工商业，是新民主主义经济 纲领中极具特色的一项内容。在新民主主义 条件下保护民族工商业，发展资本主义，是由 中国落后的生产力和新民主主义革命的性质 所决定的。新民主主义革命的对象是帝国主 义、封建主义和官僚资本主义，它不是一般地 消灭资本主义和资产阶级。D 正确，A、B、C 错误。"},
  {id:378,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"新民主主义文化就是无产阶级领导的人民大众的反帝反封建的文化，即民族的科学的大众的文 化。其中“民族的”,就其内容说，是指",options:["A. 具有鲜明的民族风格、民族形式和民族特色","B. 具有中国作风和中国气派","C. 反对帝国主义压迫，主张中华民族的尊严和独立","D. 反对封建思想和迷信思想"],answer:"C",explanation:"新民主主义文化是民族的，就其内容 说是反对帝国主义压迫，主张中华民族的尊 严和独立；就其形式说是具有鲜明的民族风 格、民族形式和民族特色，要有中国作风和中 国气派。C 正确。"},
  {id:379,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"中国革命走农村包围城市、武装夺取政权的道路，根本在于处理好",options:["A. 土地革命、武装斗争、农村革命根据地建设三者之间的关系","B. 统一战线、武装斗争、党的建设三者之间的关系","C. 工人阶级、农民阶级、民族资产阶级三者之间的关系","D. 进步势力、中间势力、顽固势力三者之间的关系"],answer:"A",explanation:"中国革命走农村包围城市、武装夺取 政权的道路，根本在于处理好土地革命、武 装斗争、农村革命根据地建设三者之间的关 系。土地革命是中国革命的基本内容；武装 斗争是中国革命的主要形式，是农村根据地 建设和土地革命的强有力保证；农村革命根 据地是中国革命的战略阵地，是进行武装斗 争和开展土地革命的依托。在党的领导下， 实现了土地革命、武装斗争、农村革命根据地 建设三者的密切结合和有机统一。A 正确。 点 拨 统一战线、武装斗争、党的建设是新 民主主义革命的三大法宝。“发展进步势 力、争取中间势力、孤立顽固势力”是巩固 抗日民族统一战线的策略总方针。"},
  {id:380,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"半殖民地半封建社会的社会性质，决定了近代中国不可能是一个独立的民主国家，外部没有民 族独立，而受帝国主义压迫；内部没有起码的资产阶级民主，反动统治阶级凭借强大的反革命 武装对人民实行独裁恐怖统治。这种社会性质决定了中国革命的主要形式是",options:["A. 争取民主","B. 农民运动","C. 武装斗争","D. 工人运动"],answer:"C",explanation:"（本题解析见原书解析分册）"},
  {id:381,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"1939年7月7日，是卢沟桥事变爆发2周年纪念日，华北联大在延安举行开学典礼，校长成仿 吾请毛泽东作报告。毛泽东以他特有的广征博引方式发表讲话，他说：“当年姜子牙下昆仑山， 元始天尊赠了他杏黄旗、四不象和打神鞭三样法宝。现在你们出发上前线，我也赠给你们三样 法宝。”毛泽东赠给的“三样法宝”是指",options:["A. 土地革命、武装斗争、农村革命根据地建设","B. 统一战线、武装斗争、党的建设","C. 实事求是、群众路线、独立自主","D. 理论联系实际、密切联系群众、批评与自我批评"],answer:"B",explanation:"毛泽东赠给的“三样法宝”是指统一战 线、武装斗争、党的建设。正确地理解和处 理了这三个问题及其相互关系，就等于正确 地领导了全部中国革命。B 正确。土地革 命、武装斗争、农村革命根据地建设，是中国 革命道路的内容；实事求是、群众路线、独立 自主是毛泽东思想活的灵魂的三个基本方 面；理论联系实际、密切联系群众、批评与自 我批评，是党的优良传统作风——三大作风。 A、C、D错误。"},
  {id:382,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"中国革命建立最广泛的统一战线不仅是必要的，而且是可能的，这种可能是由",options:["A. 中国半殖民地半封建社会的阶级状况所决定的","B. 半殖民地半封建的中国社会的交织在一起的诸多矛盾所决定的","C. 中国革命的长期性、残酷性及其发展的不平衡性所决定的","D. 战争与革命的时代主题所决定的"],answer:"B",explanation:"· 半殖民地半封建的中国社会，诸多矛 盾交织在一起，客观上为无产阶级及其政党 利用这些矛盾建立和发展统一战线提供了可 能性。近代中国社会最大的压迫是民族压 迫，决定了无产阶级及其政党可以把一切爱 国的、不愿受帝国主义奴役的人们团结在自 己的周围。民族资产阶级深受帝国主义和封 建主义的压迫，因而能够在一定时期和一定 程度上参加反帝反封建的革命斗争。当革命 的锋芒主要是反对某一个帝国主义的时候， 受别的帝国主义支持的官僚资产阶级集团也 可能在一定程度上和一定时期内参加统一战 线。B 正确。A、C是半殖民地半封建的中国 必须建立最广泛的统一战线的必要性，不是 可能性。D不符合题意。"},
  {id:383,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"新民主主义革命时期，党领导的革命统一战线包含着两个联盟。其中作为统一战线的基础的联 盟是",options:["A. 工人阶级同城市小资产阶级的联盟","B. 工人阶级同农民阶级、广大知识分子及其他劳动者的联盟","C. 工人阶级同农民阶级、小资产阶级和民族资产阶级的联盟","D. 工人阶级同可以合作的非劳动人民的联盟"],answer:"B",explanation:"新民主主义革命时期，党领导的革命 统一战线包含着两个联盟：一个是工人阶级 同农民阶级、广大知识分子及其他劳动者的 联盟，主要是工农联盟；另一个是工人阶级和 非劳动人民的联盟，主要是与民族资产阶级 的联盟。第一个联盟是统一战线的基础，是 基本的、主要的。第二个联盟是非基本的、 辅助性的，但又是重要的不可缺少的。 B 正确。"},
  {id:384,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"毛泽东思想关于党的建设理论中，始终放在党的建设的首位的是",options:["A. 加强党的思想建设","B. 加强党的组织建设","C. 加强党员的党性修养","D. 保持党的优良作风"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:385,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"新民主主义社会在经济上实行国营经济、合作社经济、个体经济、私人资本主义经济和国家资 本主义经济五种经济成分并存的经济制度。五种经济成分中，在国民经济中居于领导地位的是",options:["A. 国营经济","B. 个体经济","C. 国家资本主义经济","D. 私人资本主义经济"],answer:"A",explanation:"A正确。农民和手工业者的个体经济 在新民主主义社会的五种经济成分中占绝对 优势，但不居于领导地位，B 错误，C、D 两项 也是错误选项。"},
  {id:386,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"建国初期，随着全国土地改革的基本完成，国内的主要矛盾是",options:["A. 人民大众同帝国主义、封建主义和国民党反动派残余势力之间的矛盾","B. 工人阶级和资产阶级的矛盾","C. 生产力与生产关系的矛盾和经济基础与上层建筑的矛盾","D. 人民日益增长的物质文化需要同落后的社会生产之间的矛盾"],answer:"B",explanation:"B正确。A 是新中国成立至全国土地 改革基本完成期间国内的主要矛盾；C 是社 会基本矛盾；D 是社会主义改造完成后中国 社会的主要矛盾。"},
  {id:387,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"党在过渡时期总路线的主要内容被概括为“一化三改”,也曾被比喻为鸟的“主体”和“两 翼”。“主体”是指",options:["A. 对农业的社会主义改造","B. 对手工业的社会主义改造","C. 对资本主义工商业的社会主义改造","D. 社会主义工业化"],answer:"D",explanation:"“主体”是指社会主义工业化，对个体 农业、手工业和资本主义工商业的社会主义 改造是“两翼”。D正确，A、B、C 错误。"},
  {id:388,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"对农业的社会主义改造，是三大改造中首先进行的。以毛泽东同志为主要代表的中国共产党人 根据马克思列宁主义关于农业社会主义改造的基本原理，从我国农村实际出发，制定并实行了 一整套适合中国特点的对农业进行社会主义改造的方针、政策和办法。农业社会主义改造遵循 的原则是",options:["A. 积极领导、稳步前进","B. 区别对象、积极引导、逐步过渡","C. 自愿互利、典型示范和国家帮助","D. 既反保守又反冒进"],answer:"C",explanation:"以毛泽东同志为主要代表的中国共产 党人开辟了一条适合我国情况的农业社会主 义改造道路：1积极引导农民组织起来，走互 助合作道路。2遵循自愿互利、典型示范和 国家帮助的原则，以互助合作的优越性吸引 农民走互助合作道路。③正确分析农村的阶 级和阶层状况，制定正确的阶级政策。4 坚 持积极领导、稳步前进的方针。⑤采取循序 渐进的步骤。C 正确。"},
  {id:389,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"在农业合作化进程中，具有半社会主义性质的组织形式是",options:["A. 临时互助组","B. 常年互助组","C. 初级合作社","D. 高级合作社"],answer:"C",explanation:"， 互助组(包括临时互助组和常年互助 组两种形式)不涉及生产资料问题，只是在生 产方面组织起来、互帮互助，是农业合作化的 最初过渡形式，具有社会主义萌芽性质。初 级农业生产合作社以土地入股和统一经营为 特点，实行集体劳动，产品分配采取按劳分配 和土地入股分红相结合，具有半社会主义性 质。高级农业生产合作社实行生产资料农民 集体所有，实行按劳分配，具有完全的社会主 义性质。C 正确。"},
  {id:390,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"我国对资本主义工商业的社会主义改造经历了三个步骤。其中，在实行个别企业的公私合营中， 企业利润分配上采取的办法是",options:["A. 定股定息","B. “ 四马分肥”","C. 和平赎买","D. 公私兼顾"],answer:"B",explanation:"对资本主义工商业的社会主义改造， 第二步实行个别企业的公私合营，国家向私 营企业投资入股，企业的生产资料由国家和 资本家共同所有；企业利润的分配仍为“四 马分肥”。B正确。"},
  {id:391,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"我国对资本主义工商业的社会主义改造，采取了从低级到高级的国家资本主义的过渡形式。其 中第二步主要实行个别企业的公私合营，这些企业的性质",options:["A. 仍然是资本主义性质的企业","B. 是具有了社会主义因素的企业","C. 是半社会主义性质的企业","D. 是社会主义国营性质的企业"],answer:"C",explanation:"对资本主义工商业的社会主义改造， 第二步实行个别企业的公私合营，企业的生 产资料由国家和资本家共同所有，国家派干 部(公方代表)进入企业内部，根据国家建设 需要，同工人、资本家(私方代表)共同管理和 80"},
  {id:392,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"我国对资本主义工商业的社会主义改造经历了三个步骤。第一步实行初级形式的国家资本主义； 第二步实行个别企业的公私合营；第三步实行全行业的公私合营。在这些步骤中，同资本家在 企业外部的合作是指",options:["A. 实行初级形式的国家资本主义","B. 实行个别企业的公私合营","C. 实行全行业的公私合营","D. 实行“四马分肥”"],answer:"A",explanation:"第一步实行初级形式的国家资本主 义。国家在私营工业中实行委托加工、计划 订货、统购包销，这主要是同资本家在企业外 部的合作。第二步实行个别企业的公私合 营。这是社会主义成分同资本主义成分在企 业内部的合作。第三步实行全行业的公私合 营。全行业公私合营后，国家对合营企业进 行清产核资、定股定息，委派人员负责企业的 生产经营管理，统一调配企业的人、财、物，生 产资料为国家所有。全行业公私合营后，企 业的生产关系已经发生了根本的变化，基本 上成为社会主义国营性质的企业。A 正确， B、C错误。“四马分肥”既是实行初级形式的 国家资本主义企业的分配政策，也是个别企 业的公私合营的分配政策，D也错误。"},
  {id:393,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"邓小平曾经指出：“我们的社会主义改造是搞得成功的，很了不起。这是毛泽东同志对马克思列 宁主义的一个重大贡献。”之所以说我国社会主义改造的基本完成是一个伟大的历史性胜利，是 因为如此复杂、困难和深刻的社会变革 ①没有造成生产力的破坏，反而促进了工农业和整个国民经济的发展 ② 没有追求纯粹的单一的社会主义经济成分，反而深刻认识到在社会主义改造基本完成以后， 公有制经济可以和非公有制经济共同发展 ③ 没有引起巨大的社会动荡，反而极大地加强了人民的团结 ④ 没有导致对什么是社会主义的理解产生混乱，反而在此过程中形成了对我国社会主义发展阶 段问题的科学理论",options:["A. ①②","B. ②③","C. ①③","D. ②④ 的理论成果"],answer:"C",explanation:"在我国社会主义改造的历史上，有两 个事实是在世界历史上各种革命大变动中罕 见的：一是在一个几亿人口的大国中比较顺 利地实现了如此复杂、困难和深刻的社会变 革，不仅没有造成生产力的破坏，反而促进 了工农业和整个国民经济的发展；二是这样 的变革没有引起巨大的社会动荡，反而极大 地加强了人民的团结，并且是在人民普遍拥 护的情况下完成的。这些情况说明，我国社 会主义改造的基本完成是一个伟大的历史性 胜利，是中国共产党紧紧依靠人民所作出的 伟大创造。①③正确。 我国的社会主义改造取得了历史性的胜 利，同时，也出现了一些失误和偏差。出现这 些问题，既有指导思想上急于求成、不够谨慎 以及工作方法上过于简单等因素，也有受当 时历史条件限制而产生的认识上的一些问 题，主要是：在社会主义经济模式的选择和理 解上过于单一，追求纯粹的单一的社会主义 经济成分，在公有制实现形式的选择和理解 上过于简单化，只注意到集体所有制和全民 所有制这两种基本形式，而对社会主义改造 基本完成以后公有制经济可以和非公有制经 济共同发展缺乏认识。党在实际工作过程中 曾对这些问题有所觉察，对某些失误和偏差 也做过纠正，但毕竟认识不深。更重要的是， · 当时党对我国社会主义发展阶段问题还没有 形成科学的理论，对什么是社会主义还没有 完全搞清楚，致使一些遗留问题长期没有得 到解决。②④错误。因此，本题选C。"},
  {id:394,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"成为党探索中国社会主义建设道路良好开端的文章，是毛泽东发表的",options:["A. 《 论人民民主专政》","B. 《 论十大关系》","C. 《纪念孙中山先生》","D. 《关于正确处理人民内部矛盾的问题》"],answer:"B",explanation:"1956年，毛泽东在《论十大关系》的报 告中，初步总结了我国社会主义建设的经验， 明确提出要以苏为鉴，独立自主地探索适合 中国情况的社会主义建设道路。《论十大关 系》标志着党探索中国社会主义建设道路的 良好开端。B 正确。《关于正确处理人民内 部矛盾的问题》是由1957年2月毛泽东在扩 大的最高国务会议上所作的《如何处理人民 内部的矛盾》的讲话经补充修改后发表的。 《论人民民主专政》是1949年6月发表的，该 文科学地阐明了新中国国家政权的性质及各 阶级在国家中的地位与相互关系。A、C、D不 符合题意。"},
  {id:395,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"1956 年 ，毛泽东先后在中央政治局扩大会议和最高国务会议上，作了《论十大关系》的报告， 初步总结了我国社会主义建设的经验，明确了建设社会主义的根本思想是",options:["A. 正确处理人民内部矛盾","B. 调动一切积极因素为社会主义服务","C. 根据本国情况走自己的道路","D. 自力更生与对外开放相结合"],answer:"C",explanation:"《论十大关系》的报告，初步总结了我 考研政治1 0 0 题 解析分册 · 国社会主义建设的经验，明确提出要以苏为 鉴 ，独立自主地探索适合中国情况的社会主 义建设道路。毛泽东说：“特别值得注意的 是，最近苏联方面暴露了他们在建设社会主 义过程中的一些缺点和错误，他们走过的弯 路，你还想走?过去我们就是鉴于他们的经验 教训，少走了一些弯路，现在当然更要引以为 戒。”这就明确了建设社会主义必须根据本国 情况走自己的道路这一根本思想。C 正确。"},
  {id:396,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"1957年2月，毛泽东作了《关于正确处理人民内部矛盾的问题》的报告，指出：“在社会主义 社会中，基本的矛盾仍然是生产关系和生产力之间的矛盾，上层建筑和经济基础之间的矛盾。” 社会主义社会的基本矛盾同以往社会的基本矛盾“具有根本不同的性质和情况”。这里所说的 “不同的”“情况”是指",options:["A. 社会主义社会的矛盾反映在政治上可以划分为敌我矛盾和人民内部矛盾","B. 社会主义社会基本矛盾运动是“又相适应又相矛盾”","C. 社会主义社会的基本矛盾既是对抗性的又是非对抗性的","D. 社会主义社会的所有矛盾都必须采用民主的方法来解决"],answer:"B",explanation:"毛泽东指出：“在社会主义社会中，基 本的矛盾仍然是生产关系和生产力之间的矛 盾，上层建筑和经济基础之间的矛盾。”社会 主义社会的基本矛盾同以往社会的基本矛盾 “具有根本不同的性质和情况”。社会主义社 会基本矛盾运动具有“又相适应又相矛盾” 的特点，一方面社会主义生产关系已经建立 起来，它是和生产力的发展相适应的；另一方 面它又还很不完善，这些不完善的方面和生 产力的发展又是相矛盾的。除了生产关系和 生产力发展之间这种又相适应又相矛盾的情 况以外，还有上层建筑和经济基础之间又相 适应又相矛盾的情况。其中，相适应的一面 是基本方面，相矛盾的一面是非基本方面。 B正确。 社会主义社会的基本矛盾是在生产关系 和生产力基本适应、上层建筑和经济基础基 本适应条件下的矛盾，是在人民根本利益一 致基础上的矛盾，是非对抗性的矛盾。C 错 误。关于社会主义社会两类不同性质的矛盾 以及处理这两类矛盾的基本方法，毛泽东指 出：在我们面前有两类社会矛盾，这就是敌我 矛盾和人民内部矛盾，这是两类性质完全不 同的矛盾。敌我之间和人民内部这两类矛盾 的性质不同，解决的方法也不同。简单地说 起来，前者是分清敌我的问题，后者是分清是 非的问题。“我们历来就主张，在人民民主专 政下面，解决敌我之间的和人民内部的这两 类不同性质的矛盾，采用专政和民主这样两 种不同的方法。”A不符合题意，D错误。"},
  {id:397,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"1957年2月，毛泽东作了《关于正确处理人民内部矛盾的问题》的报告，阐明社会主义社会的 重大理论问题。毛泽东指出，用民主的方法解决人民内部矛盾，这是一个总方针。针对人民内 部矛盾在具体实践中的不同情况，毛泽东提出了一系列具体方针、原则。在政治思想领域，毛 泽东提出的解决人民内部矛盾的具体方针是",options:["A. “ 团结—批评—团结”","B. “惩前毖后、治病救人”","C. “ 长期共存、互相监督”","D. 统筹兼顾、适当安排"],answer:"A",explanation:"毛泽东提出，在政治思想领域，实行 “团结一批评一团结”的方针；在物质利益、 分配方面，实行统筹兼顾、适当安排的方针； 对于科学文化领域里的矛盾，实行“百花齐 放、百家争鸣”的方针；对于共产党和民主党 派之间的矛盾，实行在坚持社会主义道路和 共产党领导的前提下“长期共存、互相监督” 的方针。A正确，C、D不符合题意。“惩前毖 后、治病救人”的方针，是中国共产党在延安 整风运动中提出的对待犯错误同志的正确方 针，B不符合题意。"},
  {id:398,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"20世纪50年代中期，毛泽东明确提出要走一条有别于苏联的中国工业化道路。走中国工业化道 路主要是强调要正确处理",options:["A. 信息化和工业化的关系","B. 工业化和农业现代化的关系","C. 农业现代化和城镇化的关系","D. 重工业和轻工业、农业的关系"],answer:"D",explanation:"在《关于正确处理人民内部矛盾的问 题》中，毛泽东明确提出了中国工业化道路的 问题，主要是指重工业和轻工业、农业的发 展关系问题，强调要走一条有别于苏联的中 国工业化道路。走中国工业化道路的思想， 是党探索我国社会主义建设道路的一个重要 思想，强调正确处理重工业和轻工业、农业的"},
  {id:399,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"在中国特色社会主义理论体系的形成过程中，邓小平在党的十二大上提出的一个具有里程碑意 义的重大命题是",options:["A. 什么是社会主义、怎样建设社会主义","B. 建设有中国特色的社会主义","C. 改革是中国的第二次革命","D. 中国问题的关键在于党"],answer:"B",explanation:"1982年邓小平在党的十二大开幕词 中明确提出：走自己的道路，建设有中国特色 的社会主义。从此，“中国特色社会主义”成 为我们党的全部理论和实践创新的主题。这 一重大命题的提出具有里程碑意义，是中国 共产党人对科学社会主义发展的开创性贡 献。B 正确，A、C、D错误。"},
  {id:400,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"邓小平理论是逐步形成和发展起来的。邓小平理论逐步走向成熟始于",options:["A. 党的十一届三中全会","B. 党的十二大","C. 党的十三大","D. 1992年南方谈话"],answer:"D",explanation:"1978年12月召开的党的十一届三中 全会，重新确立了实事求是的思想路线，彻底 否定了“以阶级斗争为纲”的错误理论和实 践，确定把全党工作的重点转移到社会主义 现代化建设上来，作出实行改革开放的重大 决策，实现了党的历史上具有深远意义的伟 大转折。党的十二大，邓小平理论的主题形 成；党的十三大，邓小平理论的轮廓形成； 1992年南方谈话是邓小平理论的集大成之 作，从理论上深刻地回答了当时困扰和束缚 人们思想的一系列重大问题，推动改革开放 和社会主义现代化建设进入新阶段，邓小平 理论逐步走向成熟。D 正确，A、B、C 错误。"},
  {id:401,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"邓小平在领导改革开放和现代化建设这一新的革命过程中，不断提出和反复思考的首要的基本 的理论问题是",options:["A. 什么是社会主义、怎样建设社会主义","B. 建设什么样的党、怎样建设党","C. 实现什么样的发展、怎样发展","D. 坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义"],answer:"A",explanation:"“ 什么是社会主义、怎样建设社会主 义”,是邓小平在领导改革开放和现代化建设 这一新的革命过程中，不断提出和反复思考 的首要的基本的理论问题。 A 正确。B 是 “三个代表”重要思想回答的问题；C 是科学 发展观回答的问题；新时代坚持和发展什么 样的中国特色社会主义、怎样坚持和发展中 国特色社会主义，是习近平新时代中国特色 社会主义思想回答的三大时代课题之一，D 也不符合题意。"},
  {id:402,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"所谓精髓，对于理论而言，指的是能使这一理论得以形成和发展并贯穿始终，同时又体现在这 一理论中最本质的东西。邓小平理论的精髓是",options:["A. 解放思想、实事求是","B. 发展是硬道理","C. 什么是社会主义、怎样建设社会主义","D. 社会主义市场经济理论"],answer:"A",explanation:"解放思想、实事求是，是邓小平理论的 精髓，贯穿邓小平理论形成发展的全过程。A 正确，B、C、D 错误。"},
  {id:403,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"在邓小平指导下，党的十一届三中全会重新确立解放思想、实事求是的思想路线，停止使用 “以阶级斗争为纲”的错误提法，作出把党和国家工作中心转移到经济建设上来、实行改革开放 的历史性决策，开启了改革开放和社会主义现代化建设新时期，实现了党的历史上具有深远意 义的伟大转折。党在改革开放和社会主义现代化建设新时期实现的最根本的拨乱反正是",options:["A. 坚持四项基本原则","B. 坚持改革开放","C. 坚持以经济建设为中心","D. 坚持中国特色社会主义"],answer:"C",explanation:"（本题解析见原书解析分册）"},
  {id:404,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"邓小平明确指出：“改革是中国的第二次革命。” 所谓第二次革命，是与中国共产党领导的第一 次革命相对而言的。社会主义改革的性质是",options:["A. 社会主义基本制度的改革","B. 社会主义经济运行方式的改变","C. 社会主义原有体制的修补","D. 社会主义制度的自我完善和发展"],answer:"D",explanation:"改革不是原有经济体制的细枝末节的 考研政治 1000题 解析分册 · 修补，它的实质和目标是要从根本上改变束 缚我国生产力发展的经济体制。改革是一场 新的革命。但改革不是一个阶级推翻另一个 阶级那种原来意义上的革命，不是也不允许 否定和抛弃我们建立起来的社会主义基本制 度 ，而是社会主义制度的自我完善和发展。 D正确。"},
  {id:405,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"1992年党的十四大之所以能够明确地把建立社会主义市场经济体制作为我国经济体制改革目 标，是因为在社会主义可以实行市场经济的理论上有了重大突破。这个重大突破就是认识到",options:["A. 市场经济是有国家宏观调控的经济","B. 市场经济是法治经济","C. 市场经济与计划经济是可以结合的","D. 市场经济本身不具有制度属性"],answer:"D",explanation:"市场经济作为资源配置手段本身不具 有制度属性，可以和不同的社会制度结合，它 和不同的社会制度结合具有不同的性质。D 正确。A、B 本身内容正确，但不符合题意。 市场经济与计划经济是两种不同的经济体 制 ，是无法结合的，C内容错误。"},
  {id:406,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"社会主义市场经济理论认为，计划经济与市场经济属于",options:["A. 不同的资源配置手段","B. 不同的经济增长方式","C. 不同的经济制度的范畴","D. 不同的生产关系的范畴"],answer:"A",explanation:"1992年邓小平在南方谈话中指出，计 划经济不等于社会主义，资本主义也有计划； 市场经济不等于资本主义，社会主义也有市 场。邓小平的这一系列重要论断，蕴含着社 会主义市场经济理论的要点：一是计划经济 和市场经济不是划分社会制度的标志；二是 计划和市场都是经济手段；三是市场经济作 为资源配置手段本身不具有制度属性，可以 和不同的社会制度结合，从而表现出不同的 性质。党的十五大和十六大都对市场经济的 作用进行了论述。可排除C、D 两项，A 是唯 一正确选项。B 项“不同的经济增长方式”, 专指粗放型增长与集约型增长，与题干不符。"},
  {id:407,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"“三个代表”重要思想创造性回答了",options:["A. 什么是社会主义、怎样建设社会主义的问题","B. 建设什么样的党、怎样建设党的问题","C. 实现什么样的发展、怎样发展的问题","D. 实现什么样的现代化、怎样实现现代化的问题"],answer:"B",explanation:"“三个代表”重要思想在邓小平理论的 基础上，进一步回答了什么是社会主义、怎样 建设社会主义的问题，创造性回答了建设什 么样的党、怎样建设党的问题。B 正确，A、 C、D不符合题意。"},
  {id:408,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"要正确认识和处理改革、发展、稳定的关系，改革是动力，发展是目的，稳定是前提。处理改 革、发展、稳定关系的重要结合点是",options:["A. 把改革的力度、发展的速度和社会可承受的程度统一起来","B. 不断改善人民生活","C. 在社会稳定中推进改革发展","D. 通过改革发展促进社会稳定"],answer:"B",explanation:"要正确认识和处理改革、发展、稳定的 关系。改革是动力，发展是目的，稳定是前 提。要把改革的力度、发展的速度和社会可 承受的程度统一起来，把不断改善人民生活 作为处理改革、发展、稳定关系的重要结合 点，在社会稳定中推进改革发展，通过改革发 展促进社会稳定。B 正确，A、C、D 错误。 第八章"},
  {id:409,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"科学发展观的基本要求是",options:["A. 推动经济社会发展","B. 以人为本","C. 全面协调可持续","D. 统筹兼顾"],answer:"C",explanation:"推动经济社会发展是科学发展观的第 一要义，以人为本是科学发展观的核心立场， 全面协调可持续是科学发展观的基本要求， 统筹兼顾是科学发展观的根本方法。 C 正确。"},
  {id:410,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"single",question:"坚持中国特色社会主义政治发展道路，最根本的是要",options:["A. 坚持党的领导、人民当家作主、依法治国有机统一","B. 坚持政治安全、人民安全、国家利益至上有机统一","C. 坚持历史和现实、理论和实践、形式和内容有机统一","D. 坚持人民民主和国家意志有机统一"],answer:"A",explanation:"坚持中国特色社会主义政治发展道 路，最根本的是要坚持党的领导、人民当家 作主、依法治国有机统一。其中，党的领导 是人民当家作主和依法治国的根本保证，人 民当家作主是社会主义民主政治的本质和核 心，依法治国是党领导人民治理国家的基本 方略。A 正确，B、C、D 错误。 84"},
  {id:411,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"大革命时期，毛泽东关于新民主主义革命的基本思想的提出，标志着毛泽东思想开始萌芽。毛泽 东关于新民主主义革命的基本思想的内容是",options:["A. 分析了中国社会各阶级在革命中的地位和作用","B. 明确指出无产阶级领导农民斗争的极端重要性","C. 解决了无产阶级领导权的中心问题，即如何领导农民斗争的问题","D. 捉出了“工农武装割据”的思想"],answer:"ABC",explanation:"大革命时期，毛泽东以马克思列宁主义 为指导，深入实际调查研究，在《中国社会各阶 级的分析》《湖南农民运动考察报告》等著作 中，分析了中国社会各阶级在革命中的地位和 作用，明确指出无产阶级领导农民斗争的极 端重要性，分析了中国农民斗争的特点，强 调无产阶级领导农民斗争在推翻反动政权、 建立人民革命政权中的重大作用，从而解决 了无产阶级领导权的中心问题，即如何领导 农民斗争的问题。这些关于新民主主义革命 基本思想的提出，标志着毛泽东思想开始萌 芽。A、B、C 正确。“工农武装割据”和农村包 围城市、武装夺取政权的思想是毛泽东在土地 革命战争时期提出的，D错误。 ·"},
  {id:412,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"实事求是是毛泽东思想的基本点，是毛泽东思想的精髓。在实事求是思想路线提出和确立的过程 中，毛泽东提出的相关观点有",options:["A. 没有调查，没有发言权","B. 我们要坚持用马克思主义之“矢”去射中国革命之“的” C、一个党，一个国家，一个民族，如果一切从本本出发，那它就不能前进","D. 不唯上、不唯书、只唯实，交换、比较、反复"],answer:"AB",explanation:"实事求是是毛泽东思想的基本点，是毛 泽东思想的精髓。这条思想路线由毛泽东确 立于民主革命时期。毛泽东向来反对离开中 国社会和中国革命的实际去研究马克思主义。 1930年，他在《反对本本主义》中强调调查研 究是一切工作的第一步，提出了“没有调查， 没有发言权”的著名论断。为了统一全党思 想并为制定新民主主义革命的总路线奠定思 想基础，毛泽东在延安整风期间又从思想路线 的角度，不仅系统阐述了坚持实事求是的重要 性，而且对实事求是的科学含义作了马克思主 义的界定。毛泽东还把实事求是形象地比喻 为“有的放矢”,强调我们要坚持用马克思主义 之“矢”去射中国革命之“的”。经过延安 整风和党的七大，实事求是的思想路线在全党 得到了确立。A、B正确。 毛泽东在新民主主义革命时期领导我们 党克服了党内曾经盛行的把马克思主义教条 化、把共产国际决议和苏联经验神圣化的错误 倾向，在全党确立了实事求是的思想路线，由 此保证了新民主主义革命和社会主义改造的 胜利。然而，党没能始终如一坚持这条思想路 线，在社会主义建设道路的探索中出现了曲 折。邓小平指出：“一个党，一个国家，一个民 族，如果一切从本本出发，思想僵化，迷信盛 行，那它就不能前进，它的生机就停止了，就要 亡党亡国。”C 是邓小平的观点，不符合题意。 “不唯上、不唯书、只唯实，交换、比较、反复”是 陈云提出的，D不符合题意。 民主主义革命的必然趋势，坚决地领导民主革 命是争取社会主义胜利的条件。新民主主义 革命与社会主义革命是互相联系、紧密衔接 的，在民主主义革命和社会主义革命中间不容 横插一个资产阶级专政。A、B正确，C错误。"},
  {id:413,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"新中国成立的开国大典前，围绕军乐团演奏什么曲目，一度众说纷纭，提议用德国乐曲、苏联乐 曲、美国乐曲的意见都有。最终，毛泽东拍板：要听自己的乐曲，走自己的路。走自己的路，也 就是独立自主。独立自主是毛泽东思想活的灵魂的三个基本方面的内容之一，是",options:["A. 中华民族的优良传统","B. 中国共产党、中华人民共和国立党立国的重要原则","C. 党从中国实际出发、依靠党和人民力量进行革命、建设、改革的必然结论","D. 党的生命线和根本工作路线"],answer:"ABC",explanation:"独立自主，就是坚持独立思考，走自己的 路，就是坚定不移地维护民族独立、捍卫国家 主权，把立足点放在依靠自己力量的基础上， 同时积极争取外援，开展国际经济文化交流， 学习外国一切对我们有益的先进事物。独立 自主是中华民族的优良传统，是中国共产党、中 华人民共和国立党立国的重要原则，是我们党 从中国实际出发、依靠党和人民力量进行革命、 建设、改革的必然结论。A、B、C 正确。群众路 线是党的生命线和根本工作路线。D 错误。"},
  {id:414,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"邓小平在谈到毛泽东思想的时候指出：“这个思想，从历史上证明了是好的。中国的革命，不是由 别的思想引导到胜利的，而是由毛泽东思想引导到胜利的。革命胜利以后，也正是在毛泽东思想的 指导下，我们的社会主义建设才获得了这样伟大的成就，并且继续胜利地前进着。”毛泽东思想是",options:["A. 马克思主义中国化时代化的第一个重大理论成果","B. 中国革命和建设的科学指南","C. 中国共产党和中国人民宝贵的精神财富","D. 党必须长期坚持的指导思想"],answer:"ABCD",explanation:"“一次革命论”和“二次革命论”都是错误 的。“左”倾教条主义的“一次革命论”(如“无 间断”革命论)的错误在于，只看到了民主革命 与社会主义革命的联系，而混淆了民主革命与 社会主义革命的区别，在反帝反封建的同时， 也反对民族资产阶级，否定了中国革命的阶段 性。而右的“二次革命论”的错误在于，只看到 了民主革命与社会主义革命的区别，而没有看 到两个革命阶段的联系，放弃了党对民主革命 的领导权。D 错误。 ·"},
  {id:415,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"新民主主义革命与旧民主主义革命相比有新的内容和特点.集中表现在新民主主义革命",options:["A. 处于世界无产阶级社会主义革命的时代，是世界无产阶级社会主义革命的一部分","B. 革命的领导力量是中国无产阶级及其先锋队——中国共产党","C. 革命的指导思想是马克思列宁主义","D. 革命的前途是社会主义而不是资本主义"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:416,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"关于新民主主义政治纲领规定的新民主主义国家，以下说法正确的有",options:["A. 国体是各革命阶级联合专政","B. 政体是实行民主集中制的人民代表大会制度","C. 新民主主义共和国是一定历史时期的国家形式，是过渡的形式","D. 人民当家作主是新民主主义国家制度的核心内容和基本准则"],answer:"ABCD",explanation:"新民主主义国家的国体是无产阶级领 导的以工农联盟为基础，包括小资产阶级、民 族资产阶级和其他反帝反封建的人们在内的 各革命阶级的联合专政。与新民主主义国体 相适应的政体，是实行民主集中制的人民代 表大会制度。新民主主义国家的国体决定了 人民当家作主，由人民行使管理国家的一切 权力，这是新民主主义国家制度的核心内容 和基本准则，而人民代表大会制度能够最直 接、最全面地体现这一核心内容和准则。A、"},
  {id:417,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"新民主主义经济纲领的内容是",options:["A. 没收封建地主阶级的土地归农民所有","B. 没收官僚资产阶级的垄断资本归新民主主义的国家所有","C. 保护民族工商业","D. 没收外国在华资本归新民主主义的国家所有"],answer:"ABC",explanation:"（本题解析见原书解析分册）"},
  {id:418,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"1948年，毛泽东在《在晋绥干部会议上的讲话》中，在新民主主义革命总路线的革命对象中增 加了“官僚资本主义”。把官僚资本主义作为民主革命的对象，是因为官僚资本主义",options:["A. 是资本主义，党作为中国无产阶级的先锋队必须带领人民消灭资本主义剥削制度","B. 背靠帝国主义，充当帝国主义的买办，是买办的、封建的国家垄断资本主义","C. 同大地主、大资产阶级的反革命国家政权密切结合着，成为国民党统治的经济基础","D. 严重束缚了中国社会生产力的发展，对中国社会进步起着严重的阻碍作用"],answer:"BCD",explanation:"（本题解析见原书解析分册）"},
  {id:419,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"新民主主义革命的对象是帝国主义、封建主义和官僚资本主义，它不是一般地消灭资本主义和 资产阶级，“它只推翻帝国主义和汉奸反动派在中国的统治，而不破坏任何尚能参加反帝反封建 的资本主义成分”。在新民主主义条件下保护民族工商业，发展资本主义，这是因为",options:["A. 同官僚资产阶级相比，民族资产阶级与帝国主义和封建主义联系较少","B. 民族资本主义经济是一种与新生产力相联系的先进的生产方式和经济成分","C. 让私人资本主义经济在不能操纵国计民生的范围内获得发展的便利，有益于社会向前发展","D. 民族资本家经营的企业在中国社会经济中占主要地位，保护民族工商业有利于社会稳定"],answer:"ABC",explanation:"A、B、C正确。民族资本家经营的企业 由于原始积累不足，大多数规模小、设备落 后，并受到外国资本主义和本国封建主义及 官僚买办资产阶级的压迫，发展缓慢，始终未 能在中国社会经济中占主要地位。D 错误。"},
  {id:420,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"当年，蒋介石在南京宣称，谁控制了北平、上海、广州等城市，谁就控制了中国；毛泽东在井 冈山说，谁赢得了农民，谁就会赢得中国。1926年，毛泽东曾在广州农民运动讲习所任所长， 培养了300多名学员，他们奔赴各地领导农民运动。仿佛是巧合——讲习所内展示的红色锦旗 依旧赫然：“农为党本”。按当时体例从右向左书写的四个大字，今天从左向右读来就是“本党 为农”。党之所以如此重视农民，是因为",options:["A. 农民是中国革命的主力军","B. 新民主主义革命实质上就是党领导下的农民革命","C. 中国革命战争实质上就是党领导下的农民战争","D. 农民阶级是近代中国最革命最进步的阶级"],answer:"ABC",explanation:"（本题解析见原书解析分册）"},
  {id:421,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"1938年11月， 毛泽东在《战争和战略问题》中明确指出：“共产党的任务，基本地不是经过长 期合法斗争以进入起义和战争，也不是先占城市后取乡村，而是走相反的道路。”中国走农村包 围城市、武装夺取政权道路的依据是",options:["A. 无产阶级是革命的领导阶级","B. 农民占全国人口的绝大多数，是无产阶级可靠的同盟军和革命的主力军","C. 当时的中国内无民主制度而受封建主义的压迫，外无民族独立而受帝国主义的压迫","D. 在半殖民地半封建的近代中国，封建主义和人民大众的矛盾是各种矛盾中最主要的矛盾"],answer:"BC",explanation:"B、C 正确。无产阶级是革命的领导阶 级，不是中国走农村包围城市、武装夺取政权 道路的依据。俄国十月革命也是无产阶级领 导的，但走的却是城市包围农村的道路，A错 误。在半殖民地半封建的近代中国，社会矛 盾呈现出错综复杂的状况。在诸多社会矛盾 中，占支配地位的主要矛盾是帝国主义和中"},
  {id:422,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"近代中国社会的阶级结构是“两头小中间大”,“中间”是指",options:["A. 无产阶级","B. 农民阶级","C. 民族资产阶级","D. 城市小资产阶级"],answer:"BCD",explanation:"中国社会的阶级结构是“两头小中间 大”,“两头”的一头是无产阶级，另一头是地 主大资产阶级，“两头小”即占少数；“中间”是 指农民、城市小资产阶级以及其他中间阶级， 占多数。B、C、D正确。A 是“两头”中的一头。 点 拨 在“习近平新时代中国特色社会主义 思想概论”这门课程中也有一个类似的“两 头小中间大”的比喻：在分配问题上，我们 要“扩大中等收入群体比重，增加低收入群 体收入，合理调节高收入，取缔非法收入， 形成中间大、两头小的橄榄型分配结构” (橄榄型分配结构是一种以中等收入群体为 主体、高收入和低收入群体占比均较小的收 入分配模式，其核心特征是“中间大、两头 小”,形似橄榄)。"},
  {id:423,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"新民主主义革命时期，以国共合作为基础所建立的统一战线有",options:["A. 国民革命联合战线","B. 工农民主统一战线","C. 抗日民族统一战线","D. 人民民主统一战线"],answer:"AC",explanation:"新民主主义革命时期，中国共产党先 后经历了国民革命联合战线、工农民主统一 战线、抗日民族统一战线、人民民主统一战线 等几个时期。符合“以国共合作为基础”的是 国民革命联合战线(第一次国共合作的统一 战线)与抗日民族统一战线(第二次国共合作 的统一战线)。A、C正确。"},
  {id:424,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"武装斗争是中国革命的特点和优点之一。总结党在新民主主义革命时期开展武装斗争的革命经 验，建设人民军队，要",options:["A. 坚持党对军队的绝对领导","B. 建设全心全意为人民服务的人民军队","C. 开展革命的政治工作","D. 坚持正确的战略战术原则"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:425,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"开展革命的政治工作是党在新民主主义革命时期建设人民军队的经验之一。人民军队政治工作 的基本原则包括",options:["A. 支部建在连上的原则","B. 官兵一致的原则","C. 军民一致的原则","D. 瓦解敌军和优待俘虏的原则"],answer:"BCD",explanation:"87 考研政治1 0 0 题 解析分册 A、B、C正确。没收封建地主阶级的土 地归农民所有，是新民主主义革命的主要内 容。封建地主土地所有制经济在中国封建社 会的经济中占主导地位，但不属于新民主主 义社会的五种经济成分。D 错误。 人民军队政治工作的基本原则包括： 官兵一致的原则，就是在军队内部建立自觉 纪律，实行同甘共苦的生活，官兵待遇平等； 军民一致的原则，就是军队要减轻民众的经 济负担，宣传、组织和武装民众；瓦解敌军和 优待俘虏的原则，就是要削弱敌人、壮大自 己。B、C、D 正确。“支部建在连上”属于坚 持党对军队的绝对领导的内容，A错误。"},
  {id:426,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"毛泽东在中共七大上总结的中国共产党区别于其他任何政党的显著标志有",options:["A. 谦虚、谨慎、不骄、不躁的作风","B. 理论和实践相结合的作风","C. 自我批评的作风","D. 和人民群众紧密地联系在一起的作风"],answer:"BCD",explanation:"两条道路、工人阶级和资产阶级两个阶级的 B、C、D正确。A 是在党的七届二中全 会上提出的，不符合题意。"},
  {id:427,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"中国共产党要领导革命取得胜利，必须不断加强党的思想建设、组织建设和作风建设。新民主 主义革命时期党的建设的主要经验有",options:["A. 必须把思想建设始终放在党的建设的首位，以无产阶级思想克服和改造各种非无产阶级思想","B. 必须重视党的组织建设和作风建设","C. 必须联系党的政治路线加强党的建设","D. 注意党的执政能力建设"],answer:"ABC",explanation:"A、B、C正确。执政能力建设主要是在 中国共产党成为全国的执政党以后的事情， 党的十六大以后才突出地强调这个问题。D 不符合题意。"},
  {id:428,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"新民主主义社会是",options:["A. 中国由新民主主义转变到社会主义的过渡性社会形态","B. 无产阶级推翻资产阶级建立政权过程中必然经历的一个独立的社会形态","C. 属于社会主义体系的逐步过渡到社会主义社会的过渡性质的社会","D. 既有社会主义因素又有非社会主义因素存在的社会"],answer:"ACD",explanation:"A、C、D正确。新民主主义社会不是一个 独立的社会形态，而是由新民主主义向社会主 义转变的过渡性社会形态，而且其他国家的无 产阶级革命中也没有这样的先例，B 错误。 A、B、C 正确。遵循自愿互利、典型示 范和国家帮助的原则是对农业进行社会主义 改造的原则，不是对资本主义工商业进行社 会主义改造的原则，D错误。"},
  {id:429,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"新中国成立初期，中国处于新民主主义社会。新民主主义社会有五种经济成分，其中主要的经 济成分是",options:["A. 社会主义经济","B. 个体经济","C. 资本主义经济","D. 封建地主经济"],answer:"ABC",explanation:"手工业供销合作社和初级农业生产合 88"},
  {id:430,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"党在过渡时期的总路线，将马克思列宁主义关于过渡时期的理论在中国进一步具体化了，形成 了中国化的过渡时期理论，为中国社会主义改造提供了行动指南。党在过渡时期的总路线",options:["A. 是社会主义建设和社会主义改造同时并举的路线","B. 体现了社会主义工业化和社会主义改造的紧密结合","C. 体现了解放生产力与发展生产力的有机统一","D. 体现了变革生产关系与发展生产力的有机统一"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:431,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"在社会主义改造中，我国创造性地开辟了一条适合中国情况的对资本主义工商业进行社会主义 改造的道路，主要有",options:["A. 用和平赎买的方法改造资本主义工商业","B. 采取从低级到高级的国家资本主义的过渡形式","C. 把资本主义工商业者改造成为自食其力的社会主义劳动者","D. 遵循自愿互利、典型示范和国家帮助的原则"],answer:"ABC",explanation:"（本题解析见原书解析分册）"},
  {id:432,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"我国对个体手工业的社会主义改造，采取了类似改造个体农业的逐步过渡的方法。以下逐步过 渡的形式中，在性质上相一致的过渡形式是",options:["A. 手工业供销合作社","B. 手工业供销小组","C. 手工业生产合作社","D. 初级农业生产合作社"],answer:"AD",explanation:"（本题解析见原书解析分册）"},
  {id:433,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"我国之所以能够采取赎买的方式对资本主义工商业进行和平改造，其原因在于",options:["A. 民族资产阶级具有两面性","B. 中国共产党与民族资产阶级长期保持着统一战线的关系","C. 我国已经有了人民民主专政的国家政权和掌握了国家经济命脉的强大的社会主义国营经济","D. 国家对粮食和工业原料的统购统销，以及资本主义企业中工人群众对资本家的监督"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:434,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"在党的七届二中全会上，毛泽东将“国家和私人合作的国家资本主义经济”作为新中国的几种 主要的经济成分之一。在新中国社会主义改造过程中，中国共产党采用国家资本主义的方式开 展对资本主义工商业的社会主义改造，即通过在一定的时期内有步骤地、有区别地把一切对国 计民生有利的、而又为国家所需要的资本主义企业基本上改造为国家资本主义企业，并有计划 地稳步地使低级形式的国家资本主义向高级形式的国家资本主义发展。国家资本主义",options:["A. 是与社会主义直接相联系的、国家直接控制和支配下的资本主义经济","B. 不是一种独立的经济形态","C. 其性质取决于生产力的发展水平 D、是个体经济向社会主义集体经济过渡的形式"],answer:"AB",explanation:"国家资本主义是与社会主义直接相联 系的、国家直接控制和支配下的资本主义经 济。它不是一种独立的经济形态，其性质取 决于所在国家的性质。A、B 正确，C 错误。 在新民主主义社会中，存在着五种经济成分： 社会主义性质的国营经济、半社会主义性质 的合作社经济、农民和手工业者的个体经济、 私人资本主义经济和国家资本主义经济。其 中，半社会主义性质的合作社经济是个体经 济向社会主义集体经济过渡的形式，国家资 本主义经济是私人资本主义经济向社会主义 国营经济过渡的形式。D 错误。"},
  {id:435,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"我国对资本主义工商业的改造采取赎买的方针，所谓赎买就是",options:["A. 国家有偿地将私营企业改变为国营企业","B. 由国家支付一笔巨额补偿资金","C. 让资本家在一定年限内从企业经营所得中获取一部分利润","D. 国家把私营企业改变为集体企业"],answer:"AC",explanation:"A、C正确。赎买的具体方式不是由国 家支付一笔巨额补偿资金，而是让资本家在 一定年限内从企业经营所得中获取一部分利 润。私营企业也不是改变为集体企业，而是 改变为国营企业，B、D 错误。"},
  {id:436,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"我国对资本主义工商业的社会主义改造经历了三个步骤：第一步实行初级形式的国家资本主义； 第二步实行个别企业的公私合营；第三步实行全行业的公私合营。从个别企业的公私合营到全 行业公私合营，是",options:["A. 党和国家对资本主义工商业采取利用、限制、改造政策的必然趋势","B. 经济运行中计划不断强化的必然结果","C. 保证国家重点建设顺利进行的必然要求","D. 彻底完成民主革命遗留任务的必要前提"],answer:"ABC",explanation:"A、B、C 正确。中国革命分两步走，第 一步是民主革命，第二步是社会主义革命，后 者不可能成为前者的前提。D 错误。"},
  {id:437,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"把资本主义工商业者改造成为自食其力的社会主义劳动者，是适合中国情况的对资本主义工商 业进行社会主义改造的道路的主要内容之一，它的优点在于",options:["A. 通过改造阶级成分的方式达到从整体上消灭资产阶级的目的","B. 对企业的改造和对人的改造相结合","C. 改造资本家个人与消灭他们所属的资产阶级相结合","D. 既避免了激烈的阶级对抗，减少了改造的阻力，又推动了生产力的发展和社会的进步"],answer:"ABCD",explanation:"在对资本主义工商业的社会主义改造 中，国家对资方在职人员和资方代理人采取 “包下来”的政策，以企业为基地，根据“量才 使用，适当照顾”的原则，对他们在政治上适 当安排、工作上发挥作用、生活上妥善照顾， · 通过改造阶级成分的方式达到从整体上消灭 资产阶级的目的。对企业的改造和对人的改 造相结合，改造资本家个人与消灭他们所属 的资产阶级相结合，既避免了激烈的阶级对 抗，减少了改造的阻力，又推动了生产力的 发展和社会的进步。A、B、C、D 全选。"},
  {id:438,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"我国在对个体农业进行社会主义改造的过程中，成功地开辟了一条适合我国情况的农业社会主 义改造道路，其内容主要有",options:["A. 积极引导农民组织起来，走互助合作道路","B. 遵循自愿互利、典型示范、国家帮助的原则","C. 坚持积极领导、稳步前进的方针，采取循序渐进的步骤","D. 在有条件的地区推广农业生产责任制"],answer:"ABC",explanation:"正确选项是A、B、C,分别说明了我国 农业社会主义改造的道路、原则、方针和步 骤。D 是1978年之后实施的农村经济管理 体制。"},
  {id:439,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"在一个几亿人口的大国中比较顺利地实现了如此复杂、困难和深刻的社会主义改造，不仅没有 造成生产力的破坏，反而促进了工农业和整个国民经济的发展；不仅没有引起巨大的社会动荡， 反而极大地加强了人民的团结，并且是在人民普遍拥护的情况下完成的。这些情况说明，我国 社会主义改造的基本完成的确是一个伟大的历史性胜利。我国社会主义改造的成功经验在于",options:["A. 坚持“一举过渡”","B. 坚持社会主义工业化建设与社会主义改造同时并举","C. 采取积极引导、逐步过渡的方式","D. 用和平方法进行改造"],answer:"BCD",explanation:"B、C、D正确。新中国成立之初，当时 的设想是“一举过渡”。随着民主革命遗留任 务的彻底完成和国内阶级关系、主要矛盾的 变化，国民经济的恢复、初步发展和中国社会 经济成分的变化，中共中央对向社会主义过 渡步骤的认识也发生了变化。1952年9月 24日，毛泽东在中共中央书记处会议上提 出，我们要在“十年到十五年基本上完成社会 主义，不是十年以后才过渡到社会主义”。刘 少奇、周恩来等也都论述过“从现在逐步过渡 到社会主义去”的设想。这是“建设和改造同 时并举，逐步过渡”的设想。提出过渡时期 总路线，就是这一转变的结果。A 错误。"},
  {id:440,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"1956年底，我国对农业、手工业和资本主义工商业的社会主义改造基本完成，我国社会经济结 构发生了根本变化，社会主义公有制已成为我国社会的经济基础，标志着中国历史上长达数千 年的阶级剥削制度的结束和社会主义基本制度的确立。在中国确立社会主义基本制度是中国共 产党百年奋斗的伟大成就之一。社会主义基本制度的确立",options:["A. 是中国历史上最深刻最伟大的社会变革，为当代中国一切发展进步奠定了制度基础","B. 实现了马克思主义同中国实际的“第二次结合”","C. 极大地促进了我国社会生产力的发展","D. 使广大劳动人民真正成为国家的主人，这是中国几千年来阶级关系的最根本变革"],answer:"ACD",explanation:"89 考研政治 1000题 解析分册 · A、C、D正确。1956年社会主义基本制 度在中国确立的时候，马克思主义同中国实际 的“第二次结合”刚开始，并没有完成。B 错误。"},
  {id:441,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"1956年，毛泽东提出探索马克思主义同中国实际即社会主义建设实际的“第二次结合”,这说 明中国共产党",options:["A. 开始探索适合中国特点的社会主义建设道路","B. 开始摆脱单一的苏联模式","C. 开始重新认识“什么是社会主义、怎样建设社会主义”","D. 开始明确社会主义基本制度建立后还要通过改革进一步解放生产力"],answer:"AB",explanation:"A、B正确。毛泽东提出探索马克思主 义同中国实际即社会主义建设实际的“第二次 结合”,虽然在理论和实践上都取得了许多积 极成果，但当时并没有开始重新认识“什么是 社会主义、怎样建设社会主义”的问题，这也是 毛泽东虽然提出了“第二次结合”,但总体上没 有取得成功的最根本的原因。C 错误。明确 社会主义基本制度建立后还要通过改革进一 步解放生产力是邓小平的贡献。D 错误。"},
  {id:442,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"1957年2月，毛泽东在《关于正确处理人民内部矛盾的问题》的报告中提出了一系列正确处理 人民内部矛盾的具体方针、原则，主要有",options:["A. 统筹兼顾、适当安排","B. 有理、有利、有节","C. “百花齐放、百家争鸣”","D. “ 长期共存、互相监督”"],answer:"ACD",explanation:"毛泽东提出的一系列正确处理人民内 部矛盾的具体方针、原则有：对于政治思想领 域的人民内部矛盾，实行“团结—批评—团 结”的方针，坚持说服教育、讨论的方法；对于 物质利益、分配方面的人民内部矛盾，实行统 筹兼顾、适当安排的方针，兼顾国家、集体和 个人三方面的利益；对于科学文化领域里的 矛盾，实行“百花齐放、百家争鸣”的方针； 对于共产党和民主党派之间的矛盾，实行在 坚持社会主义道路和共产党领导的前提下 “长期共存、互相监督”的方针；等等。A、 C、D正确。有理、有利、有节是抗日战争时期 党在抗日民族统一战线内与国民党顽固派斗 争的方针，B错误。"},
  {id:443,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"走中国工业化道路的思想是党在社会主义建设道路初步探索中取得的理论成果之一。毛泽东所 说的中国工业化道路，就是正确处理重工业和轻工业、农业的关系，也就是他在《论十大关系》 中论述的第一大关系。为此，毛泽东提出了以农业为基础，以工业为主导，以农轻重为序发展 国民经济的总方针，以及一整套“两条腿走路”的工业化发展思路，即",options:["A. 重工业和轻工业同时并举","B. 中央工业和地方工业同时并举","C. 沿海工业和内地工业同时并举","D. 外资企业和内资企业同时并举"],answer:"ABC",explanation:"毛泽东提出了以农业为基础，以工业 为主导，以农轻重为序发展国民经济的总方 针，以及一整套“两条腿走路”的工业化发展 思路，即重工业和轻工业同时并举，中央工 业和地方工业同时并举，沿海工业和内地工 业同时并举，大型企业和小型企业同时并 举，等等。A、B、C 正确。毛泽东没有提出外 资企业和内资企业同时并举，D错误。"},
  {id:444,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"以毛泽东为核心的第一代中央领导集体在创建新中国和探索适合中国情况的社会主义建设道路 过程中，形成了一系列重要的理论，主要有",options:["A. 在社会主义经济建设方面，实行以农业为基础，以工业为主导，以农轻重为序发展国民经济 的总方针","B. 社会主义可以分为不发达的社会主义和比较发达的社会主义两个阶段，后一阶段可能比前一 阶段需要更长的时间","C. 应当采取“两步走”的发展战略，把中国建设成为一个具有现代农业、现代工业、现代国防 和现代科学技术的社会主义强国","D. 发展面向现代化、面向世界、面向未来的，民族的科学的大众的社会主义文化"],answer:"ABC",explanation:"96 A、B、C正确。在社会主义文化建设方 面，毛泽东提出，要坚持马克思主义的指导地 位，实行“百花齐放、百家争鸣”的方针，对古 今中外的优秀文化，实行“古为今用、洋为中 用、百花齐放、推陈出新”的方针。“发展面向 现代化、面向世界、面向未来的，民族的科学 的大众的社会主义文化”是后来提出的，也是 目前关于发展中国特色社会主义文化的提法 中的一部分，D 错误。 赋予其鲜明的时代特色，是探索中国特色社 会主义取得的重大理论成果之一，是对马克 思主义的重大发展。这一科学概括，反映了 人民的利益和时代的要求，廓清了不合乎时 代进步和社会发展规律的模糊观念，摆脱了 长期以来拘泥于具体模式而忽略社会主义本 质的错误倾向，把对社会主义的认识提高到 新的科学水平。A、B、C、D 全选。 ·"},
  {id:445,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"以毛泽东同志为主要代表的中国共产党人对社会主义建设道路的初步探索",options:["A. 彻底摆脱了苏联模式的影响","B. 巩固和发展了我国的社会主义制度","C. 丰富了科学社会主义的理论和实践","D. 为开创中国特色社会主义提供了宝贵经验、理论准备、物质基础"],answer:"BCD",explanation:"（本题解析见原书解析分册）"},
  {id:446,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"实践没有止境，理论创新也没有止境。改革开放以来，我们党继续推进马克思主义中国化时代 化，形成和发展了中国特色社会主义理论体系。中国特色社会主义理论体系逐步形成和发展的 社会历史条件是",options:["A. 对国际形势深刻变化和世界发展新趋势的深刻把握","B. 对建设社会主义正反两方面经验的认真总结","C. 对我国发展历史方位的科学判断","D. 对中国特色社会主义建设实践经验的科学总结"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:447,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"中国特色社会主义理论体系是中国共产党长期探索的伟大理论创造，开辟了马克思主义中国化 时代化新境界。中国特色社会主义理论体系是",options:["A. 全党全国各族人民团结奋斗的共同思想基础","B. 战胜来自政治、经济、社会和自然界等一切风险和挑战的精神支柱","C. 全面推进中华民族伟大复兴的根本指针","D. 我们党最可宝贵的政治和精神财富"],answer:"ABCD",explanation:"中国特色社会主义理论体系是全党全 国各族人民团结奋斗的共同思想基础，是战 胜来自政治、经济、社会和自然界等一切风险 和挑战的精神支柱，是坚持和发展中国特色 社会主义的行动指南，是全面推进中华民族 伟大复兴的根本指针，是我们党最可宝贵的 政治和精神财富，必须长期坚持。A、B、C、D 全选。"},
  {id:448,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"邓小平关于社会主义本质的科学概括，对于我们在坚持社会主义基本制度的基础上推进改革， 指导改革沿着合乎社会主义本质要求的方向发展，对于建设中国特色社会主义，具有重大的政 治意义、理论意义和实践意义。这一科学概括",options:["A. 既坚持了科学社会主义的基本原则，又赋予其鲜明的时代特色","B. 反映了人民的利益和时代的要求","C. 廓清了不合乎时代进步和社会发展规律的模糊观念","D. 摆脱了长期以来拘泥于具体模式而忽略社会主义本质的错误倾向"],answer:"ABCD",explanation:"邓小平关于社会主义本质的科学概 括，既坚持了科学社会主义的基本原则，又 91"},
  {id:449,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"党的十一届三中全会以后，以邓小平同志为主要代表的中国共产党人重新确立并丰富发展了实 事求是的思想路线，提出了一系列有利于增强党的团结和调动一切积极因素的方针政策。党的 思想路线的重新确立，解决了一系列重大理论和实践问题。具体来说就是，坚持解放思想、实 事求是",options:["A. 有力推动和保证了拨乱反正的进行","B. 破除了僵化的社会主义模式观念，坚持走自己的路","C. 一切从社会主义初级阶段的实际出发","D. 坚持以“三个有利于”作为检验一切工作是非得失的根本标准"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:450,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"社会主义制度建立以后，也有一个如何认清国情、正确判断我国社会所处历史方位的问题。社 会主义初级阶段理论",options:["A. 揭示了当代中国的历史方位，为建设中国特色社会主义提供了总依据","B. 是对马克思主义关于社会主义发展阶段理论的重大发展和重大突破","C. 使我们党对社会主义建设的长期性、复杂性、艰巨性有了更加清醒的认识","D. 正确回答了邓小平理论首要的基本的理论问题"],answer:"ABC",explanation:"A、B、C 正确。邓小平理论首要的基本 的理论问题是“什么是社会主义、怎样建设 社会主义”。D 错误。 B、C、D 正确。由于在初步探索时期，中 国共产党人对什么是社会主义以及怎样建设社 会主义的问题并没有完全搞清楚，因此，不能说 已经彻底摆脱了苏联模式的影响。A 错误。"},
  {id:451,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"1992年，针对人们思想中普遍存在的疑虑，邓小平南方谈话重申了深化改革、加速发展的必要 性和重要性，并从中国实际出发，站在时代的高度，深刻地总结了十多年改革开放的经验教训， 在一系列重大的理论和实践问题上，提出了一系列重要论断。这些重要论断包括",options:["A. 社会主义可以搞市场经济","B. 不坚持社会主义，不改革开放，不发展经济，不改善人民生活，就没有出路","C. “三个有利于”标准","D. 革命是解放生产力，改革也是解放生产力"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:452,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"邓小平理论是马克思列宁主义基本原理同当代中国实际和时代特征相结合的产物，是对马克思 列宁主义、毛泽东思想的继承和发展，是全党全国人民集体智慧的结晶。邓小平理论是",options:["A. 中国特色社会主义理论体系的开篇之作","B. 中国共产党和中国人民宝贵的精神财富","C. 中国革命、建设、改革的科学指南","D. 党和国家必须长期坚持的指导思想"],answer:"ABD",explanation:"A、B、D正确。邓小平理论是在改革开放 的新时期形成的，是改革开放和社会主义现代 化建设的科学指南，不涉及革命问题。C错误。"},
  {id:453,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"发展是党执政兴国的第一要务。关于正确认识和处理改革、发展、稳定的关系，以下说法正确 的有",options:["A. 改革是动力，发展是目的，稳定是前提","B. 要把改革的力度、发展的速度和社会可承受的程度统一起来","C. 把不断改善人民生活作为处理改革、发展、稳定关系的重要结合点","D. 在社会稳定中推进改革发展，通过改革发展促进社会稳定"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:454,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"2001年11月，在卡塔尔首都多哈举行的世界贸易组织第四届部长级会议通过中国加入世界贸 易组织的决定。同年12月，中国正式加入世界贸易组织。加入世界贸易组织是党为推进经济发 展和改革开放而作出的重大战略决策。短短20余年间，我国货物贸易总额增长了11倍，成为 全球第一货物贸易大国、140多个国家和地区的主要贸易伙伴，对全球经济增长的年均贡献率 近30%。事实表明，加入世界贸易组织",options:["A. 使中国经济在全球化进程中获得参与制定规则和竞争的有利位置","B. 打开了我国对外开放的新天地，对推动经济体制改革和现代化建设产生了深刻影响","C. 使我国从国际经贸规则的被动接受者和主动接轨者，逐步成长为重要参与者","D. 是我国对外开放的里程碑，中国对外开放进入了一个新的阶段"],answer:"ABCD",explanation:"考 点 拓 展 题 57. 答案 ABCD"},
  {id:455,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"“三个代表”重要思想最鲜明的特点和最突出的贡献，在于用一系列紧密联系、相互贯通的新 思想新观点新论断",options:["A. 进一步回答了什么是社会主义、怎样建设社会主义的问题","B. 创造性回答了建设什么样的党、怎样建设党的问题","C. 继承和发展了马克思列宁主义、毛泽东思想、邓小平理论","D. 深化了我们对新的时代条件下推进中国特色社会主义事业、加强党的建设的规律的认识"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:456,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"科学发展观创造性回答了新形势下实现什么样的发展、怎样发展等重大问题。科学发展观的集 中概括是",options:["A. 第一要义是发展","B. 核心立场是以人为本","C. 基本要求是全面协调可持续","D. 根本方法是统筹兼顾"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:457,chapter:"毛中特",sub:"毛泽东思想和中国特色社会主义理论体系概论",type:"multi",question:"科学发展观最鲜明的精神实质是",options:["A. 解放思想","B. 实事求是","C. 与时俱进","D. 求真务实 1."],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:458,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"“十个明确”“十四个坚持”“十三个方面成就”“六个必须坚持”内在贯通、有机统一，共同构 成了习近平新时代中国特色社会主义思想的科学体系。其中，构成了这一思想体系的四梁八柱， 发挥着统摄作用的是",options:["A. “十个明确”","B. “ 十四个坚持”","C. “十三个方面成就”","D. “六个必须坚持”"],answer:"A",explanation:"“十个明确”是习近平新时代中国特色 社会主义思想的主体内容，集中体现了这一思 想体系的主要观点和基本精神，构成了这一思 想体系的四梁八柱，发挥着统摄作用。A 正 确。“十四个坚持”是习近平新时代中国特色 社会主义思想的重要组成部分，是在治国理政 各方面作出的理论分析和政策指导，构成了新 时代坚持和发展中国特色社会主义的基本方 略。“十三个方面成就”对新时代伟大实践进 行了科学总结，全景式地展示了习近平新时代 中国特色社会主义思想的理论与实践成果。 “六个必须坚持”赋予了马克思主义世界观和 方法论以新的时代内涵，彰显了习近平新时代 中国特色社会主义思想的理论品格和鲜明特 征。B、C、D 错误。"},
  {id:459,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"党的二十大提出的“六个必须坚持”,是习近平新时代中国特色社会主义思想的世界观、方法论 和贯穿其中的立场观点方法的重要体现。在这“六个必须坚持”中，必须坚持自信自立是",options:["A. 根本价值立场","B. 内在精神特质","C. 鲜明理论品格","D. 重要实践要求"],answer:"B",explanation:"坚持人民至上是根本价值立场；坚持自 信自立是内在精神特质，体现了客观规律性和 主观能动性的有机结合；坚持守正创新是鲜明 理论品格；坚持问题导向是重要实践要求；坚 持系统观念是基本思想和工作方法；坚持胸怀 天下是中国共产党人的境界格局。B 正确，A、 C、D错误。"},
  {id:460,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"新时代坚持和发展中国特色社会主义，必须坚定道路自信、理论自信、制度自信、文化自信。我 们坚定“四个自信”的理论支撑和根本依据是",options:["A. 世界百年变局加速演进","B. 江山就是人民，人民就是江山","C. 实现中华民族伟大复兴进入不可逆转的历史进程","D. 社会主义必然代替资本主义的客观规律"],answer:"D",explanation:"中国特色社会主义道路自信、理论自信、 制度自信、文化自信，来源于实践、来源于人 民、来源于真理。马克思主义深刻揭示了社会 主义必然代替资本主义的客观规律，这是我 们坚定“四个自信”的理论支撑和根本依据。 · D正确，A、B、C 错误。"},
  {id:461,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"坚定中国特色社会主义道路自信、理论自信、制度自信，说到底是要坚定",options:["A. 政治自信","B. 历史自信","C. 战略自信","D. 文化自信"],answer:"D",explanation:"习近平指出：“如果没有中华五千年文 明，哪里有什么中国特色?如果不是中国特 色，哪有我们今天这么成功的中国特色社会主 义道路?”要坚定中国特色社会主义道路自信、 理论自信、制度自信，说到底是要坚定文化自 信，文化自信是更基础、更广泛、更深厚的自 信，是一个国家、一个民族发展中最基本、最 深沉、最持久的力量。D正确。"},
  {id:462,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"中国特色社会主义进入新时代，是长期以来特别是党的十八大以来我们党领导人民不懈奋斗的必 然结果，是我们党在科学把握形势和实践发展变化基础上作出的重大判断。新时代是我国发展新 的历史方位，标志着中国特色社会主义事业进入了新的发展阶段。中国特色社会主义进入新时代 重大判断的基本依据是",options:["A. 我国社会主要矛盾发生新变化","B. 党的主要任务发生新变化","C. 中国和世界关系发生新变化","D. 发展理念和思路发生新变化"],answer:"A",explanation:"社会主要矛盾状况及其变化，是认识把握 社会发展阶段性特征的重要依据。我国社会主 要矛盾的变化反映了我国社会主义初级阶段不 断变化的新特点，是我们党作出中国特色社会主 义进入新时代重大判断的基本依据。A 正确。"},
  {id:463,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"“四个全面”战略布局，是新的时代条件下坚持和发展中国特色社会主义、推进改革开放和社会主 义现代化建设的战略抉择。“四个全面”战略布局既有战略目标又有战略举措，每个“全面”之间 具有紧密的内在逻辑，是一个整体战略部署的有序展开。在“四个全面”中居于引领地位的是",options:["A. 全面深化改革","B. 全面依法治国","C. 全面从严治党","D. 全面建设社会主义现代化国家"],answer:"D",explanation:"全面建设社会主义现代化国家是战略目 标，在“四个全面”中居于引领地位；全面深 化改革、全面依法治国、全面从严治党是三大 战略举措，为全面建设社会主义现代化国家提 供重要保障。D 正确，A、B、C 错误。 考研政治1000题 >>>解析分册 ·"},
  {id:464,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"习近平指出：“中国式现代化，是中国共产党领导的社会主义现代化，既有各国现代化的共同特 征，更有基于自己国情的中国特色。”党的二十大集中概括了中国式现代化五个方面的中国特色， 深刻揭示了中国式现代化的科学内涵，这是理论概括，也是实践要求。关于中国式现代化，以下 内容正确的是 ①人口规模巨大的现代化是中国式现代化的显著特征 ②全体人民共同富裕的现代化是中国式现代化的本质特征 ③既要物质富足、也要精神富有，是中国式现代化的崇高追求 ④促进人与自然和谐共生，是中国式现代化区别于西方现代化的显著标志",options:["A. ①②③","B. ①②④","C. ①③④","D. ②③④"],answer:"A",explanation:"中国式现代化的中国特色(5个方面): ①中国式现代化是人口规模巨大的现代化。 这是中国式现代化的显著特征。②中国式现 代化是全体人民共同富裕的现代化。这是中 国式现代化的本质特征，也是区别于西方现代 化的显著标志。3 中国式现代化是物质文明 和精神文明相协调的现代化。物质富足、精神 富有是社会主义现代化的根本要求。习近平 指出：“既要物质富足、也要精神富有，是中 国式现代化的崇高追求。”④中国式现代化是 人与自然和谐共生的现代化。尊重自然、顺应 自然、保护自然，促进人与自然和谐共生，是中 国式现代化的鲜明特点。⑤中国式现代化是 走和平发展道路的现代化。坚持和平发展，在 坚定维护世界和平与发展中谋求自身发展，又 以自身发展更好维护世界和平与发展，推动构 建人类命运共同体，是中国式现代化的突出特 征。①②③正确，④错误。因此，本题选A。"},
  {id:465,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"在长期实践过程中，党领导人民不懈探索现代化道路，取得了社会主义现代化建设的伟大成就， 用几十年时间走完了发达国家几百年走过的工业化历程。我国现代化建设的出发点和落脚点是",options:["A. 完善和发展中国特色社会主义制度","B. 增进民生福祉、促进社会公平","C. 实现人民对美好生活的向往","D. 实现高质量发展"],answer:"C",explanation:"中国式现代化是全体人民共同富裕的 现代化。这是中国式现代化区别于西方现代 化的显著标志。必须把实现人民对美好生活 的向往作为现代化建设的出发点和落脚点， C正确。完善和发展中国特色社会主义制度、 推进国家治理体系和治理能力现代化，是全面 深化改革的总目标，A 错误。中国特色社会保 障体系把增进民生福祉、促进社会公平作为根 本出发点和落脚点，B 错误。高质量发展是全 面建设社会主义现代化国家的首要任务，D 错误。"},
  {id:466,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"中国特色社会主义有很多特点和特征，其中最本质的特征是",options:["A. 以人民为中心","B. 中国特色社会主义道路","C. 中国特色社会主义制度","D. 中国共产党领导"],answer:"D",explanation:"（本题解析见原书解析分册）"},
  {id:467,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"加强党的全面领导为新时代党和国家事业发展提供了坚强保证。坚持和加强党的全面领导，使 党的政治领导力、思想引领力、群众组织力、社会号召力显著增强。马克思主义政党第一位的 能力是",options:["A. 思想引领力","B. 政治领导力","C. 社会号召力","D. 群众组织力"],answer:"B",explanation:"点 拨 关于“第 一 位”的提法： ①道路问题是关系党的事业兴衰成败第 一 位 的问题。 ②政治领导力是马克思主义政党第一位的能力。 ③政治方向是党生存发展第 一位的问题。 ④在领导干部的所有能力中政治能力是第 一 位的。 ⑤坚持正确的政治方向是做好新闻舆论工作 的第一位要求。"},
  {id:468,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"党的领导是党和国家的根本所在、命脉所在，是全国各族人民的利益所系、命运所系。党的领 导的最高原则是",options:["A. 党中央集中统一领导","B. 制度治党、依规治党","C. 坚定理想信念","D. 勇于自我革命"],answer:"A",explanation:"事在四方，要在中央。党中央集中统 一领导是党的领导的最高原则，是党保持团 结统一和强大战斗力、不断取得胜利的关键 所在。A 正确。"},
  {id:469,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"中国特色社会主义制度是一个严密完整的科学制度体系，起四梁八柱作用的是根本制度、基本 制度、重要制度。其中，具有统领地位的是",options:["A. 人民代表大会制度这一根本政治制度","B. 马克思主义在意识形态领域指导地位的根本制度","C. 社会主义基本经济制度","D. 党的领导制度"],answer:"D",explanation:"中国共产党领导是国家治理体系的核 心，党的领导制度是中国特色社会主义制度 建设的关键。习近平指出，中国特色社会主 义制度是一个严密完整的科学制度体系，起 四梁八柱作用的是根本制度、基本制度、重要 制度，其中具有统领地位的是党的领导制度。 D正确，A、B、C错误。"},
  {id:470,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"习近平指出：“时代是出卷人，我们是答卷人，人民是阅卷人。”我们党做好一切工作的价值取 向和根本标准是",options:["A. 促进国民经济发展","B. 维护国家长治久安","C. 增强国际影响力","D. 让群众满意"],answer:"D",explanation:"100"},
  {id:471,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"发展是党执政兴国的第一要务。发展的出发点和落脚点是",options:["A. 满足人民对美好生活的新期待","B. 不断实现理论和实践上的创新突破","C. 完善中国特色社会主义制度","D. 推进国家治理体系和治理能力现代化"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:472,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"实现现代化是近代以来中国人民孜孜以求的宏愿。中国共产党团结带领中国人民追求民族复兴 的历史，也是一部不断探索现代化道路的历史。现代化的最终目标是实现",options:["A. 中华民族伟大复兴","B. 物质财富极大丰富","C. 社会关系高度和谐","D. 人自由而全面的发展"],answer:"D",explanation:"推动全体人民共同富裕与促进人的全 面发展是高度统一的。马克思主义政党的最 高目标是实现共产主义，并把实现人的自由 而全面发展作为共产主义的本质特征。习近 平指出，现代化的最终目标是实现人自由而 全面的发展。D 正确。物质财富极大丰富、 消费资料按需分配，社会关系高度和谐、人们 精神境界极大提高，是共产主义社会三个基 本特征中的另外两个。A、B、C错误。 ③要把推进农业转移人口市民化作为新型城 镇化首要任务。 ④建设社会主义法治国家，必须把全面贯彻 实施宪法作为首要任务。 ⑤构建统筹各领域安全的新安全格局，必须 把维护政治安全作为应对各领域安全风险挑 战的首要任务。 ⑥保证全党服从中央，维护党中央权威和集 中统 一 领导，是党的政治建设的首要任务。 ⑦加强思想教育和理论武装，是党内政治生 活的首要任务。"},
  {id:473,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"改革开放是当代中国最显著的特征、最壮丽的气象。习近平强调：“改革开放是决定当代中国命 运的关键一招，也是决定实现‘两个一百年’奋斗目标、实现中华民族伟大复兴的关键一招。” 改革开放的鲜明特征和首要任务是",options:["A. 解放思想","B. 解放和发展社会生产力","C. 解放和增强社会活力","D. 以创新的思维和办法解决前进中的问题"],answer:"B",explanation:"全面深化改革开放，必须有利于进一 步解放思想、进一步解放和发展社会生产力、 进一步解放和增强社会活力。“三个进一步 解放”既是改革的目的，又是改革的条件。 解放思想，是开启改革开放事业的思想前提， 也是新时代全面深化改革开放的思想前提。 解放和发展社会生产力，是改革开放的鲜明 特征和首要任务，也是新时代贯彻新发展理 念、构建新发展格局、推动高质量发展的必然 要求。解放和增强社会活力，是社会主义改 革的内在要求和基本目的，也是新时代全面 深化改革的关键所在。B正确，A、C、D 错误。"},
  {id:474,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"全面深化改革开放，不是某个领域某个方面的变革，而是涉及党和国家事业发展全局的体制机 制变革。全面深化改革开放的主线是",options:["A. 重要领域和关键环节改革","B. 经济体制改革","C. 制度建设","D. 统筹改革、发展、稳定"],answer:"C",explanation:"· 统筹推进各领域各方面改革开放，必 须以全面深化改革总目标为引领，以制度建 设为主线，以经济体制改革为重点，以重要 领域和关键环节改革为突破口，使各方面改 革协同推进、环环相扣、形成合力。C 正确， A、B错误。统筹改革、发展、稳定是全面深化 改革开放要坚持的正确方法论之一，D错误。 点拨 制度建设也是进一步全面深化改革的 主线。关于“主线”的其他提法："},
  {id:475,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"全面深化改革必须牢牢把握总目标，实施好“六个紧紧围绕”的路线图。统筹推进各领域各方 面改革开放的突破口是",options:["A. 制度建设","B. 重要领域和关键环节改革","C. 经济体制改革","D. 文化体制改革"],answer:"B",explanation:"（本题解析见原书解析分册）"},
  {id:476,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"在全面深化改革开放中，我们坚持了正确方法论，这是改革取得成就的原因之一。在改革方法 论中，富有中国特色、符合中国国情的改革方法是",options:["A. 摸着石头过河","B. 加强顶层设计","C. 统筹改革发展稳定","D. 重大改革于法有据"],answer:"A",explanation:"新时代的改革同过去相比，广度和深 度都大大拓展了，要把改革推向前进，必须加 强顶层设计，以利于提高改革的科学性和协 调性。但加强顶层设计，并不是不要摸着石 头过河。摸着石头过河，是富有中国特色、 符合中国国情的改革方法。改革开放是全新 的事业，没有现成的方案和经验可以借鉴，必 须在实践中探索。A 正确。 局、管根本、管方向、管长远的东西，是发展思 路、发展方式、发展着力点的集中体现。发展 理念从根本上决定着发展成效乃至成败。党 的十八大以来，我们党适应发展新的形势，对 发展理念和思路作出及时调整，提出了经济 社会发展的许多重大理论和战略，其中新发 展理念是最重要、最主要的。C 正确。 20 301考研政治1000题 解析分册"},
  {id:477,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"正确处理好改革、发展、稳定的关系，是我国改革开放的一条重要经验。正确处理改革、发展、 稳定关系的结合点是",options:["A. 不断开辟发展新领域、新赛道","B. 人的自由而全面的发展","C. 坚持守正创新","D. 改善人民生活"],answer:"D",explanation:"改革、发展、稳定是我国社会主义现代 化建设的三个重要支点。改革是经济社会发 展的强大动力，发展是解决一切经济社会问 题的关键，稳定是改革发展的前提。正确处 理好改革、发展、稳定的关系，是我国改革开 放的一条重要经验。把改善人民生活作为正 确处理改革、发展、稳定关系的结合点，在 保持社会稳定中推进改革发展，通过改革发 展促进社会稳定。D 正确。"},
  {id:478,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"当前和今后一个时期是以中国式现代化全面推进强国建设、民族复兴伟业的关键时期。中国式现代化 是在改革开放中不断推进的，也必将在改革开放中开辟广阔前景。进一步全面深化改革，必须 ①以推进中国式现代化为主题 ②以深化经济体制改革为重点 ③以文化体制改革为牵引 ④以制度建设为主线",options:["A. ①②③","B. ①②④","C. ①③④","D. ②③④"],answer:"B",explanation:"党的二十届三中全会关于进一步全面 深化改革的重要提法有： 主题——推进中国式现代化； 重点——深化经济体制改革； 牵 引——经济体制改革； 出发点和落脚点——促进社会公平正 义、增进人民福祉； 主线——制度建设。 ①②④正确，③错误。因此，本题选B。 · 单"},
  {id:479,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"面对纷繁复杂的国际国内形势，面对新一轮科技革命和产业变革，面对人民群众新期待，必须 继续把改革推向前进。进一步全面深化改革的出发点和落脚点是",options:["A. 促进社会公平正义、增进人民福祉","B. 解放和发展社会生产力","C. 解放和增强社会活力","D. 推动生产关系和生产力、上层建筑和经济基础、国家治理和社会发展更好相适应"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:480,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"党的二十届四中全会审议通过的《中共中央关于制定国民经济和社会发展第十五个五年规划的 建议》,对“扩大高水平对外开放，开创合作共嬴新局面”作了专章部署，强调“稳步扩大制度 型开放”“积极扩大自主开放”。其中，扩大市场准入和开放领域的重点是",options:["A. 新兴产业","B. 服务业","C. 农业","D. 先进制造业"],answer:"B",explanation:"《中共中央关于制定国民经济和社会 发展第十五个五年规划的建议》指出，对接国 际高标准经贸规则，以服务业为重点，扩大市 场准入和开放领域，扩大单边开放领域和区 域。B 正确。 加快实现高水平科技自立自强，是推动 高质量发展的必由之路；加快构建新发展格 局，是推动高质量发展的战略基点；推进农业 现代化是实现高质量发展的必然要求；更好统 筹质的有效提升和量的合理增长是推动高质 量发展的重要举措。B正确，A、C、D 错误。"},
  {id:481,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"党的十八大以来.我们党对经济社会发展提出了许多重大理论和战略.其中最重要、最主要的是",options:["A. 供给侧结构性改革","B. 以人民为中心的发展思想","C. 新发展理念","D. 推动高质量发展"],answer:"C",explanation:"发展理念是发展行动的先导，是管全 96"},
  {id:482,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"发展理念是发展行动的先导，是发展思路、 发展方式、发展着力点的集中体现。发展理念从根 本上决定着发展成效乃至成败。新发展阶段必须坚定不移贯彻创新、协调、绿色、开放、共享 的新发展理念。其中，创新是",options:["A. 引领发展的第一动力","B. 国家繁荣发展的必由之路","C. 持续健康发展的内在要求","D. 中国特色社会主义的本质要求"],answer:"A",explanation:"创新是引领发展的第一动力。协调是 持续健康发展的内在要求。绿色是永续发展 的必要条件和人民对美好生活追求的重要体 现。开放是国家繁荣发展的必由之路。共享 是中国特色社会主义的本质要求。A 正确。"},
  {id:483,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"高质量发展是新时代我国经济社会发展的鲜明主题，是全面建设社会主义现代化国家的首要任 务。推动高质量发展的主线是",options:["A. 改革创新","B. 实施扩大内需战略","C. 深化供给侧结构性改革","D. 加快构建新发展格局"],answer:"C",explanation:"推动高质量发展，要更好统筹质的有 效提升和量的合理增长。要保持经济社会发 展稳定性，以深化供给侧结构性改革为主线， 以改革创新为根本动力，把实施扩大内需战 略同深化供给侧结构性改革有机结合起来， 加快构建新发展格局。C 正确。"},
  {id:484,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"高质量发展是全面建设社会主义现代化国家的首要任务。推动高质量发展的战略基点是",options:["A. 加快实现高水平科技自立自强","B. 加快构建新发展格局","C. 推进农业现代化","D. 更好统筹质的有效提升和量的合理增长"],answer:"B",explanation:"A正确。解放和发展社会生产力，是 改革开放的鲜明特征和首要任务。解放和增 强社会活力，是社会主义改革的内在要求和 基本目的。B、C错误。D不符合题意。"},
  {id:485,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》全面部署了“十五五”时期改 革发展任务，其中一项就是“加快构建高水平社会主义市场经济体制，增强高质量发展动力”。 构建高水平社会主义市场经济体制，关键是要处理好",options:["A. 政府和市场的关系","B. 企业和市场的关系","C. 中央和地方的关系","D. 消费者和生产者的关系"],answer:"A",explanation:"构建高水平社会主义市场经济体制， 关键是要处理好政府和市场的关系。使市场 在资源配置中起决定性作用，更好发挥政府 作用，二者是有机统一的，不是相互否定的， 不能把二者割裂开来、对立起来。要用好“看 不见的手”和“看得见的手”,推动有效市场和 有为政府更好结合。A正确，B、C、D 错误。"},
  {id:486,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"全面建成新发展格局任重道远，必须坚持问题导向和系统观念，着力破除制约加快构建新发展 格局的主要矛盾和问题，不断扬优势、补短板、强弱项。要坚持把发展经济的着力点放在",options:["A. 制度创新上","B. 乡村振兴上","C. 对外开放上","D. 实体经济上"],answer:"D",explanation:"实体经济是一国经济的立身之本、财 富之源，是构筑未来发展战略优势的重要支 撑。要坚持把发展经济的着力点放在实体经 济上，推动资源要素向实体经济集聚、政策措 施向实体经济倾斜、工作力量向实体经济加 强，营造脚踏实地、勤劳创业、实业致富的发 展环境和社会氛围，把实体经济做实、做强、 做优。D正确。"},
  {id:487,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"构建新发展格局，是根据我国发展阶段、发展环境、条件变化，特别是基于我国比较优势变化， 审时度势作出的重大决策，是关系我国发展全局的重大战略任务。构建新发展格局最本质的特 征是",options:["A. 实现高水平的自立自强","B. 推动实施扩大内需战略同深化供给侧结构性改革有机结合","C. 推动产业链供应链优化升级","D. 建设现代化经济体系"],answer:"A",explanation:"构建新发展格局最本质的特征是实现 高水平的自立自强。科技自立自强是我国经 济生存和发展的基础，是畅通国内国际双循 环、促进我国发展大局的关键。A正确。"},
  {id:488,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"构建新发展格局是事关全局的系统性、深层次变革，是立足当前、着眼长远的战略谋划，是适 应我国发展新阶段要求、塑造国际合作和竞争新优势的必然选择。构建新发展格局的重要前提 和保障是",options:["A. 充分挖掘内需潜力","B. 夯实我国经济发展的根基","C. 促进区域协调发展","D. 牢牢守住安全发展这条底线"],answer:"D",explanation:"安全是发展的前提，发展是安全的保 障 。牢牢守住安全发展这条底线是构建新发 展格局的重要前提和保障。以新安全格局保 障新发展格局，必须统筹维护国家安全各类 要素、各个领域、各方资源、各种手段，主动塑 造于我有利的外部安全环境，推动发展和安 全深度融合，实现高质量发展和高水平安全 的良性互动。D 正确，A、B、C 错误。"},
  {id:489,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"新质生产力是创新起主导作用，摆脱传统经济增长方式、生产力发展路径，具有高科技、高效 能、高质量特征、符合新发展理念的先进生产力质态。新质生产力的显著特点是创新，这种创 新包括 ①生产资料所有制和产品分配层面的创新 ②技术和业态模式层面的创新",options:["A. ①②","B. ①③","C. ②④","D. ②③"],answer:"D",explanation:"习近平在《发展新质生产力是推动高 质量发展的内在要求和重要着力点》一文中 指出，新质生产力的显著特点是创新，既包括 技术和业态模式层面的创新，也包括管理和 制度层面的创新。必须继续做好创新这篇大 文章，推动新质生产力加快发展。②③正确。 因此，本题选D。"},
  {id:490,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"新质生产力由技术革命性突破、生产要素创新性配置、产业深度转型升级而催生，以劳动者、 劳动资料、劳动对象及其优化组合的跃升为基本内涵。新质生产力的核心标志是",options:["A. 全要素生产率大幅提升","B. 创新和质优","C. 稳定的产业链供应链","D. 催生新产业、新模式、新动能"],answer:"A",explanation:"新质生产力由技术革命性突破、生产 要素创新性配置、产业深度转型升级而催生， 以劳动者、劳动资料、劳动对象及其优化组合 的跃升为基本内涵，以全要素生产率大幅提 升为核心标志，特点是创新，关键在质优，本 质是先进生产力。科技创新能够催生新产 业、新模式、新动能，是发展新质生产力的核 心要素。A 正确，B、C、D 错误。"},
  {id:491,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"加快建设以实体经济为支撑的现代化产业体系，关系我们在未来发展和国际竞争中赢得战略主 动。支撑我国国际竞争力的基石是",options:["A. 大力发展战略性新兴产业","B. 保持优势产业的领先地位","C. 构建优质高效的服务业新体系","D. 构建现代化基础设施体系"],answer:"B",explanation:"保持优势产业的领先地位，是支撑我 国国际竞争力的基石。B 正确。战略性新兴 产业具有先导性，代表新一轮科技革命和产 业变革的方向，是引领国家未来产业发展的 决定性力量；现代服务业是现代化产业体系 的重要支撑；基础设施是经济社会发展的重 要支撑。A、C、D不符合题意。"},
  {id:492,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"脱贫摘帽不是终点，而是新生活、新奋斗的起点。接下来要做好乡村振兴这篇大文章，让乡亲 们生活越来越美好。实施乡村振兴战略的总方针是",options:["A. 农业农村现代化","B. 坚持农业农村优先发展","C. 产业兴旺、生态宜居、乡风文明、治理有效、生活富裕","D. 建立健全城乡融合发展体制机制和政策体系"],answer:"B",explanation:"实施乡村振兴战略，农业农村现代化 是总目标，坚持农业农村优先发展是总方针， 产业兴旺、生态宜居、乡风文明、治理有效、生 活富裕是总要求，建立健全城乡融合发展体 制机制和政策体系是制度保障。B 正确，A、 C、D 错误。"},
  {id:493,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"我国发展最大的不平衡是城乡发展不平衡，最大的不充分是农村发展不充分。必须坚持把解决 好“三农”问题作为全党工作重中之重，扎实推进乡村全面振兴。推进乡村全面振兴的基础是",options:["A. 农业农村现代化","B. 发展乡村特色产业","C. 持续深化农村科技和改革创新","D. 建立健全城乡融合发展体制"],answer:"B",explanation:"习近平在广东考察时指出，发展乡村 特色产业是推进乡村全面振兴的基础，要加 强科技应用，推动农文旅融合，不断延伸产业 链、增加附加值，带动更多农民群众增收致 富。B 正确。实施乡村振兴战略，农业农村 现代化是总目标，坚持农业农村优先发展是 总方针，产业兴旺、生态宜居、乡风文明、治理 有效、生活富裕是总要求，建立健全城乡融合 发展体制机制和政策体系是制度保障。A、D 错误。农业农村部印发的《国家乡村振兴示 范县创建工作方案》,从五个方面重点部署国 家乡村振兴示范县创建任务，“持续深化农村 科技和改革创新”是其中之一。C 错误。 · 考研政治1000题>>>解析分册"},
  {id:494,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"促进区域协调发展，是贯彻新发展理念的重要内容，也是实现高质量发展的必然要求。 新形势 下促进区域协调发展，要深入实施区域协调发展战略、区域重大战略、主体功能区战略。以下 属于区域协调发展战略的是",options:["A. 高标准、高质量建设雄安新区","B. 推进长江经济带发展","C. 推进粤港澳大湾区建设","D. 鼓励东部地区加快推进现代化"],answer:"D",explanation:"深入实施区域协调发展战略，要推动 西部大开发形成新格局，推动东北全面振兴 取得新突破，促进中部地区加快崛起，鼓励东 部地区加快推进现代化。D 正确。深入实施 区域重大战略，要推进京津冀协同发展、长江 经济带发展、粤港澳大湾区建设、长三角一体 化发展，推动黄河流域生态保护和高质量发 展，高标准、高质量建设雄安新区，推动成渝 地区双城经济圈建设。A、B、C 错误。 我们要建设的教育强国，是中国特色 社会主义教育强国，必须以坚持党对教育事 业的全面领导为根本保证，以立德树人为根 本任务，以为党育人、为国育才为根本目标， 以服务中华民族伟大复兴为重要使命，以教 育理念、体系、制度、内容、方法、治理现代化 为基本路径，以支撑引领中国式现代化为核 心功能，最终是办好人民满意的教育。人民 满意是发展教育的根本尺度。C 正确。"},
  {id:495,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"教育是国之大计、党之大计，是功在当代、利在千秋的德政工程。教育的根本任务是",options:["A. 人民满意","B. 价值观塑造","C. 立德树人","D. 为国育才"],answer:"C",explanation:"（本题解析见原书解析分册）"},
  {id:496,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"制度优势是一个政党、一个国家的最大优势。坚定中国特色社会主义制度自信，首先要",options:["A. 坚定对社会主义基本经济制度的自信","B. 坚定对中国特色社会主义政治制度的自信","C. 坚定对中国传统文化的自信","D. 坚定对马克思主义在意识形态领域指导地位的根本制度的自信"],answer:"B",explanation:"（本题解析见原书解析分册）"},
  {id:497,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"中国特色社会主义政治发展道路，是近代以来中国人民长期奋斗历史逻辑、理论逻辑、实践逻 辑的必然结果，是坚持党的本质属性、践行党的根本宗旨的必然要求。走中国特色社会主义政 治发展道路，最根本的是",options:["A. 坚持人民当家作主","B. 坚持党的领导","C. 坚持以人民为中心","D. 坚持独立自主"],answer:"B",explanation:"98 104"},
  {id:498,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"新时代我国民主政治领域具有重大创新意义的标志性成果是",options:["A. 协商民主","B. 中国特色社会主义政治发展道路","C. 党内民主","D. 全过程人民民主"],answer:"D",explanation:"全过程人民民主植根于我国社会主义 民主的长期实践，是中国特色社会主义民主 政治理论和实践的重大成果，是新时代我国 民主政治领域具有重大创新意义的标志性成 果。D正确。"},
