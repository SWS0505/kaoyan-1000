  {id:866,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1992年1月18日至2月21 日 ，邓小平先后到武昌、深圳、珠海、上海等地视察，发表了 一 系列重要谈话，即南方谈话。邓小平的南方谈话",options:["A. 从理论上深刻回答了长期困扰和束缚人们思想的许多重大问题","B. 是把改革开放和现代化建设推向新阶段的又一个解放思想、实事求是的宣言书","C. 对之后召开的党的十四大具有十分重要的指导作用","D. 开启了我国改革开放和社会主义现代化建设新时期"],answer:"ABC",explanation:"邓小平的南方谈话，从理论上深刻回 答了长期困扰和束缚人们思想的许多重大 问题，是把改革开放和现代化建设推向新阶 段的又一个解放思想、实事求是的宣言书， 不仅对之后召开的党的十四大具有十分重 要的指导作用，而且对中国整个社会主义现 代化建设事业具有重大而深远的意义。A、 B、C 正确。党的十一届三中全会的胜利召 开，实现了新中国成立以来党的历史上具有 深远意义的伟大转折，开启了我国改革开放 和社会主义现代化建设新时期。D 错误。"},
  {id:867,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"党的十八大以来，中国特色社会主义进入新时代。党面临的主要任务是",options:["A. 实现第一个百年奋斗目标","B. 开启实现第二个百年奋斗目标新征程","C. 为实现中华民族伟大复兴提供充满新的活力的体制保证和快速发展的物质条件","D. 朝着实现中华民族伟大复兴的宏伟目标继续前进"],answer:"ABD",explanation:"A、B、D正确。为实现中华民族伟大 复兴提供充满新的活力的体制保证和快速 发展的物质条件，是党在改革开放和社会主 义现代化建设新时期面临的主要任务之一， C错误。"},
  {id:868,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"党的十九大是在全面建成小康社会决胜阶段、中国特色社会主义进入新时代的关键时期召开的 一次十分重要的大会，是一次不忘初心、牢记使命、高举旗帜、团结奋进的大会。党的十九大 的主要贡献有",options:["A. 确立习近平新时代中国特色社会主义思想的指导地位","B. 作出中国特色社会主义进入新时代、我国社会主要矛盾发生转化的重大政治论断","C. 确定决胜全面建成小康社会、开启全面建设社会主义现代化国家新征程的目标","D. 对新时代推进中国特色社会主义伟大事业和党的建设伟大工程作出全面部"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:869,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"党的二十大报告指出，从现在起，中国共产党的中心任务是",options:["A. 团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标","B. 促进世界和平与发展","C. 推动构建人类命运共同体","D. 以中国式现代化全面推进中华民族伟大复兴"],answer:"AD",explanation:"（本题解析见原书解析分册）"},
  {id:870,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"“十四五”时期，我国发展历程极不寻常、极不平凡。面对错综复杂的国际形势和艰巨繁重的 国内改革发展稳定任务，以习近平同志为核心的党中央团结带领全党全国各族人民，迎难而 上、砥砺前行，经受住世纪疫情严重冲击，有效应对一系列重大风险挑战，推动党和国家事业 取得新的重大成就。“十四五”时期我国发展取得的重大成就主要有",options:["A. 我国经济实力、科技实力、综合国力跃上新台阶","B. 人均国内生产总值达到中等发达国家水平","C. 中国式现代化迈出新的坚实步伐","D. 第二个百年奋斗目标新征程实现良好开局 1."],answer:"ACD",explanation:"“十四五”时期，我国发展历程极不寻 常、极不平凡。面对错综复杂的国际形势和 艰巨繁重的国内改革发展稳定任务，以习近 平同志为核心的党中央团结带领全党全国 各族人民，迎难而上、砥砺前行，经受住世纪 疫情严重冲击，有效应对一系列重大风险挑 战，推动党和国家事业取得新的重大成就。 我国经济实力、科技实力、综合国力跃上 新台阶，中国式现代化迈出新的坚实步 伐，第二个百年奋斗目标新征程实现良好 开局。A、C、D 正确。人均国内生产总值达 到中等发达国家水平，是2035年我国基本 实现社会主义现代化的一个重要标志性指 标。B 错误。 三 、"},
  {id:871,chapter:"思修",sub:"思想道德与法治",type:"single",question:"法律是成文的道德，道德是内心的法律。法律和思想道德的共同点在于",options:["A. 都发挥引领和教化作用","B. 都发挥规范和强制作用","C. 都提供思想指引和价值基础","D. 都属于上层建筑的重要组成部分"],answer:"D",explanation:"思想道德和法律都是调节人们思想行 为、协调人际关系、维护社会秩序的重要手段。 思想道德和法律虽然在调节领域、调节方式、 调节目标等方面存在很大不同，但是二者都是 上层建筑的重要组成部分，共同服务于一定 的经济基础。一方面，思想道德建设为法治建 设提供思想指引和价值基础。另一方面，法治 建设为思想道德建设提供制度支撑和法律保 障。D 正确，A、B、C 错误。"},
  {id:872,chapter:"思修",sub:"思想道德与法治",type:"single",question:"在网络世界里，一句恶毒的话语、一个带节奏的帖子、一个随意剪切的视频，经过一次次传播 后，影响可能被无限放大，给受害者及其家庭造成毁灭性打击。身处“人人都有麦克风”的网络 社会，在享受多元表达的同时，每个人都可能成为网络暴力的受害者。如何有效治理网络暴力， 成为社会治理面临的重要挑战。除了从道德层面进行教育和引导，倡导大家提高素质，尊重社会 公德和伦理道德，还应该通过更加完善的法律制度保护受害者，追责施暴者，震慑违法行为，切 实维护好广大网民的合法权益。整治网络暴力，共建清朗网络家园，既要靠道德，又要靠法律， 这是因为",options:["A. 法律和道德都具有规范社会行为、维护社会秩序的作用","B. 法律和道德两种规范的实现方式相同","C. 法律和道德两种规范的实施载体相同","D. 法律和道德两种规范调节的领域相同"],answer:"A",explanation:"整治网络暴力，共建清朗网络家园，既要 靠道德，又要靠法律，是因为法律和道德都具 有规范社会行为、调节社会关系、维护社会 秩序的作用。A 正确。但是，法律和道德两种 规范，或者说法治和德治，实现方式和实施 载体不同。法治主要依靠制定和实施法律规 范的形式来推进和实施，实行法有禁止不得 为，体现的是规则之治；德治主要依靠培育和 弘扬道德等途径来推进和实施，以价值、精神 和理念等形式表现出来，引导人们自觉地在行 动上符合道德才可为，违反道德不可为。另 外，法律和道德两种规范调节的领域也不同， 法律调节的领域比道德调节的领域小。B、C、 D错误。"},
  {id:873,chapter:"思修",sub:"思想道德与法治",type:"single",question:"道德和法律是维护社会秩序的两种重要手段。下列关于二者关系的说法中，正确的是",options:["A. 法律是道德形成的基础，能够为道德规范的制定提供依据","B. 凡是道德所反对和谴责的行为，必定是法律所制裁的行为 ·","C. 法律的调节更具有广泛性，能够渗透到道德不能调节的领域","D. 凡是法律所禁止和制裁的行为，通常也是道德所反对和谴责的行为"],answer:"D",explanation:"思想道德和法律是维护社会秩序的两种 重要手段，两者相互补充、相互促进。一方面， 思想道德建设为法治建设提供思想指引和价 值基础。另一方面，法治建设为思想道德建设 提供制度支撑和法律保障。公共生活中，道德 可以用来调节、规范人们的行为，预防犯罪的 产生。社会生活是纷繁复杂的，法律的属性决 定了它不可能把复杂而广泛的社会关系全部 纳入其调控的范围，因而其发挥作用的范围是 有限的。道德发挥作用的领域更加广泛，它能 够调整许多法律效力所不及的问题，不仅深入 到社会生活中的各个方面，而且深入到人们的 精神世界。D 正确。道德规范的要求高于法 律规范，违反道德规范的不一定违反法律规 范。A、B、C 错误。"},
  {id:874,chapter:"思修",sub:"思想道德与法治",type:"single",question:"人生观是人们关于人生目的、人生态度、人生价值等问题的总观点和总看法。对人的认识，核心 在于认识",options:["A. 人的本质","B. 人的属性","C. 人的行为","D. 人的阶级关系"],answer:"A",explanation:"对人的认识，核心在于认识人的本质。 社会属性是人的本质属性，人的自然属性也深 深打上了社会属性的烙印。人的社会关系的 总和决定了人的本质。A 正确。"},
  {id:875,chapter:"思修",sub:"思想道德与法治",type:"single",question:"人生观主要是通过人生目的、人生态度和人生价值三个方面体现出来的。其中核心是",options:["A. 人生目的","B. 人生态度","C. 人生价值","D. 人生意义"],answer:"A",explanation:"有什么样的人生目的就会有什么样的人 生态度，就会追求什么样的人生价值，所以，人 164 生目的是人生观的核心。A正确。"},
  {id:876,chapter:"思修",sub:"思想道德与法治",type:"single",question:"爱因斯坦说过：“一个人的价值，应该看他贡献什么,而不应当看他取得什么。”这句话的启示是",options:["A. 人的自我价值是无足轻重的","B. 人的自我价值与社会价值不能同时实现","C. 社会价值是人的唯一价值","D. 人的价值在于率献而不在于索取"],answer:"D",explanation:"人生价值内在地包含了人生的自我价 值和社会价值两个方面。C 错误。人生的自 我价值和社会价值，既相互区别，又密切联系、 相互依存。人生的自我价值是个体生存和发 展的必要条件，人生的自我价值的实现是个体 为社会创造更大价值的前提。A 错误。个体 的人生活动不仅具有满足自我需要的价值属 性，还必然地包含着满足社会需要的价值属 性。个体通过努力提高自我价值的过程，也是 其创造社会价值的过程。B 错误。正确的人 生目的会使人懂得人生的价值首先在于奉献， 从而在工作中尽心、尽力、尽责；错误的人生目 的则会使人把人生价值理解为向社会或他人 进行索取，只把个人私利视为人生的价值追 求，而漠视对国家、社会、集体和他人的义务与 责任。D 正确。"},
  {id:877,chapter:"思修",sub:"思想道德与法治",type:"single",question:"“为掩护战友身负重伤的扫雷英雄”杜富国，“用爱照亮山区女孩人生梦想的教育燃灯者”张桂 梅 ，“为莫高窟研究保护倾尽一生的敦煌女儿”樊锦诗， “60多年深藏功名的战斗英雄”张 富 清 ，以及在黄山风景区分别从事环卫保洁和迎客松守护工作的“中国好人”李培生、 胡晓春等 平凡英雄，他们最可贵的地方就是在平凡的工作中创造了不平凡的业绩。他们的事迹告诉我们， 评价人生价值的根本尺度，是看一个人的",options:["A. 劳动以及通过劳动对社会和他人作出的贡献","B. 个人社会地位的高低","C. 个人成绩的大小","D. 实践活动是否符合社会发展的客观规律，是否促进了历史的进步"],answer:"D",explanation:"评价人生价值的根本尺度，是看一个人 的实践活动是否符合社会发展的客观规律， 是否促进了历史的进步。在今天，衡量人生价 值的标准，最重要的就是看一个人是否用自己 的劳动和聪明才智为国家和社会真诚奉献，为 人民群众尽心尽力服务。D正确，A、B、C 错误。"},
  {id:878,chapter:"思修",sub:"思想道德与法治",type:"single",question:"“塞翁失马，焉知非福”,这句话对我们辩证对待人生矛盾的启示是",options:["A. 不要拘泥于个人利益的得失","B. 不要满足于一时的得","C. 不要惧怕一时的失","D. 要树立正确的幸福观"],answer:"C",explanation:"“塞翁失马，焉知非福”,“吃一堑，长一 智”,失去了不一定是坏事，不要惧怕一时的 失。C 最符合题意。"},
  {id:879,chapter:"思修",sub:"思想道德与法治",type:"single",question:"理想是多方面和多类型的。从主体上划分，理想有",options:["A. 政治理想和道德理想","B. 个人理想和社会理想","C. 近期理想和远期理想","D. 职业理想和生活理想"],answer:"B",explanation:"理想是多方面和多类型的。从时序上 划分，有近期理想和远期理想等；从主体上划 分，有个人理想和社会理想等；从内容上划 分，有政治理想、道德理想、职业理想和生活 理想等。B正确，A、C、D不符合题意。"},
  {id:880,chapter:"思修",sub:"思想道德与法治",type:"single",question:"走向绞刑架的李大钊，发出了“共产主义在中国必然得到光辉的胜利”的坚贞誓言。面对敌人 屠刀的夏明翰，写下“砍头不要紧，只要主义真。杀了夏明翰，还有后来人”的雄壮诗篇。面 对敌人6天内9次劝降，瞿秋白作出了“人爱自己的历史，比鸟爱自己的翅膀更厉害，请勿撕 破我的历史”的铿锵回答。理想信念是精神之“钙”。信念是认知、情感和意志的有机统一体。 信念的特征包括 ·",options:["A. ①②③","B. ①②④","C. ②③④","D. ①③④"],answer:"C",explanation:"信念同理想一样，也是人类特有的精 神现象。信念是人们在一定的认识基础上确 立的对某种思想或事物坚信不疑并身体力行 的精神状态。信念具有执着性、支撑性和多 样性。信念因其执着而为信念。信念一旦形 成，就不会轻易改变。信念是一个人经受实 践考验而始终坚守理想的精神力量。信念有 不同的层次和类型。信仰是最高层次的信 念，具有最大的统摄力。②③④正确。理想 具有超越性、实践性和时代性。①不符合题 意。因此，本题选C。"},
  {id:881,chapter:"思修",sub:"思想道德与法治",type:"single",question:"中国有句古话：“千里之行，始于足下。”这句话对我们在人生哲理方面的启发是",options:["A. 立志当高远","B. 立志做大事","C. 立志须躬行","D. 立志须果断"],answer:"C",explanation:"崇高理想的实现需要一点一滴地奋 斗。通往理想的路是遥远的，但起点就在脚 下，在一切平凡的岗位上，在扎扎实实的学习 和工作中。C正确。A、B、D都不符合题意。 第三章"},
  {id:882,chapter:"思修",sub:"思想道德与法治",type:"single",question:"中华民族在5000多年的历史进程中不仅创造出光辉灿烂、享誉世界的中华文明，也塑造出中华 民族独特的精神气质和精神品格，形成了崇尚精神的优秀传统。中国古人所说的“不义而富且 贵，于我如浮云”“一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐”这两句话，表现的 是中华民族崇尚精神的优秀传统中的",options:["A. 对理想的不懈追求","B. 对品格养成的重视","C. 注重以和为贵","D. 对物质生活与精神生活相互关系的独到理解"],answer:"D",explanation:"中华民族崇尚精神的优秀传统，首先 · 考研政治1000题 解析分册 · 表现为对物质生活与精神生活相互关系的独 到理解。古圣先贤认为，人之所以异于禽兽， 在于人有道德，有精神追求。物质生活固然 为人所必需，但如果沉溺于物欲而不能自拔， 则无异于禽兽。古人认为，“不义而富且贵， 于我如浮云”,崇尚“一箪食，一瓢饮，在陋巷， 人不堪其忧，回也不改其乐”的精神追求。 D正确。A、B、C不符合题意。"},
  {id:883,chapter:"思修",sub:"思想道德与法治",type:"single",question:"孙中山先生说，做人最大的事情，“就是要知道怎么样爱国”。习近平指出：“爱国，是人世间最 深沉、最持久的情感，是一个人立德之源、立功之本。”“气节也好，人格也好，爱国是第一位 的。”检验一个人对祖国忠诚程度的试金石是",options:["A. 对民族利益共同体的自觉认同","B. 对祖国大好河山的热爱程度","C. 对祖国灿烂文化的认同程度","D. 对民族优良传统的熟悉程度"],answer:"A",explanation:"爱自己的骨肉同胞是爱国主义的基本 内涵之一。骨肉同胞之爱反映了对民族利益 共同体的自觉认同，是检验一个人对祖国忠 诚程度的试金石。A 正确。B、C、D 不符合 题意。"},
  {id:884,chapter:"思修",sub:"思想道德与法治",type:"single",question:"爱国主义是具体的、现实的。当代中国爱国主义精神最重要的体现是",options:["A. 维护祖国统一和民族团结","B. 坚持爱国和爱党、爱社会主义相统一","C. 尊重和传承中华民族历史文化","D. 坚持立足中国又面向世界"],answer:"B",explanation:"习近平在《大力弘扬伟大爱国主义精 神，把强国建设、民族复兴伟业不断推向前 进》一文中指出，弘扬爱国主义精神，必须坚 持爱国主义和社会主义相统一。我国爱国主 义始终围绕着实现民族富强、人民幸福而发 展，最终汇流于中国特色社会主义。祖国的 命运和党的命运、社会主义的命运是密不可 分的。只有坚持爱国和爱党、爱社会主义相 统一，爱国主义才是鲜活的、真实的，这是当 代中国爱国主义精神最重要的体现。B正确。 点 拨当代中国，爱国主义的本质就是坚持 爱国和爱党、爱社会主义高度统一。"},
  {id:885,chapter:"思修",sub:"思想道德与法治",type:"single",question:"1935年，在中华民族危急存亡之际，著名教育家张伯苓在南开大学开学典礼上问了三个问题： “你是中国人吗?你爱中国吗?你愿意中国好吗?”振奋了师生爱国斗志。习近平强调，这三个 问题是历史之问，更是时代之问、未来之问，我们要一代一代问下去、答下去!新时代爱国主 义教育的鲜明主题是",options:["A. 全面建成社会主义现代化强国、实现中华民族伟大复兴","B. 维护祖国统一和民族团结","C. 广泛开展党史、国史、改革开放史教育","D. 大力弘扬民族精神和时代精神"],answer:"A",explanation:"《中华人民共和国爱国主义教育法》规 定，爱国主义教育坚持爱国和爱党、爱社会主 义相统一，以维护国家统一和民族团结为着 力点，把全面建成社会主义现代化强国、实 现中华民族伟大复兴作为鲜明主题。A 正 确。B是大力弘扬新时代爱国主义的要求之 一，不符合题意。C、D 是爱国主义教育的基 本内容，不符合题意。"},
  {id:886,chapter:"思修",sub:"思想道德与法治",type:"single",question:"在5000多年的历史发展进程中，中华民族形成了伟大民族精神。中华民族伟大民族精神的核 心是",options:["A. 团结统一","B. 爱国主义","C. 勤劳勇敢","D. 自强不息 践 行 价 值 准 则"],answer:"B",explanation:"爱国主义体现了人们对自己祖国的深 厚感情，揭示了个人对祖国的依存关系，是人 们对自己家园以及民族和文化的归属感、认 同感、尊严感与荣誉感的统一，是调节个人与 祖国之间关系的道德要求、政治原则和法律 规范。因此，爱国主义是民族精神的核心。 B正确。其他三项的内容是中华民族民族精 神的重要内容，但不是核心。"},
  {id:887,chapter:"思修",sub:"思想道德与法治",type:"single",question:"富强、民主、文明、和谐，这一价值追求回答了我们",options:["A. 要建设什么样的国家的重大问题","B. 要建设什么样的社会的重大问题","C. 要建设什么样的政府的重大问题","D. 要培育什么样的公民的重大问题"],answer:"A",explanation:"富强、民主、文明、和谐的价值追求回 答了我们要建设什么样的国家的重大问题， 揭示了当代中国经济社会发展的价值目标， 从国家层面标注了社会主义核心价值观的时 代刻度。A 正确，B、C、D 错误。"},
  {id:888,chapter:"思修",sub:"思想道德与法治",type:"single",question:"自 由 、平等、公正、法治，这一价值追求回答了我们要建设什么样的社会的重大问题，反映了 人们对美好社会的期望和憧憬，是 ·",options:["A. 衡量现代社会是否高度发展、充满活力、和谐有序的重要标志","B. 判断社会性质的主要标准","C. 社会进步的根本内容","D. 衡量社会进步的根本尺度"],answer:"A",explanation:"自由、平等、公正、法治，反映了人 们对美好社会的期望和憧憬，是衡量现代社 会是否高度发展、充满活力、和谐有序的重 要标志。A 正确。判断社会性质的主要标准 是生产关系的性质；生产力是社会进步的根 本内容，也是衡量社会进步的根本尺度。B、 C、D 错误。 166 172"},
  {id:889,chapter:"思修",sub:"思想道德与法治",type:"single",question:"人民当家作主的社会主义制度，为社会主义核心价值观的真正实现奠定了根本的制度前提和制 度保障，使得自由、民主、公正等价值观“不是装饰品，不是用来做摆设的，而是要用来解决 人民要解决的问题的”。这体现的是社会主义核心价值观具有的",options:["A. 先进性","B. 人民性","C. 普适性","D. 真实性"],answer:"D",explanation:"（本题解析见原书解析分册）"},
  {id:890,chapter:"思修",sub:"思想道德与法治",type:"single",question:"社会主义核心价值观的根本特性是",options:["A. 先进性","B. 人民性","C. 普适性","D. 真实性"],answer:"B",explanation:"人民性是社会主义核心价值观的根本 特性。B正确，A、D不符合题意。C 错误。"},
  {id:891,chapter:"思修",sub:"思想道德与法治",type:"single",question:"社会主义核心价值观的先进性集中体现在",options:["A. 它是社会主义所坚持和追求的价值理念","B. 它吸纳了世界文明有益成果","C. 它是真切、具体、广泛的现实","D. 它扎根于中华优秀传统文化土壤"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:892,chapter:"思修",sub:"思想道德与法治",type:"single",question:"道德属于上层建筑的范畴，是一种特殊的社会意识形态。作为人类社会特有的一种社会现象， 道德是人类社会发展到一定阶段的必然产物。道德起源的第一个历史前提是",options:["A. 意识","B. 劳动","C. 情感欲望","D. 动物本能"],answer:"B",explanation:"劳动创造了人和人类社会，是道德起 源的第一个历史前提，B 正确。意识是道德 产生的思想认识前提，A 不符合题意。道德 起源的“情感欲望论”“动物本能论”等均无 法正确揭示道德的起源，C、D错误。"},
  {id:893,chapter:"思修",sub:"思想道德与法治",type:"single",question:"恩格斯说：“人们自觉地或不自觉地，归根到底总是从他们阶级地位所依据的实际关系中——从 他们进行生产和交换的经济关系中，获得自己的伦理观念。”这说明，道德的产生、发展和变 化，归根结底源于",options:["A. 社会意识形态","B. 社会经济关系","C. 社会存在","D. 社会的阶级关系"],answer:"B",explanation:"道德是反映社会经济关系的特殊意识 形态。道德的产生、发展和变化，归根结底 源于社会经济关系。B正确，A 错误。社会存 在包括自然地理环境、人口因素和物质生产 方式，而不只是社会经济关系，C 错误。社会 的阶级关系也不等于社会经济关系，D 错误。"},
  {id:894,chapter:"思修",sub:"思想道德与法治",type:"single",question:"道德具有多方面的功能和效力。通过评价等方式，指导和纠正人们的行为和实践活动、协调社 会关系和人际关系的功效与能力，是道德的",options:["A. 认识功能","B. 调节功能","C. 导向功能","D. 规范功能"],answer:"B",explanation:"在道德的功能系统中，认识功能、规范 功能、调节功能是最基本的功能，此外还有导 向、激励、教育等功能。道德的调节功能是指 道德通过评价等方式，指导和纠正人们的行 为和实践活动、协调社会关系和人际关系的 功效与能力。B 正确。道德的认识功能是指 道德反映社会关系特别是反映社会经济关系 的功效与能力；道德的规范功能是指在正确 善恶观的指引下，规范社会成员在社会公共 领域、职业领域、家庭领域的行为，并规范个 人品德的养成，引导并促进人们崇德向善。 A、C、D 错误。"},
  {id:895,chapter:"思修",sub:"思想道德与法治",type:"single",question:"道德调节的主要形式是",options:["A. 道德评价","B. 社会舆论","C. 传统习俗","D. 内心信念"],answer:"A",explanation:"道德评价是道德调节的主要形式，社 会舆论、传统习俗和人们的内心信念是道德 调节所赖以发挥作用的力量。A 正确，B、C、 D不符合题意。"},
  {id:896,chapter:"思修",sub:"思想道德与法治",type:"single",question:"道德发挥作用的性质是由",options:["A. 社会发展的历史阶段决定的","B. 道德所反映的经济基础、代表的阶级利益决定的","C. 道德的性质决定的","D. 上层建筑的性质决定的"],answer:"B",explanation:"道德发挥作用的性质与社会发展的不 同历史阶段相联系，由道德所反映的经济基 础、代表的阶级利益所决定。只有反映先进 生产力发展要求和进步阶级利益的道德，才 会对社会的发展和人的素质的提高产生积极 的推动作用，否则，就不利于甚至阻碍社会的 发展和人的素质的提高。B正确。"},
  {id:897,chapter:"思修",sub:"思想道德与法治",type:"single",question:"集体主义可以增强一个人恪尽职守、担当任事的责任心，可以激发一个人面对困难和危险不退 缩的战斗力，赋予一个人光辉的人格、英雄的风范。集体主义最高层次的道德要求是",options:["A. 先公后私、先人后己","B. 顾全大局、遵纪守法","C. 无私奉献、一心为公","D. 热爱祖国、诚实劳动"],answer:"C",explanation:"根据我国现阶段经济社会生活和人们 思想道德的实际，集体主义可分为三个层次 的道德要求：一是无私奉献、一心为公，这 是集体主义的最高层次，是优秀共产党员、先 进分子应努力达到的道德目标。二是先公后 私、先人后己，这是已经具有较高社会主义道 德觉悟的人能够达到的要求。三是顾全大 局、遵纪守法、热爱祖国、诚实劳动，这是对公 民最基本的道德要求。C 正确。A、B、D 不符 合题意。"},
  {id:898,chapter:"思修",sub:"思想道德与法治",type:"single",question:"中华传统美德的根本要求是",options:["A. 以和为贵","B. 注重人伦关系","C. 追求精神境界，向往理想人格","D. 公义胜私欲"],answer:"D",explanation:"（本题解析见原书解析分册）"},
  {id:899,chapter:"思修",sub:"思想道德与法治",type:"single",question:"中国革命道德是指中国共产党人、人民军队、一切先进分子和人民群众在中国革命、建设、改 革中所形成的优秀道德，是马克思主义与中国革命、建设、改革的伟大实践相结合的产物，是 中华民族极其宝贵的道德财富。中国革命道德的灵魂是 ·",options:["A. 坚持社会主义和共产主义理想信念","B. 全心全意为人民服务","C. 始终把革命利益放在首位","D. 修身自律、保持节操"],answer:"A",explanation:"中国革命道德具有丰富而独特的内 涵，既包括革命道德的原则、要求、态度、修 养、风尚等方面，也包括革命理想、革命精神 等方面，具有丰富的内容。坚持社会主义和 共产主义理想信念是革命道德的灵魂。无数 革命先烈，正是为了实现这样一个崇高的理 · 考研政治 1000题 解析分册 思法 · 单选 想，毫不犹豫地献出了自己的生命。A 正确， B、C、D不符合题意。"},
  {id:900,chapter:"思修",sub:"思想道德与法治",type:"single",question:"记者在采访诺贝尔生理学或医学奖得主、中国女药学家屠呦呦时问她：“你在小鼠和猴子身上测 试了青蒿素，证明它是有效的之后，你自己也服了药。你害怕吗?”屠呦呦答：“我们担心药物 是否安全。我和两位同事服了药，表明药不会死人。我认为这是我作为药物化学家的责任和工 作的一部分。”屠呦呦的回答展现了崇高的社会主义职业道德。社会主义职业道德的最高层次的 要求是",options:["A. 诚实守信","B. 办事公道","C. 热情服务","D. 奉献社会"],answer:"D",explanation:"社会主义职业生活中的基本道德规范 包括爱岗敬业、诚实守信、办事公道、热情服 务、奉献社会等内容。奉献社会是社会主义 职业道德中最高层次的要求，体现了社会主 义职业道德的最高目标指向。D 正确，A、B、 C不符合题意。"},
  {id:901,chapter:"思修",sub:"思想道德与法治",type:"single",question:"从业人员在职业活动中做到公平、公正，不损公肥私，不以权谋私，不假公济私，这是职业道德中",options:["A. 爱岗敬业的要求","B. 热情服务的要求","C. 办事公道的要求","D. 奉献社会的要求"],answer:"C",explanation:"职业道德的基本要求包括：①爱岗敬 业；②诚实守信；③办事公道，就是要求从业 人员做到公平、公正，不损公肥私，不以权谋 私，不假公济私；4热情服务；⑤奉献社会。 C正确。"},
  {id:902,chapter:"思修",sub:"思想道德与法治",type:"single",question:"习近平指出：“家庭是社会的基本细胞，是人生的第一所学校。不论时代发生多大变化，不论生 活格局发生多大变化，我们都要重视家庭建设，注重家庭、注重家教、注重家风。”以下符合家 庭美德的选项有",options:["A. “ 远亲不如近邻” B . “君子成人之美”","C. “为善最乐”","D. “博施济众”"],answer:"A",explanation:"家庭美德的主要内容包括尊老爱幼、 男女平等、夫妻和睦、勤俭持家、邻里互助。 “远亲不如近邻”是指邻里互助，A 正确。 “君子成人之美”“为善最乐”“博施济众”是 社会公德中助人为乐的内容，不符合题意，B、 C、D错误。"},
  {id:903,chapter:"思修",sub:"思想道德与法治",type:"single",question:"在社会道德建设中具有基础性作用的是",options:["A. 社会公德","B. 职业道德","C. 家庭美德","D. 个人品德"],answer:"D",explanation:"个人品德在社会道德建设中具有基础 性作用。社会公德、职业道德和家庭美德建 设，最终都要落实到个人品德的养成上。无 论是社会的和谐有序，还是个人的人格健全， 都有赖于个人品德的不断提升。D 正确，A、 B、C错误。"},
  {id:904,chapter:"思修",sub:"思想道德与法治",type:"single",question:"“吾日三省吾身”(曾子),这属于中国传统道德修养方法中的",options:["A. 省察克治","B. 学思并重","C. 慎独自律","D. 积善成德"],answer:"A",explanation:"我国古代思想家们提出了一些积极有 效的道德修养方法，包括：①学思并重的方 法，即通过虚心学习，积极思索，辨别善恶，学 善戒恶，以涵养良好的德性；②省察克治的方 法，即通过反省检验以发现和找出自己思想 与行为中的不良倾向，并及时进行抑制和克 服；3慎独自律的方法，强调在无人知晓或无 人监督的情况下，能够对个人内心深处比较 隐蔽的意识、情绪进行管理和自律的一种修 养方式；4 知行合一的方法，即把提高道德认 识与躬行道德实践统一起来，以促进道德要 求内化为个人的道德品质，外化为实际的道 德行为；⑤积善成德的方法，即通过积累善行 或美德，使之巩固强化，以逐渐凝结成优良的 品德。A正确。"},
  {id:905,chapter:"思修",sub:"思想道德与法治",type:"single",question:"东汉安帝时，昌邑县令王密为感谢杨震的提聚之恩，夜里怀金十斤馈赠，被杨震拒绝。王密说： “暮夜无知者。”杨震答道：“天知，神知，我知，子知。何谓无知!”王密听后“愧而出”。个 人加强道德修养，应借鉴历史上思想家们所提出的各种积极有效的道德修养方法，并结合当今 社会发展的需要和当代人道德修养的实践经验，身体力行。这个故事告诉我们，个人加强道德 修养，要采取",options:["A. 学思并重的方法","B. 省察克治的方法","C. 慎独自律的方法","D. 积善成德的方法"],answer:"C",explanation:"（本题解析见原书解析分册）"},
  {id:906,chapter:"思修",sub:"思想道德与法治",type:"single",question:"志愿服务是社会文明进步的重要标志，是新时代党引导动员人民群众贡献智慧力量、创造美好 生活、实现奋斗目标的生动实践。志愿服务精神的精髓是",options:["A. 友爱","B. 互助","C. 进步","D. 奉献"],answer:"D",explanation:"志愿服务是指志愿贡献个人的时间及 精力，在不求任何物质报酬的情况下，为改善 社会、促进社会进步而提供的服务。志愿服 务是培育和弘扬社会主义核心价值观的重要 载体。志愿服务的精神是奉献、友爱、互 助、进步。其中，奉献精神是精髓。D 正确。"},
  {id:907,chapter:"思修",sub:"思想道德与法治",type:"single",question:"法律规范区别于道德规范、纪律规范等其他社会规范的一个重要特征是",options:["A. 法律规范具有国家强制性","B. 法律是统治阶级意志的体现","C. 法律由社会物质生活条件决定","D. 法律所体现的统治阶级意志是统治阶级意志的全部"],answer:"A",explanation:"与道德规范和纪律规范不同，法律规范的实 施是由国家强制力来保障的。虽然道德规范 和纪律规范的实施也具有一定程度的强制 力，但这些强制力并不以国家强制为后盾。 国家强制性是法律规范区别于其他社会规范 的一个重要特征。A正确。 B、C 也是法律一般含义的内容，但不是 区别于道德规范、纪律规范等其他社会规范 的地方，比如道德规范也是统治阶级意志的 168 17 体现，也由社会物质生活条件决定。B、C不 符合题意。D内容错误，法律所体现的统治 阶级意志，并不是统治阶级意志的全部，而仅 仅是上升为国家意志的那部分意志。统治阶 级的意志还体现在国家政策、统治阶级的道 德、最高统治者的言论等形式之中。"},
  {id:908,chapter:"思修",sub:"思想道德与法治",type:"single",question:"决定法律本质、内容和发展方向的根本因素是",options:["A. 生产方式","B. 生产力的发展水平","C. 文化的发展程度","D. 人的素质"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:909,chapter:"思修",sub:"思想道德与法治",type:"single",question:"法律的运行是一个从创制、实施到实现的过程。这个过程主要包括法律制定(立法)、法律执行 (执法)、法律适用(司法)、法律遵守(守法)等环节。法律实施和实现的基本途径是 ·",options:["A. 法律制定","B. 法律遵守","C. 法律执行","D. 法律适用"],answer:"B",explanation:"在法律运行过程中，法律遵守(守法) 是法律实施和实现的基本途径。B 正确。法 律制定(立法)是指有立法权的国家机关依照 法定职权和程序制定规范性法律文件的活 动，是法律运行的起始性和关键性环节。在 狭义上，法律执行(执法)是指国家行政机关 及其公职人员执行法律的活动，也被称为行 政执法，是法律实施和实现的重要环节。法 律适用(司法)是指国家司法机关及其公职人 员依照法定职权和程序适用法律处理案件的 专门活动。A、C、D 不符合题意。"},
  {id:910,chapter:"思修",sub:"思想道德与法治",type:"single",question:"法律运行的关键性(起始性)环节是",options:["A. 法律制定","B. 法律遵守","C. 法律执行","D. 法律适用"],answer:"A",explanation:"法律制定是指有立法权的国家机关， 依照法定职权和程序制定规范性法律文件的 活动，是法律运行的起始性和关键性环节。 A正确。B、C、D 不符合题意。"},
  {id:911,chapter:"思修",sub:"思想道德与法治",type:"single",question:"国家司法机关及其公职人员依照法定职权和程序适用法律处理案件的专门活动，称为",options:["A. 法律执行","B. 法律制裁","C. 法律遵守","D. 法律适用"],answer:"D",explanation:"（本题解析见原书解析分册）"},
  {id:912,chapter:"思修",sub:"思想道德与法治",type:"single",question:"法律的实施包括法律适用和法律执行。其中，狭义上的法律执行的主体是",options:["A. 国家司法机关及其公职人员","B. 国家行政机关及其公职人员","C. 国家立法机关及其公职人员","D. 社会团体及其公职人员"],answer:"B",explanation:"在广义上，法律执行是指国家机关及 其公职人员，在国家和公共事务管理中依照 法定职权和程序，贯彻和实施法律的活动。 在狭义上，法律执行则是指国家行政机关及 其公职人员执行法律的活动，也被称为行政 执法。在我国，大部分的法律法规都是由行 政机关执行的。B正确。"},
  {id:913,chapter:"思修",sub:"思想道德与法治",type:"single",question:"推进全面依法治国的根本保证是",options:["A. 党的领导","B. 中国特色社会主义制度","C. 中国特色社会主义法治理论","D. 依宪治国、依宪执政"],answer:"A",explanation:"党的领导是中国特色社会主义最本质 的特征，是推进全面依法治国的根本保证。 A正确，B、C、D不符合题意。"},
  {id:914,chapter:"思修",sub:"思想道德与法治",type:"single",question:"我国的法治同西方资本主义国家的法治最大的区别是",options:["A. 坚持党的领导","B. 坚持以人民为中心","C. 坚持中国特色社会主义制度","D. 坚持中国特色社会主义法治理论"],answer:"A",explanation:"党的领导是中国特色社会主义最本质 的特征，是社会主义法治最根本的保证。把 党的领导贯彻到依法治国全过程和各方面， 是我国社会主义法治建设的一条基本经验。 我国是人民民主专政的社会主义国家，党的 领导是中国特色社会主义法治之魂，是我们 的法治同西方资本主义国家的法治最大的区 别。A 正确。"},
  {id:915,chapter:"思修",sub:"思想道德与法治",type:"single",question:"全面推进依法治国是一个系统工程，是国家治理领域一场广泛而深刻的革命，涉及立法、执法、 司法、守法等各个方面，在实际工作中必须有一个总揽全局、牵引各方的总抓手。全面依法治 国的总抓手是",options:["A. 坚持科学立法、严格执法、公正司法、全民守法","B. 保障和促进社会公平正义","C. 建设中国特色社会主义法治体系","D. 坚持依法治国和以德治国相结合"],answer:"C",explanation:"全面推进依法治国涉及很多方面，在 实际工作中必须有一个总揽全局、牵引各方 的总抓手，这个总抓手就是建设中国特色社 会主义法治体系。依法治国各项工作都要围 绕这个总抓手来谋划、来推进。C 正确。"},
  {id:916,chapter:"思修",sub:"思想道德与法治",type:"single",question:"建设中国特色社会主义法治体系，就是在中国共产党领导下，坚持中国特色社会主义制度，贯 彻中国特色社会主义法治理论，形成完备的法律规范体系、高效的法治实施体系、严密的法治 监督体系、有力的法治保障体系，形成完善的党内法规体系。其中，建设中国特色社会主义法 治体系的重点是建设",options:["A. 完备的法律规范体系","B. 高效的法治实施体系","C. 有力的法治保障体系","D. 严密的法治监督体系"],answer:"B",explanation:"完备的法律规范体系，是中国特色社 会主义法治体系的前提，是法治国家、法治政 府、法治社会的制度基础；建设高效的法治实 施体系，是建设中国特色社会主义法治体系 的重点；严密的法治监督体系，是宪法法律有 效实施的重要保障；有力的法治保障体系，是 全面依法治国的重要依托。B 正确，A、C、D 错误。"},
  {id:917,chapter:"思修",sub:"思想道德与法治",type:"single",question:"全面依法治国是国家治理的一场深刻革命，关系党执政兴国，关系人民幸福安康，关系党和国 家长治久安。推进全面依法治国，根本目的是",options:["A. 依法保障人民权益","B. 加强党对国家的全面领导","C. 建设法治国家","D. 保证法律面前人人平等"],answer:"A",explanation:"习近平强调，要坚持以人民为中心。 全面依法治国最广泛、最深厚的基础是人民， 必须坚持为了人民、依靠人民。要把体现人 民利益、反映人民愿望、维护人民权益、增进 · 20 考研政治1 0 0 题 解析分册 · 人民福祉落实到全面依法治国各领域全过 程 。推进全面依法治国，根本目的是依法保 障人民权益。A 正确。"},
  {id:918,chapter:"思修",sub:"思想道德与法治",type:"single",question:"全面依法治国是一个系统工程，要整体谋划，更加注重系统性、整体性、协同性。推进全面依 法治国，要坚持依法治国、依法执政、依法行政共同推进，坚持法治国家、法治政府、法治社 会一体建设。其 中 ，构筑法治国家的基础是",options:["A. 法治政府","B. 依法执政","C. 法治社会","D. 依法行政"],answer:"C",explanation:"要坚持法治国家、法治政府、法治社会 一体建设。法治国家是法治建设的目标；法 治政府是建设法治国家的重点，法治政府建 设是全面依法治国的重点任务和主体工程； 法治社会是构筑法治国家的基础。C 正确。"},
  {id:919,chapter:"思修",sub:"思想道德与法治",type:"single",question:"支持重大改革、护航国家发展，新时代我国立法更具针对性、有效性、可操作性。制定国家安 全法、香港国安法、网络安全法等，坚决维护国家安全与核心利益，以宪法为统帅的中国特色 社会主义法律体系不断完善。立法是",options:["A. 法治的龙头环节","B. 法治的生命线","C. 治国理政的基本方式","D. 法律实施和实现的基本途径和重要环节"],answer:"A",explanation:"立法是法治的龙头环节。A 正确。公 正是法治的生命线，是司法活动最高的价值 追求；法治是治国理政的基本方式；守法是法 律实施和实现的基本途径；行政执法是法律 实施和实现的重要环节。B、C、D 错误。"},
  {id:920,chapter:"思修",sub:"思想道德与法治",type:"single",question:"习近平曾指出，要懂得“100- ”的道理。一个错案的负面影响，足以摧毁九十九个公平裁 判积累起来的良好形象。执法司法中万分之一的失误，对当事人就是百分之百的伤害。这说明 了公正司法的重要性。公正司法是 ·",options:["A. 法治社会的基础工程","B. 法治的龙头环节","C. 维护社会公平正义的最后一道防线","D. 维护社会公平正义的决定因素"],answer:"C",explanation:"公正是法治的生命线，是司法活动最 高的价值追求。公正司法是维护社会公平正 义的最后一道防线。C 正确。法律的权威源 自人民的内心拥护和真诚信仰，全民守法是 法治社会的基础工程。A 错误。法律是治国 之重器，立法是法治的龙头环节。B 错误。D 不符合题意。"},
  {id:921,chapter:"思修",sub:"思想道德与法治",type:"single",question:"法治思维是指以法治价值和法治精神为导向，运用法律原则、法律规则、法律方法思考和处理 问题的思维模式。法治思维以法律原则和法律规则为依据来指导人们的社会行为，这是在强调， 法治思维是一种",options:["A. 正当性思维","B. 规范思维","C. 逻辑思维","D. 底线思维"],answer:"B",explanation:"法治思维包含以下几层含义：①法治 思维以法治价值和法治精神为指导，蕴含着 公正、平等、民主、人权等法治理念，是一种正 当性思维；2法治思维以法律原则和法律规 则为依据来指导人们的社会行为，是一种规 范思维；③法治思维以法律手段与法律方法 为依托分析问题、处理问题、解决纠纷，是一 种逻辑思维；4法治思维是一种符合规律、尊 重事实的科学思维。因此，法治思维是一种 融法律的价值属性和工具理性于一体的特殊 的高级法律意识。B 正确，A、C、D 错误。"},
  {id:922,chapter:"思修",sub:"思想道德与法治",type:"single",question:"习近平指出，党纪国法不能成为“橡皮泥”“稻草人”,无论是因为“法盲”导致违纪违法，还 是故意违规违法，都要受到追究，否则就会形成“破窗效应”。任何人不论权力大小、职位高 低，只要有违法犯罪行为，就要受到法律制裁，这体现的是法律的",options:["A. 普遍适用","B. 优先适用","C. 不可违反","D. 阶级属性"],answer:"C",explanation:"法律的普遍适用，是指法律在本国主 权范围内对所有人具有普遍的约束力。所有 国家机关、社会组织和公民个人都必须遵守 法律，依法享有和行使法定职权与权利，承担 和履行法定职责与义务。法律的优先适用， 是指当同一项社会关系同时受到多种社会规 范的调整而多种社会规范又相互矛盾时，要 优先考虑法律规范的适用。法律的不可违 反，是指法律必须遵守，违反法律要受到惩 罚。任何人不论权力大小、职位高低，只要有 违法犯罪行为，就要受到法律制裁。C 正确。 A、B不符合题意，D错误。"},
  {id:923,chapter:"思修",sub:"思想道德与法治",type:"single",question:"所有国家机关、社会组织和公民个人都必须遵守法律，依法享有和行使法定职权与权利，承担 和履行法定职责与义务，这体现的是法律的",options:["A. 不可违反","B. 优先适用","C. 权力制约","D. 普遍适用"],answer:"D",explanation:"（本题解析见原书解析分册）"},
  {id:924,chapter:"思修",sub:"思想道德与法治",type:"single",question:"权利公平是公平正义的重要内容之一。以下不属于权利公平内容的是",options:["A. 权利主体平等","B. 发展机会和发展前景平等","C. 权利保护和权利救济平等","D. 享有的权利特别是基本权利平等"],answer:"B",explanation:"权利公平包括三重含义：一是权利主 体平等，国家对每个权利主体“不偏袒”“非歧 视”;二是享有的权利特别是基本权利平等； 三是权利保护和权利救济平等。A、C、D不符 合题意。机会公平是指生活在同一社会中的 成员拥有相同的发展机会和发展前景，反对 任何形式的歧视。B 属于机会公平的内容， 符合题意。"},
  {id:925,chapter:"思修",sub:"思想道德与法治",type:"single",question:"《中华人民共和国民法典》是新中国成立以来第一部以“法典”命名的法律，被誉为“保障民 事权利的宣言书”。权利保障主要是指对公民权利的法律保障，具体包括公民权利的宪法保障、 立法保障、行政保障和司法保障。权利保障的关键环节是",options:["A. 宪法保障","B. 立法保障","C. 行政保障","D. 司法保障"],answer:"C",explanation:"宪法保障是权利保障的前提和基础。 宪法表明尊重和保障人权的鲜明态度，确立 保障权利的有效机制，明确列出宪法保障的 公民基本权利，能够推动整个国家和法律体 系加强权利保障。立法保障是权利保障的重 要条件。行政保障是权利保障的关键环节。 司法保障是公民权利保障的最后防线，既是 解决个人之间权利纠纷的有效渠道，也是纠 正和遏制行政机关侵犯公民权利的有力机 制。C 正确，A、B、D不符合题意。 170"},
  {id:926,chapter:"思修",sub:"思想道德与法治",type:"single",question:"程序正当是法治思维的基本内容之一。程序的正当，表现在程序的合法性、中立性、参与性、 公开性、时限性等方面。正义不应缺席，也不应迟到，迟到的正义是有瑕疵的正义。这实际上 指的是程序必须具有",options:["A. 中立性","B. 参与性","C. 公开性","D. 时限性"],answer:"D",explanation:"“迟到的正义是有瑕疵的正义”,实 际上指的是程序必须具有时限性。时限性是 指程序的运行必须有合理的期限，符合时间 成本和效率原则的要求，不得无故拖延。如 诉讼案件应当在法定的期限内作出裁判，如 无法定事由，诉讼期限不得延长。D正确。"},
  {id:927,chapter:"思修",sub:"思想道德与法治",type:"single",question:"按照程序做事情，才能防止主观任性、无序混乱。程序运行合乎法律的规定，有关机关或个人 不得违反或变相违反，这是程序的",options:["A. 中立性","B. 公开性","C. 参与性","D. 合法性"],answer:"D",explanation:"程序正当，表现在程序的合法性、中立 性、参与性、公开性、时限性等方面。合法性 是指程序运行合乎法律的规定，有关机关或 个人不得违反或变相违反；中立性是指程序 设计和运行应平等地对待双方当事人，不得 偏向任何一方；参与性是指案件或纠纷的利 害关系人都有机会进入办案程序，充分表达 自己的利益诉求和意见主张，为解决纠纷发 挥作用；公开性是指程序运行的过程和结果 应当向当事人和社会公开，以接受各方监督， 防止办案不公和暗箱操作，让正义以人们看 得见的方式实现。D正确，A、B、C 错误。"},
  {id:928,chapter:"思修",sub:"思想道德与法治",type:"single",question:"马克思主义权利观与其他权利观的根本区别在于",options:["A. 强调社会的物质生活条件对权利的制约和决定作用","B. 强调公民的权利和义务是平等的","C. 强调公民的权利和义务是统一的","D. 强调权利和义务关系是社会关系的核心部分"],answer:"A",explanation:"马克思主义认为，权利的产生、发展和 实现，都必须以一定的社会经济条件为基础。 强调社会的物质生活条件对权利的制约和决 定作用，这是马克思主义权利观与其他权利 观的根本区别。A 正确，B、C、D 都不符合 题意。 国家强制力保障其实现，这是法律权利区别 于其他权利的根本所在。B 正确，A、C、D 都 不符合题意。"},
  {id:929,chapter:"思修",sub:"思想道德与法治",type:"single",question:"法律权利是指由一定的社会物质生活条件所制约的行为自由，是法律所允许的权利人为了满足 自己的利益而采取的、由其他人的法律义务所保障的法律手段。法律权利区别于其他权利的根 本所在是",options:["A. 受社会物质生活条件的制约","B. 由国家强制力保障其实现","C. 源于现实需要","D. 随着历史的发展变化而变化"],answer:"B",explanation:"法律权利不仅由法律规定或认可，而 171 1000题 >>>解析分册"},
  {id:930,chapter:"思修",sub:"思想道德与法治",type:"single",question:"我国《立法法》明文规定，限制公民人身和财产权利的法律必须由国家立法机关制定，行政机 关即政府不得制定限制公民人身或财产权利的法规。党的十八届四中全会决定指出，行政机关 要“坚持法无授权不得为”,不得通过行政法规减损公民的权利。这体现的法律义务的特点是",options:["A. 法律义务是历史的","B. 法律义务源于现实需要 ·","C. 法律义务必须依法设定","D. 法律义务可能发生变化"],answer:"C",explanation:"（本题解析见原书解析分册）"},
  {id:931,chapter:"思修",sub:"思想道德与法治",type:"single",question:"我国宪法法律规定了公民享有一系列权利，主要包括政治权利、宗教信仰自由、人身权利、财 产权利、社会经济权利及文化教育权利等。公民参加国家政治、经济与社会生活的基础是",options:["A. 表达权利","B. 人身权利","C. 社会经济权利","D. 文化教育权利"],answer:"B",explanation:"人身权利是指公民的人身不受非法侵 犯的权利，包括生命健康权、人身自由权、人 格尊严权、住宅安全权、通信自由权等具体权 利。人身权利是公民参加国家政治、经济与 社会生活的基础，是公民权利的重要内容。 B正确，A、C、D 都不符合题意。"},
  {id:932,chapter:"思修",sub:"思想道德与法治",type:"single",question:"我国宪法法律规定了公民享有一系列权利，主要包括政治权利、宗教信仰自由、人身权利、财 产权利、社会经济权利及文化教育权利等。人们一切行动和生活的前提条件是",options:["A. 健康权","B. 人格尊严","C. 人身自由","D. 言论自由"],answer:"C",explanation:"（本题解析见原书解析分册）"},
  {id:933,chapter:"思修",sub:"思想道德与法治",type:"single",question:"我国宪法法律规定了公民享有一系列权利。人享有其他各项权利的前提是",options:["A. 生命权","B. 健康权","C. 人身自由权","D. 人格尊严权"],answer:"A",explanation:"生命健康权是人身权利的主要内容之 一。生命健康权，即维持生命存在的权利。 生命权是人最基本、最原始的权利，具有神圣 性与不可转让性，不可非法剥夺。享有生命 权是人享有其他各项权利的前提。A 正确， B、C、D错误。 ·"},
  {id:934,chapter:"思修",sub:"思想道德与法治",type:"single",question:"“法律既不是铭刻在大理石上，也不是铭刻在铜表上，而是铭刻在公民们的内心里。”卢梭这句 话强调的是",options:["A. 法律必须被信仰，否则形同虚设","B. 要用实际行动保障法律实施","C. 应当拥护法律的规定，接受法律的约束","D. 对违法犯罪行为要敢于揭露、敢于抵制"],answer:"A",explanation:"法律的权威源自人民的内心拥护和真 诚信仰。人民权益要靠法律保障，法律权威 要靠人民维护。尊重法律权威，就要信仰法 律，对法律常怀敬畏之心。卢梭这句话强调 的是法律必须被信仰，否则形同虚设。A 正 确。B、C、D涉及的是遵守法律、服从法律和 维护法律的内容，都不符合题意。"},
  {id:935,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"法治建设为思想道德建设提供制度支撑和法律保障，体现在",options:["A. 法治建设通过对思想道德的基本原则予以确认，为思想道德建设提供国家强制力保障","B. 科学立法和民主立法，可以将思想道德有机融入法律体系，让法治成为良法善治","C. 严格执法和公正司法，使思想道德要求在实践中得到切实遵循","D. 全民普法和全民守法，有助于提高人们信守法律的思想道德水平"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:936,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"思想道德建设为法治建设提供思想指引和价值基础，体现在",options:["A. 思想道德为法律的制定、发展和完善提供价值准则，是社会主义法律正当性和合理性的重要 基础","B. 思想道德能够促进人们自觉尊法学法守法用法，维护法律权威","C. 思想道德调整社会关系的范围和方式更加广泛灵活，与法治建设共同促进良好社会秩序的形成","D. 思想道德可以通过作为后盾的国家强制力，发挥惩罚作用、威慑作用，对公民和社会组织的 行为进行约束"],answer:"ABC",explanation:"A、B、C 正确。法治发挥作用要以国家 强制力为后盾，主要依靠法律的预测作用、惩 罚作用、威慑作用和预防作用对公民和社会组 织的行为进行约束，并对违反法律的行为追究 法律责任；德治发挥作用要通过人们的内心信 念、传统习俗、社会舆论等进行道德教化， 并对违反道德的行为进行道德谴责。D 错误。"},
  {id:937,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"法律是成文的道德，道德是内心的法律，法律和道德都具有规范社会行为、维护社会秩序的作 用。以下既属于道德规范又是法律规范的是 ·",options:["A. 爱国主义","B. 诚实守信","C. 尊重他人权利","D. 男女平等"],answer:"ABCD",explanation:"法律是成文的道德，道德是内心的法律， 法律和道德都具有规范社会行为、维护社会秩 序的作用。爱国主义、诚实守信、尊重他人 权利、男女平等，都既属于道德规范又是法 律规范。A、B、C、D 全选。"},
  {id:938,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"习近平在湖南大学岳麓书院考察调研时指出，新时代是一个英雄辈出的时代，青年人正逢其时。 习近平希望同学们不负青春、不负韶华、不负时代，珍惜时光好好学习，掌握知识本领，树立正 确的世界观、人生观、价值观，系好人生第一粒扣子，走好人生道路，为实现中华民族伟大复兴 贡献聪明才智。世界观、人生观、价值观是紧密联系在一起的，三者的关系是",options:["A. 世界观决定人生观","B. 价值观对于人生观的形成和发展有重要的引导作用","C. 世界观从属于人生观","D. 人生观对世界观的巩固、发展和变化起着重要的作用"],answer:"ABD",explanation:"世界观决定人生观，有什么样的世界观， 就会有什么样的人生观。同时，人生观又对世 界观的巩固、发展和变化起着重要作用。A、D 正确，C 错误。价值观是人们关于价值的根本 观点，对于人生观的形成和发展有重要的引导 作用。B 正确。"},
  {id:939,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"王继才生前是江苏省灌云县开山岛民兵哨所所长。1986年，26岁的王继才接受了守岛任务，从 此与妻子以海岛为家，与孤独相伴，在没水没电、植物都难以存活的孤岛上默默坚守，把青春年 华全部献给了祖国的海防事业。2014年，王继才夫妇被评为全国“时代楷模”。2018年7月27 日、王继才在执勤时突发疾病，经抢救无效去世，年仅58岁。习近平总书记对王继才同志先进 事迹作出重要指示强调，要大力倡导这种爱国奉献精神，使之成为新时代奋斗者的价值追求。以 下说法正确的有",options:["A. 评价人生价值的根本尺度，是看一个人的实践活动是否符合社会发展的客观规律，是否促进 了历史的进步","B. 社会价值的实现总是以个人价值的牺牲为代价","C. 社会对于个人的价值评判主要是以个人对国家和社会所作的奉献为衡量标准","D. 人生的自我价值是个体生存和发展的必要条件"],answer:"ACD",explanation:"人生价值内在地包含了人生的自我价值 和社会价值两个方面。人生的自我价值是个 体生存和发展的必要条件，人生的自我价值的 实现是个体为社会创造更大价值的前提。人 生的社会价值是社会存在和发展的重要条件， 人生社会价值的实现是个体自我完善、全面发 展的保障。评价人生价值的根本尺度，是看 一个人的实践活动是否符合社会发展的客观 规律，是否促进了历史的进步。在今天，衡 量人生价值的标准，最重要的就是看一个人 是否用自己的劳动和聪明才智为国家和社会 真诚奉献，为人民群众尽心尽力服务。个体 对社会和他人的生存和发展贡献越大，其人生 的社会价值也就越大；反之，人生的社会价值 就越小。A、C、D正确，B显然错误。"},
  {id:940,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"复旦大学生命科学学院教授钟扬胸怀科技报国理想，长期致力于生物多样性研究和保护，率领团 队在青藏高原为国家种子库收集了数千万颗植物种子；他艰苦援藏16年，足迹遍布西藏最偏远、 最艰苦的地区，为西部少数民族地区的人才培养、学科建设和科学研究作出了重要贡献。2017 年9月25日，钟扬在赴内蒙古为民族干部授课途中遭遇车祸，不幸逝世，年仅53岁。高尚的人 生目的总是与奋斗奉献联系在一起。钟扬的一生体现了“服务人民、奉献社会”的高尚品质。确 立服务人民、奉献社会的高尚的人生追求，才能",options:["A. 清楚地把握人生的奋斗目标","B. 以正确的人生态度对待人生、解决实际生活中的各种问题","C. 掌握正确的人生价值标准 ·","D. 懂得人生的价值首先在于奉献"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:941,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"近年来，一些地方政府出于社会利益考虑，准备在某些地点设立垃圾场、核电厂、殡仪馆等设施， 这往往引起当地居民或单位的不满，滋生“不要建在我家后院”的心理。“邻避效应”涉及个人 与社会的关系问题。个人与社会的关系，最根本的是个人利益与社会利益的关系。社会利益是",options:["A. 社会发展的根本目标","B. 作为社会成员的个人的根本利益和长远利益的体现","C. 个人利益得以实现的前提和基础","D. 所有人利益的有机统一"],answer:"BCD",explanation:"当地居民或单位因担心建设项目(如 垃圾场、核电厂、殡仪馆等邻避设施)对身体 健康、环境质量和资产价值等带来诸多负面 影响，激发了嫌恶情结，滋生“不要建在我家 后院”的心理，采取强烈和坚决的、有时高度 情绪化的集体反对甚至抗争行为，这是“邻避 效应”的表现。个人与社会的关系，最根本 的是个人利益与社会利益的关系。社会利益 是所有人利益的有机统一，它体现了作为社 会成员的个人的根本利益和长远利益，是个 人利益得以实现的前提和基础，同时它也保 172"},
  {id:942,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"比较客观、公正、准确地评价社会成员人生价值的大小，除了要掌握科学的标准外、还需要掌 握恰当的评价方法，坚持",options:["A. 既要看贡献的大小，也要看尽力的程度","B. 既要尊重物质贡献，也要尊重精神贡献","C. 既要注重社会贡献，也要注重自身完善","D. 既要注重社会地位，也要注重社会影响"],answer:"ABC",explanation:"（本题解析见原书解析分册）"},
  {id:943,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"“文王拘而演《周易》;仲尼厄而作《春秋》;屈原放逐，乃赋《离骚》;左丘失明，厥有《国 语》;孙子膑脚，《兵法》修列；不韦迁蜀，世传《吕览》;韩非囚秦，《说难》《孤愤》;《诗》 三百篇，大底圣贤发愤之所为作也。”司马迁这段话对我们辩证对待人生矛盾，树立正确顺逆观 的启发有",options:["A. 顺境和逆境是人生历程中两种不同的境遇","B. 在人生旅途中没有永远的顺境，也没有永远的逆境","C. 受磨难而奋进，这是身处逆境的学问","D. 有多少逆境，就会有多少顺境"],answer:"ABC",explanation:"顺境和逆境是人生历程中两种不同的 境遇。在人生旅途中没有永远的顺境，也没 有永远的逆境。顺势而快上.乘风而勇进，这 是身处顺境的学问，是善于抓住机遇不断丰 富与完善自己的途径；处低谷而力争，受磨难 而奋进，这是身处逆境的学问，是将压力变成 动力之所为。A、B、C正确。D 显然错误。"},
  {id:944,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"辩证对待人生矛盾，要树立正确的荣辱观。中国古人向来注重荣与辱。以下名言体现出中国古 人注重荣与辱的有",options:["A. “ 知耻近乎勇”","B. “无羞恶之心，非人也”","C. “ 礼义廉耻，国之四维”","D. “舍生取义”"],answer:"ABC",explanation:"A、B、C 正确。“舍生取义”属于生死 观，D不符合题意。 ·"},
  {id:945,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"漫漫人生，唯有激流勇进、奋力拼搏，方能中流击水， 抵达理想的彼岸。科学的理想信念，既 是指引人们穿越迷雾、辨识航向的灯塔，也是激励人们乘风破浪、搏击沧海的风帆。以下关于 理想信念表述正确的有",options:["A. 理想和信念都是人类特有的精神现象","B. 理想是信念所指的对象，信念是理想实现的保障","C. 理想信念不是思想认识问题，而是一个实践问题","D. 理想和信念总是相互依存"],answer:"ABD",explanation:"理想信念是人类特有的精神现象。人 既需要物质资料来实现生存和发展，也需要 理想信念来充实精神生活。理想和信念总是 相互依存。理想是信念所指的对象，信念则 是理想实现的保障。A、B、D正确。理想信念 是思想认识问题，更 是一个实践问题。 C 错误。 追求个人理想的实践活动都是在社会 中进行的，个人理想的确立不能只凭个人的 主观愿望，而要顺应社会发展的客观规律和 趋势要求；个人理想的实现不仅仅是个人奋 斗的事情，而是要担当时代赋予的社会责任 和历史使命。从根本上说，个人理想是由社 会理想规定的。个人理想的确立要以社会理"},
  {id:946,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"理想是人们在实践中形成的、有实现可能性的、对未来社会和自身发展目标的向往与追求，是 人们的世界观、人生观和价值观在奋斗目标上的集中体现。关于理想，以下内容正确的选项有",options:["A. 理想具有实践性","B. 理想受时代条件的制约","C. 理想源于现实，又超越现实","D. 理想具有时代性"],answer:"ABCD",explanation:"理想是人们在实践中形成的、有实现 可能性的、对未来社会和自身发展目标的向 往与追求，是人们的世界观、人生观和价值观 想为导向，个人理想的实现依赖于社会理想 的指引。A、B、C正确。社会理想是个人理想 考研政治 1000题 解析分册 · 的汇聚和升华，不是叠加，D 错误。"},
  {id:947,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"信念是人们在一定的认识基础上确立的对某种思想或事物坚信不疑并身体力行的精神状态。以 下选项内容正确的有 ·",options:["A. 信念是认知、情感和意志的有机统一体","B. 信念具有不同的层次和类型","C. 信念是最高层次的信仰","D. 信念一旦形成就不会轻易改变"],answer:"ABD",explanation:"评价人生价值大小的方法是既要看贡 献的大小，也要看尽力的程度；既要尊重物质 贡献，也要尊重精神贡献；既要注重社会贡献， 也要注重自身完善。A、B、C正确，D 错误。 信念是认知、情感和意志的有机统一 体。信念具有执着性，信念一旦形成，就不会 轻易改变。信念具有不同的层次和类型。高 层次的信念决定低层次的信念，低层次的信 念服从高层次的信念。信仰是最高层次的信 念，具有最大的统摄力。 A、B、D 正确，C 错误。"},
  {id:948,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"习近平总书记在上海瞻仰中共一大代表群像浮雕时，曾对着浮雕——列数中共一大13名代表的 姓名，感叹英雄辈出，也感叹大浪淘沙。个人坚守理想信念力量的强弱决定着人生命运的方向。 理想信念的作用和意义在于",options:["A. 昭示奋斗目标","B. 催生前进动力","C. 提供精神支柱","D. 提高精神境界"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:949,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"在追求理想的过程中，人们常常会感受到理想与现实之间的矛盾。因此，正确认识理想与现实 的关系，是追求理想的过程中必须解决的问题。理想与现实的关系是",options:["A. 理想与现实之间的矛盾与冲突属于“应然”和“实然”的矛盾","B. 理想受现实的规定和制约，是在对现实认识的基础上发展起来的","C. 现实中包含着理想的因素，理想中也包含着现实","D. 在一定条件下，理想可以转化为未来的现实"],answer:"ABCD",explanation:"理想与现实是对立统一的。理想和现 实存在着对立的一面，二者的矛盾与冲突属 干“应然”和“实然”的矛盾。理想与现实又 是统一的。理想受现实的规定和制约，是在 对现实认识的基础上发展起来的。一方面， 现实中包含着理想的因素，孕育着理想的发 展。另一方面，理想中也包含着现实，既包含 着现实中必然发展的因素，又包含着由理想 转化为现实的条件。在一定条件下，理想可 以转化为未来的现实。脱离现实而谈理想， 理想就会成为空想。A、B、C、D 全选。"},
  {id:950,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"习近平在国家勋章和国家荣誉称号颁授仪式上的讲话中强调，要胸怀强国之志，以国家富强为 念，以人民幸福为盼，忠心爱国、矢志报国，把个人小我融入国家大我，在为国尽责、为民服 务中实现个人价值、展现人生风采。在整个理想体系中，社会理想是最根本、最重要的，而个 人理想则从属于社会理想。这是因为",options:["A. 个人理想的确立要以社会理想为导向","B. 个人理想的实现依赖于社会理想的指引","C. 从根本上说个人理想是由社会理想规定的","D. 社会理想是个人理想的叠加"],answer:"ABC",explanation:"（本题解析见原书解析分册）"},
  {id:951,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"习近平在纪念周恩来同志诞辰120周年座谈会上的讲话中深切缅怀了周恩来为党、人民、国家 和人民军队建立的卓著功勋，并指出，青少年时期的周恩来，面对国家危难和人民困苦，决心 “为了中华之崛起”而读书，誓言“险夷不变应尝胆，道义争担敢息肩”,立下“面壁十年图破 壁”的远大志向。周恩来的光辉一生启示我们",options:["A. 立鸿鹄志，做奋斗者","B. 青年时期是理想形成的重要时期，也是立志的关键阶段","C. 青年要以国家民族的命运为己任，而不要以个人的荣华富贵为人生的理想","D. 心怀“国之大者”,敢于担当"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:952,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"中华民族在5000多年的历史进程中，不仅创造出光辉灿烂、享誉世界的中华文明，也塑造出独 特的精神气质和精神品格，形成了崇尚精神的优秀传统。中华民族崇尚精神的优秀传统表现为",options:["A. 对物质生活与精神生活相互关系的独到理解","B. 对理想的不懈追求","C. 对品格养成的重视","D. 对法治精神的推崇"],answer:"ABC",explanation:"崇尚精神是中华民族的优秀传统。中 华民族崇尚精神的优秀传统的表现：①表现 为对物质生活与精神生活相互关系的独到理 解。2表现为对理想的不懈追求。③表现为 对品格养成的重视。A、B、C正确，D错误。"},
  {id:953,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"在几千年的历史进程中，中国人民用勤劳和智慧书写了辉煌的中华历史，也培育铸就了独特的 中国精神，为中国发展和人类文明进步提供了强大的精神动力。中国精神的内涵是",options:["A. 伟大创造精神","B. 伟大奋斗精神","C. 伟大团结精神","D. 伟大梦想精神"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:954,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"中国精神是兴国强国之魂，是",options:["A. 推进复兴伟业的精神支柱","B. 凝聚中国力量的精神纽带 ·","C. 激发创新创造的精神动力","D. 政治文明建设的重要内容"],answer:"ABC",explanation:"中国精神是兴国强国之魂，是凝聚中 国力量的精神纽带、激发创新创造的精神动 力和推进复兴伟业的精神支柱。 A、B、C 正 确。中国精神属于精神文明的范畴，D 错误。 点 拨社会主义核心价值观清晰地展现了社 会主义的基本特征和根本追求，渗透于经 济、政治、文化、社会、生态文明建设的 各个方面，是我国社会主义制度的内在精 神之魂。"},
  {id:955,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"从“把我们的血肉，筑成我们新的长城”,到“这是英雄的祖国，是我生长的地方”,再到“我 和我的祖国，一刻也不能分割”,这些歌声激励着中国人民百折不挠向前进的壮丽征程，也激荡 着当代中国强国复兴的澎湃动力。历史的天空里，家国情怀的光芒熠熠生辉；时间的长河中， 家国情怀的源流绵绵不断。爱国主义是",options:["A. 中华民族的民族心、民族魂","B. 中华民族最重要的精神财富","C. 调节个人与祖国之间关系的道德要求、政治原则和法律规范","D. 中国人民和中华民族维护民族独立和民族尊严的强大精神动力"],answer:"ABCD",explanation:"爱国主义是中华民族的民族心、民族 魂 ，是中华民族最重要的精神财富，是中国 人民和中华民族维护民族独立和民族尊严的 强大精神动力。爱国主义体现了人们对自己 祖国的深厚感情，揭示了个人对祖国的依存 关系，是人们对自己家园以及民族和文化的 归属感、认同感、尊严感与荣誉感的统一，是 调节个人与祖国之间关系的道德要求、政治 原则和法律规范，也是中华民族精神的核心。 爱国是每个人都应当自觉履行的责任和义 务，是对祖国的报答。A、B、C、D全选。"},
  {id:956,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"中华民族有着源远流长的爱国主义传统。以下关于爱国主义说法正确的有",options:["A. 爱国主义揭示了个人对祖国的依存关系","B. 爱国主义是具体的","C. 爱国主义是永恒的","D. 爱国主义是现实的"],answer:"ABD",explanation:"A 正确。爱国主义是具体的、 现实 的，在不同的历史条件下所形成的爱国主义 具有不同的内涵和特点。B、D 正确。爱国主 义不是永恒的，它随着国家的发展而发展，在 未来的共产主义社会，国家消亡后，爱国主义 就会失去存在的条件和意义。C 错误。"},
  {id:957,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"爱国主义的基本内涵是",options:["A. 爱祖国的大好河山","B. 爱自己的骨肉同胞","C. 爱祖国的灿烂文化、爱自己的国家","D. 爱社会主义"],answer:"ABC",explanation:"爱国主义的基本内涵是爱祖国的大好 河山，爱自己的骨肉同胞，爱祖国的灿烂文 化，爱自己的国家。A、B、C正确。爱国主义 是具体的、现实的，在不同历史条件下所形成 的爱国主义具有不同的内涵和特点。在新民 主主义革命时期，爱国主义主要表现为致力 于推翻帝国主义、封建主义和官僚资本主义 的反动统治，把黑暗的旧中国改造成光明的 新中国。在中国特色社会主义新时代，爱国 主义主要表现为在党的领导下开启全面建设 社会主义现代化国家新征程，为实现中华民 族强起来而奋斗。所以，把爱社会主义作为 爱国主义的基本内涵不准确，D不选。"},
  {id:958,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"“河山只在我梦紫……长江长城，黄山黄河，在我心中重千斤。”这一首歌体现了人们对祖国大 好河山的热爱之情。爱祖国的大好河山是爱国主义的基本内涵之一，这是因为",options:["A. 祖国的河山在人们的心中占据着至高无上的地位","B. 祖国的山山水水滋养哺育着她的子子孙孙","C. 祖国的大好河山是自然风光，更是主权、财富、民族发展和进步的基本载体","D. 祖国的大好河山是涵养民族心理、民族个性、民族精神的摇篮"],answer:"ABC",explanation:"祖国的河山在人们的心中占据着至高 无上的地位，祖国的山山水水滋养哺育着她 的子子孙孙。“禾苗离土即死，国家无土难 存”,祖国的大好河山，不只是自然风光，更是 主权、财富、民族发展和进步的基本载体。因 此，每一个爱国者都会把“保我国土”“爱我家 乡”、维护祖国领土的完整和统一，作为自己 的神圣使命和义不容辞的责任。A、B、C正 确 。文化是涵养民族心理、民族个性、民族 精神的摇篮，D不符合题意。"},
  {id:959,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"2023年10月24日， 第十四届全国人大常委会第六次会议表决通过了《中华人民共和国爱国主 义教育法》,自2024年1月1日起施行。制定该法的目的是加强新时代爱国主义教育，传承和 弘扬爱国主义精神，凝聚全面建设社会主义现代化国家、全面推进中华民族伟大复兴的磅礴力 量。爱国主义是中华民族精神的核心。中国特色社会主义进入新时代，实现中华民族伟大复兴 的中国梦是新时代爱国主义的鲜明主题。大力弘扬新时代爱国主义，必须",options:["A. 坚持爱国爱党爱社会主义相统一","B. 维护祖国统一和民族团结","C. 尊重和传承中华民族历史文化","D. 坚持立足中国又面向世界"],answer:"ABCD",explanation:"174"},
  {id:960,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"近年来，《中国汉字听写大会》《中国诗词大会》《中国成语大会》《经典咏流传》《朗读者》等 节目广受欢迎。这类节目符合国情、接地气，从中华历史和优秀传统文化资源中汲取养分，增 进了人们对祖国悠久历史、深厚文化的理解和接受，是人们爱国主义情感培育和发展的重要条 件。中华优秀传统文化是",options:["A. 中华民族精神的核心","B. 中华民族得以延续的文化基因","C. 我们在世界文化激荡中站稳脚跟的根基","D. 中华民族的精神命脉"],answer:"BCD",explanation:"在世界文明中，中华文明源远流长、从 未中断，至今仍充满蓬勃的生机和旺盛的生 命力。中华优秀传统文化是中华民族的精神 命脉，是中华民族得以延续的文化基因，也是 我们在世界文化激荡中站稳脚跟的根基。B、 C、D正确。爱国主义是中华民族精神的核 心，A错误。 自由是社会活力之源，是社会主义的 价值理想。平等是人类追求的美好状态。公 正是人类社会进步的标尺，是社会主义制度 的本质要求。法治是人类政治文明的重要成 果，是现代社会的主要特征。A、C、D 正确， B 错误。"},
  {id:961,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"中华民族是富有创新精神的民族，勇于创新创造的民族禀赋成就了辉煌灿烂的中华文明。在当 代中国，社会发展离不开改革创新，因为",options:["A. 创新是推动人类社会发展的第一动力","B. 创新能力是当今国际竞争新优势的集中体现","C. 改革创新是赢得未来的必然要求","D. 坚持改革创新是新时代的迫切要求"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:962,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"人类社会发展的历史表明，对一个民族、一个国家来说，最持久、最深沉的力量是全社会共同 认可的核心价值观。核心价值观 ·",options:["A. 承载着一个民族、一个国家的精神追求","B. 体现着一个社会评判是非曲直的价值标准","C. 是一定社会形态、社会性质的集中体现，在整个上层建筑中处于主导地位","D. 体现着社会制度的阶级属性、社会运行的基本原则和社会发展的基本方向"],answer:"ABD",explanation:"人类社会发展的历史表明，对一个民 族、一个国家来说，最持久、最深层的力量是 全社会共同认可的核心价值观。核心价值观 承载着一个民族、一个国家的精神追求，体 现着一个社会评判是非曲直的价值标准。 核心价值观是一定社会形态、社会性质的集 中体现，在一个社会的思想观念体系中处于 主导地位，体现着社会制度的阶级属性、社 会运行的基本原则和社会发展的基本方向。 A、B、D正确。在整个上层建筑中，政治上层 建筑处于主导地位，C 错误。"},
  {id:963,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"社会主义核心价值观",options:["A. 是当代中国精神的集中体现","B. 凝结着全体人民共同的价值追求","C. 集中体现社会主义的本质属性","D. 是整个上层建筑的核心"],answer:"ABC",explanation:"社会主义核心价值观是当代中国精神 的集中体现，是中国特色社会主义道路、理 论、制度、文化的价值表达，集中体现社会主 义的本质属性，凝结着全体人民共同的价值 追求，体现了社会主义意识形态的本质要求。 全社会积极弘扬和践行社会主义核心价值 观，才能汇聚起建设社会主义现代化强国和 实现中华民族伟大复兴的中国梦的磅礴力 量。A、B、C正确。核心价值观在一个社会的 思想观念体系中处于主导地位。在整个上层 建筑中，国家政权是核心，D 错误。 ②反对西方所谓的“普世价值”,并不是说 人类社会不存在共同价值。 我们所主张的共 同 价 值 ，是要倡导求同存异、和而不同，充 分尊重文明的多样性，尊重各国自主选择社 会制度和发展道路的权利。"},
  {id:964,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"社会主义核心价值观的基本内容是富强、民主、文明、和谐，自由、平等、公正、法治，爱国、 敬业、诚信、友善。自由、平等、公正、法治回答了建设什么样的社会的重大问题，与实现国 家治理体系和治理能力现代化的要求相契合，揭示了社会主义社会发展的价值取向。以下选项 内容正确的有",options:["A. 自由是社会活力之源，是社会主义的价值理想","B. 平等是人类追求的普世价值","C. 公正是人类社会进步的标尺，是社会主义制度的本质要求","D. 法治是人类政治文明的重要成果，是现代社会的主要特征"],answer:"ACD",explanation:"（本题解析见原书解析分册）"},
  {id:965,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"国家艺术基金资助项目、新编历史晋剧《日昇昌票号》里有这样的情节：当饥寒交迫的魏老太 拿着被水浸过的汇票来兑银子，伙计难辨数额怎么办?日昇昌票号大掌柜雷履泰责人详查账目 底簿，当机立断，兑! 当伙计忽略差价少给客商兑了七两八钱银子怎么办?雷履泰斩钉截铁， 补齐!正是靠着这种诚信精神，日昇昌票号实现了分号遍布全国几十个城市、商埠重镇，以 “汇通天下”著称于世。诚信是社会主义核心价值观的重要内容，是",options:["A. 个人立身处世的基本价值规范","B. 社会存续发展的重要价值基石","C. 社会主义职业道德的基本规范之一","D. 中华传统美德的根本要求"],answer:"ABC",explanation:"诚信是个人立身处世的基本价值规 范 ，是社会存续发展的重要价值基石。社会 主义核心价值观倡导的诚信，就是要以诚待 人、以信取人，说老实话、办老实事、做老实人。 现代社会不仅是物质丰裕的社会，也应是诚信 有序的社会；市场经济不仅是法治经济，更应 是信用经济。爱岗敬业、诚实守信、办事公 道、热情服务和奉献社会是职业生活中的基 本道德规范。A、B、C 正确。“公义胜私欲”是 中华传统美德的根本要求，D错误。 ·"},
  {id:966,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"社会主义核心价值观与社会主义核心价值体系具有内在的一致性，两者",options:["A. 都体现了社会主义意识形态的本质要求","B. 都体现了社会主义制度在思想和精神层面的质的规定性","C. 都把涉及国家、社会、公民的价值要求融为一体","D. 都是全面建成社会主义现代化强国、实现第二个百年奋斗目标的价值引领"],answer:"ABD",explanation:"社会主义核心价值观与社会主义核心 价值体系具有内在的一致性，都体现了社会 主义意识形态的本质要求，体现了社会主义 制度在思想和精神层面的质的规定性，是全 面建成社会主义现代化强国、实现第二个百 年奋斗目标的价值引领。A、B、D正确。社会 考研政治1 0 0 题 解析分册 · 主义核心价值观把涉及国家、社会、公民的 价值要求融为一体，C 错误。"},
  {id:967,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"爱国、敬业、诚信、友善，这一价值追求回答了我们要培育什么样的公民的重大问题，是每一 个公民都应当遵守的价值规范。爱国、敬业、诚信、友善，涵盖了",options:["A. 社会公德","B. 职业道德","C. 家庭美德","D. 个人品德"],answer:"ABCD",explanation:"爱国才能承担时代赋予的使命，敬业 才能创造更大的人生价值，诚信才能赢得良 好的发展环境，友善才能形成和谐的人际关 系。爱国、敬业、诚信、友善，这一价值追求回 答了我们要培育什么样的公民的重大问题， 涵盖了社会公德、职业道德、家庭美德、个 人品德等各个方面，是每一个公民都应当遵 守的价值规范。A、B、C、D 全选。"},
  {id:968,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"真理的力量加上道义的力量，才能行之久远。社会主义核心价值观站在人类道义制高点，彰显 出独特而强大的价值观优势。因为社会主义核心价值观具有",options:["A. 先进性","B. 人民性","C. 普适性","D. 真实性"],answer:"ABD",explanation:"真理的力量加上道义的力量，才能行 之久远。社会主义核心价值观以其先进性、 人民性、真实性站在人类道义制高点上，彰 显出独特而强大的价值观优势。 A、B、D 正确。"},
  {id:969,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"马克思主义道德观是科学世界观、人生观、价值观在道德领域的反映与体现。下列观点符合马 克思主义道德观的有",options:["A. 劳动是道德起源的首要前提","B. 道德是人们为实现情感欲望而形成的行为要求","C. 道德是适应社会关系尤其是利益关系调节的需要而产生的","D. 道德观念是动物本能的延续"],answer:"AC",explanation:"自古以来，人们就在探讨道德的起源 并提出了种种见解或理论。“情感欲望论” 认为道德起源于人们的情感欲望，是人们为 实现情感欲望而形成的行为要求；“动物本能 论”则认为道德观念是动物本能的延续，进 而把动物基于本能的活动与人类有目的、有 意识的活动画上等号。可以说，在马克思主 义产生之前，这些关于道德起源的观点，要么 是主观唯心主义或客观唯心主义的注解，要 么是旧唯物主义形而上学的分析，均无法正 确揭示道德的起源。B、D错误。 马克思主义道德观认为，人类社会的实 际情况是，“物质生活的生产方式制约着整个 社会生活、政治生活和精神生活的过程”。因 此，道德的起源问题，必须从这一实际出发来 认识和把握。劳动是道德起源的首要前提。 社会关系是道德赖以产生的客观条件。可以 说，道德正是适应社会关系尤其是利益关系 调节的需要而产生的。A、C正确。"},
  {id:970,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"马克思主义在人类思想史上第一次科学而全面地论述了道德的起源问题，为正确认识和理解道 德的本质奠定了基础。以下说法正确的有",options:["A. 道德是一种特殊的社会意识形态","B. 道德在阶级社会里不可避免地具有阶级性","C. 不同阶级之间的道德是完全不同的","D. 道德是社会利益关系的特殊调节方式"],answer:"ABD",explanation:"道德是反映社会经济关系的特殊意识 形态。道德的产生、发展和变化，归根结底源 于社会经济关系：①道德的性质和基本原则、 规范反映了与之相应的社会经济关系的性质 和内容。有什么样的社会经济关系，相应地 就有什么样的道德。2道德随着社会经济关 176 182"},
  {id:971,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"作为社会意识的道德一经产生，便有相对独立性。这种相对独立性表现为",options:["A. 道德的历史继承性","B. 道德对社会发展具有能动的反作用","C. 在阶级社会里道德具有阶级性","D. 道德随着社会经济关系的变化而变化"],answer:"AB",explanation:"作为社会意识的道德一经产生，便有 相对独立性。这种相对独立性既表现为道德 的历史继承性，也表现为道德对社会发展具 有能动的反作用，A、B正确。C、D 内容正确 但不符合题意。"},
  {id:972,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"道德属于上层建筑的范畴，是一种特殊的社会意识形态。道德以善恶为评价方式，发挥作用主 要是依靠",options:["A. 社会舆论","B. 传统习俗","C. 内心信念","D. 国家强制"],answer:"ABC",explanation:"道德属于上层建筑的范畴，是一种特 殊的社会意识形态。道德是以善恶为评价方 式，主要依靠社会舆论、传统习俗和内心信 念来发挥作用的行为规范的总和。A、B、C 正 确。国家强制性是法律规范区别于其他社会 规范的一个重要特征。作为一种调整人与 人、人与社会、人与自然以及人与自身之间关 系的特殊的行为规范，道德与法律规范、政治 规范的不同之处在于，它是一种非强制性的 规范。D 错误。"},
  {id:973,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"道德的功能，一般是指道德作为社会意识的特殊形式对于社会发展所具有的功效与作用。在道 德的功能系统中，最基本的功能是",options:["A. 认识功能","B. 规范功能","C. 调节功能","D. 表达功能"],answer:"ABC",explanation:"177 1000题 解析分册 · 范，还有法律规范、政治规范等)。D 错误。"},
  {id:974,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"道德功能的发挥和实现所产生的社会影响及实际效果，就是道德的作用。道德的作用主要表现在",options:["A. 巩固特定社会的经济基础和上层建筑","B. 提高人的精神境界","C. 促进人的自我完善","D. 推动人的全面发展"],answer:"ABCD",explanation:"道德作用的主要表现是： 道德作为 维系社会稳定、促进国家发展的重要因素，对 巩固特定社会的经济基础和上层建筑具有不 可替代的重要作用。②道德作为激励人们改 造客观世界和主观世界的一种精神力量，是 提高人的精神境界、促进人的自我完善、推动 人的全面发展的内在动力。A、B、C、D 全选。 道德是社会利益关系的特殊调节方式。 道德与法律规范、政治规范的不同之处在于， 它是用善恶标准去评价，依靠社会舆论、传统 习俗、内心信念来维持的，因此是一种非强制 性的规范。D 正确。"},
  {id:975,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"道德功能的发挥和实现所产生的社会影响及实际效果，就是道德的作用。道德",options:["A. 是维系社会稳定、促进国家发展的重要因素","B. 是激励人们改造客观世界和主观世界的一种精神力量","C. 在本质上是知行合一的","D. 对社会的发展和人的素质的提高总是起着积极的推动作用"],answer:"ABC",explanation:"A、B、C 正确。道德发挥作用的性质与 社会发展的不同历史阶段相联系，由道德所反 映的经济基础、代表的阶级利益所决定。只有 反映先进生产力发展要求和进步阶级利益的 道德，才会对社会的发展和人的素质的提高 产生积极的推动作用，否则，就不利于甚至阻 碍社会的发展和人的素质的提高。D错误。"},
  {id:976,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"与以往社会的道德形态相比，社会主义道德具有显著的先进性特征。 这种先进性主要体现在， 社会主义道德",options:["A. 是社会主义经济基础的反映","B. 是对人类优秀道德资源的批判继承和创新发展","C. 克服了以往阶级社会道德的片面性和局限性","D. 是调节社会一切行为规范的准则"],answer:"ABC",explanation:"· 与以往社会的道德形态相比，社会主 义道德具有显著的先进性特征。这种先进性 主要体现在：1社会主义道德是社会主义经 济基础的反映。2社会主义道德是对人类优 秀道德资源的批判继承和创新发展。3社会 主义道德克服了以往阶级社会道德的片面性 和局限性，坚持以为人民服务为核心，坚持以 集体主义为原则，展现出真实而强大的道义 力量。A、B、C正确。道德是调节社会道德行 为的规范和准则，而不是调节社会一切行为规 范的准则。道德只是调节人与人、人与社会、 人与自然、人与自身关系的一种规范，而不是 唯一的规范(调节社会行为的规范除了道德规"},
  {id:977,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"1949年春，毛泽东在宴请九三学社的朋友时说，“我和各位都是新中国的‘长工’,我们的主人 是谁呢?不是地主老财或资本家，而是人民，四万万五千万中国人民，我们要全心全意为他们 服务!”全心全意为人民服务是",options:["A. 贯穿中国革命道德始终的一根红线","B. 社会主义道德观的集中体现 ·","C. 社会主义道德的原则","D. 先进性要求和广泛性要求的统一"],answer:"ABD",explanation:"精讲P306 考点36 -2-2 全心全意为人民服务是贯穿中国革命 道德始终的一根红线。为人民服务，不仅是 坚持历史唯物主义的必然要求，是中国共产 党践行的根本宗旨，也是社会主义道德观的 集中体现，是全体中国人民共同遵循的道德 要求。为人民服务是社会主义道德的本质要 求，是社会主义经济基础和人际关系的客观 要求，是社会主义市场经济健康发展的要求， 是先进性要求和广泛性要求的统一。A、B、D 正确。为人民服务是社会主义道德的核心， 集体主义是社会主义道德的原则。C 不符合 题意。"},
  {id:978,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"马克思说：“我们知道个人是微弱的，但是我们也知道整体就是力量。”在我国革命、建设、改 革的历程中，在我国抗疫、抗震、抗灾等斗争中，集体主义从未缺席。长期以来，集体主义已 经成为调节国家利益、社会整体利益和个人利益关系的基本原则。集体主义",options:["A. 强调国家利益、社会整体利益和个人利益的辩证统一","B. 强调国家利益、社会整体利益高于个人利益","C. 强调抑制个人利益来发展国家利益、社会整体利益","D. 重视和保障个人的正当利益"],answer:"ABD",explanation:"集体主义强调国家利益、社会整体利 益和个人利益的辩证统一；强调国家利益、社 会整体利益高于个人利益；重视和保障个人 的正当利益，促进和保障个人正当利益的实 现，使个人的才能、价值得到充分的发挥。A、 B、D正确。在现实生活中，国家利益、社会整 体利益和个人利益是相辅相成的，不能靠抑 制一方来发展另一方，而是要力求做到共同 发展、相互增益、相得益彰。C 错误。"},
  {id:979,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"根据我国现阶段经济社会生活和人们思想道德的实际，对公民最基本的集体主义的道德要求是",options:["A. 无私奉献、一心为公","B. 先公后私、先人后己","C. 顾全大局、遵纪守法","D. 热爱祖国、诚实劳动"],answer:"CD",explanation:"“顾全大局、遵纪守法、热爱祖国、诚实 劳动，以正当合法的手段保障个人利益”是对 公民最基本的道德要求。C、D 正确。“无私 奉献、一心为公”是集体主义的最高层次，是 优秀共产党员、先进分子应努力达到的道德 目标。“先公后私、先人后己”是已经具有较 高社会主义道德觉悟的人能够达到的要求， 具有广泛的社会基础。A、B错误。"},
  {id:980,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"2024年10月17日，习近平来到安徽省安庆桐城市考察。地处城中的六尺巷，因清代大学士张 英与邻居吴家互相退让三尺地基而成，是中国邻里和谐礼让的典范。习近平指出，人民内部矛 盾要用调解的办法解决。六尺巷体现了先人化解矛盾的历史智慧，要作为弘扬中华优秀传统文 化的教育场所，发挥好中华民族讲求礼让、以和为贵传统美德的作用，营造安居乐业的和谐社 会环境。推崇仁爱、崇尚和谐是中华民族的优良传统和高尚品德。以下选项中，体现了中华传 统美德推崇仁爱原则，注重以和为贵的有",options:["A. “己欲立而立人，己欲达而达人”","B. “亲亲而仁民，仁民而爱物”","C. “仁、义、礼、智、信”","D. “兼相爱，交相利”"],answer:"ABD",explanation:"A、B、D正确。“仁、义、礼、智、信”属 于中华传统美德中注重人伦关系，重视道德 义务的内容，C错误。"},
  {id:981,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"中国革命道德内容丰富、历久弥新，是中国共产党领导全体人民实现民族独立、人民解放的精 神支撑，对于我们走好新时代的长征路，实现中华民族伟大复兴仍然具有极其重要的现实意义。 中国革命道德的当代价值在于，发扬革命道德、传承红色基因，有利于",options:["A. 加强和巩固社会主义和共产主义的理想信念","B. 培育和践行社会主义核心价值观","C. 引导人们树立正确的道德观","D. 培育良好的社会道德风尚"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:982,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"中国特色社会主义进入新时代，加强公民道德建设、提高全社会道德水平，具有十分重要的意 义。新时代加强公民道德建设，作为着力点的是",options:["A. 社会公德建设","B. 职业道德建设","C. 家庭美德建设","D. 个人品德建设"],answer:"ABCD",explanation:"中共中央、国务院印发的《新时代公民 道德建设实施纲要》指出，新时代公民道德建 设要把社会公德、职业道德、家庭美德、个 人品德建设作为着力点。A、B、C、D 全选。"},
  {id:983,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"新时代公民道德建设的重点任务是",options:["A. 筑牢理想信念之基","B. 培育和践行社会主义核心价值观","C. 传承中华传统美德","D. 弘扬民族精神和时代精神"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:984,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"当代公共生活的特征主要表现在 ·",options:["A. 活动范围的广泛性","B. 活动内容的开放性","C. 交往对象的复杂性","D. 活动方式的多样性"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:985,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"网络空间同现实社会一样，既要提倡自由，也要保持秩序。公共生活需要公共秩序，有序的公 共生活是",options:["A. 调整和规范人际关系的行为准则","B. 社会生产活动的重要基础","C. 提高社会成员生活质量的基本保障","D. 社会文明的重要标志"],answer:"BCD",explanation:"公共秩序是由一定规范维系的人们公 共生活的一种有序化状态。公共生活领域越 思想道德与法治 · 多项选择题 扩大，对公共生活秩序的要求就越高。在当 代社会，维护公共秩序对经济社会健康发展 的重要意义愈加突出。有序的公共生活是社 会生产活动的重要基础，是提高社会成员生 活质量的基本保障，更是社会文明的重要标 志。B、C、D正确。文明礼貌是调整和规范人 际关系的行为准则，A错误。"},
  {id:986,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"公共生活中的道德规范即社会公德。以下对社会公德理解正确的有",options:["A. 社会公德是指人们在社会交往和公共生活中应该遵守的行为准则","B. 遵纪守法是全体公民都必须遵循的基本行为准则","C. 社会公德是维护公共利益、公共秩序、社会和谐稳定的起码的道德要求","D. 社会公德的最高层次的要求是奉献社会"],answer:"ABC",explanation:"献、友爱、互助、进步。其中，奉献精神是精 髓。当前，志愿服务已经成为大学生参与社 会实践、成长成才的重要舞台，成为大学生 关爱他人、传播青春正能量的重要途径。大 学生志愿服务活动已经遍及农村扶贫开发、 城市社区建设、环境保护、大型活动、抢险救 灾、社会公益等领域。A、D正确。《关于健全 新时代志愿服务体系的意见》提出，到2035 年，“志愿服务成为社会主义文化强国的重要 标志”。一个民族的复兴需要强大的物质力 量，也需要强大的精神力量。志愿服务归根 结底是一种先进文化现象，志愿精神必将成 为中国特色社会主义文化的高尚元素，引领 和推动中国特色志愿服务在新征程的新发 展。C 正确。衡量社会文明程度与社会治理 水平需要综合考量，志愿服务不能作为其“根 本标准”。B 错误。 A、B、C正确。奉献社会是社会主义职 业道德中最高层次的要求，D错误。"},
  {id:987,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"网络生活中的道德要求，是人们在网络生活中为了维护正常的网络公共秩序而需要共同遵守的 基本道德准则，是社会公德在网络空间的运用和扩展。网络生活中的道德要求有",options:["A. 正确使用网络工具","B. 加强网络文明自律","C. 进行健康网络交往","D. 营造良好网络道德环境"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:988,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"“人与人交往在于言而有信，国与国相处讲究诚信为本。”诚实守信在我国思想道德建设中具有 特殊重要的作用。诚实守信是",options:["A. 中华民族的传统美德","B. 我国公民道德建设的重点","C. 社会主义道德的核心","D. 社会主义核心价值观的一条重要准则"],answer:"ABD",explanation:"诚实守信在我国思想道德建设中具有 特殊重要的作用，它既是中华民族的传统美 德，也是我国公民道德建设的重点，还是社 会主义核心价值观的一条重要准则。A、B、D 正确。社会主义道德的核心是为人民服务。 C错误。"},
  {id:989,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"职业道德中的诚实守信，要求从业者在职业活动中",options:["A. 诚实劳动","B. 合法经营","C. 信守承诺","D. 讲求信誉"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:990,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"“怒发冲冠，凭栏处、潇潇雨歇。”抗金名将岳飞留给我们的，除了气吞山河的壮烈，莫须冤死 的悲戚，还有一段精忠报国的热血家训。习近平曾多次讲过岳母刺字的故事，强调家风是社会 风气的重要组成部分，父母应引导孩子成为对国家和人民有用的人。之所以要注重家教、家风， 是因为",options:["A. 家庭是人生的第一个课堂，父母是孩子的第一任老师","B. 良好的家风，对家庭成员的个人修养产生着重要的作用","C. 良好的家风，对整个社会道德风尚的形成产生着重要的影响","D. 家教是新时代公民道德建设的重点任务"],answer:"ABC",explanation:"法律的国家强制性，既表现为国家对 违法行为的否定和制裁，也表现为国家对合 法行为的肯定和保护。A、B正确。国家强制 力并不是保证法律实施的唯一力量，法律意 识、道德观念、价值观念、纪律观念也在保证 法律的实施过程中发挥着重要作用，C、D 错误。 A、B、C正确。新时代公民道德建设的 重点任务是筑牢理想信念之基、培育和践行 社会主义核心价值观、传承中华传统美德、弘 扬民族精神和时代精神。D 错误。 ·"},
  {id:991,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"为深入学习贯彻习近平总书记关于注重家庭家教家风建设的重要论述，中央宣传部、全国妇联 于2026年5月向全社会发布2026年“最美家庭”,10户家庭光荣入选2026年“最美家庭”。 家是最小国，国是千万家，家庭的命运同国家和民族的前途命运紧密相连，要以“最美家庭” 为榜样，大力弘扬社会主义家庭文明新风尚。社会主义家庭文明新风尚的内容是",options:["A. 爱国爱家","B. 相亲相爱","C. 向上向善","D. 共建共享"],answer:"ABCD",explanation:"当代青年作为家庭的重要成员，也要 积极弘扬践行家庭美德，感念父母养育之恩， 感念长辈关爱之情，孝敬父母、尊重长辈、回 报家庭、回馈社会，推动形成爱国爱家、相亲 相爱、向上向善、共建共享的社会主义家庭 文明新风尚。A、B、C、D全选。"},
  {id:992,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"在2025年五四青年节到来之际，习近平给新疆克孜勒苏柯尔克孜自治州阿图什市哈拉峻乡谢依 特小学戍边支教西部计划志愿者服务队全体队员回信。回信指出，这些年，越来越多年轻人选 择到西部、到乡村、到基层志愿服务，无私奉献，展现了新时代中国青年昂扬向上的精神风貌 和强国有我的责任担当。志愿服务",options:["A. 是培育和弘扬社会主义核心价值观的重要载体","B. 已经成为衡量地区社会文明程度、社会治理水平的根本标准","C. 归根结底是一种先进文化现象 ·","D. 已成为大学生参与社会实践、成长成才的重要舞台"],answer:"ACD",explanation:"志愿服务是培育和弘扬社会主义核心 价值观的重要载体。志愿服务的精神是奉 考研政治 1000题 解析分册"},
  {id:993,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"法律是由国家创制和实施的行为规范。法律不但由国家制定和认可，而且由国家强制力保证实 施。也就是说，法律具有国家强制性。法律的国家强制性表现为",options:["A. 国家对违法行为的否定和制裁","B. 国家对合法行为的肯定和保护","C. 法律的每一个实施过程都要借助于国家的强制力","D. 国家强制力是保证法律实施的唯一力量"],answer:"AB",explanation:"（本题解析见原书解析分册）"},
  {id:994,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"2026年3月，《生态环境法典(草案)》提请十四届全国人大四次会议审议并获得通过。这是 《民法典》之后我国第二部以“法典”命名的法律，将为美丽中国建设提供坚实法治保障。我 国社会主义法律",options:["A. 体现了党的主张和人民意志的统一","B. 具有科学性和先进性","C. 是中国特色社会主义建设的重要保障","D. 具有比发达国家法律体系更高的成熟性"],answer:"ABC",explanation:"从法律体现的意志看，我国社会主义 法律体现了党的主张和人民意志的统一，是 阶级性与人民性的统一。从法律的实质内容 来看，我国社会主义法律具有科学性和先进 性。从法律的社会作用看，我国社会主义法 律是中国特色社会主义建设的重要保障。A、 B、C正确。由于历史等原因，我国的法律体 系还不如发达国家成熟，D 错误。"},
  {id:995,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"法律的运行是一个从创制、实施到实现的过程。这个过程主要包括法律制定(立法)、法律执行 (执法)、法律适用(司法)、法律遵守(守法)等环节。其中，把法律规范转化为法律实践， 把法定的权利和义务转化为现实的权利和义务是法律运行环节中的",options:["A. 法律制定","B. 法律执行","C. 法律适用","D. 法律遵守"],answer:"BCD",explanation:"（本题解析见原书解析分册）"},
  {id:996,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"我国大部分的法律法规都是由行政机关执行的。行政执法是法律实施和实现的重要环节，必须 坚持的基本原则有",options:["A. 合法性","B. 合理性","C. 信赖保护","D. 效率"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:997,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"2020年11月，中央全面依法治国工作会议正式提出习近平法治思想。习近平法治思想",options:["A. 是新时代全面依法治国的指导思想和根本遵循","B. 是马克思主义法治理论中国化时代化的最新成果","C. 是顺应实现中华民族伟大复兴时代要求应运而生的重大理论创新成果","D. 深刻回答了新时代为什么实行全面依法治国、怎样实行全面依法治国等一系列重大问题"],answer:"ABCD",explanation:"2020年11月，中央全面依法治国工 作会议正式提出习近平法治思想，并将其确 立为全面依法治国的指导思想和根本遵循。 A正确。习近平法治思想从历史和现实相贯 通、国际和国内相关联、理论和实际相结合上 深刻回答了新时代为什么实行全面依法治 国、怎样实行全面依法治国等一系列重大问 题，是顺应实现中华民族伟大复兴时代要求 应运而生的重大理论创新成果，是马克思主 义法治理论中国化时代化的最新成果，是习 近平新时代中国特色社会主义思想的重要组 成部分。B、C、D正确。 ·"},
  {id:998,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"习近平法治思想系统阐述了全面依法治国的政治方向、战略地位、工作布局、主要任务、重大 关系、重要保障等。其中，科学指明了中国特色社会主义法治的前进方向的是",options:["A. 坚持党对全面依法治国的领导","B. 坚持以人民为中心","C. 坚持中国特色社会主义法治道路","D. 坚持依宪治国、依宪执政"],answer:"ABC",explanation:"习近平法治思想系统阐述了全面依法 治国的政治方向、战略地位、工作布局、主要 任务、重大关系、重要保障等，涉及的都是全 面依法治国方向性、根本性、全局性的重大问 题，构成了习近平法治思想的主要内容。关 于政治方向，这一思想深刻回答了全面依法 治国由谁领导、依靠谁、走什么道路等大是大 非问题，科学指明了中国特色社会主义法治 的前进方向。A、B、C正确，D不符合题意。 180 的法治同西方资本主义国家的法治最大的区 别。B、C、D正确。严格执法是全面依法治国 的关键，A错误。"},
  {id:999,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"习近平强调：“改革和法治如鸟之两翼、车之两轮。”改革的“破”和“变”,与法治的“立” 和“稳”,只有相辅相成才能相得益彰。耕好改革“试验田”,需要把在法治轨道上推进改革和 在改革进程中完善法治有机结合起来，发挥好立法引导、推动、规范、保障改革的“稳定器” 作用。为此，要做到",options:["A. 立法主动适应改革需要，确保改革于法有据","B. 实践证明行之有效的举措和经验，应及时上升为法律法规","C. 对不适应改革要求的现行法律法规，能修改的则及时修改，宜废止的则及时废止","D. 改革创新要大胆试、大胆闯，相关立法活动不受法定程序限制"],answer:"ABC",explanation:"耕好改革“试验田”,需要把在法治轨 道上推进改革和在改革进程中完善法治有机 结合起来，发挥好立法引导、推动、规范、保障 改革的“稳定器”作用。立法主动适应改革需 要，确保改革于法有据，改革创新大胆试、大 胆闯、自主改就更有底气。实践证明行之有 效的举措和经验，也应及时上升为法律法 规。耕好改革“试验田”,立法工作除了要做 好“加法”,还要做好“减法”。对不适应改革 要求的现行法律法规，能修改的则及时修 改，宜废止的则及时废止。防止不合时宜的 法规条款束缚改革步伐、迟滞改革进程，有助 于增强改革决心、排除改革阻力、巩固改革成 果。A、B、C正确。我国立法贯彻公正、公平、 公开原则，坚持科学立法、民主立法、依法立 法，表达人民的共同意志和诉求。立法活动 必须遵循法定程序。就全国人民代表大会的 立法程序而言，大体包括法律案的提出、法律 案的审议、法律案的表决和法律的公布四个 环节。D 错误。"},
  {id:1000,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"把党的领导贯彻到依法治国全过程和各方面，是我国社会主义法治建设的一条基本经验。我国 是人民民主专政的社会主义国家，党的领导是",options:["A. 全面依法治国的关键","B. 社会主义法治最根本的保证 ·","C. 中国特色社会主义法治之魂","D. 我们的法治同西方资本主义国家的法治最大的区别"],answer:"BCD",explanation:"党的领导是中国特色社会主义最本质 的特征，是社会主义法治最根本的保证。把 党的领导贯彻到依法治国全过程和各方面， 是我国社会主义法治建设的一条基本经验。 我国是人民民主专政的社会主义国家，党的 领导是中国特色社会主义法治之魂，是我们 法律的运行是一个从创制、实施到实 现的过程。这个过程主要包括法律制定(立 法)、法律执行(执法)、法律适用(司法)、法 律遵守(守法)等环节。法律制定是国家对权 利和义务，即社会利益和负担进行的权威性 分配；法律的执行、适用、遵守则是把法律 规范转化为法律实践，把法定的权利和义务 转化为现实的权利和义务。B、C、D 正确， A错误。"},
  {id:1001,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"中国特色社会主义法治道路的一个鲜明特点，就是坚持依法治国和以德治国相结合。坚持依法 治国和以德治国相结合，就要",options:["A. 运用法治手段解决道德领域突出问题","B. 强化道德对法治的支撑作用","C. 在立法、执法、司法中都体现社会主义道德要求","D. 让思想道德和法律在调节领域上保持完全一致"],answer:"ABC",explanation:"坚持依法治国和以德治国相结合，既 要强化道德对法治的支撑作用，重视发挥道 德的教化作用，提高全社会文明程度，为全面 依法治国创造良好环境；又要把道德要求贯 彻到法治建设中，以法治承载道德理念。立 法、执法、司法都要体现社会主义道德要 求，都要把社会主义核心价值观贯穿其中，使 社会主义法治成为良法善治，引导全社会崇 德向善。要运用法治手段解决道德领域突出 问题，依法加强对群众反映强烈的失德行为 的整治。A、B、C正确。 思想道德和法律都是调节人们思想行 为、协调人际关系、维护社会秩序的重要手 段。思想道德和法律虽然在调节领域、调节 方式、调节目标等方面存在很大不同，但是 二者都是上层建筑的重要组成部分，共同服 务于一定的经济基础。D 错误。"},
  {id:1002,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"走中国特色社会主义法治道路，必须坚持从中国实际出发，坚持",options:["A. 中国共产党的领导","B. 人民主体地位","C. 法律面前人人平等","D. 依法治国和以德治国相结合"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:1003,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"坚持党的领导，是社会主义法治的根本要求，是全面依法治国的题中应有之义。坚持党的领导， 体现在党",options:["A. 领导立法","B. 保证执法","C. 支持司法","D. 带头守法"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:1004,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"平等是社会主义法律的基本属性，是社会主义法治的基本要求。坚持法律面前人人平等，有利于",options:["A. 增强人民群众的主人翁意识和责任感","B. 预防特权思想和各种潜规则的侵蚀","C. 贯彻执行“以事实为根据，以法律为准绳”的司法原则","D. 维护法律权威、健全社会主义法治，确保实现全面依法治国的总目标"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:1005,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"坚持全面依法治国，是中国特色社会主义国家制度和国家治理体系的显著优势。我国社会主义 法治凝聚着我们党治国理政的理论成果和实践经验，是制度之治最基本最稳定最可靠的保障。 法治兴则国兴，法治强则国强。法治是",options:["A. 解决一切问题的总钥匙","B. 治国理政的基本方式","C. 国家治理体系和治理能力的重要依托","D. 国家核心竞争力的重要内容"],answer:"BCD",explanation:"法治是治国理政的基本方式，是国家 治理体系和治理能力的重要依托。法治是国 家核心竞争力的重要内容。法治兴则国兴， 法治强则国强。坚持全面依法治国，是中国 特色社会主义国家制度和国家治理体系的显 著优势。实践充分证明，我国社会主义法治 凝聚着我们党治国理政的理论成果和实践经 验，是制度之治最基本最稳定最可靠的保障。 B、C、D 正确。习近平主席在金砖国家领导人"},
  {id:1006,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"每一条法治道路底下都有一种政治立场，每一种法治模式当中都有一种政治逻辑。中国特色社 会主义法治道路的核心要义，就是要",options:["A. 坚持党的领导","B. 坚持以人民为中心","C. 坚持中国特色社会主义制度","D. 贯彻中国特色社会主义法治理论"],answer:"ACD",explanation:"中国特色社会主义法治道路的核心要 义，就是要坚持党的领导，坚持中国特色社 会主义制度，贯彻中国特色社会主义法治理 论，这充分体现了我国社会主义性质，具有鲜 明的中国特色、实践特色、时代特色。A、C、D 正确，B不符合题意。"},
  {id:1007,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"党的二十届三中全会通过的《中共中央关于进一步全面深化改革推进中国式现代化的决定》, 站在党和国家事业发展全局的战略高度，着眼以中国式现代化全面推进强国建设、民族复兴伟 业，为聚焦发展全过程人民民主指明方向，提出推动“中国特色社会主义法治体系更加完善， 社会主义法治国家建设达到更高水平”的目标要求，并对“完善中国特色社会主义法治体系” 作出专章部署。中国特色社会主义法治体系",options:["A. 是国家治理体系的骨干工程","B. 是全过程人民民主制度体系的重要依托","C. 本质上是中国特色社会主义制度的法律表现形式","D. 集中反映了中国之治的制度精华"],answer:"ABCD",explanation:"中国特色社会主义法治体系是国家治 理体系的骨干工程，是中国特色社会主义制 度的重要组成部分，本质上是中国特色社会 主义制度的法律表现形式，集中反映了中国 之治的制度精华。中国特色社会主义法治体 系也是全过程人民民主制度体系的重要依 托，完善中国特色社会主义法治体系，是聚焦 发展全过程人民民主的题中应有之义。A、B、 C、D全选。"},
  {id:1008,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"党的十八届四中全会提出和确立了建设中国特色社会主义法治体系、建设社会主义法治国家的 总目标，开启了建设社会主义法治国家的新征程。建设中国特色社会主义法治体系就是要形成 完备的法律规范体系、高效的法治实施体系、严密的法治监督体系、有力的法治保障体系，形 成完善的党内法规体系。完备的法律规范体系是 ·",options:["A. 中国特色社会主义法治体系的前提","B. 法治国家、法治政府、法治社会的制度基础","C. 宪法法律有效实施的重要保障","D. 全面依法治国的重要依托"],answer:"AB",explanation:")完备的法律规范体系，是中国特色社 会主义法治体系的前提，是法治国家、法治政 府、法治社会的制度基础。A、B 正确。建设 高效的法治实施体系，是建设中国特色社会 主义法治体系的重点。严密的法治监督体 系，是宪法法律有效实施的重要保障，是加强 对权力运行制约和监督的迫切要求。有力的 法治保障体系，是全面依法治国的重要依托。 建设完善的党内法规体系，是中国特色社会 主义法治体系的本质要求和重要内容。C、D 错误。"},
  {id:1009,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"“100- ”。“一个错案的负面影响足以摧毁99个公正裁判积累起来的良好形象。执法司法中 万分之一的失误，对当事人就是百分之百的伤害。”党的二十大报告指出，要严格公正司法，深 化司法体制综合配套改革，全面准确落实司法责任制，加快建设公正高效权威的社会主义司法 制度，努力让人民群众在每一个司法案件中感受到公平正义。公正是",options:["A. 法治的生命线","B. 司法活动最高的价值追求","C. 全面依法治国的前提","D. 社会主义法治最根本的保证"],answer:"AB",explanation:"公正是法治的生命线，是司法活动最 高的价值追求。公正司法是维护社会公平正 义的最后一道防线。A、B 正确。科学立法是 · 全面依法治国的前提，公正司法是全面依法 治国的重点。C 错误。党的领导是中国特色 社会主义最本质的特征，是社会主义法治最 根本的保证。D 错误。 公平正义是指社会的政治利益、经济 利益和其他利益在全体社会成员之间合理、 公平分配和占有。一般来讲，公平正义主要 包括权利公平、机会公平、规则公平和救济公 平。权利公平包括三重含义：一是权利主体 平等，国家对每个权利主体“不偏袒”“非歧 视”;二是享有的权利特别是基本权利平等； 三是权利保护和权利救济平等。B、C、D 正 确，A错误。"},
  {id:1010,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"必须坚持宪法的国家根本法地位，是对我国宪法制度建设的规律性认识之一。宪法集中体现了 党和人民的统一意志和共同愿望，是国家意志的最高表现形式，具有",options:["A. 根本性","B. 全局性","C. 稳定性","D. 长期性"],answer:"ABCD",explanation:"宪法在中国特色社会主义法律体系中 居于核心地位。我国宪法具有最高的法律地 位、法律权威、法律效力，具有根本性、全局 性、稳定性、长期性。一切法律、行政法规、 地方性法规的制定都必须以宪法为依据，遵 循宪法的基本原则，不得与宪法相抵触。A、"},
  {id:1011,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"《中华人民共和国宪法》规定，国家工作人员就职时应当依照法律规定公开进行宪法宜哲。 习近平指出，宪法宣誓制度有利于彰显宪法权威，增强公职人员宪法观念，激励公职人员忠于 和维护宪法，也有利于在全社会增强宪法意识、树立宪法权威。把宪法放到如此重婴的地位， 是因为宪法",options:["A. 是国家的根本法、足党和人民意志的集中体现","B. 是国家各项制度和法律法规的总依据","C. 规定了国家的根本制度","D. 只有最高的法律地位、法律权威、法律效力"],answer:"ABCD",explanation:"我国宪法是国家的根本法，是党和人 民意志的集中体现。我国宪法是国家各项制 度和法律法规的总依据。宪法在中国特色社 会主义法律体系中居于核心地位。我国宪法 具有最高的法律地位、法律权威、法律效 力，具有根本性、全局性、稳定性、长期性。我 国宪法规定了国家的根本制度，确立了中国 共产党的领导地位，规定了国家的根本任务、 领导核心、指导思想、基本原则、发展道路、奋 斗目标。A、B、C、D 全选。"},
  {id:1012,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"宪法的力量不仅因其地位崇高，更源于其有效的监督。在新的历史条件下，推进全面依法治国、 加强宪法实施，对宪法监督提出了新的更高要求。这些新的更高要求是",options:["A. 健全人大工作机制","B. 健全宪法解释机制","C. 健全备案审查机制","D. 健全合宪性审查机制"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:1013,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"2025年9月12日，十四届全国人大常委会第十七次会议表决通过《法治宣传教育法》。制定 《法治宣传教育法〉是夯实全面依法治国社会基础的迫切要求。通过国家立法，在全社会弘扬社 会主义法治精神、培育法治信仰、传播法律知识，使尊法学法守法用法成为全体人民的共同追 求，让法治成为全民思维方式和行为习惯，为全面建设社会主义现代化国家营造良好法治环境。 法治思维足一种",options:["A. 正当性思维","B. 规范思维","C. 逻辑思维","D. 科学思维"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:1014,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"法律至上是法治思维的基本内容之一。法律至上，具体表现为",options:["A. 法律的普遍适用","B. 法律的优先适用","C. 法律的权利保障","D. 法律的不可违反"],answer:"ABD",explanation:"法律权利与法律义务就像一枚硬币的 两面，不可分割，相互依存。在社会生活中， 每个人既是享受法律权利的主体，又是承担 法律义务的主体。在法治国家，不存在只享 受权利的主体，也不存在只承担义务的主体。 法律权利的实现必须以相应法律义务的履行 为条件；法律义务的设定和履行也必须以法 律权利的行使为根据。离开了法律权利，法 律义务就失去了履行的价值和动力；离开了 法律至上具体表现为法律的普遍适 用、优先适用和不可违反。A、B、D正确。法 治思维主要包括法律至上、权力制约、公平正 义、权利保障、程序正当等内容，C 错误。"},
  {id:1015,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"清代史学家赵翼分析历代贪官案例，得出了“贿随权集”的结论：贿赂总是跟随权力而聚集， 即使是曾经品行端正之人，一旦手中有了权力，也容易腐化堕落。权力是把双刃剑，它既是施 展才华、干事创业的利器，也是自断前程、人生陷落的“凶器”,关键看怎么用。因此，只有依 法对权力的配置和运行进行有效制约和监督，才能防止权力私用、权力滥用和权力腐败。权力 制约是社会主义法治思维的重要内容，其要求是",options:["A. 权力由法定","B. 有权必有贵","C. 用权受监督","D. 违法受追究"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:1016,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"公平正义是法治思维的基本内容之一。公平正义主要包括权利公平、机会公平、规则公平和救 济公平。权利公平包括",options:["A. 权利和义务对等","B. 权利主体平等 ·","C. 享有的权利特别是基本权利平等","D. 权利保护和权利救济平等"],answer:"BCD",explanation:"182"},
  {id:1017,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"公平正义是法治思维的基本内容之一。公平正义主要包括权利公平、机会公平、规则公平和救 济公平。机会公平包括",options:["A. 起点平等","B. 结果平等","C. 发展平等","D. 代际平等"],answer:"ACD",explanation:"机会公平是指生活在同一社会中的成 员拥有相同的发展机会和发展前景，反对任 何形式的歧视。机会公平包括：1起点平 等：国家和社会要积极为社会成员的发展创 造条件，并努力创造平等的起点；2 发展平 等：社会成员的发展进步权要受到同等尊 重，不断拓展社会成员的发展领域；3代际平 等：不仅要关注当代人的机会平等，还要考 虑后代人的机会平等。A、C、D正确，B 错误。 B、C、D全选。"},
  {id:1018,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"权利保障是法治思维的基本内容之一。权利保障主要是指对公民权利的法律保障，具体包括公 民权利的",options:["A. 宪法保障","B. 立法保障","C. 行政保障","D. 司法保障"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:1019,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"马克思说：“没有无义务的权利，也没有无权利的义务。”法律权利与法律义务的关系，就像一 枚硬币的两面，不可分割，相互依存。以下选项内容正确的有",options:["A. 法律权利的实现必须以相应法律义务的履行为条件","B. 法律义务的设定和履行必须以法律权利的行使为根据","C. 一个行为不可以同时是权利行为和义务行为","D. 每个人既是享受法律权利的主体，又是承担法律义务的主体"],answer:"ABD",explanation:"（本题解析见原书解析分册）"},
  {id:1020,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"权利和义务问题是人们经常遇到的现实问题，权利和义务关系也是社会关系的法律表现。以下 关于权利和义务说法正确的有",options:["A. 履行义务是对自己不利的，行使权利是对自己有利的","B. 权利的行使和义务的履行都是绝对的","C. 任何公民都是享有权利和履行义务的统一体","D. 有些法律权利和法律义务具有复合性的关系"],answer:"CD",explanation:"在法律权利与法律义务相一致的情况 下，一个人无论是行使权利还是履行义务，实 际上都是对自己有利的。A 错误。任何权利 的行使都不是绝对的，都有其相应的限度，必 须依照法律规定的限度来行使权利。法律义 务也可能发生变化。B 错误。我国公民享有 广泛的权利，同时承担相应的义务；公民的权 利和义务是平等的，任何人不得享有法外特 权 ；公民的权利和义务是统一的，不允许任何 人只享受法律权利，不履行法律义务；任何公 民都是享有权利和履行义务的统一体，并把 自己依法履行义务作为他人依法享受权利的 实现条件。C 正确。有些法律权利和法律义 务具有复合性的关系，D正确。"},
  {id:1021,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"人身自由是人们一切行动和生活的前提条件。人身自由是指",options:["A. 人的身体不受拘束","B. 人的行动自由","C. 人身自由不受非法限制和剥夺","D. 公民居住、生活、休息的场所不受非法侵入或搜查的权利"],answer:"ABC",explanation:"人身自由是人们一切行动和生活的前 提条件。人身自由，首先是指人的身体不受 拘束，因而被视为“最小限度的自由”。其次 是指人的行动自由，如可以自由外出旅游、经 商、打工、求学等。最后是指人身自由不受非 法限制和剥夺。A、B、C 正确。公民居住、生 活、休息的场所不受非法侵入或搜查的权利 属于住宅安全权利。D 错误。"},
  {id:1022,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"我国宪法法律规定了公民享有的一系列权利，主要包括政治权利、宗教信仰自由、人身权利、 财产权利、社会经济权利及文化教育权利等。社会经济权利主要包括",options:["A. 劳动权和休息权","B. 私有财产权","C. 社会保障权","D. 物质帮助权"],answer:"ACD",explanation:"社会经济权利，是指公民要求国家根 据社会经济的发展状况，积极采取措施干预 社会经济生活，加强社会建设，提供社会服 务，以促进公民的自由和幸福，保障公民过上 健康而有尊严的生活的权利。社会经济权利 主要包括以下几方面内容：一是劳动权；二是 休息权；三是社会保障权；四是物质帮助权。 A、C、D正确。财产权主要包括以下几方面内 容：一是私有财产权，即公民个人所有的以财 产利益为内容，直接体现财产利益的民事权 利；二是继承权，是指继承人依法取得被继承 人遗产的资格。B 错误。"},
  {id:1023,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"在现代法治社会，人们行使任何权利、做任何事情都不能超越法律界限。行使权利要",options:["A. 符合权利行使的目的","B. 符合权利行使的限度","C. 符合权利行使的方式","D. 符合权利行使的程序"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:1024,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"除了在各个部门法中规定了公民的法律义务外，我国宪法特别规定了公民的基本义务。公民未 能依法履行义务，根据情节轻重，应当承担相应的法律责任。法律责任包括",options:["A. 民事责任","B. 行政责任","C. 刑事责任","D. 社会责任"],answer:"ABC",explanation:"（本题解析见原书解析分册）"},
  {id:1025,chapter:"思修",sub:"思想道德与法治",type:"multi",question:"尊重法律权威的基本要求是",options:["A. 信仰法律","B. 遵守法律","C. 服从法律","D. 维护法律"],answer:"ABCD",explanation:"· 分 析 三 、"},
];

// ===== 应用状态 =====
let state = {
  currentIdx: 0,
  filtered: [],
  isRandom: false,
  selectedAnswers: [],
  answered: {},
  wrong: {},
  wrongDates: {}, // qid -> 'YYYY-MM-DD' 最近一次答错的日期
  favorites: {},
  chapterFilter: 'all',
  review: null     // {ids:[], idx, total, mastered, stillWrong, doneIds:Set, prev:{filtered,currentIdx,isRandom,chapterFilter}}
};

// ===== 初始化 =====
function init() {
  loadState();
  buildChapterSelect();
  applyFilter();
  renderQuestion();
  updateStats();
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('xxr1000_state') || '{}');
    if (s.answered) state.answered = s.answered;
    if (s.wrong) state.wrong = s.wrong;
    if (s.wrongDates) state.wrongDates = s.wrongDates;
    if (s.favorites) state.favorites = s.favorites;
    if (s.chapterFilter) state.chapterFilter = s.chapterFilter;
  } catch(e) {}
}

function saveState() {
  localStorage.setItem('xxr1000_state', JSON.stringify({
    answered: state.answered,
    wrong: state.wrong,
    wrongDates: state.wrongDates,
    favorites: state.favorites,
    chapterFilter: state.chapterFilter
  }));
}

function buildChapterSelect() {
  const chapters = [...new Set(Q.map(q => q.chapter))];
  const sel = document.getElementById('chapter');
  sel.innerHTML = '<option value="all">全部章节</option>';
  chapters.forEach(c => {
    sel.innerHTML += `<option value="${c}">${c}</option>`;
  });
  sel.value = state.chapterFilter;
  sel.onchange = () => {
    state.chapterFilter = sel.value;
    state.currentIdx = 0;
    applyFilter();
    renderQuestion();
    saveState();
  };
}

function applyFilter() {
  let list = [...Q];
  if (state.chapterFilter !== 'all') {
    list = list.filter(q => q.chapter === state.chapterFilter);
  }
  if (state.isRandom) {
    list = shuffle(list);
  }
  state.filtered = list;
  if (state.currentIdx >= list.length) state.currentIdx = 0;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---- 日期工具 & 统一判题 ----
function dateStr(offsetDays) {
  const d = new Date();
  d.setDate(d.getDate() + (offsetDays || 0));
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

// 统一记录一次作答：更新已答/错题/错题日期，并追踪复习进度
function recordAnswer(q, userAnswer, isCorrect) {
  state.answered[q.id] = { userAnswer, isCorrect };
  if (isCorrect) {
    delete state.wrong[q.id];
    delete state.wrongDates[q.id];
  } else {
    state.wrong[q.id] = true;
    state.wrongDates[q.id] = dateStr(0);
  }
  if (state.review) trackReview(q.id, isCorrect);
  saveState();
}

function disableOpts() {
  document.querySelectorAll('#q-opts input').forEach(i => i.disabled = true);
}

// ===== 昨日错题复习 =====
function startReview() {
  if (state.review) return;
  const y = dateStr(-1);
  const ids = Q.filter(q => state.wrongDates && state.wrongDates[q.id] === y).map(q => q.id);
  if (ids.length === 0) {
    alert('昨天（' + y + '）没有错题，先去刷题吧！');
    return;
  }
  state.review = {
    ids,
    idx: 0,
    total: ids.length,
    mastered: 0,
    stillWrong: 0,
    doneIds: new Set(),
    prev: { filtered: state.filtered.slice(), currentIdx: state.currentIdx, isRandom: state.isRandom, chapterFilter: state.chapterFilter }
  };
  state.filtered = ids.map(id => Q.find(q => q.id === id)).filter(Boolean);
  state.currentIdx = 0;
  document.getElementById('chapter').disabled = true;
  document.getElementById('review-bar').classList.add('show');
  updateReviewBar();
  renderQuestion();
  updateStats();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function trackReview(qid, isCorrect) {
  const r = state.review;
  if (!r) return;
  r.doneIds.add(qid);
  if (isCorrect) r.mastered++; else r.stillWrong++;
  document.getElementById('review-mastered').textContent = r.mastered;
}

function updateReviewBar() {
  const r = state.review;
  if (!r) return;
  document.getElementById('review-progress').textContent = (r.idx + 1) + '/' + r.total;
  document.getElementById('review-mastered').textContent = r.mastered;
}

function finishReview(showSummary) {
  const r = state.review;
  if (!r) return;
  // 复习中跳过的题：仍算错题并排到明天的复习
  r.ids.forEach(id => {
    if (!r.doneIds.has(id) && state.wrong[id]) state.wrongDates[id] = dateStr(0);
  });
  const summary = showSummary ? '📅 昨日错题复习完成！共 ' + r.total + ' 题：\n' +
    '✅ 已掌握 ' + r.mastered + ' 题\n' +
    (r.stillWrong > 0 ? '❌ 仍需巩固 ' + r.stillWrong + ' 题（已排入明日复习）\n' : '') +
    (r.total - r.doneIds.size > 0 ? '⏭ 跳过 ' + (r.total - r.doneIds.size) + ' 题（已排入明日复习）\n' : '') : null;
  state.review = null;
  state.filtered = r.prev.filtered.slice();
  state.currentIdx = 0;
  state.isRandom = r.prev.isRandom;
  state.chapterFilter = r.prev.chapterFilter;
  document.getElementById('chapter').value = state.chapterFilter;
  document.getElementById('chapter').disabled = false;
  document.getElementById('review-bar').classList.remove('show');
  saveState();
  applyFilter();
  renderQuestion();
  updateStats();
  if (summary) alert(summary);
}

function exitReview() {
  finishReview(false);
}

function toggleRandom() {
  if (state.review) return;
  state.isRandom = !state.isRandom;
  state.currentIdx = 0;
  applyFilter();
  renderQuestion();
  updateStats();
}

// ===== 渲染题目 =====
function renderQuestion() {
  if (state.filtered.length === 0) {
    document.getElementById('q-body').innerHTML = '<p style="color:#999;">该章节暂无题目</p>';
    document.getElementById('q-opts').innerHTML = '';
    document.getElementById('q-result').className = 'result';
    document.getElementById('q-exp').className = 'explanation';
    document.getElementById('btn-submit').style.display = 'none';
    document.getElementById('btn-next').style.display = 'none';
    document.getElementById('btn-exp').style.display = 'none';
    return;
  }

  const q = state.filtered[state.currentIdx];
  const isDone = !state.review && !!state.answered[q.id];

  document.getElementById('q-type').textContent = q.type === 'single' ? '单选题' : '多选题';
  document.getElementById('q-type').className = 'q-badge ' + (q.type === 'single' ? 'single' : 'multi');
  document.getElementById('q-chapter').textContent = q.chapter + ' · ' + q.sub;
  document.getElementById('q-body').textContent = (state.currentIdx + 1) + ' / ' + state.filtered.length + '. ' + q.question;
  document.getElementById('btn-fav').className = 'q-btn' + (state.favorites[q.id] ? ' fav' : '');

  // 渲染选项
  const optsDiv = document.getElementById('q-opts');
  const inputType = q.type === 'single' ? 'radio' : 'checkbox';
  optsDiv.innerHTML = q.options.map((opt, i) => {
    const letter = String.fromCharCode(65 + i);
    return `<li><label class="opt-label" id="opt-${i}"><input type="${inputType}" name="answer" value="${letter}" onchange="onSelect(this)">${opt}</label></li>`;
  }).join('');

  // 重置结果
  const resultDiv = document.getElementById('q-result');
  resultDiv.className = 'result';
  resultDiv.innerHTML = '';
  document.getElementById('q-exp').className = 'explanation';
  document.getElementById('q-exp').innerHTML = '';

  // 按钮
  document.getElementById('btn-submit').style.display = isDone ? 'none' : (q.type === 'multi' ? 'inline-block' : 'none');
  document.getElementById('btn-next').style.display = 'inline-block';
  document.getElementById('btn-exp').style.display = isDone ? 'inline-block' : 'none';

  state.selectedAnswers = [];

  // 如果已答题，显示之前的结果
  if (isDone && state.answered[q.id]) {
    const prev = state.answered[q.id];
    showResult(prev.userAnswer, prev.isCorrect);
    // 预选选项
    prev.userAnswer.forEach(letter => {
      const idx = letter.charCodeAt(0) - 65;
      const el = document.getElementById('opt-' + idx);
      if (el) {
        el.classList.add(prev.isCorrect ? 'correct' : 'wrong');
        const input = el.querySelector('input');
        if (input) input.checked = true;
      }
    });
    // 也标记正确答案
    q.answer.split('').forEach(letter => {
      const idx = letter.charCodeAt(0) - 65;
      const el = document.getElementById('opt-' + idx);
      if (el) el.classList.add('correct');
    });
  }
  if (isDone) disableOpts();
}

function onSelect(input) {
  const cur = state.filtered[state.currentIdx];
  if (!cur) return;
  // 已答过且不在复习模式时不允许重做（复习模式允许重做昨日错题）
  if (!state.review && state.answered[cur.id]) return;
  const q = cur;
  if (q.type === 'single') {
    // 单选立即判定
    const answer = input.value;
    const isCorrect = answer === q.answer;
    recordAnswer(q, [answer], isCorrect);
    showResult([answer], isCorrect);
    // 标记选项
    document.querySelectorAll('#q-opts label').forEach(l => l.classList.remove('sel', 'correct', 'wrong'));
    q.answer.split('').forEach(letter => {
      const idx = letter.charCodeAt(0) - 65;
      const el = document.getElementById('opt-' + idx);
      if (el) el.classList.add('correct');
    });
    if (!isCorrect) {
      const idx = answer.charCodeAt(0) - 65;
      const el = document.getElementById('opt-' + idx);
      if (el) el.classList.add('wrong');
    }
    disableOpts();
    document.getElementById('btn-submit').style.display = 'none';
    document.getElementById('btn-exp').style.display = 'inline-block';
    updateStats();
  } else {
    // 多选记录选择
    const label = input.closest('label');
    if (input.checked) {
      state.selectedAnswers.push(input.value);
      label.classList.add('sel');
    } else {
      state.selectedAnswers = state.selectedAnswers.filter(a => a !== input.value);
      label.classList.remove('sel');
    }
  }
}

function submitAnswer() {
  const q = state.filtered[state.currentIdx];
  if (!q || q.type !== 'multi') return;
  if (!state.review && state.answered[q.id]) return;

  const userAnswer = [...state.selectedAnswers].sort();
  const correctAnswer = q.answer.split('').sort();
  const isCorrect = userAnswer.join('') === correctAnswer.join('');

  recordAnswer(q, userAnswer, isCorrect);
  showResult(userAnswer, isCorrect);

  // 标记选项
  document.querySelectorAll('#q-opts label').forEach(l => l.classList.remove('sel', 'correct', 'wrong'));
  correctAnswer.forEach(letter => {
    const idx = letter.charCodeAt(0) - 65;
    const el = document.getElementById('opt-' + idx);
    if (el) el.classList.add('correct');
  });
  userAnswer.forEach(letter => {
    if (!correctAnswer.includes(letter)) {
      const idx = letter.charCodeAt(0) - 65;
      const el = document.getElementById('opt-' + idx);
      if (el) el.classList.add('wrong');
    }
  });
  disableOpts();

  document.getElementById('btn-submit').style.display = 'none';
  document.getElementById('btn-exp').style.display = 'inline-block';
  updateStats();
}

function showResult(userAnswer, isCorrect) {
  const q = state.filtered[state.currentIdx];
  const resultDiv = document.getElementById('q-result');
  resultDiv.className = 'result show ' + (isCorrect ? 'right' : 'wrong');
  resultDiv.innerHTML = isCorrect
    ? '✅ 回答正确！答案：' + q.answer
    : '❌ 回答错误！你的答案：' + (userAnswer && userAnswer.length ? userAnswer.join('') : '（未作答）') + '，正确答案：' + q.answer;

  // 每做完一题自动展开解析
  const exp = document.getElementById('q-exp');
  exp.innerHTML = '<strong>📖 解析：</strong>' + q.explanation;
  exp.classList.add('show');
  const btn = document.getElementById('btn-exp');
  if (btn) {
    btn.style.display = 'inline-block';
    btn.textContent = '📖 收起解析';
  }
}

function toggleExp() {
  const exp = document.getElementById('q-exp');
  const showing = exp.classList.toggle('show');
  const btn = document.getElementById('btn-exp');
  if (btn) btn.textContent = showing ? '📖 收起解析' : '📖 查看解析';
}

function nextQuestion() {
  // 复习模式下走到最后则结束复习
  if (state.review) {
    const r = state.review;
    if (r.idx < r.ids.length - 1) {
      r.idx++;
      state.currentIdx = r.idx;
      updateReviewBar();
      renderQuestion();
      updateStats();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    finishReview(true);
    return;
  }
  if (state.currentIdx < state.filtered.length - 1) {
    state.currentIdx++;
  } else {
    state.currentIdx = 0;
  }
  renderQuestion();
  updateStats();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleFav() {
  const q = state.filtered[state.currentIdx];
  if (!q) return;
  if (state.favorites[q.id]) {
    delete state.favorites[q.id];
  } else {
    state.favorites[q.id] = true;
  }
  saveState();
  document.getElementById('btn-fav').className = 'q-btn' + (state.favorites[q.id] ? ' fav' : '');
  updateStats();
}

// ===== 统计 =====
function updateStats() {
  const done = Object.keys(state.answered).length;
  const ok = Object.values(state.answered).filter(a => a.isCorrect).length;
  const fav = Object.keys(state.favorites).length;
  const total = Q.length;
  const rate = done > 0 ? Math.round(ok / done * 100) : 0;

  document.getElementById('st-done').textContent = done + '/' + total;
  document.getElementById('st-ok').textContent = ok;
  document.getElementById('st-rate').textContent = rate + '%';
  document.getElementById('st-fav').textContent = fav;
  document.getElementById('progress-bar').style.width = (done / total * 100) + '%';
  document.getElementById('pct').textContent = Math.round(done / total * 100) + '%';
}

// ===== 错题本 =====
function showWrong() {
  const wrongIds = Object.keys(state.wrong);
  const wrongQs = Q.filter(q => wrongIds.includes(String(q.id)));
  if (wrongQs.length === 0) {
    alert('暂无错题！');
    return;
  }
  showModal('❌ 错题本 (' + wrongQs.length + '题)', wrongQs.map(q => {
    const a = state.answered[q.id];
    return `<div style="margin-bottom:16px;padding:12px;background:#f8f9fa;border-radius:8px;">
      <b>[${q.chapter}] ${q.type==='single'?'单选':'多选'}</b><br>
      ${q.question}<br>
      <span style="color:#e63946;">你的答案：${a.userAnswer.join('')}</span> |
      <span style="color:#2ec4b6;">正确答案：${q.answer}</span><br>
      <small>${q.explanation}</small>
    </div>`;
  }).join(''));
}

function showFavorites() {
  const favIds = Object.keys(state.favorites);
  const favQs = Q.filter(q => favIds.includes(String(q.id)));
  if (favQs.length === 0) {
    alert('暂无收藏！');
    return;
  }
  showModal('⭐ 收藏夹 (' + favQs.length + '题)', favQs.map(q => {
    return `<div style="margin-bottom:16px;padding:12px;background:#f8f9fa;border-radius:8px;">
      <b>[${q.chapter}] ${q.type==='single'?'单选':'多选'}</b><br>
      ${q.question}<br>
      <span style="color:#2ec4b6;">正确答案：${q.answer}</span><br>
      <small>${q.explanation}</small>
    </div>`;
  }).join(''));
}

function showModal(title, body) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function resetAll() {
  if (confirm('确定要重置所有做题数据吗？这将清除进度、错题、错题日期、收藏和复习会话。')) {
    state.answered = {};
    state.wrong = {};
    state.wrongDates = {};
    state.favorites = {};
    state.review = null;
    state.currentIdx = 0;
    state.isRandom = false;
    state.chapterFilter = 'all';
    document.getElementById('chapter').value = 'all';
    document.getElementById('chapter').disabled = false;
    document.getElementById('review-bar').classList.remove('show');
    saveState();
    applyFilter();
    renderQuestion();
    updateStats();
  }
}

// ===== 键盘快捷键 =====
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' && !e.ctrlKey && !e.metaKey) {
    nextQuestion();
  }
  if (e.key === 'e' && e.ctrlKey) {
    e.preventDefault();
    toggleExp();
  }
});

// ===== 启动 =====
init();
</script>
</body>
