  {id:499,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"多民族是我国的一大特色，也是我国发展的一大有利因素。中华民族和各民族的关系，是一个 大家庭和家庭成员的关系，各民族的关系是一个大家庭里不同成员的关系。民族团结之本是",options:["A. 民族区域自治制度","B. 各民族共同团结奋斗、共同繁荣发展","C. 保障少数民族当家作主，管理本民族、本地区事务的权利","D. 中华民族共同体意识"],answer:"D",explanation:"民族团结是我国各族人民的生命线， 中华民族共同体意识是民族团结之本。D 正 确，A、B、C错误。"},
  {id:500,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"统一战线是中国共产党夺取革命、建设、改革事业胜利的重要法宝，也是实现中华民族伟大复 兴的重要法宝。统战工作的本质要求是",options:["A. 大团结大联合","B. 围绕中心、服务大局","C. 在尊重多样性中寻求一致性","D. 统一思想"],answer:"A",explanation:"统战工作的本质要求是大团结大联 合，解决的是人心和力量问题。A 正确。统 战工作的关键是要坚持求同存异，发扬“团 结—批评—团结”的优良传统，在尊重多样性 中寻求一致性，找到最大公约数、画出最大同 心圆。B、C、D错误。"},
  {id:501,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"统一战线是凝聚人心、汇聚力量的强大法宝。统一战线最鲜明的特征(或：统一战线最核心最 根本的问题) 是",options:["A. 人民至上","B. 求同存异","C. 党的领导","D. 团结奋斗"],answer:"C",explanation:"党的领导是统一战线最鲜明的特征。 坚持党的领导是统一战线最核心最根本的问 题。C 正确。"},
  {id:502,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"新时代，统一战线面临的时和势、肩负的使命和任务发生了重大变化。新时代爱国统一战线的 历史责任是",options:["A. 高举爱国主义、社会主义旗帜","B. 促进中华儿女大团结","C. 坚持和完善中国特色社会主义制度","D. 巩固和维护国家安全的民心基础"],answer:"B",explanation:"（本题解析见原书解析分册）"},
  {id:503,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"习近平指出：“全面推进依法治国，必须走对路。如果路走错了，南辕北辙了，那再提什么要求 和举措也都没有意义了。”我们党领导人民长期探索走出的中国特色社会主义法治道路，是全面 依法治国的唯一正确道路。中国特色社会主义法治之魂是",options:["A. 依法治国和以德治国相结合","B. 以人民为中心","C. 党的领导","D. 法律面前人人平等"],answer:"C",explanation:"坚持和拓展中国特色社会主义法治道 路是一个深入探索和不断实践的过程，必须 毫不动摇坚持以下原则：坚持中国共产党的 领导，坚持以人民为中心，坚持法律面前人人 平等，坚持依法治国和以德治国相结合，坚持 从中国实际出发。党的领导是中国特色社会 主义法治之魂，是我们的法治同西方资本主 义国家的法治最大的区别。C 正确。"},
  {id:504,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"全面依法治国是“四个全面”战略布局的重要内容之一。推进全面依法治国，根本目的是",options:["A. 依法保障人民权益","B. 努力让人民群众在每一个司法案件中感受到公平正义","C. 提高依法执政水平","D. 保证法律面前人人平等"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:505,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"走中国特色社会主义法治道路，必须坚持法律面前人人平等。平等是",options:["A. 推进全面依法治国的根本目的","B. 我们的法治同西方资本主义国家的法治最大的区别","C. 社会主义法律的基本属性","D. 全面依法治国的关键"],answer:"C",explanation:"平等是社会主义法律的基本属性，C 正 确。推进全面依法治国，根本目的是依法保 障人民权益，A 错误。党的领导是中国特色 社会主义法治之魂，是我们的法治同西方资 本主义国家的法治最大的区别，B 错误。严 格执法是全面依法治国的关键，D错误。"},
  {id:506,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"全面推进依法治国涉及很多方面，在实际工作中必须有一个总揽全局、牵引各方的总抓手，这 个总抓手就是",options:["A. 建设中国特色社会主义法治体系","B. 建设社会主义法治国家","C. 坚持依法治国、依法执政、依法行政共同推进","D. 坚持法治国家、法治政府、法治社会一体建设"],answer:"A",explanation:"习近平指出：“全面推进依法治国涉及 很多方面，在实际工作中必须有一个总揽全 局、牵引各方的总抓手，这个总抓手就是建设 中国特色社会主义法治体系。依法治国各项 工作都要围绕这个总抓手来谋划、来推进。” A正确。建设中国特色社会主义法治体系， 建设社会主义法治国家，是全面推进依法治 国的总目标；坚持依法治国、依法执政、依法 行政共同推进，坚持法治国家、法治政府、法 治社会一体建设，坚持统筹推进国内法治和 涉外法治，是法治中国建设的工作布局。B 、 C、D 错误。"},
  {id:507,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"坚持依法治国首先要坚持依宪治国，坚持依法执政首先要坚持依宪执政。坚持依宪治国、依宪 执政，作为首要任务的是",options:["A. 全面贯彻实施宪法","B. 法治国家建设","C. 法治社会建设","D. 法治政府建设"],answer:"A",explanation:"· 考研政治1000题 解析分册"},
  {id:508,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"全面依法治国是国家治理的一场深刻革命，关系党执政兴国，关系人民幸福安康，关系党和国 家长治久安。全面依法治国的重点任务和主体工程是",options:["A. 法治国家建设","B. 法治政府建设","C. 法治社会建设","D. 依法行政"],answer:"B",explanation:"法治国家是法治建设的目标，法治政府 建设是全面依法治国的重点任务和主体工程， 法治社会是构筑法治国家的基础。B 正确。 大文明。中华文明的连续性，从根本上决定 了中华民族必然走自己的路。如果不从源远 流长的历史连续性来认识中国，就不可能理 解古代中国，也不可能理解现代中国，更不可 能理解未来中国。D 正确。中华文明的统一 性，从根本上决定了中华民族各民族文化融 为一体、即使遭遇重大挫折也牢固凝聚，决定 了国土不可分、国家不可乱、民族不可散、文 明不可断的共同信念，决定了国家统一永远 是中国核心利益的核心，决定了一个坚强统 一的国家是各族人民的命运所系。 A、B 错 误。中华文明的创新性，从根本上决定了中 华民族守正不守旧、尊古不复古的进取精神， 决定了中华民族不惧新挑战、勇于接受新事 物的无畏品格。C 错误。"},
  {id:509,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"文化是一个国家、一个民族的灵魂。国家的富强，民族的振兴，无不伴随着文化的历史性进步。 建设社会主义文化强国，推动社会主义文化繁荣兴盛，关键在于",options:["A. 坚定中国特色社会主义文化自信","B. 坚持马克思主义在意识形态领域的指导地位","C. 以社会主义核心价值观引领文化建设","D. 缩小城乡公共文化服务差距"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:510,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"哲学社会科学是人们认识世界、改造世界的重要工具，是推动历史发展和社会进步的重要力量。 当代中国哲学社会科学区别于其他哲学社会科学的根本标志是",options:["A. 坚持以马克思主义为指导","B. 坚持正确的政治方向","C. 坚持党性原则","D. 坚持以人民为中心"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:511,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"电影《南京照相馆》上映13天，票房超过17亿元。调查显示，《南京照相馆》的观众满意度 居2025年电影首位。《南京照相馆》的表达，“新”在摆脱了宏大叙事容易“见事不见人”的 窠臼，开阔了对主旋律和重大题材的理解。该片集中笔墨“写”普通人在生死关头的大义与坚 守，及其背后的精神脉络与人文底色。电影主创以正确的二战史观、严肃的创作态度，传递当 代青年对历史真相的探求与思考，唤起全民族共同记忆，有力呼应了中国人民抗日战争暨世界 反法西斯战争胜利80周年的重大主题。《南京照相馆》的成功启示我们，创新创造是",options:["A. 繁荣发展社会主义文化的重要方针","B. 文化的生命所在、文化的本质特征","C. 推动社会主义文化繁荣兴盛的唯一正确道路","D. 决定社会主义文化事业前途命运的关键"],answer:"B",explanation:")创新创造是文化的生命所在，是文化 的本质特征。B 正确。坚持百花齐放、百家 争鸣，是繁荣发展社会主义文化的重要方针； 中国特色社会主义文化发展道路，是推动社 会主义文化繁荣兴盛的唯一正确道路；坚持 为人民服务、为社会主义服务的根本方向，是 决定社会主义文化事业前途命运的关键。A、 C、D错误。"},
  {id:512,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"中华文明具有突出的连续性，是世界上唯一绵延不断且以国家形态发展至今的伟大文明。中华 文明的连续性，从根本上决定了",options:["A. 国家统一永远是中国核心利益的核心","B. 国土不可分、国家不可乱、民族不可散、文明不可断的共同信念","C. 中华民族不惧新挑战、勇于接受新事物的无畏品格","D. 中华民族必然走自己的路"],answer:"D",explanation:"中华文明具有突出的连续性，是世界 上唯一绵延不断且以国家形态发展至今的伟 100 改善民生的重要方针。A 正确。坚守底线、 突出重点、完善制度、引导预期，是保障和改 善民生的工作思路；坚持人人尽责、人人享 有，让所有劳动者在推动发展中分享发展成 果，是保障和改善民生的重要原则；解决人民 群众最关心、最直接、最现实的利益问题，是 保障和改善民生的重中之重。B、C、D 错误。"},
  {id:513,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"随着我国社会主要矛盾的转化，人民对美好生活的向往越来越强烈，对精神文化生活更加看重， 文化需求高品质、个性化的特点更加明显。满足人民精神文化需求、保障人民文化权益的基本 途径是",options:["A. 繁荣发展文化事业和文化产业","B. 推动中华优秀传统文化创造性转化、创新性发展","C. 提升国家文化软实力","D. 保护好、传承好文化遗产"],answer:"A",explanation:"文化自信是更基础、更广泛、更深厚的 自信，是一个国家、一个民族发展中最基本、最 深沉、最持久的力量。建设社会主义文化强 国、推动社会主义文化繁荣兴盛，关键在于坚 定中国特色社会主义文化自信。习近平强调： “没有高度的文化自信，没有文化的繁荣兴盛， 就没有中华民族伟大复兴。”A正确。 ·"},
  {id:514,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"全面建设社会主义现代化国家，是一项伟大而艰巨的事业，前途光明，任重道远。全面建设社 会主义现代化国家，出发点和落脚点是",options:["A. 让人民生活越过越好","B. 国家富强、民族振兴","C. 国家长治久安、社会安定有序","D. 解放和增强社会活力"],answer:"A",explanation:"全面建设社会主义现代化国家，出发 点和落脚点是让人民生活越过越好。A 正 确，B、C、D错误。"},
  {id:515,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"改革、发展、稳定是我国社会主义现代化建设的三个重要支点。其中，发展是解决一切经济社 会问题的关键。发展的根本目的是",options:["A. 消除绝对贫困","B. 增进民生福祉","C. 跳出历史周期率","D. 促进社会稳定"],answer:"B",explanation:"（本题解析见原书解析分册）"},
  {id:516,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"民生事关人民的生存生活生计，事关民心所向、民情所系、民意所指，决定党的事业成败和国 家命运兴衰。保障和改善民生的重要方针是",options:["A. 坚持尽力而为、量力而行","B. 坚守底线、突出重点","C. 完善制度、引导预期","D. 坚持人人尽责、人人享有"],answer:"A",explanation:"坚持尽力而为、量力而行，是保障和 坚持正确的政治方向是做好新闻舆论 工作的第一位要求。新闻舆论工作有鲜明的 意识形态属性。党性原则是新闻舆论工作的 根本原则，坚持党性原则最根本的是坚持党 对新闻舆论工作的领导。D 正确。"},
  {id:517,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"改善民生、实现发展成果由人民共享最重要最直接的方式是",options:["A. 稳就业","B. 城镇化","C. 社会保障","D. 收入分配"],answer:"D",explanation:"收入分配是民生之源，是改善民生、 实现发展成果由人民共享最重要最直接的方 式 。D正确。就业是最基本的民生，是劳动者 赖以生存和发展的基础、共享经济发展成果的 基本条件；社会保障是保障和改善民生、维护 社会公平、增进人民福祉的基本制度保障，是 促进经济社会发展、实现广大人民群众共享改 革发展成果的重要制度安排。A、B、C错误。"},
  {id:518,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"实现共同富裕不仅是经济问题，而且是关系党的执政基础的重大政治问题。促进共同富裕的基 础性制度是",options:["A. 社会保障制度","B. 分配制度","C. 基本养老保险制度","D. 以人民为中心的法律制度"],answer:"B",explanation:"（本题解析见原书解析分册）"},
  {id:519,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"经过接续奋斗。我国社会建设全面加强，人民安居乐业、社会安定有序的良好局面不断巩固发 展，人民对美好生活的向往不断变为现实。新时代加强社会建设的重要着力点是",options:["A. 健全和完善社会保障体系","B. 正确把握民生和发展的关系","C. 全面推进健康中国建设","D. 防范化解重大风险"],answer:"A",explanation:"健全和完善社会保障体系是新时代加 强社会建设的重要着力点。A 正确。正确把 握民生和发展的关系，是保障和改善民生的 重要前提。B、C、D 错误。"},
  {id:520,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"生态环境变化直接影响文明的兴衰演替。生态环境问题归根到底是",options:["A. 政府与市场的关系问题","B. 人与社会的关系问题","C. 人与人的关系问题","D. 经济发展方式和生活方式问题"],answer:"D",explanation:"（本题解析见原书解析分册）"},
  {id:521,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"生态兴则文明兴，生态衰则文明衰。生态环境是人类生存最为基础的条件，生态文明建设是关 系中华民族永续发展的根本大计。解决生态环境问题的治本之策是",options:["A. 资源循环利用","B. 绿色低碳发展","C. 产业结构优化升级","D. 严守生态保护红线"],answer:"B",explanation:"绿色发展是新发展理念的重要内容，是 发展观的一场深刻革命。要加快推动发展方 式绿色低碳转型，坚持把绿色低碳发展作为 解决生态环境问题的治本之策，加快形成绿 色生产方式和生活方式，厚植高质量发展的 绿色底色。B 正确。"},
  {id:522,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"实现碳达峰碳中和，是中国站在对人类文明负责的高度，基于实现可持续发展的内在要求作出 的重大决策部署。实现碳达峰碳中和的关键是",options:["A. 大力推进循环经济","B. 实施节能降碳增效行动","C. 能源绿色低碳转型","D. 巩固提升碳汇能力"],answer:"C",explanation:"国务院新闻办公室于2025年11 月 8日发布《碳达峰碳中和的中国行动》白皮 书。白皮书指出，能源活动是碳排放的最主 要来源，能源绿色低碳转型是实现碳达峰碳 中和的关键。节能是从源头减少碳排放的重 要抓手，循环经济对碳减排具有重要促进作 用，生态系统碳汇是实现减排固碳的重要途 径。中国深入实施节能降碳增效行动、循环 经济助力降碳行动、碳汇能力巩固提升行动， 取得积极成效。C 正确。"},
  {id:523,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"总体国家安全观，既回答了如何解决好大国发展进程中面临的共性安全问题，同时又回答了如 何解决好中华民族伟大复兴关键时期面临的特殊安全问题，系统提出了一系列具有原创性、时 代性的重要观点，为破解我国国家安全面临的难题、推进新时代国家安全工作提供了基本遵循。 新时代中国国家安全的生命线是",options:["A. 人民安全","B. 政治安全","C. 坚守维护国家利益准则","D. 防范化解国家安全风险"],answer:"B",explanation:"国务院新闻办公室于2025年5月 12日发布了《新时代的中国国家安全》白皮 书。白皮书指出，人民安全是总体国家安全 观坚持的宗旨，是新时代中国国家安全的根 本立场。政治安全是新时代中国国家安全的 生命线(也是总体国家安全观的根本)。政 治安全的核心是政权安全和制度安全，最根 本的就是维护中国共产党的领导和执政地 位、维护中国特色社会主义制度。B 正确，A 错误。坚守维护国家利益准则，这是新时代 中国国家安全的基本要求。中国维护国家安 全，主要是维护国家利益尤其是核心利益。 · 1000题 解析分册 中国核心利益主要包括：国家政权、主权、统 一和领土完整、人民福祉、经济社会可持续发 展。C 错误。防范化解国家安全风险，这是 新时代中国国家安全的中心任务。D 错误。"},
  {id:524,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"构建新发展格局是事关全局的系统性、深层次变革，是立足当前、着眼长远的战略谋划，是适 应我国发展新阶段要求、塑造国际合作和竞争新优势的必然选择。构建新发展格局的重要前提 和保障是",options:["A. 主动塑造于我有利的外部安全环境","B. 夯实我国经济发展的根基","C. 统筹维护国家安全各类要素、各个领域、各方资源、各种手段","D. 牢牢守住安全发展这条底线"],answer:"D",explanation:"（本题解析见原书解析分册）"},
  {id:525,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"构建新安全格局是应对国家安全形势新变化、新趋势的战略选择。要坚定不移走中国特色国家 安全道路，加快构建统筹各领域安全的新安全格局。应对各领域安全风险挑战的首要任务是",options:["A. 维护国土安全","B. 维护政治安全","C. 维护社会安全","D. 维护粮食安全"],answer:"B",explanation:"（本题解析见原书解析分册）"},
  {id:526,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"总体国家安全观以人民安全为宗旨，以政治安全为根本，实现政治安全、人民安全、国家利益 至上有机统一。其中，居于中心地位的是",options:["A. 政治安全","B. 人民安全","C. 国家利益至上","D. 确保实现党的长期执政、人民安居乐业、国家长治久安"],answer:"B",explanation:"政治安全是维护人民安全和国家利益 的根本保证；人民安全居于中心地位，国家安 全归根到底是保障人民利益；国家利益至上 是实现政治安全和人民安全的要求和原则。 要把政治安全、人民安全、国家利益至上三者 统一起来，确保实现党的长期执政、人民安居 乐业、国家长治久安。B正确，A、C、D 错误。 ·"},
  {id:527,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"构建新安全格局是全面贯彻落实总体国家安全观的重大举措。构建统筹各领域安全的新安全格 局的主阵地、主战场是",options:["A. 维护意识形态安全","B. 维护制度安全","C. 维护政权安全","D. 维护重点领域国家安全"],answer:"D",explanation:"构建统筹各领域安全的新安全格局， 维护重点领域国家安全是主阵地、主战场。 D正确。维护政治安全是应对各领域安全风 险挑战的首要任务。政治安全涉及国家主 权、政权、制度和意识形态的稳固，A、B、C 都 属于维护政治安全的内容，不符合题意。"},
  {id:528,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"2025年9月3日，纪念中国人民抗日战争暨世界反法西斯战争胜利80周年大会在首都北京隆 重举行。人民军队光荣接受党和人民检阅。阅兵场上， 一系列先进装备震撼亮相：新型坦克、 步兵战车等新一代传统陆战兵器，无人、水下、网电等领域新型作战装备，高超声速导弹、战 略导弹等国之重器……“以武止戈、砥定乾坤”,彰显的是新时代中国发展进步的硬核实力，展 现的是人民军队捍卫和平的强大能力。“能战方能止战，准备打才可能不必打，越不能打越可能 挨打。”这说明，强军兴军，核心是",options:["A. 听党指挥","B. 能打胜仗","C. 作风优良","D. 艰苦奋斗"],answer:"B",explanation:"坚持在中华民族伟大复兴进程中推进 祖国统一，这是统一的历史方位。D 正确。 坚持在祖国大陆发展进步基础上解决台湾问 题，这是统一的战略思路；坚持推动两岸关系 和平发展、融合发展，这是统一的实践途径； 坚持一个中国原则和“九二共识”,这是统一 的政治基础。A、B、C 错误。 听党指挥是灵魂，决定军队建设的政 治方向。 能打胜仗是核心，反映军队的根本 职能和军队建设的根本指向。作风优良是保 证，关系军队的性质、宗旨、本色。B 正确。"},
  {id:529,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"坚持党对人民军队绝对领导的根本制度和根本实现形式是",options:["A. 支部建在连上","B. 政治委员制","C. 军委主席负责制","D. 首长分工负责制"],answer:"C",explanation:"军委主席负责制是坚持党对人民军队 绝对领导的根本制度和根本实现形式，在党 领导军队的一整套制度体系中处于最高层 次、居于统领地位。C 正确。"},
  {id:530,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"党的十八大以来，我们深入推进政治建军理论探索和实践创造，形成了新时代政治建军方略， 明确政治建军是",options:["A. 掌握一切领导的基础","B. 人民军队立军之本","C. 我军胜利法宝","D. 我军的生命线"],answer:"B",explanation:"党的十八大以来，我们深入推进政治 建军理论探索和实践创造，形成了新时代政 治建军方略，明确政治建军是人民军队立军 之本，明确政治工作永远是我军的生命线，明 确政治整训要突出政治上的正本清源，明确 掌握思想领导是掌握一切领导的基础，明确 党的力量来自组织、部队凝聚力战斗力来自 组织，明确枪杆子要始终掌握在对党忠诚可 靠的人手中，明确严才能正纲纪、严才能肃军 威、严才能出战斗力，明确军中绝不能有腐败 分子藏身之地，明确作风优良才能塑造英雄 部队，明确军政军民团结是我军胜利法宝。 (“十个明确”)B 正确，A、C、D错误。"},
  {id:531,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"“一国两制”是中国共产党领导人民实现祖国和平统一的伟大构想。“一国两制”方针的最高原 则是",options:["A. 维护国家主权、安全、发展利益","B. 实现祖国和平统一","C. 确保中华民族伟大复兴进程不被迟滞甚至中断","D. 政权必须掌握在爱国者手中"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:532,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"新时代党解决台湾问题的总体方略内涵丰富、逻辑严密、系统完备，深刻回答了推进祖国统一 的一系列重大理论和实践问题，是我们党对台大政方针的继承发展和集大成。其中，作为统一 的历史方位的是",options:["A. 坚持在祖国大陆发展进步基础上解决台湾问题","B. 坚持一个中国原则和“九二共识”","C. 坚持推动两岸关系和平发展、融合发展","D. 坚持在中华民族伟大复兴进程中推进祖国统一"],answer:"D",explanation:"（本题解析见原书解析分册）"},
  {id:533,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"在新时代党解决台湾问题的总体方略中，作为统一的战略支撑的是",options:["A. 坚持决不承诺放弃使用武力","B. 坚持粉碎“台独”分裂图谋","C. 坚持团结台湾同胞、争取台湾民心","D. 坚持反对外部势力干涉"],answer:"A",explanation:"坚持团结台湾同胞、争取台湾民心，这 习近平新时代中国特色社会主义思想概论 ·单项选择题 是统一的根本动力；坚持粉碎“台独”分裂图 谋，这是统一的必然要求；坚持反对外部势力 干涉，这是统一的外部条件；坚持决不承诺放 弃使用武力，这是统一的战略支撑。A 正确， B、C、D错误。"},
  {id:534,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"外交工作是党和国家工作全局的重要组成部分。中国特色大国外交牢牢把握的主线是",options:["A. 服务民族复兴、促进人类进步","B. 相互尊重、合作共赢","C. 打造全球伙伴关系、维护多边主义","D. 维护世界和平、促进共同发展"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:535,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"周边是我国安身立命之所、发展繁荣之基。无论从地理方位、自然环境还是相互关系看，周边 对我国都具有极为重要的战略意义。我国始终将周边置于外交全局的首要位置， 秉持的周边外 交理念是",options:["A. 与邻为善、以邻为伴","B. 真实亲诚","C. 亲诚惠容","D. 求同存异、相互尊重、互学互鉴"],answer:"C",explanation:"中国始终将周边置于外交全局的首要 位置，秉持亲诚惠容的周边外交理念，着力深 化互利共赢格局，找准同周边国家互利合作 的战略契合点，构建区域经济一体化新格局， 不断深化区域金融合作。C 正确。与邻为 善、以邻为伴是中国周边外交方针；真实亲诚 是中国加强同发展中国家团结合作的理念： 求同存异、相互尊重、互学互鉴是中国构建新 型政党关系的理念。A、B、D 错误。"},
  {id:536,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"新时代新征程，要继续全面推进我国对外工作，不断开创中国特色大国外交新局面。我国对外 工作的出发点和落脚点是",options:["A. 坚定奉行独立自主的和平外交政策","B. 维护国家主权、安全、发展利益","C. 推动构建人类命运共同体","D. 坚持走和平发展道路"],answer:"B",explanation:"（本题解析见原书解析分册）"},
  {id:537,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"把党的建设作为一项伟大工程来推进，是我们党的一大创举，是我们党领导人民进行伟大社会 革命的重要法宝。党的建设的一贯要求和根本方针是",options:["A. 坚持思想建党和制度治党相统一","B. 坚持党内监督和群众监督相统一","C. 自我净化、自我完善、自我革新、自我提高","D. 党要管党、从严治党"],answer:"D",explanation:"党的建设的一贯要求和根本方针是党 要管党、从严治党，D 正确。A、B 是全面从 严治党六条重要经验的其中两条，不符合题 意。“四个自我”是实现伟大自我革命的重要 途径，C不符合题意。"},
  {id:538,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"把党的建设作为一项伟大工程来推进，是我们党的一大创举，是我们党领导人民进行伟大社会 革命的重要法宝。深入推进党的建设，作为统领的是",options:["A. 政治建设","B. 思想建设","C. 作风建设","D. 制度建设"],answer:"A",explanation:"深入推进新时代党的建设新的伟大工 程，必须注重系统性、整体性、协同性，以政治 建设为统领持续抓好党的各方面建设，不断 提高党的建设质量，为坚持和发展中国特色 社会主义提供坚强政治保证。把政治建设纳 入党的建设总体布局并摆在首位，是新时代 我们党对马克思主义党建理论的重大创新。 A正确。"},
  {id:539,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"党内政治生活的首要任务是",options:["A. 保证全党服从中央","B. 维护党中央权威和集中统一领导","C. 营造良好政治生态、提高政治能力","D. 加强思想教育和理论武装"],answer:"D",explanation:"·"},
  {id:540,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"一颗苹果，照鉴党的优良作风，映照为民造福的初心。2025 年春节前夕，习近平在辽宁考察时 再次提起一个关于苹果的红色故事：辽沈战役期间，锦州乡间的苹果熟了，解放军战士行军路 过 ，虽然饥渴难耐，却一个都没有摘。“毛主席说，‘不吃是很高尚的，而吃了是很卑鄙的，因 为这是人民的苹果’。”总书记的话意味深长，“这样的苹果，我们现在也不能吃。”由此可见， 作风问题的核心是",options:["A. 党同人民群众的关系问题","B. “ 不忘初心、牢记使命”","C. 抓住领导干部这个“关键少数”","D. 推进作风建设常态化长效化"],answer:"A",explanation:"作风问题的核心是党同人民群众的关 系问题。习近平强调：“党的作风正，人民的 心气顺，党和人民就能同甘共苦。”党的作风 关系人心向背。执政党如果不注重作风建 设，听任不正之风侵蚀党的肌体，就有失去民 心、丧失政权的危险。A 正确。"},
  {id:541,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"全面从严治党永远在路上，党的自我革命永远在路上。最彻底的自我革命是",options:["A. 党风廉政建设","B. 让人民来监督政府","C. 建立不忘初心、牢记使命的长效制度","D. 反腐败"],answer:"D",explanation:"（本题解析见原书解析分册）"},
  {id:542,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"治国必先治党，党兴才能国强。党的十八大以来，以习近平同志为核心的党中央以刀刃向内、 刮骨疗毒的勇气，打出了一套自我革命的“组合拳”。开启新时代中国共产党人再塑自身形象的 “第一行动”是",options:["A. 开展反腐败斗争","B. 全面从严治党","C. 中央八项规定","D. 加强党中央对重大工作的领导"],answer:"C",explanation:"2012年12月，党的十八大闭幕后不 久，中央八项规定出台，这是新时代制定的第 一部重要党内法规，是新时代的徙木立信之 举，是改进作风的切入口和动员令，开启新时 代中国共产党人再塑自身形象的“第一行 动”。C 正确。"},
  {id:543,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"中国共产党区别于其他政党的显著标志，也是我们党最大的优势、最鲜明的品格的是",options:["A. 勇于自我革命","B. 密切联系群众","C. 独立自主","D. 守正创新"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:544,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"习近平总书记在二十届中央纪委三次全会上发表重要讲话，系统阐述党的自我革命的重要思想， 科学回答党的自我革命“为什么要”“为什么能”“怎样推进”的重大问题，特别是明确提出 “九个以”的实践要求，为新时代新征程深入推进党的自我革命提供了强大思想武器和科学行动 指南。党的自我革命的根本目的是",options:["A. 跳出历史周期率","B. 解决大党独有难题","C. 引领伟大社会革命","D. 正风肃纪反腐"],answer:"C",explanation:"103 在深入推进党的自我革命实践中需要 把握好九个问题(“九个以”),即：以坚持党 中央集中统一领导为根本保证，以引领伟大 社会革命为根本目的，以习近平新时代中国 特色社会主义思想为根本遵循，以跳出历史 周期率为战略目标，以解决大党独有难题为 主攻方向，以健全全面从严治党体系为有效 途径，以锻造坚强组织、建设过硬队伍为重要 着力点，以正风肃纪反腐为重要抓手，以自我 监督和人民监督相结合为强大动力。C 正 确，A、B、D错误。 ,"},
  {id:545,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"single",question:"以伟大自我革命引领伟大社会革命是新时代中国特色社会主义发展的显著特点。实现伟大自我 革命的重要途径是",options:["A. 自我净化、自我完善、自我革新、自我提高","B. 自我管理、自我服务、自我教育、自我监督","C. 道路自信、理论自信、制度自信、文化自信","D. 政治意识、大局意识、核心意识、看齐意识"],answer:"A",explanation:"勇于自我革命就要同一切影响党的先 进性、弱化党的纯洁性的问题作坚决斗争，实 现自我净化、自我完善、自我革新、自我提 高。“四个自我”是实现伟大自我革命的重要 途径。A正确。基层群众自治制度是社会主 义民主政治建设的基础。要发展基层民主， 保障人民依法直接行使民主权利，实现自我 管理、自我服务、自我教育、自我监督。B 不 符合题意。C“四个自信”和D“四个意识”不 符合题意。"},
  {id:546,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"历史正反两方面的经验表明，“两个结合”是我们取得成功的最大法宝。“结合”不是“拼盘”, 不是简单的“物理反应”,而是深刻的“化学反应”。“结合”的结果是",options:["A. 造就了一个有机统一的新的文化生命体","B. 让马克思主义成为中国的","C. 让中华优秀传统文化成为现代的","D. 让经由“结合”而形成的新文化成为中国式现代化的文化形态"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:547,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"中国共产党的历史就是一部不断推进理论创新、进行理论创造的历史。不断谱写马克思主义中国 化时代化新篇章，是当代中国共产党人的庄严历史责任。继续推进实践基础上的理论创新，首先 要把握好习近平新时代中国特色社会主义思想的世界观和方法论，坚持好、运用好贯穿其中的立 场观点方法，必须",options:["A. 坚持人民至上，坚持自信自立","B. 坚持守正创新，坚持问题导向","C. 坚持系统观念，坚持胸怀天下","D. 坚持党的领导，坚持实事求是"],answer:"ABC",explanation:"A、B、D正确。全人类共同价值是以联 合国宪章为基础和行为准绳的，其理论基础 是共识性的、不是独断性的，实践基础是包容 性的、不是排他性的，反映了世界各国人民普 遍认同的价值理念的最大公约数。C 错误。"},
  {id:548,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"党的十八届六中全会明确了习近平同志党中央的核心、全党的核心地位，党的十九大把习近平新 时代中国特色社会主义思想确立为党必须长期坚持的指导思想。“两个确立”对新时代党和国家 事业发展、对推进中华民族伟大复兴历史进程具有决定性意义。“两个确立”",options:["A. 是党在新时代取得的近大政治成果","B. 反映了全党全军全国各族人民共同心愿","C. 是新时代党和国家事业取得历史性成就、发生历史性变革的决定性因素","D. 是党和人民应对一切不确定性的最大确定性、最大底气、最大保证"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:549,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"改革开放以来，我们取得一切成绩和进步的根本原因，归结起来就是",options:["A. 开辟了中国特色社会主义道路","B. 形成了中国特色社会主义理论体系","C. 确立了中国特色社会主义制度","D. 发展了中国特色社会主义文化"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:550,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"新时代坚持和发展中国特色社会主义，必须坚定道路自信、理论自信、制度自信、文化自信。 坚定文化自信，就是坚信中国特色社会主义文化",options:["A. 积淀着中华民族最深层的精神追求","B. 代表着中华民族独特的精神标识","C. 反映了世界各国人民普遍认同的价值理念的最大公约数","D. 是激励全党全国各族人民奋勇前进的强大精神力量"],answer:"ABD",explanation:"A、B、C 正确。科学发展观创造性地回 答了新形势下“实现什么样的发展、怎样发展” 这一重大问题，D不符合题意。"},
  {id:551,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"坚定中国特色社会主义道路自信、理论自信、制度自信，说到底是要坚定文化自信。文化自信是",options:["A. 更基础、更广泛、更深厚的自信","B. 改革开放以来我们取得一切成绩和进步的根本原因","C. 我们坚定“四个自信”的理论支撑和根本依据","D. 一个国家、一个民族发展中最基本、最深沉、最持久的力量"],answer:"AD",explanation:"A、D 正确。改革开放以来我们取得一 切成绩和进步的根本原因，归结起来就是：开 辟了中国特色社会主义道路，形成了中国特 色社会主义理论体系，确立了中国特色社会 主义制度，发展了中国特色社会主义文化。B 错误。马克思主义深刻揭示了社会主义必然 代替资本主义的客观规律，这是我们坚定“四 个自信”的理论支撑和根本依据。C 错误。"},
  {id:552,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"经过长期努力，中国特色社会主义进入了新时代，这是我国发展新的历史方位。中国特色社会 主义进入了新时代有着充分的依据，它是",options:["A. 我国社会主要矛盾发生新变化的反映","B. 党的主要任务发生新变化的反映","C. 中国和世界关系发生新变化的反映","D. 我国进入新发展阶段的反映"],answer:"ABC",explanation:"A、B、C 正确。习近平指出：“全面建成 小康社会、实现第一个百年奋斗目标之后， 我们要乘势而上开启全面建设社会主义现代 化国家新征程、向第二个百年奋斗目标进军， 这标志着我国进入了一个新发展阶段。”由此 可见，进入新发展阶段是在全面建成小康社会 (2021年)之后，更在中国特色社会主义进入 新时代(2012 年)之后，D错误。"},
  {id:553,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"中国特色社会主义进入新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和 不平衡不充分的发展之间的矛盾。新时代我国社会主要矛盾的变化",options:["A. 是在社会主义初级阶段中发生的变化","B. 是关系全局的历史性变化","C. 没有改变我国仍处于并将长期处于社会主义初级阶段的基本国情","D. 正确反映了我国全面建成小康社会之后的新特点"],answer:"ABC",explanation:"新时代我国社会主要矛盾的变化是关 系全局的历史性变化，但它是在社会主义初 级阶段中发生的变化：没有改变对我国社会 主义所处历史阶段的判断，我国仍处于并将 长期处于社会主义初级阶段的基本国情没有 变，我国是世界最大发展中国家的国际地位 没有变。A、B、C 正确。 我国社会主要矛盾的变化是我们党作出 中国特色社会主义进入新时代重大判断的基 本依据。2012年党的十八大开启了中国特 色社会主义新时代，我国全面建成小康社会 是在2021年，认为我国社会主要矛盾的变化 “正确反映了我国全面建成小康社会之后的 新特点”的说法无疑是错误的。D不选。"},
  {id:554,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"新时代的伟大变革，在党史、新中国史、改革开放史、社会主义发展史、中华民族发展史上具 有的里程碑意义主要有",options:["A. 中国共产党在革命性锻造中更加坚强有力","B. 中国人民的前进动力更加强大、奋斗精神更加昂扬、必胜信念更加坚定","C. 实现中华民族伟大复兴进入不可逆转的历史进程","D. 科学社会主义在21世纪的中国焕发出新的蓬勃生机"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:555,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"中国共产党团结带领中国人民追求民族复兴的历史，也是一部不断探索现代化道路的历史。在 新中国成立特别是改革开放以来长期探索和实践基础上，经过党的十八大以来在理论和实践上 的创新突破，我们成功推进和拓展了中国式现代化。中国式现代化",options:["A. 既基于自身国情、又借鉴各国经验","B. 既传承历史文化、又融合现代文明","C. 是具有中国特色、符合中国实际的现代化","D. 是强国建设、民族复兴的唯一正确道路"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:556,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"中国式现代化是中国共产党领导的社会主义现代化。中国共产党领导的社会主义现代化，是对 中国式现代化的定性，是管总、管根本的。党的领导直接关系中国式现代化的根本方向、前途 命运、最终成败。党的领导",options:["A. 决定中国式现代化的根本性质","B. 确保中国式现代化锚定奋斗目标行稳致远","C. 激发建设中国式现代化的强劲动力","D. 凝聚建设中国式现代化的磅礴力量"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:557,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"中国式现代化是中国共产党领导人民长期探索和实践的重大成果。中国式现代化",options:["A. 深深植根于中华优秀传统文化","B. 体现科学社会主义的先进本质","C. 借鉴吸收一切人类优秀文明成果","D. 代表人类文明进步的发展方向"],answer:"ABCD",explanation:"中国式现代化，深深植根于中华优秀 传统文化，体现科学社会主义的先进本质，借 鉴吸收一切人类优秀文明成果，代表人类文 明进步的发展方向，是一种全新的人类文明 形态，既是我们强国建设、民族复兴的康庄大 · 道，也是中国谋求人类进步、世界大同的必由 之路。A、B、C、D 全选。"},
  {id:558,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"习近平深刻指出：“我们将不断提高人民物质生活和精神生活水平，做到家家仓廪实衣食足，又 让人人知礼节明荣辱。”这番话启示我们",options:["A. 先抓物质富足、再抓精神富有是社会主义现代化的根本要求","B. 只有坚持“两个文明”协调发展，才能不断满足人民日益增长的美好生活需要","C. “ 两个文明”协调发展，根植于中华优秀传统文化的深厚土壤","D. 物质文明和精神文明相协调，是中国式现代化的重要特征"],answer:"BCD",explanation:"以习近平同志为核心的党中央明确提 出“中国式现代化是物质文明和精神文明相 协调的现代化”,打破了“物质先行、精神滞 后”的西方现代化模式。在实践层面，中国式 现代化通过多元路径实现物质文明与精神文 明的融合共生。中国在迈向民族复兴的伟大 进程中，十分重视把握物质文明建设与精神 文明建设的平衡，促进物质积累与精神升华 共进。“先抓物质富足、再抓精神富有”不 符合“两手抓、两手硬”的精神。只有“两 手抓、两手硬”,方能在时代的浪潮中实现民 族复兴的完整图景，书写人类文明新篇章。 B、C、D正确，A错误。"},
  {id:559,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"习近平指出：“中国式现代化，是我们为如何唤醒‘睡狮’、实现民族复兴这个重大历史课题所 给出的答案，是选择自己的道路、做自己的事情。”中国式现代化创造了人类文明新形态，是一 种全新的人类文明形态。中国式现代化",options:["A. 打破了“现代化=西方化”的迷思，展现了不同于西方现代化模式的新图景","B. 是对西方式现代化理论和实践的重大超越","C. 为广大发展中国家提供了全新选择","D. 是当代中国共产党人回答和解决关乎人类前途命运的时代之问的中国方案"],answer:"ABC",explanation:"中国式现代化创造了人类文明新形 态，是一种全新的人类文明形态。中国式现 代化，提供了一种全新的现代化模式，打破了 “现代化=西方化”的迷思，展现了不同于西 方现代化模式的新图景；是对西方式现代化 理论和实践的重大超越，中国式现代化蕴含 考研政治1000题 >>> 解析分册 ③理论和实践相结合的作风，和人民群众紧 密地联系在一起的作风，以及自我批评的作 风(三大优良作风),是中国共产党区别于 其他任何政党的显著标志。 的独特世界观、价值观、历史观、文明观、民主 观、生态观等及其伟大实践，是对世界现代化 理论和实践的重大创新；为广大发展中国家 独立自主迈向现代化、探索现代化道路的多 样性提供了全新选择。A、B、C正确。 推动构建人类命运共同体，是当代中国 共产党人回答和解决关乎人类前途命运的时 代之问的中国方案，是应对人类共同挑战、建 设更加繁荣美好世界的人间正道，也是新时 代对外工作的总目标。D 错误。"},
  {id:560,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"中国最大的国情就是中国共产党的领导。中国共产党领导",options:["A. 是中国人民和中华民族能够扭转近代以后的历史命运、取得今天伟大成就的最根本原因","B. 是人民当家作主的可靠保障","C. 关系中国特色社会主义的性质、方向和命运","D. 是实现中华民族伟大复兴的根本保证"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:561,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"中国共产党领导是中国特色社会主义制度的最大优势，这是因为",options:["A. 党的自身优势是中国特色社会主义制度优势的主要来源","B. 党能够集中全党全国力量、凝聚全民族共同意志，确保中国特色社会主义制度的显著优势充 分彰显","C. 党的领导是全面的、系统的、整体的，事无巨细都去管","D. 党在实践中不断推进马克思主义中国化时代化，为坚持和完善中国特色社会主义制度提供强 大理论优势"],answer:"ABD",explanation:"A、B、D正确。党的领导是全面的、系 统的、整体的，并不是说党组织包揽包办一 切、事无巨细什么都去管，而是在各级各种组 织中发挥领导核心作用，既善于总揽全局，又 善于协调各方。C 错误。"},
  {id:562,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"党的领导是党和国家的根本所在、命脉所在，是全国各族人民的利益所系、命运所系。中国共 产党是最高政治领导力量，这是",options:["A. 在历史发展中形成的","B. 由我国国家性质决定的","C. 由我国的政治制度体系决定的","D. 由中华民族伟大复兴事业决定的"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:563,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"坚持党的全面领导，必须依靠制度来保障。党的领导制度是",options:["A. 我国的根本政治制度","B. 党的领导核心地位的必然反映和内在要求","C. 中国特色社会主义制度体系的核心","D. 国家治理体系和治理能力现代化的关键"],answer:"BCD",explanation:"B、C、D正确。党的领导制度是我国的 根本领导制度，不是根本政治制度，我国的根 本政治制度是人民代表大会制度，A错误。 · 国共产党把为民办事、为民造福作为最重要 的政绩，把为老百姓办了多少好事实事作为 检验政绩的重要标准。”让群众满意是我们党 做好一切工作的价值取向和根本标准。我们 党是以辩证唯物主义和历史唯物主义作为世 界观和方法论的党，人民在党的理论路线方 针政策和一切工作中始终处于最高的地位， 这决定了党的工作的最高裁决者和最终评判 者只能是人民。A、B、C、D全选。"},
  {id:564,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"人民是我们党的生命之根、执政之基、力量之源，人民性是马克思主义的本质属性和鲜明品格。 人民对美好生活的向往就是党的奋斗目标，要坚持以人民为中心。以下说法正确的有",options:["A. 人民立场是中国共产党的根本政治立场","B. 人民立场是我们党区别于其他政党的显著标志","C. 人民是中国共产党执政的最大底气、最深厚的根基","D. 坚持人民至上是新时代党治国理政的根本价值取向"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:565,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"2024年10月，习近平在福建东山县考察期间，专门参观了谷文昌纪念馆，了解谷文昌同志感 人事迹。习近平指出：“‘先祭谷公，后拜祖宗’,这是老百姓发自内心的敬仰。人民心里有一本 账，金杯银杯不如老百姓的口碑。”“‘为官一任，造福一方’,只有走这条路，才是人间正道。” 必须牢固树立和践行为民造福的政绩观，这是因为",options:["A. 让群众满意是我们党做好一切工作的价值取向和根本标准","B. 人民是党的工作的最高裁决者和最终评判者","C. 中国共产党把为民办事、为民造福作为最重要的政绩","D. 全心全意为人民服务是党的根本宗旨"],answer:"ABCD",explanation:"中国共产党是全心全意为人民服务的 党，党的执政水平和执政成效不是由自己说 了算，必须而且只能由人民来评判。习近平 指出：“时代是出卷人，我们是答卷人，人民是 阅卷人。”要始终把人民放在心中最高位置， 树立正确的政绩观，以人民满意不满意作为 检验工作的最终评判标准。习近平指出：“中"},
  {id:566,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"我们正在向第二个百年奋斗目标迈进。适应我国社会主要矛盾的变化，更好满足人民日益增长 的美好生活需要，必须推动全体人民共同富裕取得更为明显的实质性进展。实现共同富裕",options:["A. 不仅是经济问题，而且是关系党的执政基础的重大政治问题","B. 首先要通过全国人民共同奋斗把“蛋糕”做大做好，然后通过合理的制度安排把“蛋糕”切 好分好","C. 是一个长期的历史过程","D. 必须等实现了现代化再来解决"],answer:"ABC",explanation:"实现共同富裕不仅是经济问题，而且 是关系党的执政基础的重大政治问题。实现 共同富裕，首先要通过全国人民共同奋斗把 “蛋糕”做大做好，然后通过合理的制度安 排正确处理增长和分配关系，把“蛋糕”切 好分好，让人民群众真真切切感受到共同富 裕不仅仅是一个口号，而是看得见、摸得着、 真实可感的事实。我们不能等实现了现代化 再来解决共同富裕问题，而是要始终把满足 人民对美好生活的新期待作为发展的出发点 和落脚点，在实现现代化过程中不断地、逐步 地解决好这个问题。实现全体人民共同富裕 是一个长期的历史过程，不可能一蹴而就，必 须保持历史耐心、进行不懈努力，根据现有条 件把能做的事情尽量做起来，积小胜为大胜，"},
  {id:567,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"共同富裕是中国特色社会主义的本质要求，是中国式现代化的重要特征。要从全局角度来把握 共同富裕。共同富裕是",options:["A. 全体人民共同富裕","B. 人民群众物质生活和精神生活都富裕","C. 所有人都同时富裕","D. 所有地区同时达到一个富裕水准"],answer:"AB",explanation:"要从全局角度来把握共同富裕：共同 富裕是全体人民共同富裕，是人民群众物质 生活和精神生活都富裕，不是少数人的富裕， 也不是整齐划一的平均主义，不是所有人都 同时富裕，也不是所有地区同时达到一个富 裕水准。A、B 正确，C、D 错误。"},
  {id:568,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"坚持以人民为中心的发展思想，真正做到发展成果由人民共享，就必须落实到扎实推进全体人 民共同富裕上，在推动共同富裕过程中促进人的全面发展。扎实推进共同富裕必须坚持的原 则是",options:["A. 鼓励勤劳创新致富","B. 坚持基本经济制度","C. 尽力而为、量力而行","D. 坚持循序渐进"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:569,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"改革开放是党和人民大踏步赶上时代的重要法宝，是当代中国最显著的特征、最壮丽的气象。 改革开放是",options:["A. 我们党的一次伟大觉醒","B. 坚持和发展中国特色社会主义的必由之路","C. 决定当代中国命运的关键一步","D. 决定实现“两个一百年”奋斗目标、实现中华民族伟大复兴的关键一招"],answer:"ABD",explanation:"（本题解析见原书解析分册）"},
  {id:570,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"党的十一届三中全会是划时代的，党的十八届三中全会也是划时代的。党的十八届三中全会",options:["A. 开启了改革开放和社会主义现代化建设新时期","B. 对全面深化改革进行总体擘画，确定了全面深化改革的总目标和时间表、路线图","C. 实现改革由局部探索、破冰突围到系统集成、全面深化的转变","D. 实现了改革理论和政策的一系列新的重大突破"],answer:"BCD",explanation:"B、C、D正确。党的十一届三中全会开 启了改革开放和社会主义现代化建设新时 期。A 错误。"},
  {id:571,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"全面深化改革开放改什么、怎么改，这是一个带有根本性的问题。习近平强调：“我们的改革开 放是有方向、有立场、有原则的。”坚持全面深化改革开放的正确方向，必须",options:["A. 坚持和改善党的全面领导","B. 坚持和完善中国特色社会主义制度","C. 坚持以人民为中心，促进社会公平正义、增进人民福祉","D. 有利于进一步解放思想、进一步解放和发展社会生产力、进一步解放和增强社会活力"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:572,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"党的十八届三中全会通过的《中共中央关于全面深化改革若干重大问题的决定》,提出全面深化 改革的总目标是完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化。国 家治理体系和国家治理能力的关系是",options:["A. 国家治理体系和国家治理能力是相辅相成的","B. 国家治理体系越完备国家治理能力就一定越强","C. 通过好的国家治理体系能够提高国家治理能力","D. 通过提高国家治理能力能够充分发挥国家治理体系的效能"],answer:"ACD",explanation:"国家治理体系和治理能力两者相辅相 成。治理国家，制度是起根本性、全局性、长 远性作用的，但没有有效的治理能力，再好的 制度也难以发挥作用。同时，又不能把国家 治理体系和国家治理能力等同起来，不是国 家治理体系越完备，国家治理能力就越强。 必须把国家治理体系和治理能力结合在一 起，把两者当作一个相辅相成的有机整体，通 过好的国家治理体系提高国家治理能力，通 过提高国家治理能力充分发挥国家治理体系 的效能。A、C、D正确，B错误。"},
  {id:573,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"正确处理好改革、发展、稳定的关系，是我国改革开放的一条重要经验。全面深化改革开放要 统筹改革、发展、稳定，下列选项内容正确的有",options:["A. 改革是经济社会发展的强大动力","B. 发展是解决一切经济社会问题的关键","C. 稳定是改革发展的前提","D. 改善人民生活是正确处理改革、发展、稳定关系的结合点"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:574,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"党的十八大以来，我们党及时总结新鲜经验，不断深化对改革的规律性认识，形成了习近平总 书记关于全面深化改革的一系列新思想、新观点、新论断，为进一步全面深化改革提供了根本 遵循。关于进一步全面深化改革，以下说法正确的有",options:["A. 要始终朝着总目标指引的方向前进，该改的坚决改，不该改的不改","B. 要全面协调推进各方面改革，确保同时满足所有人的利益诉求","C. 要做到重大改革于法有据，平等保护全体公民和法人的合法权益","D. 要稳步扩大制度型开放，主动对接国际高标准经贸规则"],answer:"ACD",explanation:"· 习近平指出，要坚持继续完善和发展 中国特色社会主义制度、推进国家治理体系 和治理能力现代化的改革总目标，始终朝着 总目标指引的方向前进，该改的坚决改，不 该改的不改。A 正确。要坚持改革和法治相 统一，以改革之力完善法治，进一步深化法治 领域改革，不断完善中国特色社会主义法治 体系；更好发挥法治在排除改革阻力、巩固改 革成果中的积极作用，善于运用法治思维和 法治方式推进改革，做到重大改革于法有 据，平等保护全体公民和法人的合法权益。 C正确。要坚持改革和开放相统一，稳步扩 大制度型开放，主动对接国际高标准经贸规 则，深化外贸、外商投资和对外投资管理体制 改革，营造市场化、法治化、国际化一流营商 环境。D正确。 改革是利益格局调整的过程，不可能同 时满足所有人的利益诉求，随着改革不断推 进，对利益关系的触及将越来越深。我们要 增强大局意识，正确对待改革中的利益关系 调整和个人利害得失。B 错误。"},
  {id:575,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"当前，国际形势变乱交织，单边主义、保护主义逆流涌动，对国际经贸秩序造成严重冲击。我 国外贸企业出口承压，出口转内销成为不少企业解决当前困难的重要选择。加快内外贸一体化 发展是构建新发展格局、推动高质量发展的内在要求，对促进经济发展、扩大内需、稳定企业 具有重要作用。内外贸一体化发展有利于推动企业",options:["A. 更好利用两个市场、两种资源","B. 实现在国内外市场相互促进、协调发展","C. 彻底消除外部环境急剧变化的不确定性","D. 提升抗风险能力和生产经营韧性"],answer:"ABD",explanation:"加快内外贸一体化发展是构建新发展 格局、推动高质量发展的内在要求，对促进经 济发展、扩大内需、稳定企业具有重要作用。 内外贸一体化发展，能推动企业更好利用两 考研政治1000题 解析分册 个市场、两种资源，实现在国内外市场相互 促进、协调发展。A、B 正确。对中国企业而 言，加快推进内外贸一体化可以借助国际竞 争压力倒逼中国企业加快转型升级，通过灵 活调整企业产供销渠道和生产经营计划，提 升企业的抗风险能力和生产经营韧性。D 正 确。外部环境急剧变化的不确定性是客观事 实，我们要认真应对，但无法彻底消除这种不 确定性。C 错误。"},
  {id:576,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"对外开放是中国的基本国策，中国推进改革开放坚定不移，开放的大门只会越开越大。数据显 示，中国连续15年吸引外资超1000亿美元。截至2025年7月，“十四五”时期我国实际使用 外资累计7148.7亿美元，累计新设外资企业23.5万家。外资企业贡献了中国1/3的进出口额、 1/4 的工业增加值、1/7的税收，创造了3000多万个就业岗位。与此同时，外资准入负面清单 从最早的190项缩减到现在的全国版29项和自贸试验区版27项，制造业领域已实现“清零”。 这表明",options:["A. 外资企业在推动中国改革开放和现代化建设中发挥了重要作用","B. 外资经济已成为社会主义经济的重要组成部分","C. 中国已经形成比较健全的利用外资法规政策体系和工作体系","D. 中国将长期成为外资企业投资兴业的沃土"],answer:"ACD",explanation:"外资企业在推动中国改革开放和现代 化建设中发挥了重要作用。一是带动了中国 经济增长和就业。二是促进了中国技术和管 理进步。三是助推了中国改革开放。中国已 经形成比较健全的利用外资法规政策体系和 工作体系，将长期成为外资企业投资兴业的 沃土。A、C、D 正确。 外资经济是社会主义市场经济的重要组 成部分，但不是社会主义经济的重要组成部分 (只有公有制经济是社会主义经济)。B 错误。"},
  {id:577,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"新中国成立70多年特别是改革开放40多年来，创造了经济快速发展和社会长期稳定“两大奇 迹”,靠的是中国共产党坚强领导和中国人民团结奋斗，这其中也离不开国际社会支持帮助，包 括在华外资企业作出的贡献。改革开放使中国快速进入世界市场、大踏步赶上时代，重要一条 就是积极利用外资。外商来华投资在中国发展中发挥的重要作用有",options:["A. 带动了中国经济增长和就业","B. 促进了中国技术和管理进步","C. 助推了中国改革开放","D. 形成了资本主导的发展模式"],answer:"ABC",explanation:"2025年3月28日，习近平主席在会 见国际工商界代表时指出，外商来华投资，在 中国发展中发挥了重要作用。一是带动了中 国经济增长和就业。外资企业贡献了中国 1/3的进出口、1/4的工业增加值、1/7的税 收，创造了3000多万个就业岗位。二是促进 了中国技术和管理进步。外资企业带来的先 进技术和管理经验，对中国企业发展和人才 培养等产生了积极影响。三是助推了中国改 革开放，促进中国深度参与全球产业分工，主 动对接国际高标准经贸规则，推动了经济、科 技、生态等多方面体制机制改革。外资企业 还积极参与中国脱贫攻坚行动和其他社会公 益事业，同中国人民结下深厚友谊。A、B、C 正确，D错误。 A、B、C正确。正如社会主义初级阶段 并不是所有国家实现社会主义现代化所必须 经历的阶段一样，新发展阶段也不是所有国 家实现社会主义现代化所必须经历的阶段，D 错误。"},
  {id:578,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"党的十九届五中全会提出，全面建成小康社会、实现第一个百年奋斗目标之后，我们要乘势而 上开启全面建设社会主义现代化国家新征程、向第二个百年奋斗目标进军，这标志着我国进入 了一个新发展阶段。新发展阶段是",options:["A. 我国社会主义初级阶段历史进程中的一个重要阶段","B. 全面建设社会主义现代化国家、向第二个百年奋斗目标进军的重要阶段","C. 我们党带领人民迎来从站起来、富起来到强起来历史性跨越的新阶段","D. 所有国家实现社会主义现代化必须经历的阶段"],answer:"ABC",explanation:"108 B、C、D正确。“社会主义经济”与“社 会主义市场经济”不同，社会主义经济指的是 社会主义性质的经济。非公有制经济显然不 是社会主义性质的，但它和公有制经济都是 社会主义市场经济的重要组成部分，都是我 国经济社会发展的重要基础。A 错误。 新质生产力以劳动者、劳动资料、劳动对 象及其优化组合的跃升为基本内涵，以全要 素生产率大幅提升为核心标志。 D 错误。"},
  {id:579,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"创新、协调、绿色、开放、共享的新发展理念相互贯通、相互促进，是具有内在联系的集合体。 以下说法正确的有",options:["A. 创新发展注重的是解决发展动力问题","B. 绿色发展注重的是解决人与自然和谐共生问题","C. 开放发展注重的是解决发展内外联动问题","D. 共享发展注重的是解决发展不平衡问题"],answer:"ABC",explanation:"新发展理念具有丰富的科学内涵和具 体的实践要求。创新发展注重的是解决发展 动力问题，协调发展注重的是解决发展不平 衡问题，绿色发展注重的是解决人与自然和 谐共生问题，开放发展注重的是解决发展内 外联动问题，共享发展注重的是解决社会公 平正义问题。A、B、C正确，D错误。 ·"},
  {id:580,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"高质量发展是全面建设社会主义现代化国家的首要任务。高质量发展，就是",options:["A. 能够很好满足人民日益增长的美好生活需要的发展","B. 体现新发展理念的发展","C. 创新成为第一动力、协调成为内生特点、绿色成为普遍形态、开放成为必由之路、共享成为 根本目的的发展","D. 从“有没有”转向“好不好”的发展"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:581,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"新质生产力是创新起主导作用，摆脱传统经济增长方式、生产力发展路径，具有高科技、高效 能 、高质量特征，符合新发展理念的先进生产力质态。催生新质生产力的是",options:["A. 技术革命性突破","B. 上层建筑的大幅跃升","C. 产业深度转型升级","D. 生产要素创新性配置"],answer:"ACD",explanation:"新质生产力由技术革命性突破、生产 要素创新性配置、产业深度转型升级而催 生，以劳动者、劳动资料、劳动对象及其优化 组合的跃升为基本内涵，以全要素生产率大 幅提升为核心标志，特点是创新，关键在质优， 本质是先进生产力。A、C、D正确，B错误。"},
  {id:582,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"习近平提出，发展新质生产力是推动高质量发展的内在要求和重要着力点。关于新质生产力， 以下理解正确的有",options:["A. 战略性新兴产业、未来产业是发展新质生产力的主阵地","B. 传统产业通过转型升级，也能成为新质生产力的重要部分","C. 科技创新是发展新质生产力的核心要素","D. 发展新质生产力以劳动者、劳动资料、劳动对象及其优化组合的跃升为核心标志"],answer:"ABC",explanation:"站在新的起点上，必须围绕发展新质 生产力布局产业链，完善现代化产业体系。 一方面，战略性新兴产业、未来产业是发展 新质生产力的主阵地，要打造生物制造、商业 航天、低空经济等战略性新兴产业，开辟量 子、生命科学等未来产业新赛道；另一方面， 传统产业通过转型升级，也能成为新质生产 力的重要部分，要让数智技术、绿色技术得到 更广泛应用，推动产业向中高端迈进，跑出新 旧动能转换“加速度”。A、B正确。科技创新 能够催生新产业、新模式、新动能，是发展新 质生产力的核心要素。C 正确。 第六章"},
  {id:583,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"习近平指出，新质生产力“以全要素生产率大幅提升为核心标志，特点是创新，关键在质优， 本质是先进生产力”。这告诉我们，理解新质生产力，一个重要视角是全要素生产率。然而，全 要素生产率增长不足是全球性挑战。例如，美国最近20年全要素生产率年均增速只有约0.7%, 英国、法国、德国等工业化国家的全要素生产率增速也都陆续降到1%以内。相较于其他工业化 国家，我国在提升全要素生产率增速方面有许多有利因素。这些有利因素包括",options:["A. 我国不缺乏提升全要素生产率所需的大规模生产场景、技术创新和模式创新的应用场景","B. 我国超大规模市场的优势已经形成，经济始终保持高速增长","C. 我国拥有数字化和绿色化发展所带来的巨大生产率增长空间","D. 我国进一步全面深化改革将形成一个庞大的制度红利空间，带来资源配置效率提升的巨大可能"],answer:"ACD",explanation:"市场是最稀缺的资源，超大规模市场 是我国的优势所在。相较于其他工业化国 家，我国在提升全要素生产率增速方面有许 多有利因素。①我国制造业增加值的GDP 占比约为27%,制造业增加值占全球比重约 为30%。我国不缺乏提升全要素生产率所需 的大规模生产场景、技术创新和模式创新的 应用场景。2 我国拥有数字化和绿色化发展 所带来的巨大生产率增长空间。与美国旨在 提高制造业增加值占比的“再工业化”不同， 我国数字化和绿色化发展的意涵是所有行业 可以通过数字化转型和能源转型实现再次增 长。③进一步全面深化改革将形成一个庞大 的制度红利空间，带来资源配置效率提升的 巨大可能，进一步拉动全要素生产率的增 长。A、C、D正确。我国经济已由高速增长阶 段转向高质量发展阶段，B错误。 · B、C、D 全选。"},
  {id:584,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"坚持和完善社会主义基本经济制度是实现高质量发展的保障。社会主义基本经济制度",options:["A. 是我国生产关系在制度上的体现","B. 在经济制度体系中具有基础性决定性地位","C. 是中国特色社会主义制度的重要支柱","D. 是解放和发展社会生产力、改善人民生活、维护社会公平正义、推进共同富裕的制度基础"],answer:"ABCD",explanation:"民营经济是非公有制经济的主要经济 组织形式，是我国经济制度的内在要素，是推 进中国式现代化的生力军，是高质量发展的 重要基础，是推动我国全面建成社会主义现 代化强国、实现第二个百年奋斗目标的重要 力量。A、B、C、D 全选。"},
  {id:585,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"公有制经济是全体人民的宝贵财富，公有制主体地位不能动摇，国有经济主导作用不能动摇， 这是我国各族人民共享发展成果的制度性保证，也是巩固党的执政地位、坚持我国社会主义制 度的重要保证。国有企业是",options:["A. 中国特色社会主义的重要物质基础","B. 中国特色社会主义的政治基础","C. 我们党执政兴国的重要支柱","D. 我们党执政兴国的依靠力量"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:586,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"我国非公有制经济是改革开放以来在中国共产党的方针政策指引下发展起来的，我们要毫不动 摇鼓励、支持、引导非公有制经济发展。非公有制经济是",options:["A. 社会主义经济的重要组成部分和我国经济社会发展的重要基础","B. 国家税收的重要来源和就业创业的重要领域","C. 稳定经济的重要基础和金融发展的重要依托","D. 技术创新的重要主体和经济持续健康发展的重要力量"],answer:"BCD",explanation:"109 治1 0 0 题 > > >解析分册 迈上新台阶，努力使京津冀成为中国式现代 化建设的先行区、示范区。2021 年5月，习 近平总书记亲自谋划、亲自定题、亲自部署、 亲自推动，赋予浙江高质量发展建设共同富 裕示范区的光荣使命。D 错误。 政府行为厘清了边界、明确了尺度。“统一政 府行为尺度”有助于为各类经营主体创造更 公平的市场竞争环境，破解不同地区之间的 过度“内卷”,促进要素资源流动。A、B、D 正确。反腐败斗争是一项长期、复杂、系统的 工程，需要综合运用法治、监督、教育等多种 手段。“统一行为尺度”作为一项重要的制度 性建设，是“治本之策”的重要一环，但将其作 用拔高到“从根本上杜绝”权力寻租和腐败行 为的程度，则忽略了问题的复杂性。C 错误。"},
  {id:587,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"几十年来，关于对民营经济在改革开放和社会主义现代化建设事业中地位和作用的认识、党和 国家对民营经济发展的方针政策，我们党理论和实践是一脉相承、与时俱进的。党和国家对民 营经济发展的基本方针政策，概括起来就是",options:["A. 非公有制经济是我国社会主义市场经济的重要组成部分，受宪法和法律保护","B. 毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展","C. 保证各种所有制经济依法平等使用生产要素、公平参与市场竞争、同等受到法律保护","D. 促进各种所有制经济优势互补、共同发展，促进非公有制经济健康发展和非公有制经济人士 健康成长"],answer:"ABCD",explanation:"几十年来，关于对民营经济在改革开 放和社会主义现代化建设事业中地位和作用 的认识、党和国家对民营经济发展的方针政 策，我们党理论和实践是一脉相承、与时俱进 的 。党和国家对民营经济发展的基本方针政 策，概括起来就是：中国共产党领导人民发 展社会主义市场经济，非公有制经济是我国 社会主义市场经济的重要组成部分，受宪法 和法律保护；党和国家坚持和完善社会主义 基本经济制度，毫不动摇巩固和发展公有制 经济，毫不动摇鼓励、支持、引导非公有制经 济发展；党和国家保证各种所有制经济依法 平等使用生产要素、公平参与市场竞争、同等 受到法律保护，促进各种所有制经济优势互 补、共同发展，促进非公有制经济健康发展和 非公有制经济人士健康成长。这些基本方针 政策已经纳入中国特色社会主义制度体系， 宪法和党章都有明确体现，我们将一以贯之 坚持和落实，不能变，也不会变。我们谈促进 民营经济发展，这是一个基本的大前提。A、"},
  {id:588,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"迈上新征程.我国民营经济只能壮大.不能弱化，而且要走向更加广阔的舞台。民营经济是",options:["A. 非公有制经济的主要经济组织形式","B. 推进中国式现代化的生力军","C. 高质量发展的重要基础","D. 推动我国全面建成社会主义现代化强国、实现第二个百年奋斗目标的重要力量"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:589,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"内需是拉动经济增长的主动力和稳定锚。习近平强调，“要积极扩大国内需求”,“创造更多消费 场景，持续释放消费和投资潜力”。扩大内需不是权宜之计，而是战略之举，这是因为",options:["A. 大国经济的特征都是内需为主导、内部可循环","B. 扩大内需是应对外部冲击的有效途径","C. 扩大内需是全面建设社会主义现代化国家的实践要求","D. 扩大内需是满足人民对美好生活向往的现实需要"],answer:"ABCD",explanation:"当前，我国面临的国际环境复杂严峻， 国内需求不足的挑战仍然较大。扩大内需不 是权宜之计，而是战略之举。着力扩大国内 需求，是当前和今后一段时间经济工作的重 要任务。看普遍规律，内需主导是大国经济 特征。从国际经验看，大国经济的特征都是 内需为主导、内部可循环。看外部环境，扩大 内需是应对外部冲击的有效途径。看国内现 实，扩大内需是全面建设社会主义现代化国 家的实践要求。看百姓需求，扩大内需是满 足人民对美好生活向往的现实需要。A、B、 C、D全选。"},
  {id:590,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"建设农业强国，必须走中国特色社会主义乡村振兴道路，大力实施乡村振兴战略，全面推进乡 村振兴。实施乡村振兴战略",options:["A. 农业农村现代化是总目标","B. 坚持农业农村优先发展是总方针","C. 产业兴旺、生态宜居、乡风文明、治理有效、生活富裕是总要求","D. 建立健全城乡融合发展体制机制和政策体系是制度保障"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:591,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"强国必先强农，农强方能国强。农业强国是社会主义现代化强国的根基。加快建设农业强国， 必须巩固和完善农村基本经营制度，牢牢守住底线。这个底线就是",options:["A. 土地公有制性质不改变","B. 耕地红线不突破","C. 农民利益不受损","D. 农村土地经营权不流转"],answer:"ABC",explanation:"巩固和完善农村基本经营制度，必须 牢牢守住土地公有制性质不改变、耕地红线 不突破、农民利益不受损的底线，发展农业 适度规模经营，促进农业经营主体高质量发 展，为加快建设农业强国增活力添动能。A、"},
  {id:592,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"京津冀地区是我国经济最具活力、开放程度最高、创新能力最强、吸纳人口最多的地区之一。 京津冀协同发展，是习近平总书记亲自谋划、亲自部署、亲自推动的重大国家战略，对于促进 区域协调发展、形成新增长极具有重要意义。推动京津冀协同发展有利于",options:["A. 解决北京“大城市病”问题，探索人口经济密集地区优化开发的新模式","B. 完善城市群形态，打造具有较强影响力的世界级城市群","C. 增强区域发展协调性平衡性，积极服务构建新发展格局","D. 高标准建设好北京“新两翼”,推动京津冀成为高质量发展建设共同富裕示范区"],answer:"ABC",explanation:"A、B、C正确。2023年5月，习近平在 河北考察时强调，推动京津冀协同发展不断 110"},
  {id:593,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"区域重大战略的深入实施，充分考虑了我国类型多样的国土空间格局，对推动区域经济发展具 有重要的指引作用；区域重大战略的协同联动，不 仅为我国区域经济发展提供了新路径，形 成 了具有中国特色的区域融合发展方式，也推动了区域发展理论创新，为全球区域发展理论创新 作出了独特贡献。实施区域重大战略，有助于",options:["A. 打造高质量发展的动力源","B. 推动所有地区同时达到一个富裕水准","C. 加强生态文明建设","D. 建设改革开放的试验田"],answer:"ACD",explanation:"实施区域重大战略，有助于打造高质 量发展的动力源。比如，京津冀协同发展围 绕疏解北京非首都功能，把发展落差的势能 变成协同发展的动能，推动北京“新两翼”协 同发力，带动周边区域高质量发展。实施区 域重大战略，有助于加强生态文明建设。比 如，长江经济带高质量发展坚持生态优先、绿 色发展，共抓大保护、不搞大开发，扎实推进 长江生态环境保护修复。实施区域重大战 略 ，有助于建设改革开放的试验田。比如，粤 港澳大湾区建设要求在“一国两制”方针和基 本法框架内，发挥粤港澳三地综合优势，加强 规则衔接、机制对接，推动港澳融入国家发展 大局，对接高质量共建“一带一路”,建设高水 平开放合作平台。A、C、D正确。 · 共同富裕是全体人民共同富裕，是人民 群众物质生活和精神生活都富裕，不是少数 人的富裕，也不是整齐划一的平均主义：不是 所有人都同时富裕，也不是所有地区同时达 到一个富裕水准。B 错误。"},
  {id:594,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑。全面建设社会主义 现代化国家",options:["A. 教育是根本，科技是关键，人才是基础","B. 必须坚持科技是第一生产力、人才是第一资源、创新是第一动力","C. 必须坚持教育优先发展、科技自立自强、人才引领驱动","D. 必须深入实施科教兴国战略、人才强国战略、创新驱动发展战略"],answer:"ABCD",explanation:"B、C正确。我国农村土地实行所有权、承包 权、经营权“三权分置”,农村土地经营权是可 以流转的。D 错误。"},
  {id:595,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"教育是国之大计、党之大计，是民族振兴、社会进步的基石。建设教育强国是",options:["A. 全面建成社会主义现代化强国的战略先导","B. 实现高水平科技自立自强的重要支撑","C. 促进全体人民共同富裕的有效途径","D. 以中国式现代化全面推进中华民族伟大复兴的基础工程"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:596,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"科技自立自强是国家强盛之基、安全之要。加快建设科技强国，必须坚持走中国特色自主创新 道路，发挥新型举国体制优势，完善国家创新体系，加快关键核心技术攻关，实现高水平科技 自立自强。要打赢关键核心技术攻坚战，这是因为",options:["A. 关键核心技术是要不来、买不来、讨不来的","B. 关键核心技术是国之重器","C. 关键核心技术必须掌握在自己手中","D. 掌握最关键最核心的技术才能从根本上保障国家经济安全、国防安全和其他安全"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:597,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"自力更生是中华民族自立于世界民族之林的奋斗基点，自主创新是我们攀登世界科技高峰的必 由之路。实现高水平科技自立自强，必须增强自主创新能力。自主创新，就是从增强国家创新 能力出发，加强",options:["A. 原始创新","B. 集成创新","C. 开放创新","D. 改革创新"],answer:"ABC",explanation:"（本题解析见原书解析分册）"},
  {id:598,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"千秋基业，人才为先。全面建设社会主义现代化国家，要聚天下英才而用之，推动我国由人才 大国迈向人才强国。人才是",options:["A. 人力资源中能力和素质较高的劳动者","B. 实现民族振兴、赢得国际竞争主动的战略资源","C. 我们党执政的最大底气和最深厚的根基","D. 引领发展的第一动力"],answer:"AB",explanation:"A、B正确。人民是我们党执政的最大 底气，也是党执政最深厚的根基。C 错误。 创新是引领发展的第一动力。D错误。"},
  {id:599,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"全过程人民民主的提出、实践和发展，鲜明展示了我们党始终高举人民民主旗帜、实现人民当 家作主的坚定立场，深刻彰显了我国人民民主的鲜明特色和显著优势，实现了",options:["A. 过程民主和成果民主相统一","B. 程序民主和实质民主相统一","C. 直接民主和间接民主相统一","D. 人民民主和国家意志相统一"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:600,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"全过程人民民主，既有完整的制度程序，也有完整的参与实践，把民主选举、民主协商、民主 决策、民主管理、民主监督贯通起来，涵盖经济、政治、文化、社会、生态文明等各个方面， 聚焦国家发展大事、社会治理难事、百姓日常琐事，具有",options:["A. 时间上的连续性","B. 内容上的整体性","C. 运行上的协同性","D. 人民参与上的广泛性和持续性"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:601,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"全过程人民民主，是中国共产党团结带领人民追求民主、发展民主、实现民主的伟大创造，是 新时代我国民主政治领域具有重大创新意义的标志性成果。全过程人民民主是",options:["A. 全链条、全方位、全覆盖的民主","B. 最广泛、最真实、最管用的民主","C. 最纯粹、最先进、最好的民主","D. 协商民主、选举民主、人人民主的统一"],answer:"AB",explanation:"A、B正确。民主是历史的、是具体的、 是不断发展的。民主没有最好，只有更好，人 类对民主的探索和实践永无止境。世界上也 不存在最纯粹的民主。C 错误。人民民主， 是对人民民主、对敌人专政，所以不是人人民 主。D 错误。"},
  {id:602,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"对“十五五”规划编制工作，习近平强调要坚持科学决策、民主决策、依法决策，加强调研论 证 ，广泛凝聚共识，以多种方式听取人民群众和社会各界的意见建议，充分吸收干部群众在实 践中创造的新鲜经验。为此，“十五五”规划编制工作开展了为期1个月的网络征求意见活动。 在此期间，累计收到网民建言超过311.3万条，覆盖经济、社会、生态等各领域。“十五五”规 划编制工作网络征求意见活动",options:["A. 反映了数字时代民意表达方式的升级","B. 彰显了党和政府以人民为中心、在治国理政中更广泛倾听民意的行动","C. 体现了顶层设计和问计于民的统一","D. 是全过程人民民主的一次生动实践"],answer:"ABCD",explanation:"习近平对“十五五”规划编制工作作出 重要指示强调，编制和实施“十五五”规划，对 于全面落实党的二十大战略部署、推进中国 式现代化意义重大。要坚持科学决策、民主 决策、依法决策，把顶层设计和问计于民统一 起来，加强调研论证，广泛凝聚共识，以多种 方式听取人民群众和社会各界的意见建议， 充分吸收干部群众在实践中创造的新鲜经 验，注重目标任务和政策举措的系统性整体 性协同性，高质量完成规划编制工作。“十五 五”规划编制工作开展了网络征求意见活动， 广大人民群众积极建言献策的数据背后，不 · 仅反映了数字时代民意表达方式的升级，更 彰显了党和政府以人民为中心、在治国理政 中更广泛倾听民意的行动。习近平对“十五 五”规划编制工作网络征求意见活动给予充分 肯定，评价其“参与度高、覆盖面广，是全过程 人民民主的一次生动实践”。A、B、C、D 全选。"},
  {id:603,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"人民代表大会制度是我国的根本政治制度。这一根本制度，是我们党领导人民在人类政治制度 史上的伟大创造。人民代表大会制度是好制度，它",options:["A. 符合我国国情和实际","B. 体现社会主义国家性质","C. 保证人民当家作主","D. 能够有效凝聚全体人民力量一道推进中国式现代化"],answer:"ABCD",explanation:"实践证明，人民代表大会制度是符合 我国国情和实际、体现社会主义国家性质、保 证人民当家作主的好制度，是能够有效凝聚 全体人民力量一道推进中国式现代化的好制 度，具有强大生命力和显著优越性。A、B、C、 D全选。"},
  {id:604,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"人大代表作用的发挥，直接关系人民代表大会制度的运行，直接关系人大工作质量和水平。人 大代表参加行使国家权力的主要形式是",options:["A. 出席人民代表大会会议","B. 参与重要法律法规的制定修改、计划预算的审查批准和重大事项的审议决定","C. 依法参加选举、表决重要人事任免事项","D. 提出议案和建议"],answer:"ABCD",explanation:"适应人民民主专政的国体，有效保证国家沿 着社会主义道路前进；人民代表大会制度，坚 持国家一切权力属于人民，最大限度保障人 民当家作主，把党的领导、人民当家作主、依 法治国有机统一起来，有效保证国家治理跳 出治乱兴衰的历史周期率；人民代表大会制 度，正确处理事关国家前途命运的一系列重 大政治关系，实现国家统一高效组织各项事 业，维护国家统一和民族团结，有效保证国家 政治生活既充满活力又安定有序(“三个有 效保证”)。A、B、D正确。人民代表大会制 度是人民通过选举代表管理国家，并不是全 体人民直接参与国家管理，C错误。 人大代表作用的发挥，直接关系人民 代表大会制度的运行，直接关系人大工作质 量和水平。人大代表参加行使国家权力的主 要形式是出席人民代表大会会议，参与重要 法律法规的制定修改、计划预算的审查批准 和重大事项的审议决定，依法参加选举、表 决重要人事任免事项，提出议案和建议，等 等。A、B、C、D全选。"},
  {id:605,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"中国共产党领导的多党合作和政治协商制度、民族区域自治制度、基层群众自治制度构成了我 国的基本政治制度，反映了我国社会主义民主政治的独特优势，是保障各政党、各阶层、各民 族和基层人民群众当家作主的重要基础。中国人民政治协商会议是",options:["A. 实行中国共产党领导的多党合作和政治协商制度的重要机构","B. 我国政治生活中发扬社会主义民主、实践全过程人民民主的重要形式","C. 社会主义协商民主的重要渠道和专门协商机构","D. 国家治理体系的重要组成部分"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:606,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"70多年来的实践充分证明，人民政协在人类政治制度发展史上具有独特政治价值，已经并将不 断展现出旺盛生命力。人民政协",options:["A. 作为多党派参政的国家权力机关，有利于贯彻民主集中制、保证国家政治生活既充满活力又 安定有序","B. 作为最广泛的爱国统一战线组织，有利于最大限度把全体中华儿女的智慧和力量汇聚起来","C. 作为社会主义协商民主的重要渠道和专门协商机构，有利于促进科学决策、有效施策， 提升 国家治理效能","D. 作为中国共产党领导的政治组织，有利于完善人民当家作主的制度体系"],answer:"BCD",explanation:"· B、C、D正确。在我国，国家权力机关 是全国人民代表大会和地方各级人大。政协 不是权力机关，A错误。"},
  {id:607,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"习近平指出：“有事好商量，众人的事情由众人商量，找到全社会意愿和要求的最大公约数，是 人民民主的真谛。”协商民主是实践全过程人民民主的重要形式，是",options:["A. 我国社会主义民主政治的特有形式和独特优势","B. 党的群众路线在政治领域的重要体现","C. 中国共产党领导人民有效治理国家、保证人民当家作主的重要制度安排","D. 新时代我国民主政治领域具有重大创新意义的标志性成果"],answer:"ABC",explanation:"协商民主是全过程人民民主的重要组 成部分，是我国社会主义民主政治的特有形 式和独特优势，是党的群众路线在政治领域 的重要体现。协商民主是中国共产党领导人 民有效治理国家、保证人民当家作主的重要 制度安排。A、B、C 正确。全过程人民民主是 新时代我国民主政治领域具有重大创新意义 的标志性成果，D错误。"},
  {id:608,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"基层民主是全过程人民民主的重要体现。我国基层民主有多种多样的形式，如以村民委员会为 组织形态的农村村民自治、以社区居民委员会为组织形态的城市居民自治、以职工代表大会为 组织依托的企事业单位职工自治等。发展基层民主",options:["A. 是实现人民有效政治参与的重要渠道","B. 是人民当家作主的有效途径","C. 是社会主义民主最广泛的实践","D. 彰显了人民当家作主的广泛性、真实性、有效性"],answer:"ABCD",explanation:"发展基层民主是实现人民有效政治参 与的重要渠道，是人民当家作主的有效途径， 是社会主义民主最广泛的实践。基层民主的 建立和发展，保障了基层群众广泛、直接、有 效行使民主权利，彰显了人民当家作主的广 泛性、真实性、有效性。A、B、C、D全选。 11 2 118"},
  {id:609,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"新时代统战工作取得的最大成果，就是在实践中形成了关于做好新时代党的统一战线工作的重 要思想，就加强和改进统战工作提出了一系列新理念新思想新战略。必须充分发挥统一战线的 重要法宝作用。统一战线是",options:["A. 中国共产党区别于其他任何政党的显著标志","B. 党克敌制胜、执政兴国的重要法宝","C. 团结海内外全体中华儿女实现中华民族伟大复兴的重要法宝","D. 党的总路线总政策的重要组成部分"],answer:"BCD",explanation:"习近平在《完整、准确、全面贯彻落实 关于做好新时代党的统一战线工作的重要思 想》一文中强调，统一战线是党的总路线总政 策的重要组成部分，在我国革命、建设、改革 不同历史时期发挥了重要作用。文章强调， 必须充分发挥统一战线的重要法宝作用。统 一战线是党克敌制胜、执政兴国的重要法 宝 ，是团结海内外全体中华儿女实现中华民 族伟大复兴的重要法宝，必须长期坚持。现 在，统战工作不是过时了、不重要了，而是更 重要了。B、C、D正确。勇于自我革命是中国 共产党区别于其他政党的显著标志。A错误。 会主义制度是中国特色社会主义法治体系的 根本制度基础，是全面推进依法治国的根本 制度保障。中国特色社会主义法治理论是中 国特色社会主义法治体系的理论指导和学理 支撑，是全面推进依法治国的行动指南。这 三个方面规定和确保了中国特色社会主义法 治体系的制度属性和前进方向。A、C、D 正 确，B错误。"},
  {id:610,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"统一战线是我国新民主主义革命的三大法宝之一。新时代，统一战线面临的时和势、肩负的使 命和任务发生了重大变化，但统一战线仍然是重要法宝，我们要深刻理解发展壮大新时代爱国 统一战线的重要意义。统一战线",options:["A. 在维护国家主权、安全、发展利益上的作用更加重要","B. 在围绕中心、服务大局上的作用更加重要","C. 在增强党的阶级基础、扩大党的群众基础上的作用更加重要","D. 在团结国际社会共同反对霸权主义、单边主义的斗争中的作用更加重要"],answer:"ABC",explanation:"世界百年变局加速演进，统一战线在 维护国家主权、安全、发展利益上的作用更"},
  {id:611,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"民族团结是我国各族人民的生命线，中华民族共同体意识是民族团结之本。对中华民族形成起 决定作用的是对中华民族共同体的认同，而不是种族、血缘、地域、宗教等因素。只有铸牢中 华民族共同体意识，才能",options:["A. 构建起维护国家统一和民族团结的坚固思想长城","B. 增进各民族对中华民族的自觉认同，夯实我国民族关系发展的思想基础","C. 有效应对实现中华民族伟大复兴过程中民族领域可能发生的风险挑战","D. 为党和国家兴旺发达、长治久安提供重要思想保证"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:612,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"法律是治国之重器，法治是国家治理体系和治理能力的重要依托。历史和现实告诉我们，法治 兴则国兴，法治强则国强。全面依法治国，是",options:["A. 完善和发展中国特色社会主义制度的重要方面","B. 推进国家治理体系和治理能力现代化的重要方面","C. 坚持和发展中国特色社会主义的本质要求","D. 坚持和发展中国特色社会主义的重要保障"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:613,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"我们党领导人民长期探索走出的中国特色社会主义法治道路，是全面依法治国的唯一正确道路。 我国法治建设的成就可以列举出十几条、几十条，但归结起来就是开辟了中国特色社会主义法 治道路这一条。中国特色社会主义法治道路的核心要义是",options:["A. 坚持党的领导","B. 坚持以人民为中心","C. 坚持中国特色社会主义制度","D. 贯彻中国特色社会主义法治理论"],answer:"ACD",explanation:"中国特色社会主义法治道路的核心要 义：坚持党的领导，坚持中国特色社会主义 制度，贯彻中国特色社会主义法治理论。党 的领导是中国特色社会主义最本质的特征， 是社会主义法治最根本的保证。中国特色社 全面建成社会主义现代化强国必然要求 建设社会主义文化强国。统筹推进“五位一体” 总体布局、协调推进“四个全面”战略布局，文化 是重要内容；推动高质量发展，文化是重要支 点；满足人民日益增长的美好生活需要，文化 是重要因素；战胜前进道路上各种风险挑战， 文化是重要力量源泉。A、B、C、D全选。 113 1000题 >>> 解析分册"},
  {id:614,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"中国特色社会主义法治道路是全面依法治国的唯一正确道路。坚持和拓展中国特色社会主义法 治道路，必须毫不动摇坚持的原则有",options:["A. 坚持中国共产党的领导","B. 坚持以人民为中心","C. 坚持法律面前人人平等","D. 坚持依法治国和以德治国相结合"],answer:"ABCD",explanation:"坚持和拓展中国特色社会主义法治道 路是一个深入探索和不断实践的过程，必须 牢牢把握核心要义，毫不动摇坚持以下原则： 坚持中国共产党的领导；坚持以人民为中心； 坚持法律面前人人平等；坚持依法治国和以 德治国相结合；坚持从中国实际出发。A、B、 C、D全选。 · 多"},
  {id:615,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"建设法治中国，是全面建设社会主义现代化国家的重要组成部分。加快建设法治中国，必须坚 持统筹兼顾、把握重点、整体谋划，更加注重系统性、整体性、协同性。法治中国建设的工作 布局是",options:["A. 坚持依法治国、依法执政、依法行政共同推进","B. 坚持法治国家、法治政府、法治社会一体建设","C. 坚持科学立法、严格执法、公正司法、全民守法","D. 坚持统筹推进国内法治和涉外法治"],answer:"ABD",explanation:"加重要。全面建设社会主义现代化国家、实 现中华民族伟大复兴，统一战线在围绕中 心、服务大局上的作用更加重要。我国社会 结构发生深刻变化，统一战线在增强党的阶 级基础、扩大党的群众基础上的作用更加重 要。我们要深刻理解发展壮大新时代爱国统 一战线的重要意义，以高度的使命感和责任 感做好工作。A、B、C正确，D错误。 法治中国建设的工作布局是：坚持依 法治国、依法执政、依法行政共同推进，坚持 法治国家、法治政府、法治社会一体建设，坚 持统筹推进国内法治和涉外法治。A、B、D正 确。“坚持全面推进科学立法、严格执法、公 正司法、全民守法”是习近平法治思想的主要 内容之一，C 不符合题意。"},
  {id:616,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"2025 年春节档，《哪吒之魔童闹海》燃爆大银幕。影片自上映以来，屡屡刷新中国影史、世界 影史多项纪录。2025年是中国电影诞生120周年。《哪吒之魔童闹海》作为全球电影票房排行 榜前10名中唯一的非好莱坞影片，为中国电影诞生120周年献上了一份沉甸甸的厚礼，也激发 了中华儿女的民族自豪感和文化自信心。《哪吒之魔童闹海》国际版海报上那句“我偏要踏出一 条自己的路”,正是今天中国人坚定文化自信的写照。我们坚定文化自信的底气在于",options:["A. 中华优秀传统文化是我们坚定文化自信的深厚基础","B. 党带领人民在伟大斗争中孕育的革命文化和社会主义先进文化是我们坚定文化自信的坚强基石","C. 中国特色社会主义伟大实践是我们坚定文化自信的现实基础","D. 全人类共同价值是我们坚定文化自信的价值基础"],answer:"ABC",explanation:"（本题解析见原书解析分册）"},
  {id:617,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"中国特色社会主义文化发展道路，是推动社会主义文化繁荣兴盛的唯一正确道路。全面建设社 会主义现代化国家，必须坚持中国特色社会主义文化发展道路。决定社会主义文化事业前途命 运的关键是",options:["A. 坚持为人民服务","B. 坚持为社会主义服务","C. 坚持百花齐放","D. 坚持百家争鸣"],answer:"AB",explanation:"坚持为人民服务、为社会主义服务 (“二为”)的根本方向，是决定社会主义 文化事业前途命运的关键。要坚持以人民为 中心，尊重人民主体地位，保障人民文化权 益，鼓励人民参与文化创新创造，实现满足人 民文化需求和增强人民精神力量相统一。深 刻把握新时代新征程的历史方位和民族复兴 的时代主题，唱响昂扬的时代主旋律，充分发 精讲P179 考点76 -4"},
  {id:618,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"2023年10月7日至8日，全国宣传思想文化工作会议在北京召开。会议的最重要成果是首次 捉出并阐释习近平文化思想。习近平文化思想",options:["A. 既有文化理论观点上的创新和突破，又有文化工作布局上的部署要求","B. 明确了新时代文化建设的路线图和任务书","C. 标志着我们党对中国特色社会主义文化建设规律的认识达到了新高度","D. 表明我们党的历史自信、文化自信达到了新高度"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:619,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"核心价值观是一个民族赖以维系的精神纽带，是一个国家共同的思想道德基础。社会主义核心 价值观",options:["A. 体现了社会主义本质要求","B. 继承了中华优秀传统文化","C. 吸收了世界文明有益成果","D. 体现了时代精神"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:620,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"海纳百川，有容乃大。文明的繁荣、人类的进步，离不开求同存异、开放包容，离不开文明交流、 互学互鉴。中华文明自古就以开放包容闻名于世。中华文明具有突出的包容性，从根本上决定了",options:["A. 中华民族交往交流交融的历史取向","B. 中国各宗教信仰多元并存的和谐格局","C. 中华文化对世界文明兼收并蓄的开放胸怀","D. 中国不断追求文明交流互鉴而不搞文化霸权"],answer:"ABC",explanation:"中华优秀传统文化是我们坚定文化自 信的深厚基础。中华民族创造的优秀传统文 化是民族的根脉，根植在中国人内心，形成了 中国人看待世界、看待社会、看待人生的独特 价值体系、文化内涵和精神品质，这是我们区 别于其他国家和民族的根本特征，也铸就了 中华民族一以贯之的文化自信。中华优秀传 统文化是中华文明的智慧结晶和精华所在， 是中华民族的根和魂，是最深厚的文化软实 力，是中国特色社会主义植根的沃土，是我们 党创新理论的“根”,是我们在世界文化激荡 中站稳脚跟的根基。A、B、C、D 全选。"},
  {id:621,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"英国哲学家罗素这样评价中国文化中的和平传统：“中国至高无上的伦理品质中的一些东西，现 代世界极为需要”,“若能够被世界采纳，地球上肯定比现在有更多的欢乐祥和”。中华文明历来 崇尚“以和邦国”“和而不同”“以和为贵”,中华民族的血液中没有侵略他人、称王称霸的基 因。中华文明具有的和平性，从根本上决定了中国",options:["A. 始终是世界和平的建设者、全球发展的贡献者、国际秩序的维护者","B. 不断追求文明交流互鉴而不搞文化霸权","C. 不会把自己的价值观念与政治体制强加于人","D. 坚持合作、不搞对抗，决不搞“党同伐异”的小圈子"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:622,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"2025年春节档，《哪吒之魔童闹海》燃爆大银幕。影片自上映以来，屡屡刷新中国影史、世界 影史多项纪录，并成功登顶全球动画电影票房榜首，打破了长期以来好莱坞对全球动画市场的 垄断。《哪吒之魔童闹海》的导演饺子认为，影片成功的关键在于满足了观众对传统题材现代化 表达的需求。这启示我们，不断提升中华文化影响力，必须",options:["A. 推动中华优秀传统文化创造性转化和创新性发展","B. 使中华民族最基本的文化基因同当代中国相适应、同现代社会相协调、同现实文化相融通","C. 把跨越时空、超越国界、富有永恒魅力、具有当代价值的文化精神弘扬起来","D. 加强国际传播能力建设，全面提升国际传播效能"],answer:"ABCD",explanation:"坚定文化自信的底气来自：①中华优 秀传统文化是我们坚定文化自信的深厚基 础。2党带领人民在伟大斗争中孕育的革命 文化和社会主义先进文化是我们坚定文化自 信的坚强基石。3中国特色社会主义伟大实 践是我们坚定文化自信的现实基础。文化自 信不仅来自文化的积淀传承与创新发展，更 来自中国特色社会主义的伟大实践，来自实 现中华民族伟大复兴的光明前景。A、B、C 正 确，D错误。"},
  {id:623,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"近年来，在免签政策的带动下，越来越多的外国人入境旅游，世界对了解中国、走近中国的兴 趣与日俱增，中国文化也在出海的过程中越来越自信。比如，“悟空”曾常被译为MonkeyKing, 而在《黑神话：悟空》游戏中，则直接使用“Wukong”,构建中国话语和中国叙事体系的尝 试 ，高扬着文化主体性。然 而 ，在跨文化传播中，有个“文化折扣”的概念。比如，《哪吒之魔 童闹海》电影中“反抗命运、自我觉醒”的主题引起普遍共鸣，但诸如风火轮、金箍棒等意象， 也形成天然的理解困境。这从一个侧面说明，融通中外是一项艰巨的任务，也是中国文化走出 去必须面对的难题。中国文化走出去的实践说明",options:["A. 要提高国家文化软实力，就必须使当代中国价值观念走向世界","B. 面向世界是中国特色社会主义文化建设的根本方向","C. 讲好中国故事、传播好中国声音，要以我为主、以理服人、以情动人","D. 一个大国发展兴盛，必然要求文化传播力、文明影响力大幅提升"],answer:"ACD",explanation:"一个大国发展兴盛，必然要求文化传 播力、文明影响力大幅提升，实现软实力和硬 实力相得益彰。一个国家的文化软实力，从 根本上说，取决于其核心价值观的生命力、凝 聚力、感召力。习近平指出：“我国要提高国 家文化软实力，就必须使当代中国价值观念 走向世界。”A、D 正确。讲好中国故事、传播 好中国声音，根本在于传播理念，以我为主， 以理服人，以情动人。C 正确。中国特色社 会主义文化建设要坚持“二为”方向、“双百” 方针。坚持为人民服务、为社会主义服务的 根本方向，是决定社会主义文化事业前途命 运的关键。坚持百花齐放、百家争鸣，是繁荣 发展社会主义文化的重要方针。B 错误。 114"},
  {id:624,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"治国有常，利民为本。民生是老百姓最关心的问题，涉及分配、就业、教育、医疗、住房、社会保障 等方面。随着经济社会的发展进步，人民生活品质的不断提高，民生内涵也在不断丰富。民生",options:["A. 事关人民的生存生活生计","B. 事关民心所向、民情所系、民意所指","C. 是国家强盛之基、安全之要","D. 决定党的事业成败和国家命运兴衰"],answer:"ABD",explanation:"A、B、D正确。科技自立自强是国家强 盛之基、安全之要。C 错误。"},
  {id:625,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"新时代的10多年，我国建成了世界上规模最大的社会保障体系。2012年到2025年， 基本养老 保险参保人数从7.9亿人增加到10.76亿人，基本医疗保险参保人数从5.4亿人增加到13.31 亿人，社会保障网越织越密。社会保障",options:["A. 是保障和改善民生、维护社会公平、增进人民福祉的基本制度保障","B. 是促进经济社会发展、实现广大人民群众共享改革发展成果的重要制度安排","C. 是第三次分配制度的重要组成部分","D. 发挥着民生保障安全网、收入分配调节器、经济运行减震器的作用"],answer:"ABD",explanation:"A、B、D正确。在初次分配、再分配、第 三次分配协调配套的制度体系中，税收、社会 保障、转移支付等属于再分配调节；第三次分 配是指企业、社会组织、家庭和个人等基于自 愿原则，以募集、捐赠、资助、义工等慈善、公 益方式对所属资源和财富进行分配。 C 错误。"},
  {id:626,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"社会治理是国家治理的重要领域，推进社会治理现代化是推进国家治理体系和治理能力现代化 的重要内容。新时代加强和创新社会治理，要求坚持",options:["A. 系统治理","B. 依法治理","C. 综合治理","D. 源头治理"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:627,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"基础不牢，地动山摇。习近平指出，基层强则国家强，基层安则天下安，必须抓好基层治理现 代化这项基础性工作。以下说法正确的有",options:["A. 基层治理是国家治理的基石","B. 城乡社区是社会治理最基本的单元","C. 社会治理的重心必须向基层下移","D. 城乡社区是党和政府联系、服务居民群众的“最后一公里”"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:628,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"保护自然就是保护人类，建设生态文明就是造福人类。生态文明之所以重要，是因为",options:["A. 生态环境变化直接影响文明的兴衰演替","B. 生态文明是人类文明发展的历史趋势","C. 生态文明建设是重大经济问题","D. 生态文明建设是关系党的使命宗旨的重大政治问题、关系民生福祉的重大社会问题"],answer:"ABCD",explanation:"精讲P185 考点85 -1 生态文明的重要性：第一，生态兴则 文明兴，生态衰则文明衰。生态环境变化直 接影响文明的兴衰演替。第二，生态文明是 人类文明发展的历史趋势。生态文明建设 的重要性：生态文明建设是重大经济问题，也 是关系党的使命宗旨的重大政治问题、关系 民生福祉的重大社会问题。A、B、C、D全选。"},
  {id:629,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"山水意象体现了中华先贤对自然的审美和认知，“青山看不厌，流水趣何长”“白云黄鹤自来 去，绿水青山无古今”等诗句，表达了中国古人对自然的热爱、敬畏与赞美。2002年，习近 平在福建担任省长时就提出福建要建成中国第一个生态省。到浙江工作后，他于2005年又提 出“绿水青山就是金山银山”,如今这已成为中国人民的共识。“绿水青山就是金山银山”理 念之所以成为全国人民的共识，根本就在于这一重要理念",options:["A. 以“两个结合”的鲜明特质继承发展了马克思主义生态观、发展观","B. 深深根植于中华民族深厚的生态文化基因之中","C. 与时俱进地彰显出时代价值","D. 已经成为引领发展的第一动力"],answer:"ABC",explanation:"“绿水青山就是金山银山”理念之所 以成为全国人民的共识，根本就在于这一重 要理念以“两个结合”的鲜明特质继承发展 了马克思主义生态观、马克思主义发展观， 深深根植于中华民族深厚的生态文化基因 之中，与时俱进地彰显出时代价值。同时， “绿水青山就是金山银山”理念以人与自然、 生态与经济、发展和保护辩证统一的基本内 涵实现了对西方传统发展范式的历史性超 越。 A、B、C 正确。创新是引领发展的第一 动力，D 错误。"},
  {id:630,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"绿水青山就是金山银山理念是立足自身国情和发展实践形成的中国自主生态文明建设理论，符 合人类社会发展规律和生态文明建设规律，在实践中展现出强大的真理力量和独特的思想魅 力。绿水青山就是金山银山理念",options:["A. 创新和突破了现代环境经济理论","B. 推进和拓展了中国式现代化道路","C. 传承和发展了中华优秀传统生态文化","D. 推动和创造了人类文明新形态"],answer:"ABCD",explanation:"2025年8月10日，新华社国家高端 智库与习近平生态文明思想研究中心在北 京共同发布《绿水青山绘就美丽画卷——生 态文明建设的中国创新与世界意义》智库报 告。报告指出，绿水青山就是金山银山理 念，创新和突破了现代环境经济理论；推进 和拓展了中国式现代化道路；传承和发展了 中华优秀传统生态文化；推动和创造了人类 文明新形态。A、B、C、D全选。"},
  {id:631,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"党的十八大以来，我们把生态文明建设作为关系中华民族永续发展的根本大计，开展了一系列 开创性工作，决心之大、力度之大、成效之大前所未有，生态文明建设从理论到实践都发生了 历史性、转折性、全局性变化，美丽中国建设迈出重大步伐。我们实现",options:["A. 由重点整治到系统治理的重大转变","B. 由被动应对到主动作为的重大转变","C. 由全球环境治理参与者到引领者的重大转变","D. 由实践探索到科学理论指导的重大转变"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:632,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"新时代我国生态文明建设的重大成就表现在",options:["A. 生态文明建设战略地位更加凸显","B. 生态文明制度体系更加健全","C. 污染防治和生态保护更加有力","D. 生态环境保护结构性、根源性、趋势性压力得到根本缓解"],answer:"ABC",explanation:"A、B、C正确。我国生态环境保护结 构性、根源性、趋势性压力尚未根本缓解，生 态文明建设仍处干压力叠加、负重前行的关 键期。D 错误。 · 考研政治1 0 0 题 >>>解析分册"},
  {id:633,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"总体国家安全观的关键在于“总体”。以下说法正确的有",options:["A. “ 总体”是新时代中国国家安全的灵魂","B. 总体国家安全观突出大安全理念","C. 追求绝对安全是新时代中国国家安全的中心任务","D. 大安全是新形势下对国家生存和可持续发展的维护"],answer:"ABD",explanation:"总体国家安全观的关键在于“总体”, “总体”是新时代中国国家安全的灵魂。它 突出大安全理念，涵盖政治、军事、国土、经 济、金融、文化、社会、科技、网络等诸多领 域，并随着社会发展不断动态调整。 大安 全，是新形势下对国家生存和可持续发展 的维护，但不是安全泛化，更不是追求绝对 安全。大安全是通过抓好一地一域一业的 安全为国家总体安全创造条件，是通过及时 有效解决一个个安全问题为国家长治久安 筑牢根基。A、B、D正确，C错误。"},
  {id:634,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"统筹发展和安全，是党和国家的一项基础性工作，是我们党治国理政的一个重大原则。之所以 要统筹发展和安全，是因为发展和安全是两件大事，是一体之两翼、驱动之双轮，必须同步推 进。以下说法正确的有",options:["A. 发展解决的是动力问题，是推动国家和民族赓续绵延的根本支撑","B. 安全解决的是保障问题，是确保国家和民族行稳致远的坚强柱石","C. 发展具有基础性、根本性，是解决安全问题的总钥匙，发展就是最大的安全","D. 安全是发展的条件和保障，没有国家安全，发展取得的成果也可能毁于一旦"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:635,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"牢牢守住安全发展这条底线是构建新发展格局的重要前提和保障。只有以新安全格局保障新发 展格局，把国家发展建立在更加安全、更为可靠的基础之上，才能",options:["A. 夯实我国经济发展的根基","B. 增强发展的安全性稳定性","C. 在各种可以预见和难以预见的风险挑战中增强我国的生存力、竞争力、发展力、持续力","D. 确保中华民族伟大复兴进程不被迟滞甚至中断，胜利实现全面建成社会主义现代化强国目标"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:636,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"构建统筹各领域安全的新安全格局，必须把维护政治安全作为应对各领域安全风险挑战的首要 任务。这是因为",options:["A. 政治安全是国家安全的根本","B. 政治安全足一切国家生存和发展的基础条件","C. 政治安全决定和影响着国家共他各个领域的安全","D. 只要维护好了政治安全，其他领域的安全问题就会自动解决"],answer:"ABC",explanation:"听党指挥是灵魂，决定军队建设的政 治方向。坚持党对人民军队的绝对领导是 人民军队永远不变的军魂。实践证明，听党 指挥是人民军队建设的首要，是人民军队 的命脉所在。A、B正确。作风优良是保证， 关系军队的性质、宗旨、本色。在长期实践 中，人民军队形成了一整套光荣传统和优 良作风，这是人民军队的鲜明特色和政治 优势，也是人民军队战无不胜、攻无不克的 重要保证。C 错误。能打胜仗是核心，D 错误。 A、B、C正确。总体国家安全观的主 要内容集中体现为“十个坚持”,其中之一就 是“坚持统筹推进各领域安全”。以政治安 全为根本，坚持把政治安全放在首要位置， 并不意味着“其他领域的安全问题就会自动 解决”。D错误。"},
  {id:637,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"政治安全与人民安全、国家利益至上是有机统一的。以下说法正确的有",options:["A. 政治安全是维护人民安全和国家利益的根本保证","B. 人民安全居于中心地位","C. 国家利益至上是实现政治安全和人民安全的要求和原则","D. 要把三者统一起来，确保实现党的长期执政、人民安居乐业、国家长治久安"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:638,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"习近平指出：“我们捍卫和平、维护安全、慑止战争的手段和选择有多种多样，但军事手段始 终是保底手段。”只有以强大军事实力为后盾",options:["A. 政治安全、国土安全等其他安全才能托底","B. 国家的总体安全和人民的幸福生活才有保障","C. 实现国家繁荣富强的主动权才能牢牢掌握在自己手中","D. 当代中国价值观念才能走向世界"],answer:"ABC",explanation:"（本题解析见原书解析分册）"},
  {id:639,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"进入新时代，以习近平同志为核心的党中央着眼实现中华民族伟大复兴这个国家和民族最高利 益，对人民军队使命任务作出新定位、提出新要求，概括起来就是",options:["A. 为巩固中国共产党领导和我国社会主义制度提供战略支撑","B. 为捍卫国家主权、统一和领土完整提供战略支撑","C. 为维护我国海外利益提供战略支撑","D. 为促进世界和平与发展提供战略支撑"],answer:"ABCD",explanation:"进入新时代，以习近平同志为核心的 党中央着眼实现中华民族伟大复兴这个国 家和民族最高利益，对人民军队使命任务作 出新定位、提出新要求，概括起来就是“四 个战略支撑”。A、B、C、D 全选。"},
  {id:640,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"中华民族实现伟大复兴，中国人民实现更加美好生活，必须加快把人民军队建设成为世界一流 军队。新时代加强军队建设的聚焦点和着力点是",options:["A. 军民融合","B. 听党指挥","C. 能打胜仗","D. 作风优良"],answer:"BCD",explanation:"听党指挥、能打胜仗、作风优良，三者 相互联系、密不可分，抓住了建设强大人民 军队最根本、最紧要、最现实的问题，明确了 加强军队建设的聚焦点和着力点，体现了坚 持党的建军原则、人民军队根本职能、特有 政治优势的高度统一。建军治军抓住听党 指挥、能打胜仗、作风优良这三条，就抓住了 要害，就能起到纲举目张的作用。B、C、D正 确，A不符合题意。 ,"},
  {id:641,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"90多年来，人民军队之所以能够始终保持强大的凝聚力、向心力、战斗力，经受住各种考验， 不断从胜利走向胜利，最根本的就是靠党的坚强领导。实践证明，听党指挥是",options:["A. 人民军队建设的首要","B. 人民军队的命脉所在","C. 人民军队的鲜明特色和政治优势","D. 新时代强军目标的核心"],answer:"AB",explanation:"（本题解析见原书解析分册）"},
  {id:642,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"“一国两制”立足中国国情，把原则性和灵活性、现实性和长远性、一致性和差异性统一起 来，凝结了中国共产党人为解决国家统一问题展现出的超凡勇气和卓越智慧，是前无古人的伟 大创举。“一国两制”",options:["A. 是中国特色社会主义制度创新的重要成果","B. 是中国共产党领导人民实现祖国和平统一的伟大构想","C. 包含了中华文化中的和合理念","D. 为国际社会解决类似问题提供了新思路、新方案"],answer:"ABCD",explanation:"“一国两制”是中国特色社会主义制 度创新的重要成果，是中国共产党领导人民 实现祖国和平统一的伟大构想，为国际社会 解决类似问题提供了新思路、新方案。“一 国两制”包含了中华文化中的和合理念，体 A、B、C 正确。军事属于硬实力，文 化、价值观念属于软实力。当代中国价值观 念要走向世界，要下大力气加强文化软实力 建设，广泛传播当代中国价值观念，充分展 示中华文化独特魅力，推动中华文化更好走 向世界。D错误。 116"},
  {id:643,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"“一国两制”方针是一个完整的体系。关于“一国”和“两制”的关系，以下说法正确的有",options:["A. “ 一国”是实行“两制”的前提和基础","B. “两制”从属和派生于“一国”,并统一于“一国”之内","C. “ 一国”是根，根深才能叶茂；“一国”是本，本固才能枝荣","D. “ 一国”之内的“两制”等量齐观、比肩并列"],answer:"ABC",explanation:"“一国”是实行“两制”的前提和基础， “两制”从属和派生于“一国”,并统一于“一 国”之内。习近平指出：“‘一国’是根，根深 才能叶茂；‘一国’是本，本固才能枝荣。” “一国”原则愈坚固，“两制”优势就愈彰显； “一国”底线越牢，“两制”空间就越大。A、 B、C正确。“一国”之内的“两制”并非等量 齐观、比肩并列，国家的主体必须实行社会 主义制度。D 错误。"},
  {id:644,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"准确把握“一国两制”的科学内涵，必须坚持中央全面管治权和保障特别行政区高度自治权相 统一。我国是单一制国家，中央对包括香港、澳门特别行政区在内的所有地方行政区域拥有全 面管治权。全面管治权与高度自治权在本质上是统一的。以下说法正确的有",options:["A. 全面管治权是授权特别行政区高度自治的前提和基础","B. 高度自治权是中央行使全面管治权的体现","C. 它们之间是源与流、本与末的关系","D. 特别行政区不存在所谓“剩余权力”"],answer:"ABCD",explanation:"坚持中央全面管治权和保障特别行政 区高度自治权相统一。我国是单一制国家， 中央对包括香港、澳门特别行政区在内的所 有地方行政区域拥有全面管治权。全面管治 权与高度自治权在本质上是统一的。全面管 治权是授权特别行政区高度自治的前提和基 础，高度自治权是中央行使全面管治权的体 现。它们之间是源与流、本与末的关系。 高度自治不是完全自治，也不是分权，而是 中央授予的地方事务管理权。中央授予多 少权力，特别行政区就享有多少权力，不 存在所谓“剩余权力”。A、B、C、D 全选。"},
  {id:645,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"党的十八大以来，以习近平同志为核心的党中央积极推进对台工作理论和实践创新，形成新时 代党解决台湾问题的总体方略，牢牢把握两岸关系主导权和主动权，扎实推进祖国统一进程。 解决台湾问题、实现祖国完全统一，是",options:["A. 中国共产党矢志不渝的历史任务","B. 全体中华儿女的共同愿望","C. 由中华民族伟大复兴的时和势所决定的","D. 实现中华民族伟大复兴的必然要求"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:646,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"民族复兴、国家统一是大势所趋、大义所在、民心所向。以下说法正确的有",options:["A. 中华文明具有突出的统一性，国家统一永远是中国核心利益的核心","B. 台湾问题因民族弱乱而产生，必将随着民族复兴而解决","C. 实现祖国完全统一是不可阻挡的历史潮流","D. 在中华民族的发展进程中，追求统一、反对分裂始终是全民族的主流价值观"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:647,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"坚持走和平发展道路，是我们党根据时代发展潮流和我国根本利益作出的战略抉择。走和平发 展道路",options:["A. 是由中国共产党性质宗旨和我国社会主义制度决定的","B. 是基于中国历史文化传统作出的必然选择","C. 是新时代对外工作的总目标","D. 符合历史潮流、顺应世界大势"],answer:"ABD",explanation:"走和平发展道路是新时代中国外交 的基本原则。推动构建人类命运共同体是 新时代对外工作的总目标。C 错误。A、B、 D 正确。"},
  {id:648,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"构建人类命运共同体，就是为了造福各国人民，促进世界和平，实现共同繁荣和发展。共建 “一带一路”",options:["A. 是对中国与世界实现开放共赢路径的顶层设计","B. 是推动构建人类命运共同体的实践平台","C. 根植历史、更面向未来，源于中国、更属于世界","D. 追求的是发展，崇尚的是共赢，传递的是希望"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:649,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"党要管党、从严治党，是党的建设的一贯要求和根本方针。全面从严治党是",options:["A. 党永葆生机活力、走好新的赶考之路的必由之路","B. 新时代党的建设的鲜明主题","C. 党的政治建设的首要任务","D. 新时代党的自我革命的伟大实践"],answer:"ABD",explanation:"全面从严治党是党永葆生机活力、走 好新的赶考之路的必由之路，是新时代党的 建设的鲜明主题。A、B 正确。如何跳出历 史周期率?如何实现长期执政?党始终在 思索、一直在探索。毛泽东在延安的窑洞里 给出了第一个答案，这就是“让人民来监督 政府”。经过百年奋斗特别是党的十八大以 来新的实践，党又给出了第二个答案，这就 是自我革命。全面从严治党是新时代党的 自我革命的伟大实践，开辟了百年大党自我 革命的新境界。D 正确。保证全党服从中 央，维护党中央权威和集中统一领导，是党 的政治建设的首要任务。C 错误。 ·"},
  {id:650,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"全面从严治党是一项管党治党的系统工程，客观上需要一个布局合理、内容科学、要素齐备、 统一高效的全面从严治党体系。要落实新时代党的建设总要求，把全的要求、严的基调、治的 理念落实到全面从严治党全过程，坚持",options:["A. 内容上全涵盖","B. 对象上全覆盖","C. 责任上全链条","D. 制度上全贯通"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:651,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"党的政治建设是党的根本性建设。党的政治建设的首要任务是",options:["A. 保证全党服从中央","B. 时刻保持解决大党独有难题的清醒和坚定","C. 维护党中央权威和集中统一领导","D. 以伟大自我革命引领伟大社会革命"],answer:"AC",explanation:"（本题解析见原书解析分册）"},
  {id:652,chapter:"新思想",sub:"习近平新时代中国特色社会主义思想概论",type:"multi",question:"习近平在谈到作风建设时，曾引用泰山挑山工不敢在“快活三里”久留的故事。“快活三里” 是泰山半腰的一段平路，游客喜欢在此歇脚，挑山工却不敢停留太久，因为他们知道休息时间 长了，腿就会“发懒”,再上“十八盘”就更困难了。习近平引用这个故事，旨在告诫广大党 员干部",options:["A. 要警惕承平日久环境下追求安逸享乐而意志消沉","B. 作风建设永远在路上，不能有歇歇脚、松口气的念头","C. 作风建设必须一鼓作气，不能打持久战","D. 必须始终保持艰苦奋斗、负重前行的精神状态 1."],answer:"ABD",explanation:"题干这段材料的核心寓意是告诫党 员干部不能在“舒适区”久留，要警惕意志消 沉，继续“负重前行”。要有“挑担人”的自 觉、“赶路人”的警醒、“攀登者”的坚定。A、 B、D三项准确体现了这一警示的深刻内涵。 “四风”问题具有顽固性、反复性，必须以打 攻坚战、持久战的决心和恒心，锲而不舍落 实中央八项规定精神，推进作风建设常态化 长效化，以优良作风凝心聚力、真抓实干，不 断开创事业发展新局面。C 错误。 考研政治1 0 0 题 解析分册 三 、"},
  {id:653,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"从鸦片战争开始，到1949年中华人民共和国成立前，中国都属于半殖民地半封建社会。半殖民 地半封建社会性质，决定了近代中国社会矛盾呈现错综复杂的状况。在诸多社会矛盾中，贯穿中 国半殖民地半封建社会的始终，并对近代中国社会的发展变化起着决定性作用的矛盾是 ①帝国主义和中华民族的矛盾 ②工人阶级和资产阶级的矛盾",options:["A. ①②","B. ②③","C. ①③","D. ③④"],answer:"C",explanation:"在近代中国诸多社会矛盾中，主要矛盾 是帝国主义和中华民族的矛盾、封建主义和 人民大众的矛盾。这两对主要矛盾贯穿中国 半殖民地半封建社会的始终，并对近代中国社 会的发展变化起着决定性作用。①③正确，② ④错误。因此，本题选C。"},
  {id:654,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"中国近代社会的两对主要矛盾是互相交织的，而帝国主义和中华民族的矛盾是最主要的矛盾。但 是，在某个阶段、某个时期，阶级矛盾也会上升为主要矛盾，民族矛盾退居次要地位。以下根源 于阶级矛盾上升为主要矛盾的事件是",options:["A. 义和团运动","B. 甲午战争","C. 鸦片战争","D. 辛亥革命"],answer:"D",explanation:"一般来说，当资本-帝国主义向中国发动 侵略战争时，中国内部各阶级，除一些叛国分 子外，能够暂时地团结起来进行民族战争去反 对外国侵略。这时，民族矛盾特别尖锐，阶级 矛盾暂时降到次要和服从的地位。例如，鸦 片战争、第二次鸦片战争、中法战争、中日 甲午战争、义和团运动，都有过这种情形。而 当资本-帝国主义与中国的反动统治阶级结成 同盟，用战争以外的形式共同压迫中国人民， 尤其是封建主义统治特别残酷的时候，中国人 民往往采取国内战争的形式去反对资本-帝国 主义和封建主义的同盟，而斗争的矛头主要直 接地指向中国的封建政权，这时阶级矛盾就上 升为主要矛盾，民族矛盾退居次要地位。例 如 ，太平天国农民战争和辛亥革命，就是这种 情况。D正确，A、B、C 错误。"},
  {id:655,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"清朝政府同外国侵略者签订的第一个不平等条约是",options:["A. 《 南京条约》","B. 《北京条约》","C. 《 天津条约》","D. 《 马关条约》"],answer:"A",explanation:"1842年的中英《南京条约》是清朝政 府同外国侵略者签订的第一个不平等条约。 《天津条约》签订于1858年，《北京条约》签 订于1860年，《马关条约》签订于1895年。 A正确。"},
  {id:656,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"中国沦为半殖民地半封建社会的过程中，最早出现的一个新的社会阶级是",options:["A. 官僚买办资产阶级","B. 民族资产阶级","C. 工人阶级","D. 资产阶级"],answer:"C",explanation:"无产阶级(工人阶级)是中国沦为半殖 民地半封建社会的过程中最早出现的一个新 的社会阶级。它不但是伴随着中国民族工业 的产生、发展而产生的，而且是伴随着外国资 本主义在中国直接经营的企业而产生的。C · 1000题 解析分册 史 钢 · 正确。中国资产阶级也是近代中国新产生的 阶级，它是在外国资本主义入侵的影响和刺激 下，主要由一些买办、商人、地主、官僚投资新 式企业转化而成。中国资产阶级的来源不同， 构成比较复杂。其中，有一部分是官僚买办资 本家，另一部分是民族资本家。A、B、D不符合 题意。"},
  {id:657,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"孙中山在谈到义和团运动的时候曾经说过，义和团“用大刀、肉体和联军相搏，虽然被联军打死 了几万人，伤亡枕藉，还是前仆后继，其勇锐之气殊不可当，真是令人惊奇佩服。所以经过那次 血战之后，外国人才知道中国还有民族思想，这种民族是不可消灭的”。孙中山的这段话告诉我 们一个不容抹杀的基本的历史事实，即义和团运动",options:["A. 扭转了中国在对抗帝国主义侵略中的被动局面","B. 阻止了中国的半殖民地化进程","C. 在粉碎帝国主义列强瓜分中国的斗争中发挥了重大的历史作用","D. 有力地打击了外国侵略势力，成为了中国旧式农民战争的最高峰"],answer:"C",explanation:"由于当时中国人民对帝国主义的认识 还停留在感性认识的阶段，义和团运动存在着 笼统的排外主义的错误；由于认识不到帝国主 义联合中国封建地主阶级以压迫中国人民的 实质，义和团曾经蒙受封建统治者的欺骗；由 于小生产者的局限性，义和团运动中还存在着 迷信、落后的倾向。但是，一个基本的历史事 实不容抹杀：义和团运动在粉碎帝国主义列 强瓜分中国的斗争中，发挥了重大的历史作 用。在义和团反帝爱国运动时期，中国人民以 其不畏强暴、敢与敌人血战到底的英雄气概，打 击和教训了帝国主义侵略者，使他们不敢为所 欲为地瓜分中国。C 正确。由于社会制度的腐 败这一根本原因，义和团运动没有扭转中国在 对抗帝国主义侵略中的被动局面，也无法阻止 中国的半殖民地化进程。A、B错误。太平天国 起义是中国旧式农民战争的最高峰。D 错误。"},
  {id:658,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"从鸦片战争开始，外国资本-帝国主义不断入侵中国。但是，帝国主义列强始终不能灭亡和瓜分 中国。帝国主义列强不能灭亡和瓜分近代中国的根本原因是",options:["A. 帝国主义列强之间的矛盾","B. 晚清政府的军事抵抗","C. 中华民族进行的不屈不挠的反侵略斗争","D. 中国资产阶级开始登上历史舞台"],answer:"C",explanation:"帝国主义列强不能灭亡和瓜分中国的 原因主要包括两方面：帝国主义列强之间的矛 盾和互相制约是重要原因，中华民族进行的不 屈不挠的反侵略斗争是根本原因。C 正确。"},
  {id:659,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"近代以来中华民族面临着争得民族独立、人民解放和实现国家富强、人民幸福两大历史任务。无 数的志士仁人，一代又一代的中国人，为此进行了不屈不挠、英勇顽强的斗争。近代以来的历史 表明，要争得民族独立和人民解放，必须首先",options:["A. 发展民族工商业","B. 集中力量进行现代化建设","C. 学习外国先进的军事和科学技术","D. 进行反帝反封建的民主革命"],answer:"D",explanation:"近代以来的历史表明，要争得民族独立 和人民解放必须首先进行反帝反封建的民主 革命。因为帝国主义列强决不会自动放弃在 中国攫取的特权，封建主义势力也决不肯自动 放弃自己控制的政权，所以，以改良的方式是 不可能改变帝国主义和封建主义联合统治中 国的半殖民地半封建社会制度的。D 正确。"},
  {id:660,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"帝国主义列强掀起瓜分中国的狂潮是在",options:["A. 中日甲午战争爆发后","B. 第一次鸦片战争爆发后","C. 八国联军侵华战争爆发后","D. 第二次鸦片战争爆发后"],answer:"A",explanation:"中日甲午战争后签订的《马关条约》规 定把辽东半岛和台湾、澎湖列岛割让给日本， 更大大刺激了帝国主义列强瓜分中国领土的 野心，1898年至1899年德、俄、英、法、日等国 竞相租借港湾和划分势力范围，掀起了瓜分中 国的狂潮。A正确。"},
  {id:661,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"资本一帝国主义侵略、压迫中国人民的过程，同时也是中国人民反抗它们的侵略、压迫的过程。 中国近代史上中国人民第一次大规模的反侵略武装斗争是",options:["A. 三元里人民的抗英斗争","B. 太平天国的抗击洋枪队斗争","C. 台湾高山族人民的抗日斗争","D. 义和团的抗击八国联军斗争"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:662,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"从1840年至1919年的80年间，中国人民对外来侵略进行了英勇顽强的反抗。但历次的反侵略 战争、都是以中国失败、中国政府被迫签订丧权辱国的条约而告结束的。近代中国反侵略战争 屡遭失败的最重要的原因是",options:["A. 社会制度腐败","B. 军事战略错误","C. 经济技术落后","D. 思想观念保守"],answer:"A",explanation:"腐败的中国半殖民地半封建的社会制 度，阻碍了中国人民群众的广泛动员和抵抗， 这是近代中国反侵略战争屡遭失败的最重要 的原因。近代中国反侵略战争失败的另一个 重要原因，是国家综合实力特别是经济技术 的落后。A 正确。"},
  {id:663,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"帝国主义的侵略给中华民族带来了巨大的灾难。但是，列强发动的侵华战争以及中国反侵略战 争的失败，从反面教育了中国人民，极大地促进了中国人的思考、探索和奋起。以下属于中日 甲午战争爆发后提出的口号的是",options:["A. “师夷长技以制夷”","B. “睁眼看世界”","C. “振兴中华”","D. “自强”“求富”"],answer:"C",explanation:"中国在甲午战争中的失败，对中国人 的刺激极大。民族危机激发了中华民族的觉 醒，增强了中华民族的凝聚力。中国自古以 来的“天下兴亡，匹夫有责”的优良传统，得到 了发扬和升华。救亡图存成了时代的主旋 律。1894年11 月，在檀香山召开的兴中会 成立大会通过了由孙中山亲自草拟的《兴中 会章程》。在章程中，孙中山喊出了“振兴中 华”的口号。(真题2024年第11题考的就是 这个口号的内容)C 正确。“师夷长技以制 夷”是魏源在1843年1 月编成的《海国图 志》中提出的，A 错误。“睁眼看世界”是鸦片 战争以后先进的中国人提出的，B 错误。“自 强”“求富”是洋务派在洋务运动中提出的，D 错误。"},
  {id:664,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"甲午战争后，严复翻译的《天演论》所宣传的重要思想是",options:["A. “ 师夷长技以制夷”","B. “ 中学为体，西学为用”","C. “ 物竞天择，适者生存”","D. “天下兴亡，匹夫有责”"],answer:"C",explanation:"中国在甲午战争中的失败，对中国人 的刺激极大。接踵而来的瓜分狂潮，更使中 华民族的各阶级、各阶层普遍产生了亡国灭 种的危机感。严复翻译了《天演论》(1898年 正式出版),他用“物竞天择”“适者生存”的 社会进化论思想，为这种危机意识和民族意 识提供了理论根据。《天演论》对中国人无异 于是振聋发聩的警世钟。C 正确。“师夷长 技以制夷”是魏源在《海国图志》中提出的； “中学为体，西学为用”是洋务派兴办洋务事 业的指导思想；“天下兴亡，匹夫有责”表达的 是爱国情怀。A、B、D 错误。"},
  {id:665,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"《天朝田亩制度》是太平天国定都天京后颁布的最能体现太平天国社会理想和这次农民起义特 色的纲领性文件；《资政新篇》是太平天国后期颁布的社会发展方案。二者的共同点在于",options:["A. 都主张向西方学习先进的制度","B. 都主张在中国发展资本主义","C. 都在实践中得到贯彻","D. 都具有反封建的进步性"],answer:"D",explanation:"《天朝田亩制度》是最能体现太平天国 社会理想和这次农民起义特色的纲领性文 件。它从根本上否定了封建社会的基础即封 建地主的土地所有制，体现了广大农民要求 平均分配土地的强烈愿望，具有进步意义。 《资政新篇》则是中国近代历史上第一个比较 系统的发展资本主义的方案，具有明显的反 封建的进步性。D正确。 《资政新篇》主张向西方学习先进的制 度，主张在中国发展资本主义，而《天朝田亩 制度》没有这些思想，A、B 错误。《天朝田亩 制度》中的平分土地方案即使在太平军占领 地区也并未付诸实施，《资政新篇》限于当时 的历史条件，也未能付诸实施，C 错误。"},
  {id:666,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"19世纪60年代到90年代，清朝统治阶级内部的洋务派兴办近代企业，建立新式海陆军，创办 新式学堂，派遣留学生。洋务派兴办洋务的主要目的是",options:["A. 发展资本主义","B. 维护封建统治","C. 对抗顽固派","D. 迎合帝国主义"],answer:"B",explanation:"洋务派兴办洋务事业，首先是为了购 买和制造洋枪洋炮以镇压农民起义，同时也 有借此加强海防、边防，并乘机发展本集团的 政治、经济、军事实力的意图。洋务运动的指 导思想是“中学为体，西学为用”,企图以吸取 西方近代生产技术为手段，来达到维护和巩 固中国封建统治的目的，这就决定了它必然 失败的命运。B 正确。 洋务派兴办洋务新政，主要是为了维护 封建统治，并不是要使中国朝着独立的资本 主义方向发展；不是为了迎合帝国主义，因为 兴办军事工业也包含有对抗帝国主义的意 图；也不是为了对抗顽固派，而是为了购买和 制造洋枪洋炮以镇压农民起义，巩固自己的 统治。A、C、D不符合题意。"},
  {id:667,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"洋务派继承了魏源“师夷长技以制夷”的思想，提出“自强”“求富”的主张，通过所掌握的 国家权力集中力量优先发展",options:["A. 官办企业","B. 民用企业","C. 军事工业","D. 邮政铁路"],answer:"C",explanation:"洋务派提出“自强”“求富”的主张，通过 所掌握的国家权力集中力量优先发展军事工 业，同时也试图“稍分洋商之利”,发展若干民 用企业，在客观上对中国的早期工业和民族资 本主义的发展起了某些促进作用。C 正确。"},
  {id:668,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"洋务派所标榜的洋务运动的目标是",options:["A. “自强”“求富”","B. “ 师夷长技以制爽”","C. “中学为体，西学为用”","D. “振兴中华”"],answer:"A",explanation:"“自强”“求富”是洋务运动的目标。 A正确。“中学为体，西学为用”是洋务派兴 办洋务事业的指导思想；“师夷长技以制夷” 是魏源在《海国图志》中提出的；“振兴中华” 是孙中山提出的。B、C、D 错误。"},
  {id:669,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"洋务运动期间，洋务派兴办的民用企业中，采取官督商办方式的企业基本上是",options:["A. 买办官僚性质的","B. 封建主义性质的","C. 半封建半殖民地性质的","D. 资本主义性质的"],answer:"D",explanation:"洋务派兴办的官督商办的民用企业， 虽然受官僚的控制，发展受到很大限制，但基 1000题 >>>解析分册 本上是资本主义性质的近代企业。D 正确， A、B、C错误。"},
  {id:670,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"中国近代教育开始于",options:["A. 洋务运动时期","B. 戊戌维新运动时期","C. 辛亥革命时期","D. 新文化运动时期"],answer:"A",explanation:"洋务运动时期，为了培养通晓洋务的 人才，开办了一批新式学堂，派出了最早的官 派留学生，这是中国近代教育的开始。与此 同时，还翻译了一批近代自然科学书籍，给当 时的中国带来了新的知识，使人们开阔了眼 界。A正确，B、C、D 错误。"},
  {id:671,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"甲午战争一役，洋务派经营多年的北洋海军全军覆没，标志着以“自强”“求富”为目标的洋 务运动的失败。决定洋务运动必然失败命运的原因是",options:["A. 洋务运动具有封建性","B. 洋务运动对列强具有依赖性","C. 洋务企业的管理具有腐朽性","D. 资产阶级维新派的强烈反对"],answer:"A",explanation:"洋务运动具有封建性。洋务运动的指 导思想是“中学为体，西学为用”,企图以吸取 西方近代生产技术为手段，来达到维护和巩 固中国封建统治的目的，这就决定了它必然 失败的命运。因为新的生产力是同封建主义 的生产关系及其上层建筑不相容的，是不可 能在封建主义的桎梏下充分地发展起来的。 A正确。洋务运动对列强具有依赖性和洋务 企业的管理具有腐朽性，也是洋务运动失败 的原因，但不是决定性的原因。B、C 错误。 维新派是在甲午战争失败后民族意识开始普 遍觉醒的19世纪末才出现的。D 错误。"},
  {id:672,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"近代中国资产阶级思想与封建主义思想的第一次正面交锋是",options:["A. “ 师夷长技以制夷”主张的提出","B. 洋务派与顽固派的论战","C. 维新派与守旧派的论战","D. 新文化运动倡导者对以孔子为代表的“往圣先贤”的猛烈抨击"],answer:"C",explanation:"维新派与守旧派的论战，实质上是资 产阶级思想与封建主义思想在中国的第一次 正面交锋。通过论战，西方资产阶级社会政 治学说在中国得到进一步的传播，戊戌变法 运动的帷幕随之拉开。C 正确，A、B、D 错误。"},
  {id:673,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"在维新派与守旧派之间的激烈论战中，守旧派认为“民权之说，无一益而有百害”,“民权之说 一倡，愚民必喜，乱民必作，纪纲不行，大乱四起。”维新派则运用西方资产阶级政治学说，对 封建君主专制制度作了批判。谭嗣同指出：“君末也；民本也。”严复甚至认为，国家是“民之公 产”,王侯将相不过是“通国之公仆隶”,而专制帝王则是“窃国者耳”。这说明维新派主张",options:["A. 只有“兴民权改民主”,才是中国的唯一出路","B. 推翻帝制，实行共和","C. 进行社会革命","D. 兴民权、设议院，实行君主立宪"],answer:"D",explanation:"要不要兴民权、设议院，实行君主立宪 是维新派与守旧派论战的问题之一。维新派 认为只有君主立宪制度才是当时中国理想的 政治方案，兴民权、设议院，实行君主立宪，才 是“治国之大经”。D 正确。A、B、C都是资产 阶级革命派与改良派论战中革命派的观点。"},
  {id:674,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"甲午战争后，维新运动迅速兴起。针对洋务派提出的“中体西用”的方针，维新派指出，体与 用是不可分的。中学有中学的“体”与“用”, 西学有西学的“体”与“用”,把中学之“体” 与西学之“用”凑在一起，就如同让“牛体”产生“马用”一样荒谬。维新派与洋务派分歧的 实质是",options:["A. 要不要进行社会革命","B. 要不要以革命手段推翻清王朝","C. 要不要在中国兴办近代企业","D. 要不要学习西方的政治制度与思想文化"],answer:"D",explanation:"维新派对洋务派“中体西用”的驳斥说 明，维新派认为不仅应当学习西方近代科学 技术，而且应当学习西方的政治制度与思想 文化。因此，维新派与洋务派分歧的实质是 要不要学习西方的政治制度与思想文化。D 正确。A、B两项的内容是1905年至1907年 间，以孙中山为代表的革命派与以康有为、梁 启超为代表的改良派之间争论的问题，与题 意不符，不选。在中国兴办近代企业，是维新 派与洋务派都赞同的，并不是维新派与洋务 派的分歧，更不是分歧的实质，C 错误。"},
  {id:675,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"洋务运动是在19世纪60年代初第二次鸦片战争结束后，在清政府镇压太平天国起义与捻军起 义的过程中兴起的。维新运动发生于19世纪90年代。维新运动与洋务运动的主要不同点在于",options:["A. 洋务运动只学习西方技术，维新运动主张学习西方政治制度","B. 洋务运动依靠封建统治阶级中的部分成员，维新运动依靠下层群众","C. 洋务运动维护封建统治，维新运动否定封建主义","D. 洋务运动实现了预期目标，维新运动昙花一现"],answer:"A",explanation:"精讲P217 考点15 - 1-1 洋务运动坚持“中学为体，西学为用”. 仅引进西方技术而不改变政治制度。维新派 突破洋务派“中体西用”思想的局限，主张 学习西方政治制度，用君主立宪制取代君主 专制制度。戊戌维新运动虽然未能成功地建 立起资本主义的君主立宪制度，其颁布的促 进民族资本主义发展的若干措施也未能生 效，但在政治、经济等领域一定程度上冲击了 封建制度。A 正确。 洋务运动是由封建统治阶级中的部分成 员如奕诉、曾国藩、李鸿章、左宗棠、张之洞等 发起的，这些官员被称为“洋务派”。他们发 起洋务运动主要是为了维护封建统治，并不 是要使中国朝着独立的资本主义方向发展。 维新派的局限性突出地表现为不敢否定封建 主义。他们在政治上不敢根本否定封建君主 制度，只是幻想依靠光绪皇帝“以君权雷厉风 行”,通过和平、合法的手段，实现自上而下的 改良，让资产阶级和开明士绅的代表参加政 权，逐步实现君主立宪。维新派的活动基本 上局限于官僚士大夫和知识分子的小圈子。 他们不但脱离人民群众，而且惧怕甚至仇视 人民群众。B、C错误。洋务运动历时30多 年，虽然办起了一批企业，建立了海军，却没有 使中国富强起来。甲午战争一役，洋务派经营 多年的北洋海军全军覆没，标志着以“自强” “求富”为目标的洋务运动的失败。D 错误。"},
  {id:676,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"清政府于1901年宣布实行“新政”以后，又于1906年宣布“预备仿行宪政”,并于1908年颁 布了《钦定宪法大纲》,制定了预备立宪期为9年的君主立宪方案。清政府改革的根本目的在于",options:["A. 延续清王朝的反动统治","B. 发展资本主义","C. 缓和阶级矛盾","D. 挽救民族危机"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:677,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"孙中山认为，西方资本主义在发展中出现了诸多社会问题。针对这些问题，他试图探讨一种一劳 永逸的办法，既使中国富强，又避免产生贫富悬殊的现象，避免社会危机。为此，孙中山提出了",options:["A. 民族主义","B. 民权主义","C. 民主主义","D. 民生主义"],answer:"D",explanation:"孙中山认为，西方资本主义发展中的 诸多社会问题，其根源在于未能解决土地问 题，因此他试图探讨一种一劳永逸的办法，既 使中国富强，又避免产生贫富悬殊的现象，避 免社会危机。为此，他希望“举政治革命、社 会革命毕其功于一役”,提出了民生主义。民 生主义在当时指的是“平均地权”,也就是孙 中山所说的社会革命。D正确。"},
  {id:678,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1905年11月，在同盟会机关报《民报》发刊词中，孙中山将同盟会的纲领概括为三大主义， 即民族主义、民权主义、民生主义，后被称为三民主义。其中民生主义指的是“平均地权”,所 采用的方法是",options:["A. 征收地价税和土地增价归公","B. 将土地所有权分给农民","C. 废除封建土地所有制，但保留资产阶级的土地","D. 核定全国土地，按照“耕者有其田”的原则平分给农民"],answer:"A",explanation:"民生主义即社会革命，指的是“平均地 权”,也就是核定全国土地的地价，其现有之 地价，仍属原主；革命后的增价，则归国 家，为国民共享。国家还可按原定地价收买 地主的土地。A 正确。但是，“平均地权”并 非将土地所有权分给农民，没有正面触及封 建土地所有制，不能满足广大农民的土地要 求，在革命中难以成为发动广大工农群众的 理论武器。B、C、D 错误。"},
  {id:679,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"孙中山将同盟会的纲领概括为三大主义，即民族主义、民权主义、民生主义。其中民族主义包 括“驱除鞑虏，恢复中华”两项内容。孙中山指出，民族主义是“要将满洲政府所有压制人民 之手段、专制不平之政治、暴虐残忍之刑罚、勒派加抽之苛捐与及满洲政府所纵容之虎狼官吏， 一切扫除”。孙中山的民族主义是要",options:["A. 结束清政府的专制统治及其媚外政策","B. 通过驱逐所有满人来改变民族歧视和民族压迫政策","C. 把汉族军阀、官僚、地主也作为革命对象一并消灭","D. 把民族革命作为政治革命的前提"],answer:"A",explanation:"民族主义，即民族革命，包括“驱除鞑 虏，恢复中华”两项内容。一 是要以革命手段 推翻清朝政府，改变它一贯推行的民族歧视 和民族压迫政策；二是建立中华民族“独立的 国家”。孙中山指出，民族主义不是简单的排 满，不是针对一切满人，而是要结束清政府 的专制统治及其媚外政策。A 正确，B 错误。 但是，同盟会纲领中的民族主义一方面 没有明确的反帝纲领，放走了中国人民的最 大敌人。当时的革命派对于帝国主义的本质 认识不清，害怕帝国主义干涉，甚至幻想以承 认不平等条约“继续有效”为条件来换取列强 对自己的支持。另一方面，革命派强调了对 满族封建势力的清除而放松了汉族封建势 · 1000题 >>>解析分册 · 力，结果就是保留了大量封建势力，导致了辛 亥革命后封建势力的反扑。革命派没有明确 地把汉族军阀、官僚、地主作为革命对象，从 而给了这部分人后来从内部和外部破坏革命 以可乘之机。C 错误。孙中山强调，政治革 命应当与民族革命并行。 民族革命是扫除 “现在的恶劣政治”,而政治革命则是扫除“恶 劣政治的根本”,从而把斗争矛头直接指向集 国内民族压迫与封建专制统治于一身的清政 府。 D 错误。"},
  {id:680,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1956年，毛泽东在《纪念孙中山先生》一文中指出：“纪念伟大的革命先行者孙中山先生!纪 念他在中国民主革命准备时期，以鲜明的中国革命民主派立场，同中国改良派作了尖锐的斗争。 他在这一场斗争中是中国革命民主派的旗帜。”1905年至1907年间资产阶级革命派和改良派论 战的焦点是",options:["A. 要不要以革命手段推翻清王朝","B. 要不要推翻帝制，实行共和","C. 要不要反对外国帝国主义列强的侵略","D. 要不要进行社会革命"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:681,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"中国资产阶级革命派与改良派的根本不同之处在于，资产阶级革命派 ①在踏上革命道路之时就高举起民主革命的旗帜 ② 始终重视广泛动员人民群众的力量 ③最先制定了明确的反帝反封建的革命纲领 ④选择了以武装起义推翻清王朝统治的斗争方式",options:["A. ①②","B. ②③","C. ③④","D. ①④"],answer:"D",explanation:"中国革命的许多先驱者早年也曾尝试 采取和平的手段来推进中国的变革与进步。 1894年，孙中山北上京津向李鸿章上书，提 出“人能尽其才，地能尽其利，物能尽其用，货 能畅其流”的主张。可见，孙中山也曾寄希望 于进行自上而下的改革，但是李鸿章并没有 重视他的意见。孙中山在北上京津的过程 中，发现清政府的腐败比他原先了解的要严 重得多。这时，他“积渐而知和平之手段不得 不稍易以强迫”,决心以革命的方式推翻清朝 的统治。以孙中山为首的资产阶级革命派在 踏上革命道路之时，就高举起民主革命的旗 帜，并选择了以武装起义推翻清王朝统治的 斗争方式。这也是中国资产阶级革命派与改 良派的根本不同之处。①④正确。没有提出 彻底的反帝反封建的革命纲领、不能充分发 动和依靠人民群众、不能建立坚强的革命政 党是辛亥革命失败的主观方面的原因。②③ 错误，也不符合题意。因此，本题选D。"},
  {id:682,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1840年鸦片战争以后，西方列强在中华大地上恣意妄为，封建统治者孱弱无能，中国逐步成为 半殖民地半封建社会，国家蒙辱、人民蒙难、文明蒙尘，中国人民和中华民族遭受了前所未有 的劫难。英雄的中国人民始终没有屈服，在救亡图存的道路上一次次抗争、一次次求索，展现 了不畏强暴、自强不息的顽强意志。其中，拉开了近代以来中国发生的深刻社会变革序幕的事 件是",options:["A. 新文化运动","B. 五四运动","C. 中国共产党成立","D. 辛亥革命"],answer:"D",explanation:"习近平在纪念辛亥革命110周年大会 上的讲话中指出，110年前，以孙中山先生为 代表的革命党人发动了震惊世界的辛亥革 命，推翻了清朝政府，结束了在中国延续几千 年的君主专制制度，近代以来中国发生的深 刻社会变革由此拉开了序幕。这是中国人民 和中国先进分子为实现民族独立、人民解放 进行的一次伟大而艰辛探索。D正确。"},
  {id:683,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"毛泽东说过，“民国元年的《中华民国临时约法》,在那个时期是一个比较好的东西；当然，是 不完全的、有缺点的”。这里之所以说《中华民国临时约法》“在那个时期是一个比较好的东 西”,是因为它",options:["A. 以根本大法的形式否定了封建土地所有制","B. 带有革命性、民主性","C. 是中国近代历史上第一个比较系统的发展资本主义的方案","D. 明确拒绝承认清政府与列强所订的一切不平等条约"],answer:"B",explanation:")毛泽东说：“民国元年的《中华民国临 时约法》,在那个时期是一个比较好的东西； 当然，是不完全的、有缺点的，是资产阶级性 的，但它带有革命性、民主性。”B正确。 《中华民国临时约法》以根本大法的形式 废除了2000多年来的封建君主专制制度，确 认了资产阶级共和国的政治制度。但是，南 京临时政府没有提出任何可以满足农民土地 要求的政策和措施，反而以保护私有财产为 借口，去维护封建土地制度以及官僚、地主所 占有的土地和财产。A 错误。南京临时政府 在《告友邦书》中还试图用承认清政府与列强 所订的一切不平等条约和清政府所欠的一切 外债，来换取列强承认中华民国。这是南京 临时政府的局限性。D 错误。《资政新篇》是 中国近代历史上第一个比较系统的发展资本 主义的方案。C 错误。"},
  {id:684,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"“无量头颅无血，可怜购得假共和”,这是辛亥革命亲历者的血泪之作。辛亥革命“只把一个 皇帝赶跑”,中国仍旧在帝国主义和封建主义的压迫之下，反帝反封建的革命任务并没有完成。 辛亥革命之所以失败，从根本上说，是因为",options:["A. 中国民族资产阶级的软弱性和妥协性","B. 没有提出彻底的反帝反封建的革命纲领","C. 没有坚强的革命政党作为团结一切革命力量的强有力的核心","D. 在帝国主义时代，在半殖民地半封建的中国，资本主义的建国方案行不通"],answer:"D",explanation:"辛亥革命之所以失败，从根本上说，是 因为在帝国主义时代，在半殖民地半封建的 中 国，资本主义的建国方案是行不通的。尽 管当时先进的中国人真诚地希望把中国建设 成为资产阶级共和国，但是，帝国主义决不容 中国近现代史纲要 ·单项选择题"},
  {id:685,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"孙中山指出，辛亥革命之所以失败，“非袁氏兵力之强，实同党人心之涣”。从主观方面讲，辛 亥革命之所以失败，在于它的领导者资产阶级革命派本身存在着许多弱点和错误。资产阶级革 命派的这些弱点、错误，从根源上讲，在于",options:["A. 不能充分发动和依靠人民群众","B. 中国资产阶级革命派内部组织的松散和分化","C. 中国民族资产阶级的软弱性和妥协性","D. 没有提出彻底的反帝反封建的革命纲领"],answer:"C",explanation:"从主观方面讲，辛亥革命之所以失败， 是因为没有提出彻底的反帝反封建的革命纲 领，不能充分发动和依靠人民群众，不能建立 坚强的革命政党作为团结一切革命力量的强 有力的核心。资产阶级革命派的这些弱点、 错误，根源于中国民族资产阶级的软弱性和 妥协性。正因为如此，辛亥革命仅仅赶跑了 一个皇帝，却没有能够改变封建主义和军阀 官僚政治的统治基础，无法完成反帝反封建 的任务。C 正确。A、B、D是资产阶级革命派 的具体的弱点、错误，不是产生这些弱点、错 误的根源，不符合题意。"},
  {id:686,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"袁世凯窃夺辛亥革命的果实之后，建立了代表大地主和买办资产阶级利益的北洋军阀反动政权。 袁世凯当权时，北洋政府统治下的中国在形式上是统一的。在1916年袁世凯称帝败亡之后，中 国陷入了军阀割据的局面。这种局面的形成有其深刻的原因，主要是 ①中国主要是地方性的农业经济而没有形成统一的资本主义市场 ②帝国主义国家在中国采取划分势力范围的分裂剥削政策 ③尊孔复古思潮与民主共和思想反复拉锯造成了文化上的混乱 ④民族矛盾超过阶级矛盾成为当时中国社会的主要矛盾",options:["A. ①②","B. ①③","C. ②④","D. ③④"],answer:"A",explanation:")袁世凯当权时，北洋政府统治下的中 国在形式上是统一的。在1916年袁世凯称 帝败亡之后，连这种形式上的统一也维持不 住了，中国陷入了军阀割据的局面。这种局 面的形成有其深刻的原因：一方面是由于中 国主要是地方性的农业经济而没有形成统一 的资本主义市场，另一方面是由于帝国主义 国家在中国采取划分势力范围的分裂剥削政 策。①②正确。因此，本题选A。"},
  {id:687,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"新文化运动的倡导者猛烈抨击以孔子为代表的“往圣先贤”,大力提倡新道德、反对旧道德，提 倡新文学、反对旧文学，包括提倡白话文、反对文言文。新文化运动的倡导者批判孔学，是 为了",options:["A. 给中国发展资本主义扫清障碍","B. 促进马克思主义在中国的传播及其同中国工人运动的结合","C. 否定中国的全部传统文化","D. 推翻清政府这个“洋人的朝廷”"],answer:"A",explanation:"新文化运动的倡导者以进化论观点和 个性解放思想为主要武器，猛烈抨击以孔子 为代表的“往圣先贤”,大力提倡新道德、反对 旧道德，提倡新文学、反对旧文学，包括提倡 白话文、反对文言文。通过批判孔学，动摇了 封建正统思想的统治地位，在中国社会掀起 一股思想解放的潮流。新文化运动的倡导者 批判孔学，是为了给中国发展资本主义扫清 障碍。A 正确。 五四运动促进了马克思主义在中国的传 播及其同中国工人运动的结合。B 错误。新 文化运动提倡民主和科学，搞新文化运动，并 不是要否定中国的全部传统文化。C 错误。 新文化运动是在1915年开始的，清政府这个 “洋人的朝廷”早已被推翻。D 错误。 ·"},
  {id:688,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"新文化运动的倡导者猛烈抨击以孔子为代表的“往圣先贤”。通过批判孔学，动摇了封建正统思 想的统治地位，在中国社会掀起一股思想解放的潮流。五四前新文化运动的侣导者所使用的主 要武器是 ①马克思主义的民主与科学理论 ② 个性解放思想 ③中华优秀传统文化的民本思想 ④进化论观点",options:["A. ①②","B. ②③","C. ③④","D. ②④"],answer:"D",explanation:"（本题解析见原书解析分册）"},
  {id:689,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1919年5月爆发的五四运动，是中国近代史上一个划时代的事件。关于五四运动，以下说法正 确的是",options:["A. 改变了中国半殖民地半封建社会的性质，中国革命从此进入新民主主义革命时期","B. 工人阶级开始代替资产阶级成了资产阶级民主革命的主力军","C. 促进了新思想的传播，为新文化运动的兴起准备了理论基础","D. 表现了反帝反封建的彻底性"],answer:"D",explanation:"五四运动是中国革命的新阶段即新民 主主义革命阶段的开端，但它没有改变中国 半殖民地半封建社会的性质；工人阶级是新 民主主义革命的领导阶级，但不是主力军(民 主革命的主力军是农民);五四运动发生在新 127 20 考研政治 1000题 >>>解析分册 · 文化运动之后，A、B、C 错误。D符合题意。"},
  {id:690,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1919年5月爆发的五四运动，是中国近代史上的一个划时代的事件。这场运动中提出了“改造 强盗世界，不认秘密外交，实行民族自决”和“另起炉灶，组织新政府”这样的口号。这表明",options:["A. 中国人民对帝国主义的认识进到了理性的认识阶段","B. 五四运动是一次真正的群众运动","C. 以学生为主体的中国青年是近代中国最革命的阶级","D. 中国人民的民族意识开始普遍觉醒"],answer:"A",explanation:"近代以来，中国人民对帝国主义的认 识经历了两个阶段。第一阶段是表面的感性 认识阶段，这典型地表现在义和团等笼统的 排外主义的斗争上。第二阶段才进到理性的 认识阶段，即看出了帝国主义内部和外部的 各种矛盾，并看出了帝国主义联合中国买办 阶级和封建阶级以压榨中国人民大众的实 质，这种认识是从1919年五四运动前后才 开始的。在这场运动中，提出了“改造强盗世 界，不认秘密外交，实行民族自决”和“另起炉 灶，组织新政府”这样的口号。这表明，中国 人民反帝反封建的斗争提升到一个新的水平 线上了。A正确。 工人阶级是近代中国最革命的阶级；甲 午战争失败后，帝国主义列强掀起了瓜分中 国的狂潮，中国人民的民族意识开始普遍觉 醒。C、D错误。B 不符合题意。"},
  {id:691,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"从1860年到1937年，不到100年的时间里，中国首都三次被外敌攻陷，中国人民身处“覆屋 之下、漏舟之中、薪火之上”。民族危机激发了中华民族的觉醒，增强了中华民族的凝聚力。实 现了中国人民和中华民族自鸦片战争以来第一次全面觉醒的历史事件是",options:["A. 辛亥革命","B. 甲午战争","C. 维新运动","D. 五四运动"],answer:"D",explanation:"（本题解析见原书解析分册）"},
  {id:692,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"五四运动是中国近现代史上具有划时代意义的一个重大事件，以磅礴之力鼓动了中国人民和中 华民族实现民族复兴的志向和信心。五四运动孕育了五四精神，五四精神的核心是",options:["A. 民主和科学","B. 追求真理","C. 追求进步","D. 爱国主义"],answer:"D",explanation:"（本题解析见原书解析分册）"},
  {id:693,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"十月革命发生在其国情与中国相同或近似的俄国，因而对中国的先进分子具有特殊吸引力。青 年毛泽东说，“我看俄国式的革命，是无可如何的山穷水尽诸路皆走不通了的一个变计”,“只此 方法较之别的改造方法所含可能的性质为多”。十月革命发生时的俄国国情与中国“相同或近 似”是指 ①半殖民地半封建的社会性质 ②“三座大山”阻碍了社会进步和发展 ③封建压迫严重 ④经济文化落后",options:["A. ①②","B. ①④","C. ②④","D. ③④"],answer:"D",explanation:"十月革命发生在其国情与中国相同 (封建压迫严重)或近似(经济文化落后) 的俄国，因而对中国的先进分子具有特殊吸 引力。③④正确。俄国不是半殖民地半封建 性质的社会，也不存在“三座大山”。①②错 误。因此，本题选D。"},
