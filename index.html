  {id:694,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"在中国大地上率先举起马克思主义旗帜的，是李大钊。李大钊是从爱国的立场出发，从民主主 义者转变为共产主义者的。从1918年7月起，他先后发表《法俄革命之比较观》《庶民的胜 利》《Bolshevism的胜利》等文章，热情讴歌十月革命的胜利，指出十月革命是“二十世纪中 世界革命的先声”,确信“将来的环球，必是赤旗的世界”。五四运动后，他更加致力于马克思 主义的宜传。1919年9月、11月，李大钊发表《我的马克思主义观》一文，在当时思想界产生 了重大影响，标志着",options:["A. 马克思主义开始与中国工人运动相结合","B. 马克思主义在中国进入比较系统的传播阶段","C. 马克思主义成为中国共产党的指导思想","D. 中国先进分子把目光从资产阶级民主主义转向社会主义"],answer:"B",explanation:"1919年9月、11月，李大钊发表《我的 马克思主义观》一文，比较系统地介绍了马克 思主义理论，在当时思想界产生重大影响，标 志着马克思主义在中国进入比较系统的传播 阶段。B正确。"},
  {id:695,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"五四运动后，社会主义思潮在中国蓬勃兴起，马克思主义开始在知识界广泛传播。中国早期信 仰马克思主义的人物主要有三种类型，其主体部分是",options:["A. 五四爱国运动的左翼骨干","B. 新文化运动的精神领袖","C. 一部分原中国同盟会会员、辛亥革命时期的活动家","D. 第一批工人运动的组织者"],answer:"A",explanation:"中国早期马克思主义者的队伍，主要 是由新文化运动的精神领袖、五四爱国运动 的左翼骨干和一部分原中国同盟会会员、辛 亥革命时期的活动家三类人组成的。其中， 李大钊、陈独秀属于先驱者和擎旗人，毛泽东 等五四爱国运动的左翼骨干则是其主体部 分。A 正确，B、C、D 错误。"},
  {id:696,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"在中国早期马克思主义者的队伍中，李大钊是代表人物。1919年8月，李大钊在《再论问题与 主义》一文中指出：“一个社会主义者，为使他的主义在世界上发生一些影响，必须要研究怎么 可以把他的理想尽量应用于环绕着他的实境。”在《我的马克思主义观》一文中，他一方面肯定 马克思主义是“世界改造原动的学说”,具有普遍意义；另一方面又指出，“马氏的学说，实在 是一个时代的产物”,我们不可以不考虑我们的环境“就那样整个拿来，应用于我们生存的社 会”。这说明，中国早期马克思主义者",options:["A. 开始认识到必须把改造国民性置于优先地位","B. 已在实际上初步形成了马克思主义应当与中国具体实际相结合的思想","C. 仍然在马克思主义与社会民主主义等流派中进行反复比较","D. 明确提出马克思主义时代化的任务"],answer:"B",explanation:"早期马克思主义思想运动具有以下特 点：①重视对马克思主义基本理论的学习，明 确地同第二国际的社会民主主义划清界限。 在当时的国际共产主义运动中，存在着马克 思主义与社会民主主义、修正主义的严重对 立。中国先进分子对社会民主主义、修正主 义采取了明确的批判态度。毛泽东说，“社会 民主主义，借议会为改造工具，但事实上议会 的立法总是保护有产阶级的”。这说明，中国 早期马克思主义思想运动一开始就坚持了马 克思主义的革命原则和正确方向。2注意从 中国的实际出发，学习、运用马克思主义。李 大钊在《再论问题与主义》和《我的马克思主 义观》中的表述说明，中国早期马克思主义者 已在实际上初步形成了马克思主义应当与中 国具体实际相结合的思想。3开始提出知识 分子应当同劳动群众相结合的思想。 B 正 确，C错误。 五四以前的新文化运动的倡导者就已经 把改造国民性置于优先地位。A 错误。在党 的六届六中全会上，毛泽东明确提出“马克思 主义的中国化”命题。党的十八大以来，以习 近平同志为核心的党中央明确提出要不断推 进马克思主义中国化时代化。D错误。 意。因此，本题选C。"},
  {id:697,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"近代以后中国人民的反帝反封建斗争之所以屡遭挫折和失败，最重要的原因就是",options:["A. 没能够充分地发动群众","B. 中国人民的民族意识没有普遍觉醒","C. 没有先进的坚强的政党作为凝聚力量的领导核心","D. 没有把阶级矛盾当作中国社会最主要的矛盾"],answer:"C",explanation:"近代以后中国人民的反帝反封建斗争 之所以屡遭挫折和失败，最重要的原因就是 没有先进的坚强的政党作为凝聚力量的领导 核心。中国共产党的诞生，从根本上改变了 这种局面。C 正确。"},
  {id:698,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"中共一大确定党的名称为“中国共产党”。大会通过了中国共产党第一个纲领，明确“革命军队 必须与无产阶级一起推翻资本家阶级的政权”,“承认无产阶级专政，直到阶级斗争结束”,“消 灭资本家私有制”,以及联合第三国际。大会在讨论实际工作计划时，决定首先",options:["A. 集中精力研究和宣传马克思主义","B. 集中精力组织农民","C. 集中精力组织工人","D. 集中精力介绍俄国“十月革命”"],answer:"C",explanation:"中国共产党一经成立，就旗帜鲜明地 把社会主义和共产主义规定为自己的奋斗目 标，坚持用革命的手段实现这个目标。大会 在讨论实际工作计划时，决定首先集中精力 组织工人。C 正确，A、B、D 错误。"},
  {id:699,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"在1922年召开的中共二大上，中国共产党第一次明确提出了",options:["A. 新民主主义革命总路线","B. 无产阶级领导权","C. 土地革命的总路线","D. 反帝反封建的民主革命纲领"],answer:"D",explanation:"中共二大第一次明确提出了反帝反封 建的民主革命纲领。D 正确。1939年毛泽 东在《中国革命和中国共产党》一文中，第一 次提出了新民主主义革命的科学概念和总路 线的内容。1948年，他在《在晋绥干部会议 上的讲话》中完整地表述了总路线的内容和 土地革命的总路线。A、C 错误。第一次明确 提出坚持无产阶级领导权和农民同盟军的思 想是在中共四大，B 错误。"},
  {id:700,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"在新民主主义革命时期，中国共产党与国民党实行过两次合作，第一次是建立国民革命联合战 线 ，第二次是建立抗日民族统一战线。以下选项中正确反映第一次国共合作的是",options:["A. 广泛的民族性和复杂的阶级矛盾","B. 国共双方有政权有军队的合作","C. 合作双方采取党外合作的组织形式","D. 合作双方具有共同的政治基础"],answer:"D",explanation:"孙中山的新三民主义的政纲同中国共 产党在民主革命阶段的纲领基本一致，因而 成为第一次国共合作的政治基础，D 正确。 A、B是第二次国共合作的特点，不选。第一 次国共合作是采取党内合作的形式，C错误。"},
  {id:701,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1924年1月， 中国国民党第一次全国代表大会由孙中山主持在广州举行。大会审议通过的《中 国国民党第一次全国代表大会宣言》,对三民主义作出新的解释，即“新三民主义”。新三民主 义的“新”体现在 ① 在民族主义中突出了反对帝国主义的内容 ② 在民权主义中强调民主权利应“为一般平民所共有” ③ 在民主主义中强调只有“兴民权改民主”才是中国的唯一出路 ④把民生主义概括为“平均地权”和“节制资本”两大原则",options:["A. ①②③","B. ②③④","C. ①②④","D. ①③④"],answer:"C",explanation:")①②④正确。“只有‘兴民权改民主’, 才是中国的唯一出路”,是1905年至1907年 间革命派与改良派就“要不要推翻帝制，实行 共和”进行论战时革命派的观点，③不符合题"},
  {id:702,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1924年1月.中国国民党第一次全国代表大会在广州召开，大会通过的宜言对三民主义作出了 新的解释。新三民主义成为第一次国共合作的政治基础，究其原因，是由于新三民主义的政纲",options:["A. 把民生主义概括为“平均地权”","B. 把斗争的矛头直接指向北洋军阀","C. 体现了联俄、联共、扶助农工三大革命政策","D. 同中国共产党在民主革命阶段的纲领基本一致"],answer:"D",explanation:"孙中山的新三民主义的政纲同中国共 产党在民主革命阶段的纲领基本一致，因而 成为第一次国共合作的政治基础。D 正确。"},
  {id:703,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1924 年国共合作的形成，加快了中国革命前进的步伐，1925年出现了全国范围的大革命高潮。 掀起这一大革命高潮的起点是",options:["A. 五卅运动","B. 省港大罢工","C. 国民政府在广州建立","D. 北伐战争开始"],answer:"A",explanation:"1925年5月，以五卅运动为起点，掀 起了全国范围的大革命高潮，A正确。 1925年6月开始的省港大罢工是为了 支援上海“五卅”反帝斗争而举行的，前后坚 持了16个月之久，是中国工人运动史上持续 时间最长的一次政治大罢工。B 错误。国民 政府于1925年7月1 日在广州建立，它是在 以五卅运动为起点掀起的全国范围的大革命 高潮的基础上，举行了胜利的广东战争，征讨 地方军阀陈炯明、邓本殷，统一并巩固了广东 革命根据地后成立的。C 错误。以推翻北洋 军阀统治为目标的北伐战争开始于1926年 7月。D 错误。 ·"},
  {id:704,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"新民主主义革命时期，中国工会团结动员广大工人群众以大无畏革命精神，奋勇投身反对帝国 主义、封建主义、官僚资本主义的革命洪流，前赴后继、浴血奋战，为实现民族独立和人民解 放、建立新中国作出了重要贡献。中国工人运动史上持续时间最长的一次政治大罢工是",options:["A. 香港海员罢工","B. 京汉铁路工人罢工","C. 安源路矿工人罢工","D. 省港大罢工"],answer:"D",explanation:"（本题解析见原书解析分册）"},
  {id:705,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1924年国共合作的形成，加快了中国革命前进的步伐。1926年7月， 以推翻北洋军阀统治为目 标的北伐战争开始。1927年3月， 国民革命军占领南京。1927年4月12日，蒋介石在上海发 动反共政变，同年7月15日， 汪精卫在武汉召开“分共”会议，并在其辖区内对共产党员和革 命群众实行搜捕和屠杀，国共合作全面破裂，大革命最终失败。所谓大革命的失败，主要是指",options:["A. 北洋军阀的统治没有被推翻","B. 反帝反封建的革命任务没有完成","C. 国共合作全面破裂","D. 工人农民运动转入低潮"],answer:"B",explanation:"1924 年至1927年的大革命，虽然推 翻了北洋军阀的统治，但国民党政府的统治 依然是地主阶级和买办性的大资产阶级的统 治，同北洋军阀的统治没有本质的区别。中 国仍是一个处在帝国主义和封建主义统治之 下的半殖民地半封建社会，中国仍然迫切需 要一个反帝反封建的资产阶级民主革命。所 谓大革命的失败，主要是指反帝反封建的革 129 20135考研政治1000题 >>>解析分册 命任务没有完成，B正确，A 错误。国共合作 全面破裂是大革命失败的标志，工人农民运 动转入低潮是大革命失败的后果，但都不是 大革命失败的含义，C、D不符合题意。"},
  {id:706,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1928年12月29日张学良从东北发出通告，宣布“遵守三民主义，服从国民政府，改易旗帜”。 北洋军阀不再作为独立的政治力量继续存在，国民党在全国范围内建立了自己的统治。国民党 政府的统治同北洋军阀的统治没有本质的区别，这是因为",options:["A. 国民党所实行的是代表地主阶级、买办性大资产阶级利益的一党专政和军事独裁统治","B. 国民党所实行的是代表民族资产阶级利益的一党专政和军事独裁统治","C. 国民党反动集团内部派系林立，外部则与地方实力派之间矛盾重重、冲突不断","D. 国民党只是在形式上暂时地统一了中国"],answer:"A",explanation:"在1927年大革命失败后，国民党已经 不再是工人、农民、城市小资产阶级和民族资 产阶级的革命联盟，而是变成了一个由代表 地主阶级、买办性大资产阶级利益的反动集 团所控制的政党，其所建立的南京国民政府 同北洋军阀的统治没有本质的区别。国民党 所实行的是代表地主阶级、买办性大资产阶 级利益(并不是代表民族资产阶级利益)的一 党专政和军事独裁统治。A 正确，B 错误。 C、D本身内容正确，但不符合题意。"},
  {id:707,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"在大革命失败的危急关头，中共八七会议确定的方针是",options:["A. 推翻北洋军阀黑暗统治","B. 开辟农村革命根据地","C. 土地革命和武装起义","D. 建立工农民主统一战线"],answer:"C",explanation:"八七会议确定了土地革命和武装起义 的方针。这是一个正确的方针，是党在付出 血的代价后换得的正确结论。C 正确。建立 工农民主统一战线、开辟农村革命根据地是 在八七会议后的革命实践中解决的；推翻北 洋军阀黑暗统治是国民革命的任务。A、B、D 不符合题意。"},
  {id:708,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"土地革命战争时期，党从残酷的现实中认识到，没有革命的武装就无法战胜武装的反革命，就 无法夺取中国革命胜利，就无法改变中国人民和中华民族的命运，必须以武装的革命反对武装 的反革命。党领导举行了南昌起义、秋收起义、广州起义和其他许多地区起义。其中，秋收起 义不同于南昌起义的特点有 ① 以攻占敌人控制比较薄弱的农村为目标 ② 公开打出了“工农革命军”的旗帜 ③是中国共产党独立领导的革命战争 ④不仅是军队的行动，而且有数量众多的工农武装参加",options:["A. ①②","B. ①③","C. ②④","D. ③④"],answer:"C",explanation:"1927年9月9日，毛泽东等领导的湘 赣边界秋收起义爆发。起义军公开打出了 “工农革命军”的旗帜，这是与南昌起义不 同的(南昌起义中打的是“国民革命军”的旗 帜)。②正确。秋收起义不仅是军队的行 动 ，而且有数量众多的工农武装参加。④正 确。秋收起义的目标是攻打中心城市长沙。 在攻打中心城市受挫后，毛泽东果断改变计 划，决定向敌人控制比较薄弱的农村转移。 这一点与南昌起义是相同的。①错误。南昌 起义和秋收起义都是中国共产党独立领导的 革命战争。③错误。因此，本题选C。"},
  {id:709,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"大革命失败后，在国民党的统治下，白色恐怖笼罩着全国，中国革命转入低潮。在严峻的考验面 前，中国共产党人表现了坚定的革命立场和大无畏的英雄气概，独立高举起反帝反封建的革命旗 帜，中国革命由此发展到了一个新的阶段。由大革命失败到土地革命战争兴起的历史性转变是",options:["A. 遵义会议","B. 八七会议","C. 三湾改编","D. 党的六大"],answer:"B",explanation:"（本题解析见原书解析分册）"},
  {id:710,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"在新民主主义革命时期，对中国革命具有决定意义的新起点是",options:["A. 从领导工人运动转向武装斗争","B. 从进攻大城市转为向农村进军","C. 从工农武装割据转为建立全国性政权","D. 从游击战争转向正面战场"],answer:"B",explanation:"《中共中央关于党的百年奋斗重大成 就和历史经验的决议》指出，从进攻大城市转 为向农村进军，是中国革命具有决定意义的 新起点。B正确。A、C、D不符合题意。"},
  {id:711,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1927年9月9日，毛泽东等领导的湘赣边界秋收起义爆发。起义军公开打出了“工农革命军” 的旗帜，在攻打中心城市长沙受挫后，毛泽东果断改变计划，决定向敌人控制比较薄弱的农村 转移。9月29日，毛泽东领导起义军在江西永新县三湾村进行了著名的三湾改编，确立了",options:["A. 土地革命的方针","B. 支部建在连上的原则","C. 民主集中制原则","D. 思想建党、政治建军原则"],answer:"B",explanation:"1927年9月至10月，毛泽东领导秋 收起义的部队在江西省永新县三湾村完成 “三湾改编”,创造性地将支部建在连上，成立 各级士兵委员会，实行民主制度，在政治上官 兵平等。由此开始改变了起义军中旧军队的 习气和不良作风，从组织上确立了党对军队 的领导，是建设无产阶级领导的新型人民军 队的重要开端。B 正确。1927年8月7日， 中共中央在汉口秘密召开紧急会议(八七会 议),会议确定了土地革命和武装起义的方 针。 A错误。中共五大正式提出民主集中制 的组织原则。C 错误。1929年12月，红四军 党的第九次代表大会(史称古田会议)在福建 上杭县古田村召开。大会根据中央九月来信 精神，通过了毛泽东起草的古田会议决议，其 中最重要的是关于纠正党内错误思想的决议 案，确立了思想建党、政治建军原则。古田会 议决议是中国共产党和红军建设的纲领性文 献，是党和人民军队建设史上的重要里程碑。 D 错误。"},
  {id:712,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1929年12月、 红四军党的第九次代表大会在福建上杭县古田村召开(史称古田会议)。大会通 过了毛泽东起草的古田会议决议。古田会议决议是中国共产党和红军建设的纲领性文献，是党 和人民军队建设史上的重要里程碑。古田会议创造性地解决了在农村环境中、在党组织和军队 以农民为主要成分的条件下 ① 如何保持党的无产阶级先锋队性质的重大问题 ② 如何建设党领导的新型人民军队的重大问题 ③ 如何建设革命根据地的重大问题 ④如何找到新的革命道路的重大问题",options:["A. ②③","B. ①②④","C. ①②","D. ②③④"],answer:"C",explanation:"古田会议决议是中国共产党和红军建 设的纲领性文献，是党和人民军队建设史上 的重要里程碑。古田会议确立了马克思主义 建党建军原则，创造性地解决了在农村环境 中、在党组织和军队以农民为主要成分的条 件下，如何保持党的无产阶级先锋队性质和 地结合起来。C 正确。 建设党领导的新型人民军队的重大问题。 ①②正确，③④错误。因此，本题选C。"},
  {id:713,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"在大革命失败、白色恐怖极其严重的条件下，中国革命之所以能够得到坚持和发展，根本原因 就在于中国共产党",options:["A. 紧紧地依靠农民，领导农民进行了土地制度的革命","B. 吸取了大革命失败的教训，进行了武装起义","C. 建立了国民革命联合战线，扩大了革命队伍","D. 确立了思想建党、政治建军原则"],answer:"A",explanation:"在中国共产党的土地革命路线指引 下，根据地开展了热火朝天的“打土豪，分田 地”的斗争，充分调动了广大农民发展生产和 参军参战的积极性。在大革命失败、白色恐 怖极其严重的条件下，中国革命之所以能够 得到坚持和发展，根本原因就在于中国共产 党紧紧地依靠农民，领导农民进行了土地制 度的革命。A 正确，B、C、D 错误。 王明等人的“左”倾教条主义错误，对 中国革命造成了极其严重的危害。这次错误 使红军和根据地损失了90%,国民党统治区 党的力量几乎损失了100%。其最大的恶果， 就是使红军在第五次反“围剿”作战中遭到 失败，不得不退出南方根据地实行战略转 移 — 长 征。1934年9月上旬，国民党军队 加紧对中央革命根据地腹地发动进攻，红军 已无在原地扭转战局的可能。10月，中共中 央、中革军委率中央红军主力等8.6万余人踏 上战略转移的漫漫征程，开始了世界历史上前 所未有的壮举。③④正确。因此，本题选D。"},
  {id:714,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"在新民主主义革命时期，中国共产党在不同阶段建立了不同性质的革命政权。在土地革命战争 时期建立的苏维埃政权的性质是",options:["A. 工农民主专政","B. 一切赞成反帝又赞成民主的人们的政权","C. 各个革命阶级的联合专政","D. 人民民主专政"],answer:"A",explanation:"在新民主主义革命时期，中国共产党 在不同阶段建立了不同性质的革命政权。在 土地革命战争时期建立的苏维埃政权的性质 是工农民主专政(中华苏维埃共和国是中国 历史上第一个全国性的工农民主政权，是党 在局部地区执政的重要尝试)。A 正确。抗 日战争时期建立的政权的性质是抗日民族统 一战线性质的政权，是一切赞成抗日又赞成 民主的人们的政权；解放战争时期建立的政 权的性质是各个革命阶级的联合专政；新中 国成立初期建立的政权的性质是人民民主专 政。B、C、D错误。"},
  {id:715,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"在20世纪30年代前期、中期，中国共产党内屡次出现严重的“左”倾错误，其原因是多方面 的。主要的原因在于",options:["A. 八七会议以后党内一直存在着的浓厚的“左”倾情绪始终没有得到认真的清理","B. 共产国际对中国革命的错误指导","C. 党不善于把马克思列宁主义与中国实际全面地、正确地结合起来","D. 中国国情的复杂性"],answer:"C",explanation:"从1927年7月大革命失败到1935年 1月遵义会议召开之前，中国共产党内屡次 出现严重的“左”倾错误，其原因是多方面的。 除了八七会议以后党内一直存在着的浓厚的 “左”倾情绪始终没有得到认真的清理，共产 国际对中国革命的错误指导外，主要原因在 于，党的马克思主义理论准备不足，缺乏实践 经验，对中国的历史状况和社会状况、中国革 命的特点、中国革命的规律不甚了解，不善于 把马克思列宁主义与中国实际全面地、正确"},
  {id:716,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1934年10月，中共中央、中革军委率中央红军主力等8.6万余人踏上战略转移的漫漫征程， 开始了世界历史上前所未有的壮举——长征。中央红军进行长征的直接原因是 ①民族矛盾已经上升为主要矛盾 ②停止内战，北上抗日",options:["A. ①②","B. ①③","C. ②③","D. ③④"],answer:"D",explanation:"（本题解析见原书解析分册）"},
  {id:717,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"中国共产党的100年，是矢志践行初心使命的100年，是筚路蓝缕奠基立业的100年，是创造 辉煌开辟未来的100年。开启了中国共产党独立自主解决中国革命实际问题的新阶段的会议是",options:["A. 八七会议","B. 遵义会议","C. 瓦窑堡会议","D. 党的六届六中全会"],answer:"B",explanation:"遵义会议是党的历史上一个生死攸关 的转折点。会议集中解决了当时具有决定意 义的军事问题和组织问题。这次会议事实上 确立了毛泽东在党中央和红军的领导地位， 开始确立以毛泽东为主要代表的马克思主义 正确路线在党中央的领导地位，开始形成以 毛泽东同志为核心的党的第一代中央领导集 体，在最危急关头挽救了党、挽救了红军、挽 救了中国革命。遵义会议的鲜明特点是坚持 真理、修正错误，确立党中央的正确领导，创 造性地制定和实施符合中国革命特点的战略 策略。遵义会议开启了中国共产党独立自主 解决中国革命实际问题的新阶段(会议的一系 列重大决策，是在中国共产党同共产国际的联 系中断的情况下独立自主地作出的)。 B 正确。 ·"},
  {id:718,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"中国共产党在长征途中召开的遵义会议，集中解决了在当时具有决定意义的",options:["A. 军事问题和组织问题","B. 政治问题和路线问题","C. 战略问题和战术问题","D. 思想问题和作风问题"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:719,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"红军长征到达陕北后，毛泽东、党中央用很大精力总结历史经验，加强共产党自身的思想理论 建设。以毛泽东为主要代表的中共中央所进行的理论工作，对党的政治路线、军事路线和思想 路线作了系统阐述，在理论上武装了全党，为即将到来的全民族抗日战争从思想上、政治上和 组织上奠定了坚实基础。毛泽东系统地说明党的政治策略上的诸问题的著作是",options:["A. 《 中国革命战争的战略问题》","B. 《 论反对日本帝国主义的策略》","C. 《 论持久战》","D. 《 中国革命和中国共产党》"],answer:"B",explanation:"红军长征到达陕北后，毛泽东、党中央 用很大精力总结历史经验，加强共产党自身 的思想理论建设。1935年12月，毛泽东作 了《论反对日本帝国主义的策略》的报告，阐 明党的抗日民族统一战线的新政策，系统说 明了党的政治策略上的诸问题。 B 正确。 1936年12月，他写了《中国革命战争的战略 问题》,总结土地革命战争中党内在军事问题 上的争论，系统说明了有关中国革命战争战 略方面的诸问题。A 不符合题意。《论持久 战》写于1938年5月，《中国革命和中国共产 党》写于1939年12月，都在全民族抗战爆发 之后。C、D不符合题意。"},
  {id:720,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1931年9月18日， 日本发动九一八事变，武装侵占中国东北。中国人民在九一八事变后开始 的局部抗日战争",options:["A. 揭开了世界反法西斯战争的序幕","B. 宣告了抗日民族统一战线的形成","C. 开始了中国抗战的战略防御阶段","D. 标志着全民族抗战的开始"],answer:"A",explanation:"1931年9月18日，日本发动九一八 事变，武装侵占中国东北。中国人民在九一 八事变后开始的局部抗日战争揭开了世界反 法西斯战争的序幕。A 正确。1937年9月 22日，国民党中央通讯社发表《中共中央为 公布国共合作宣言》;23日，蒋介石发表实际 上承认共产党合法地位的谈话。以国共两党 第二次合作为基础的抗日民族统一战线正式 形成。B 错误。1937年7月7日，卢沟桥事 变爆发，中国开始进行全民族抗战；1937年7 月卢沟桥事变到1938年10月广州、武汉失 守，是中国抗日战争的战略防御阶段。C、D 错误。"},
  {id:721,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"华北事变发生后，中国共产党组织领导的一二 ·九运动标志着",options:["A. 中国人民局部抗日战争的开始","B. 中国人民抗日救亡运动新高潮的到来","C. 中国抗日民族统一战线的形成","D. 中国抗日战争进入全民族抗战的新时期"],answer:"B",explanation:"一二 · 九运动发生于1935年12月 9日，它促进了中华民族的觉醒，标志着中国 人民抗日救亡运动新高潮的到来。B正确。"},
  {id:722,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1935年，电影《风云儿女》一公映，主题歌《义勇军进行曲》便成为时代的最强音。歌曲发出 了中华民族不甘沦亡的怒吼，吹响了中华儿女万众一心、血战到底的战斗号角。《义勇军进行 曲》之所以发出“中华民族到了最危险的时候”的呐喊，最重要的原因是",options:["A. 国民党政府长期奉行“攘外必先安内”方针，对日本的大举侵略一再退让","B. 国际联盟和英美等国政府采取对日姑息、纵容的政策","C. 日本大举侵华，妄图把中国变为其独占的殖民地","D. 中国长期缺乏有力的国际援助"],answer:"C",explanation:"《义勇军进行曲》之所以发出“中华民 族到了最危险的时候”的呐喊，最重要的原因 是日本大举侵华，妄图把中国变为其独占的 殖民地。九一八事变后，国民党政府长期奉 行“攘外必先安内”方针，对日本的大举侵略 一再退让，这是使中华民族处于最危险时候 的又一原因。在中日民族矛盾日益上升为最 主要矛盾的情况下，国民党统治集团不是调 整自己的政策，用团结一切可以团结的力量 共同反侵略的方式来“安内”,而是借“安内” 之名消灭异己，打击甚至企图扑灭抗日力量， 这在当时就遭到了人民的反对，也被实践证 明行不通。使中华民族处于最危险时候的第 三个原因，是国际联盟和英美等国政府采取 对日姑息、纵容的政策，中国长期缺乏有力的 国际援助。C 正确，A、B、D不符合题意。"},
  {id:723,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1935年12月，中共中央在陕北瓦窑堡召开政治局扩大会议，提出党的基本策略任务是",options:["A. 建立广泛的抗日民族统一战线","B. 在根据地实行减租减息的土地政策","C. 在敌后广泛开展游击战和运动战","D. 保持党在思想上、政治上和组织上的独立性"],answer:"A",explanation:"1935年8月1日，中共驻共产国际代 表团草拟《中国苏维埃政府、中国共产党中央 为抗日救国告全体同胞书》(八一宣言),不久 公开发表。宣言主张停止内战，组织国防政 府和抗日联军，对日作战。12月，中共中央 在陕北瓦窑堡召开政治局扩大会议，提出党 的基本策略任务是建立广泛的抗日民族统一 战线，批评了党内长期存在的“左”倾冒险主义、 关门主义错误倾向。中国共产党在新的历史时 期即将到来时掌握了政治主动权。A 正确。"},
  {id:724,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1936年12月初，蒋介石到达西安，逼迫张学良、杨虎城攻打陕甘的红军。12月12日凌晨，张 学良、杨虎城在屡次劝谏无效的情况下，发动了西安事变。事变后，张、杨联合发表通电，提 出了改组南京政府、停止一切内战、开放民众爱国运动等八项抗日主张。中国共产党从民族大 义出发，确定促成事变和平解决的基本方针，并派周恩来等到西安，参加谈判，迫使蒋介石作 出“停止剿共，联红抗日”的承诺。西安事变的和平解决",options:["A. 标志着中国进入全民族抗战阶段","B. 成为中国人民抗日战争的起点","C. 标志着抗日民族统一战线的正式形成","D. 成为时局转换的枢纽，国内和平初步实现"],answer:"D",explanation:"138"},
  {id:725,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"中国抗日战争进入全民族抗战阶段是在",options:["A. 九一八事变后","B. 一·二八事变后","C. 华北事变后","D. 卢沟桥事变后"],answer:"D",explanation:"（本题解析见原书解析分册）"},
  {id:726,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1938年5月至6月间，毛泽东总结全民族抗战10个月来的经验，批驳了“亡国论”“速胜论” 等错误观点，系统地阐明了持久战的战略总方针。毛泽东科学预见了抗日战争的发展进程，指 出抗日战争的最关键阶段是",options:["A. 战略防御阶段","B. 战略相持阶段","C. 战略反攻阶段","D. 战略决战阶段"],answer:"B",explanation:"毛泽东科学预见了抗日战争的发展进 程，即抗日战争将经过战略防御、战略相持、 战略反攻三个阶段。战略相持阶段是中国抗 日战争能否取得最后胜利的最关键的阶段。 B正确。"},
  {id:727,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"抗日战争时期，中国共产党的土地政策是",options:["A. 没收地主阶级土地","B. 消灭富农","C. 征收富农多余财产","D. 减租减息"],answer:"D",explanation:"减租减息是中国共产党在抗日根据地 为适当调节各抗日阶层的利益而实行的土地 政策。D正确。1946年5月4日，中共中央 发布《关于土地问题的指示》(“五四指示”), 将党在抗日战争时期实行的减租减息政策改 变为实现“耕者有其田”的政策。"},
  {id:728,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"“三三制”民主政权是共产党领导的抗日民族统一战线性质的政权，是一切赞成抗日又赞成民 主的人们的政权，是几个革命阶级联合起来对于汉奸和反动派的民主专政。“三三制”是指抗 日民主政府在工作人员分配上实行“三三制”原则，即共产党员、党外进步人士和中间派各占 1/3。以下属于“三三制”原则中所说的中间派的是",options:["A. 小资产阶级","B. 农民阶级","C. 开明绅士","D. 地方实力派"],answer:"C",explanation:"（本题解析见原书解析分册）"},
  {id:729,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"抗日战争时期，为克服根据地面临的严重困难局面，毛泽东提出的经济工作和财政工作总方 针是",options:["A. “ 自己动手，丰衣足食”","B. “ 发展经济，保障供给”","C. “减租减息”","D. “精兵简政”"],answer:"B",explanation:"为克服根据地面临的严重困难局面， 毛泽东提出了“发展经济，保障供给”的经 济工作和财政工作总方针，发出了“自己动 手，丰衣足食”的号召，领导根据地军民开展 了大生产运动。B 正确，A 错误。“减租减 息”“精兵简政”也是当时的政策，但不是题目 所问的“经济工作和财政工作总方针”。C、D 不符合题意。"},
  {id:730,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"中国人民的抗日战争从1931年开始，到1945年结束，前后经历了14年的浴血奋战。在世界反 法西斯战争的进程中，中国人民的抗日战争被称为“最早的抗争，最后的胜利”。成为抗日战争 取得完全胜利的重要标志的是",options:["A. 中国参加联合国制宪会议，成为联合国的创始国和五个常任理事国之一","B. 日本天皇裕仁发布《终战诏书》,日本无条件投降","C. 日本代表在东京湾美军军舰密苏里号上签署向同盟国的投降书","D. 台湾以及澎湖列岛重归中国主权管轴"],answer:"D",explanation:"1945年10月25日，中国政府在台 湾举行受降仪式。被日本占领50年之久的 台湾以及澎湖列岛，重归中国主权管辖。这 成为抗日战争取得完全胜利的重要标志。D 正确。联合国制宪会议于1945年4月至6 月在美国旧金山举行，包括中国解放区代表 董必武在内的中国代表团出席了会议，会议 签署了《联合国宪章》,中国成为联合国的创 始国和五个常任理事国之一。1945年7月 26日，中、美、英三国发表《波茨坦公告》,敦 促日本投降。1945年8月15日，日本天皇 裕仁发布《终战诏书》,日本无条件投降。9 月2日，日本天皇和政府以及日本大本营的 代表在东京湾美军军舰密苏里号上签署向同 盟国的投降书，侵华日军128万人向中国投 降。至此，中国人民的14年抗日战争胜利结 束，世界反法西斯战争也胜利结束。9月3日 成为中国人民抗日战争胜利纪念日。A、B、C 都不符合题意。"},
  {id:731,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1945 年10月25日，中国政府宜告“恢复对台湾行使主权”,并在台北举行“中国战区台湾省 受降仪式”。此前，国际上已经有了一系列具有国际法律效力的文件，从法律上确认台湾是中国 领土的一部分。这些具有国际法律效力的文件有 ①《开罗宣言》 ②《波茨坦公告》 ③《日本投降书》 ④《雅尔塔协定》",options:["A. ①②③","B. ①②④","C. ①③④","D. ②③④"],answer:"A",explanation:"1945年，包括台湾同胞在内的中国军 民浴血奋战，打败日本侵略者，取得了抗日战 争的伟大胜利，台湾回归祖国怀抱，《开罗宣 言》《波茨坦公告》《日本投降书》等一系列条 约文书都明确了中国对台湾的主权。台湾光 复是二战胜利成果，是战后国际秩序的重要 组成部分。①②③正确。因此，本题选A。"},
  {id:732,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"中国人民抗日战争的胜利，是近代以来中国人民反抗外敌入侵第一次取得完全胜利的民族解放 斗争。抗日战争取得胜利的决定因素是",options:["A. 中国共产党的中流砥柱作用","B. 以爱国主义为核心的民族精神","C. 全民族抗战","D. 坚持持久战方针"],answer:"B",explanation:"以爱国主义为核心的民族精神是中国"},
  {id:733,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"中华民族从近代以来陷入深重危机走向伟大复兴的历史转折点是",options:["A. 红军长征的胜利","B. 抗日战争的胜利","C. 解放战争的胜利","D. 抗美援朝战争的胜利"],answer:"B",explanation:"（本题解析见原书解析分册）"},
  {id:734,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1945年8月25日， 中共中央在《对目前时局的宣言》中明确提出的口号是",options:["A. 巩固国内和平，实现民主改革","B. 和平、民主、团结","C. 打倒蒋介石，解放全中国","D. 独立、自由、和平"],answer:"B",explanation:"（本题解析见原书解析分册）"},
  {id:735,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1945年10月10日，重庆谈判双方签署《政府与中共代表会谈纪要》,即双十协定，确认和平 建国的基本方针，同意“长期合作，坚决避免内战”。1946年1月10日， 政治协商会议在重庆 开幕。会议通过了政府组织案等五项协议。政协会议闭幕的第二天，中共中央发出党内指示， 要求全党准备为坚决实现政协协议而奋斗。同时提出，必须提高警惕，注意“阵地的保持与继 续取得”,做好进行自卫战争的准备，并指出，目前解放区的中心工作是",options:["A. 放手发动群众，壮大人民力量","B. 进行土地改革","C. 发展生产，保障供给","D. 练兵、减租与生产"],answer:"D",explanation:"（本题解析见原书解析分册）"},
  {id:736,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1947年6月底， 根据中共中央的决策和部署，刘伯承、邓小平率领的晋冀鲁豫野战军主力，实 施中央突破，千里跃进大别山。随后，陈毅、粟裕指挥的华东野战军主力为东路，挺进苏鲁豫 皖地区。陈赓、谢富治指挥的晋冀鲁豫野战军一部为西路，挺进豫西。三路大军相互策应，机 动歼敌，这标志着",options:["A. 蒋介石20年反革命统治由发展到消灭的转折点","B. 人民解放军在数量上已经超过国民党军队","C. 100 多年来帝国主义在中国的统治由发展到消灭的转折点","D. 人民解放战争战略进攻的序幕由此揭开"],answer:"D",explanation:"1947年6月，中共中央当机立断，决 定不等完全粉碎敌人的战略进攻，不等解放 军在数量上占有优势，立刻转入全国性反攻， 以主力打到外线去，将战争引向国民党统治 区域。根据中共中央的决策和部署，刘伯承、 邓小平率领的晋冀鲁豫野战军主力，实施中 央突破，千里跃进大别山。随后，陈毅、粟裕 指挥的华东野战军主力为东路，挺进苏鲁豫 皖地区。陈赓、谢富治指挥的晋冀鲁豫野战 军一部为西路，挺进豫西。三路大军相互策 应，机动歼敌。它们调动和吸引国民党军南 线全部兵力160多个旅中约90个旅于自己 周围，迫使国民党军处于被动地位。人民解 放战争战略进攻的序幕由此揭开。D 正确，B 错误。"},
  {id:737,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1947年12月，中共中央在陕北米脂县杨家沟召开会议，制定了夺取全国胜利的行动纲领。毛 泽东指出，中国革命已经发展到了一个历史的转折点，这是",options:["A. 中国革命重心从农村转向城市的标志","B. 中国共产党和中国革命事业从挫折走向胜利的伟大转折","C. 中华民族从近代以来陷入深重危机走向伟大复兴的历史转折点","D. 100 多年来帝国主义在中国的统治由发展到消灭的转折点"],answer:"D",explanation:"135 1000题 解析分册 1947 年12月，中共中央在陕北米脂 县杨家沟召开会议，制定了夺取全国胜利的 行动纲领。毛泽东指出，中国革命已经发展 到了一个历史的转折点。这是蒋介石20年 反革命统治由发展到消灭的转折点，这是 100多年来帝国主义在中国的统治由发展到 消灭的转折点。D 正确。1949年3月25日， 毛泽东等中央领导人与中央机关、人民解放 军总部进驻北平(北京)香山，标志着中国革 命重心从农村转向城市。A 错误。长征实现 了中国共产党和中国革命事业从挫折走向胜 利的伟大转折。B 错误。抗日战争的伟大胜 利，是中华民族从近代以来陷入深重危机走 向伟大复兴的历史转折点。C 错误。"},
  {id:738,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"中国各民主党派从成立的时候起，大多同中国共产党建立了不同程度的合作关系，并在斗争实 践中逐步发展了这种关系。这是因为",options:["A. 中国各民主党派形成时的社会基础与中国共产党的社会基础是一致的","B. 中国各民主党派的政纲同中国共产党的新民主主义革命政纲基本上一致","C. 中国各民主党派的建国方案同中国共产党的建国方案大体相同 D、中国各民主党派同中国共产党一起都参加了大革命时期的斗争，有合作的基础"],answer:"B",explanation:")中国各民主党派的政纲不尽相同，但 都主张爱国、反对卖国，主张民主、反对独裁。 在这些方面，同中国共产党的新民主主义革 命政纲基本上一致。因此，它们大多从成立 时起，就同中国共产党建立了不同程度的合 作关系，并在斗争实践中逐步发展了这种关 系。B正确。各民主党派的社会基础、建国 方案，与中国共产党不同；中国的民主党派， 少数成立于大革命时期和土地革命战争时 期，多数成立于抗日战争和全国解放战争时 期。A、C、D 错误。"},
  {id:739,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1948年1月，沈钧儒先生在香港主持召开民盟一届三中全会。会议通过了新的政治纲领和宣 言，公开宣布同中国共产党携手合作，为彻底摧毁国民党反动政府，实现民主、和平、独立、 统一的新中国而奋斗。沈钧儒在会议中指出，“民盟在国共两党之间不能保持中立了，中间道路 也行不通”,要“与共产党实行密切的合作”。民盟一届三中全会是民盟的一个重大历史转折点， 它抛弃了“中间路线”,坚定地选择了中国共产党、新民主主义，为民盟之后参加新政协、参与 新政权奠定了思想和组织基础。“中间道路也行不通”是因为",options:["A. 中国在抗日战争胜利后面临的是两种命运、两个前途的尖锐斗争","B. 鼓吹“中间路线”的人所提倡的方案实际上与国民党所实行的是一致的","C. 抗战胜利改变了中国半殖民地半封建的社会性质，中国人民的民族意识普遍觉醒","D. 帝国主义势力空前强大，正在集中力量干涉中国革命"],answer:"A",explanation:"抗日战争胜利后，某些民主党派的领 导人曾经鼓吹“中间路线”,企图在国共对立 的纲领之外寻找第三条道路。他们主张：在 政治上，“必须实现英美式的民主政治”,但不 准地主官僚资本家操纵；在经济上，“应当实 行改良的资本主义”,但不容官僚买办资本横 行。实行的方法，则是走和平改良的道路。 他们所提倡的，是资产阶级共和国的方案，他 们所主张的，实质上是旧民主主义的道路。 但是，中国在战后面临的是两种命运、两个 前途的尖锐斗争。客观形势决定了中国没有 走中间路线的余地。A 正确。 鼓吹“中间路线”的人所提倡的资产阶级 共和国方案与国民党所实行的代表地主阶 级、买办性大资产阶级利益的一党专政和军 事独裁统治还是不一样的，B 错误。从鸦片 战争开始，到1949年中华人民共和国成立， 中国都属于半殖民地半封建社会。C 错误。 战后的政治形势，总的说来，对中国人民实现 建设新中国的目标是有利的。在国际上，社 会主义国家、民族解放运动力量有了新发展， 帝国主义势力遭到削弱，已经难以集中力量 干涉中国革命。D 错误。"},
  {id:740,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1949年1 月22日，李济深、沈钧儒等民主党派的领导人和著名的无党派民主人士55人联合发 表《对时局的意见》,一致认定中共提出的关于召开政治协商会议、成立联合政府的主张“符合 于全国人民大众的要求”,恳切表示“愿在中共领导下，献其绵薄，共策进行，以期中国人民民 主革命之迅速成功，独立、自由、和平、幸福的新中国之早日实现”。1949年春，毛泽东在同 有关人士谈话时提出，民主党派应“积极参政，共同建设新中国”,这",options:["A. 揭开了中国共产党同各党派、各团体、各族各界人士协商建国的序幕","B. 奠定了中国共产党领导的多党合作和政治协商制度的基础","C. 标志着民主党派地位的根本变化","D. 表明中国各民主党派和无党派民主人士公开自愿接受中国共产党的领导"],answer:"C",explanation:"1949 年春，毛泽东在同有关人士谈话 时提出，民主党派应“积极参政，共同建设新 中国”。这标志着民主党派地位的根本变化， 即它们不再是旧中国反动政权下的在野党， 而将在中国共产党领导下，共同担负起管理 国家和建设新中国的历史重任。中国共产党 领导的多党合作政治格局，正是在这个基础 上形成的。C 正确。 1948年4月30日，中共中央在纪念五 一国际劳动节的口号中提出：“各民主党派、 各人民团体、各社会贤达迅速召开政治协商 会议，讨论并实现召集人民代表大会，成立民 主联合政府。”这个号召得到各民主党派和社 会各界的热烈响应，揭开了中国共产党同各 党派、各团体、各族各界人士协商建国的序 幕 ，奠定了中国共产党领导的多党合作和政 治协商制度的基础。《对时局的意见》这个政 治声明表明，中国各民主党派和无党派民主 人士公开自愿接受中国共产党的领导，决心 走人民革命的道路，拥护建立人民民主的新 中国。A、B、D 错误。"},
  {id:741,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1949年9月21日，中国人民政治协商会议第一届全体会议在北平(北京)隆重开幕。这次会 议与1946年1月在重庆召开的政治协商会议的不同在于",options:["A. 中国共产党居于领导地位","B. 多党派参加","C. 民主党派是执政党","D. 通过的《共同纲领》属于社会主义性质"],answer:"A",explanation:"A 正确。1946年1月在重庆召开的政 治协商会议也是多党派参加，B 错误。在新 中国，民主党派是参政党，共产党是执政党，C 错误。1949年人民政协会议通过的《共同纲 领》属于新民主主义性质，D错误。 ①②③正确。《论十大关系》是以毛 泽东为主要代表的中国共产党人开始探索 适合中国国情的社会主义建设道路的标志。 ④错误。因此，本题选A。"},
  {id:742,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"中国革命的发生和胜利不是偶然的，而是有着深刻的社会根源和雄厚的群众基础。由于帝国主 义、封建主义、官僚资本主义的残酷压迫，中国人民走上了反帝、反封建、反官僚资本主义斗 争的伟大道路。在中国革命过程中，曾经被人称作“开万国未有之奇”的一种现象是",options:["A. 工人阶级成为革命的领导力量","B. 农民、城市小资产阶级群众是革命的主要力量","C. 封建势力同外国侵略势力相勾结","D. 随着斗争的发展，民族资产阶级也逐步向共产党靠拢"],answer:"D",explanation:"由于帝国主义、封建主义、官僚资本主 义的残酷压迫，中国人民走上了反帝、反封 建、反官僚资本主义斗争的伟大道路。工人、 农民、城市小资产阶级群众是民主革命的主 要力量。随着斗争的发展，民族资产阶级也 逐步向共产党靠拢，这种现象曾经被人称作 “开万国未有之奇”。(民族资产阶级属于资 产阶级、剥削阶级，与无产阶级之间存在矛 盾。但是由于中国的特殊国情以及中国共产 党的统一战线政策，民族资产阶级也逐步向 共产党靠拢，因此被称为“开万国未有之奇”) D正确。 ·"},
  {id:743,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"中国革命的胜利、结束了100多年来中华民族遭受资本-帝国主义侵略和中国各族人民遭受 资本一帝国主义同封建统治阶级联合压迫与剥削的历史，结束了国家战乱频仍、四分五裂的局 面。中国革命之所以能够走上胜利发展的道路，从根本上说，是由于有了",options:["A. 一支人民的军队","B. 广泛的统一战线","C. 一条正确的革命道路","D. 中国共产党的领导"],answer:"D",explanation:"（本题解析见原书解析分册）"},
  {id:744,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"“作风建设永远在路上”。在波澜壮阔的历史进程中，中国共产党始终十分重视党的作风建设。 在中共七届二中全会上，毛泽东强调必须保持的党的作风是",options:["A. 理论和实践相结合的作风","B. 谦虚、谨慎、不骄、不躁和艰苦奋斗的作风","C. 和人民群众紧密地联系在一起的作风","D. 自我批评的作风"],answer:"B",explanation:"B正确。A、C、D是毛泽东在党的七大 上归纳的“三大作风”,不符合题意。"},
  {id:745,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"在中国共产党七届二中全会上，毛泽东提出了“两个务必”的思想，其原因主要是",options:["A. 中国共产党即将成为执政党","B. 党的工作方式发生了变化","C. 全国大陆即将解放","D. 中国将由新民主主义社会转变为社会主义社会"],answer:"A",explanation:"题干强调的“两个务必”是从党的作 风的高度提出来的，A是最符合题意的正确 选项，因为执政对党尤其是对党的作风是严 峻的考验。C、D 没有直接指明党即将成为 执政党，因而与党的作风联系不直接；B 仅 仅从党的工作方式发生变化的角度分析提 出“两个务必”的原因也不准确。 在新解放区进行土改属于完成民主 革命的遗留任务。A正确。没收官僚资本， 确立社会主义国营经济的领导地位，开始将 资本主义纳入国家资本主义轨道，引导个体 农民在土地改革后逐步走上互助合作的道 路，都是属于社会主义革命的任务。B、C、D"},
  {id:746,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"《论人民民主专政》是毛泽东在中国新民主主义革命取得决定性胜利、全国性政权即将建立的 时刻、为纪念中国共产党成立28周年而撰写的文章。文章论述了即将成立的中华人民共和国 的国家性质，各阶级在国家中的地位及其相互关系，国家对内、对外政策等。《论人民民主专 政》这篇文章 ①奠定了新中国国家政权的理论基础和一定发展阶段上的政策基础 ②为即将成立的新中国作了政治理论准备 ③与中共七届二中全会的决议一起构成了《中国人民政治协商会议共同纲领》的基础 ④是中国共产党人开始探索适合中国国情的社会主义建设道路的标志",options:["A. ①②③","B. ①②④","C. ①③④","D. ②③④"],answer:"A",explanation:"137 1000题 解析分册 · 不符合题意。"},
  {id:747,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"新民主主义社会不是一个独立的社会形态，而是由新民主主义转变到社会主义的过渡性的社会 形态。新民主主义社会存在着五种经济成分，其中，属于过渡形式的经济成分的是",options:["A. 国营经济和合作社经济","B. 私人资本主义经济和国家资本主义经济","C. 合作社经济和国家资本主义经济","D. 个体经济和合作社经济"],answer:"C",explanation:"新民主主义社会存在着五种经济成 分：社会主义性质的国营经济、半社会主义 性质的合作社经济、农民和手工业者的个体 经济、私人资本主义经济和国家资本主义经 济。其中半社会主义性质的合作社经济是 个体经济向社会主义集体经济过渡的形 式，国家资本主义经济是私人资本主义经 济向社会主义国营经济过渡的形式。所以， 主要的经济成分是三种：社会主义经济、个 体经济和私人资本主义经济。C 正确，A、B、 D错误。"},
  {id:748,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1950年6月，中国共产党召开七届三中全会。这是中国共产党在新中国成立后召开的第一次 中央全会。会议向全党提出当前阶段的中心任务是",options:["A. 完成新解放区的土地改革","B. 争取国家财政经济状况的基本好转","C. 现有工商业的合理调整","D. 不要四面出击"],answer:"B",explanation:"党的七届三中全会向全党提出当前 阶段的中心任务是争取国家财政经济状况 的基本好转。B 正确。毛泽东向全会提交 的《为争取国家财政经济状况的基本好转而 斗争》的书面报告指出，要获得财政经济状 况的根本好转，需用三年左右的时间创造三 个条件，即土地改革的完成、现有工商业的 合理调整、国家机构所需经费的大量节减。 A、C错误。不要四面出击是党的七届三中 全会确定的党在国民经济恢复时期的战略 策略方针。D 错误。"},
  {id:749,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"新中国成立伊始，面临许多严重困难和紧迫问题。这对于刚刚执掌全国政权的中国共产党来 说，是新的严峻考验。毛泽东在中共七届二中全会上指出：“敌人的武力是不能征服我们的，这 点已经得到证明了。资产阶级的捧场则可能征服我们队伍中的意志薄弱者。”“我们必须预防这 种情况。”毛泽东这番话强调的实际上是中国共产党",options:["A. 能不能保卫住革命胜利成果，巩固新生人民政权","B. 能不能战胜严重经济困难，迅速恢复和发展国民经济","C. 能不能巩固民族独立，维护国家主权和安全","D. 能不能经受住全国执政的新考验，继续保持优良传统和作风"],answer:"D",explanation:"新中国成立伊始，面临许多严重困难 和紧迫问题，这对于刚刚执掌全国政权的中 国共产党来说，是新的严峻考验：①能不能 保卫住革命胜利成果，巩固新生人民政权； 能不能战胜严重经济困难，迅速恢复和发 展国民经济；③能不能巩固民族独立，维护 国家主权和安全；④能不能经受住全国执政 的新考验，继续保持优良传统和作风。新 中国成立后，中国共产党成为在全国范围执 掌政权的党，党的工作重心从农村转向城 市，广大干部和党员面临执政的考验、接管 城市的考验和生活环境变化的考验。诚如 毛泽东在中共七届二中全会上指出：“敌人 的武力是不能征服我们的，这点已经得到证 明了。资产阶级的捧场则可能征服我们队 伍中的意志薄弱者。”“我们必须预防这种情 况。”D正确。"},
  {id:750,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"在进行社会主义改造、向社会主义过渡的进程中，中国共产党积累了丰富的历史经验，包括坚 持社会主义工业化建设与社会主义改造同时并举，采取积极引导、逐步过渡的方式及用和平方 法进行改造。在以下逐步过渡的方式中，在性质上属于社会主义性质的形式是",options:["A. 农业互助组","B. 手工业供销合作社","C. 初级农业生产合作社","D. 全行业公私合营"],answer:"D",explanation:"农业的社会主义改造经历了互助组 (具有社会主义萌芽性质)、初级农业生产合 作社(半社会主义性质)、高级农业生产合作 社(社会主义性质)等过渡形式；手工业的 社会主义改造经历了手工业供销小组(具有 社会主义萌芽性质)、手工业供销合作社(半 社会主义性质)、手工业生产合作社(社会 主义性质)三个步骤；资本主义工商业的社 会主义改造经历了初级形式的国家资本主 义(具有了社会主义的因素)、个别企业的公 私合营(半社会主义性质)和全行业的公私 合营(社会主义性质)三个步骤。所以，D 是正确选项。"},
  {id:751,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"20世纪50年代，我国在对资本主义工商业进行社会主义改造的过程中，创造了一系列国家资 本主义具体形式，包括 ①加工订货 ② 统购包销 ③经销代销 ④统购统销",options:["A. ①②④","B. ②③④","C. ①③④","D. ①②③"],answer:"D",explanation:"精讲P269 考点71 -1-(2)- 初级形式的国家资本主义是国家对私 营工商业实行委托加工、计划订货、统购包 销、经销代销等；高级形式的国家资本主义是 公私合营，包括个别企业的公私合营和全行 业的公私合营。①②③正确。统购统销是新 中国成立初期的一项控制粮食资源的计划经 济政策。1953年10月16日，中共中央发出 了《关于实行粮食的计划收购与计划供应的 决议》。所谓“计划收购”被简称为“统 购”;“计划供应”被简称为“统销”。后 来，统购统销的范围又继续扩大到棉花、纱布 和食油。80年代改革之后，该项政策被取 消。④不符合题意。因此，本题选D。"},
  {id:752,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"对资本主义工商业的社会主义改造经历了三个步骤。第一步，主要实行初级形式的国家资本主 义 ，国家在私营工业中实行委托加工、计划订货、统购包销，企业利润的分配方式为“四马分 肥”,这",options:["A. 是社会主义成分同资本主义成分在企业内部的合作","B. 使得企业的生产和经营开始纳入国家计划的轨道","C. 改变了工人在企业中的地位，使企业具有了半社会主义性质","D. 限制了资本主义的剥削，企业的生产关系已经发生了根本的变化"],answer:"B",explanation:"精讲P269 考点71 -1-(2)- ② 144"},
  {id:753,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"我国对资本主义工商业的社会主义改造，采取了从低级到高级的国家资本主义的过渡形式。其 中第二步主要实行个别企业的公私合营，这些企业",options:["A. 仍然是资本主义性质的企业","B. 是具有了社会主义因素的企业","C. 是半社会主义性质的企业","D. 是社会主义国营性质的企业"],answer:"C",explanation:"1956年，随着社会主义改造的完成，以 生产资料公有制、按劳分配和计划经济体制为 特征的社会主义经济制度建立起来，这是中国 进入社会主义社会最主要的标志。A正确。"},
  {id:754,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1954年9月15日，第一届全国人民代表大会第一次会议顺利开幕。9月28日， 会议在完成预 定的议程后胜利闭幕。这次会议是我国人民民主建设的重要里程碑，标志着新中国",options:["A. 人民民主专政制度的确立","B. 根本政治制度的正式确立","C. 新型政党制度的正式确立","D. 国家结构形式的正式确立"],answer:"B",explanation:"139 20 考研政治 1000题 >>>解析分册 必须掌握的高频考点。 的主要任务。大会指出，虽然还有阶级斗 争，还要加强人民民主专政，但根本任务已 经是在新的生产关系下保护和发展生产力。 B正确。"},
  {id:755,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"制定一部切实可行的发展国民经济的中期计划，是完成过渡时期总路线规定的工业化主体任务 的重要步骤。为准备进行有计划的经济建设，我国从1951年着手编制第一个五年计划。1955 年7月召开的一届全国人大二次会议通过了这个计划。“一五”计划确定的经济建设指导方针 突出的核心要点是集中主要力量",options:["A. 发展Ⅲ工业，建立国家工业化和国防现代化的初步基础","B. 发展交通运输业、轻工业、农业和商业、相应地培养建设人才","C. 保证国民经济中社会主义成分的比重稳步增长","D. 保证在发展生产的基础上逐步提高人民的物质生活和文化生活的水平"],answer:"A",explanation:"“一五”计划确定的经济建设指导方 针，突出了集中主要力量发展重工业，建立 国家工业化和国防现代化的初步基础的核 心要点，同时要求相应地发展交通运输业、 轻工业、农业和商业，相应地培养建设人才， 保证国民经济中社会主义成分的比重稳步 增长，保证在发展生产的基础上逐步提高人 民的物质生活和文化生活的水平，等等。 A正确，B、C、D 错误。 全行业公私合营(改造的第三步) 后，企业的生产关系已经发生了根本的变 化，基本上成为社会主义国营性质的企业。 D错误。"},
  {id:756,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"中国进入社会主义社会的最主要的标志是",options:["A. 社会主义经济制度的确立","B. 中华人民共和国的成立","C. 党在过渡时期总路线的提出","D. 国民经济第一个五年计划的实施"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:757,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"以毛泽东为主要代表的中国共产党人开始探索适合中国国情的社会主义建设道路的标志是",options:["A. 《 论十大关系》的报告","B. 中共八大路线的制定","C. 《关于正确处理人民内部矛盾的问题》的发表","D. 国民经济第一个五年计划的实施"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:758,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1957年2月， 毛泽东作了《关于正确处理人民内部矛盾的问题》的报告，阐明社会主义社会 的重大理论问题。毛泽东提出，必须区分社会主义社会两类不同性质的社会矛盾，把正确处理 人民内部矛盾作为国家政治生活的主题。解决人民内部矛盾用民主的方法，说服教育的方法。 对于物质利益、分配方面的人民内部矛盾，毛泽东提出的方针是",options:["A. 统筹兼顾、适当安排","B. “惩前毖后、治病救人”","C. “长期共存、互相监督”","D. “ 团结—批评—团结”"],answer:"A",explanation:"中共八大坚持党中央提出的既反保 守又反冒进，即在综合平衡中稳步前进的经 济建设方针。A 正确。毛泽东在《关于正确 处理人民内部矛盾的问题》的报告中提出， 对于物质利益、分配方面的人民内部矛盾， 实行统筹兼顾、适当安排的方针，兼顾国家、 集体和个人三方面的利益。B 错误。1961 年1月，党的八届九中全会决定对国民经济 实行“调整、巩固、充实、提高”的八字方针。 C 错误。毛泽东在探索走中国工业化道路 时，提出了以农业为基础，以工业为主导，以 农轻重为序发展国民经济的总方针，以及一 整套“两条腿走路”的工业化发展思路。D 错误。"},
  {id:759,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1956年社会主义改造基本完成以后，中国进入社会主义初级阶段。社会主义初级阶段在发展 过程中会呈现不同的阶段性特征。1956年召开的中共八大指出，社会主义基本制度在我国已 经基本上建立起来了，我国国内的主要矛盾是",options:["A. 无产阶级和资产阶级的矛盾","B. 人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾","C. 人民日益增长的物质文化需要同落后的社会生产之间的矛盾","D. 人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾"],answer:"B",explanation:"1956年召开的中共八大指出，社会 主义基本制度在我国已经基本上建立起来 了，我国国内的主要矛盾是“人民对于经济 文化迅速发展的需要同当前经济文化不能 满足人民需要的状况之间的矛盾”。B 正确。 ·"},
  {id:760,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1956年9月15日至27日，中国共产党第八次全国代表大会在北京举行。中共八大正确分析 了国内形势和主要矛盾的变化，明确提出新形势下党和人民的主要任务。大会宣布，社会主义 制度在我国已经基本上建立起来，国内主要矛盾已经是人民对于经济文化迅速发展的需要同当 前经济文化不能满足人民需要的状况之间的矛盾；还有阶级斗争，还要加强人民民主专政，但 根本任务已经是",options:["A. 实现马克思主义同中国具体实际的“第二次结合”","B. 在新的生产关系下保护和发展生产力","C. 正确处理人民内部矛盾","D. 探索什么是社会主义，怎样建设社会主义"],answer:"B",explanation:"中共八大正确分析了国内形势和主 要矛盾的变化，明确提出新形势下党和人民 140"},
  {id:761,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"中共八大确定的我国社会主义经济建设的方针是",options:["A. 在综合平衡中稳步前进","B. 统筹兼顾、适当安排","C. 调整、巩固、充实、提高","D. 以农业为基础、以工业为主导"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:762,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1956年9月15日至27日， 中国共产党第八次全国代表大会在北京举行。中共八大正确分析 了国内形势和主要矛盾的变化，明确提出新形势下党和人民的主要任务。大会肯定“三个主 体 ，三个补充”思想，即以国家经营和集体经营、计划生产、国家市场三者为主体，以个体经 营、自由生产、自由市场三者为补充。这",options:["A. 在理论上完全突破了苏联计划经济模式","B. 为克服苏联模式弊端提供了重要启示","C. 初步形成了社会主义市场经济体制","D. 对过渡时期总路线的提出具有重要意义"],answer:"B",explanation:"1981年召开的中共十一届六中全会通 过的《关于建国以来党的若干历史问题的决 议》指出：“在社会主义改造基本完成以后， 我国所要解决的主要矛盾，是人民日益增 长的物质文化需要同落后的社会生产之间 的矛盾。”1987年召开的中共十三大再一 次明确指出：“我们在现阶段所面临的主要 矛盾，是人民日益增长的物质文化需要同 落后的社会生产之间的矛盾。”2017年召 开的中共十九大指出：“我国社会主要矛盾 已经转化为人民日益增长的美好生活需要 和不平衡不充分的发展之间的矛盾。”A、 C、D不符合题意。 中共八大肯定“三个主体，三个补充” 思想，即以国家经营和集体经营、计划生产、 国家市场三者为主体，以个体经营、自由生 产、自由市场三者为补充。这是在理论上突 破苏联计划经济模式，探索经济体制改革的 重要尝试。习近平在纪念陈云同志诞辰 120周年座谈会上的讲话中指出，社会主义 改造基本完成后，陈云同志积极探索适应我 国生产力发展的社会主义经济制度和经济 体制，提出“三个主体、三个补充”的思想，为 克服苏联模式弊端提供了重要启示。B 正 确。对于苏联计划经济模式，“三个主体，三 个补充”思想在理论上没有完全突破，在实 践上也只是探索尝试。A、C 错误。中共中 央在1952年底开始云酿并于1953年正式 提出党在过渡时期的总路线。D错误。"},
  {id:763,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1978年5月10日，中央党校内部刊物《理论动态》刊登《实践是检验真理的唯一标准》一 文。第二天，《光明日报》以特约评论员名义公开发表这篇文章，新华社向全国转发。文章发 表后产生强烈反响，引发了关于真理标准问题的大讨论。这场深刻而广泛的马克思主义思想解 放运动",options:["A. 成为正本清源、拨乱反正和改革开放的思想先导","B. 重新确立了实事求是的思想路线","C. 是解放思想、开辟新时期新道路的宣言书","D. 标志着党在指导思想上的拨乱反正胜利完成"],answer:"A",explanation:"在邓小平和许多老一辈革命家的支 持下，关于真理标准问题的大讨论迅速在全 党全社会展开。这场深刻而广泛的马克思 主义思想解放运动，成为正本清源、拨乱反 正和改革开放的思想先导。A 正确。1978 年12月13日，邓小平在中央工作会议闭幕 会上作了题为《解放思想，实事求是，团结一 致向前看》的讲话，这个讲话是解放思想、开 辟新时期新道路的宣言书，实际上成为随后 召开的党的十一届三中全会的主题报告，为 全会实现具有划时代意义的伟大转折奠定 了重要基础。C 错误。1978年12月召开 的党的十一届三中全会，重新确立了实事求 是的思想路线，确定把全党工作的着重点转 移到社会主义现代化建设上来，作出实行改 革开放的重大决策，实现了党的历史上具有 深远意义的伟大转折。B 错误。1981年6 月，党的十一届六中全会通过的《关于建国以 来党的若干历史问题的决议》,标志着党在指 导思想上的拨乱反正胜利完成。D错误。 ·"},
  {id:764,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1978年12月，党召开了十一届三中全会。全会果断停止使用“以阶级斗争为纲”的口号，实 现党和国家工作重心战略转移，实现了新中国成立以来党的历史上具有深远意义的伟大转折。 党的十一届三中全会",options:["A. 提出了“建设有中国特色社会主义”的重大命题","B. 把改革开放和现代化建设推向新阶段","C. 开启了我国改革开放和社会主义现代化建设新时期","D. 标志着党在指导思想上的拨乱反正胜利完成"],answer:"C",explanation:"C 正确。1982年邓小平在党的十二 大开幕词中提出了“建设有中国特色的社会 主义”的重大命题，A 错误。1992年邓小平 南方谈话把改革开放和现代化建设推向新 阶段，B 错误。D错误。"},
  {id:765,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1979年3月30日，邓小平在党的理论工作务虚会上发表《坚持四项基本原则》的讲话。他指 出：坚持社会主义道路，坚持人民民主专政，坚持共产党的领导，坚持马克思列宁主义、毛泽 东思想这四项基本原则，“是实现四个现代化的根本前提”。“如果动摇了这四项基本原则中的 任何一项，那就动摇了整个社会主义事业，整个现代化建设事业。”他还提出一个重要思想： “现在搞建设，也要适合中国情况，走出一条中国式的现代化道路。”这表明",options:["A. 中国共产党所领导的改革开放从一开始就具有明确的社会主义方向","B. 中国式现代化只能基于自身国情，不能借鉴他国经验","C. “ 中国特色社会主义”从此成为我们党的全部理论和实践创新的主题","D. 马克思主义同中国实际“第二次结合”任务的正式提出"],answer:"A",explanation:"邓小平《坚持四项基本原则》的讲话 郑重表明，中国共产党所领导的改革开放从 一开始就具有明确的社会主义方向。A 正 确。邓小平指出：“我们的现代化建设，必须 从中国的实际出发。无论是革命还是建设， 都要注意学习和借鉴外国经验。但是，照抄 照搬别国经验、别国模式，从来不能得到成 功。”B错误。1982年邓小平在党的十二大 开幕词中明确提出：走自己的道路，建设有 中国特色的社会主义。从此，“中国特色社 会主义”成为我们党的全部理论和实践创新 的主题。C 错误。1956年4月，毛泽东明确 提出：“最重要的是要独立思考，把马列主义 的基本原理同中国革命和建设的具体实际 相结合。民主革命时期，我们吃了大亏之后 才成功地实现了这种结合，取得了新民主主 义革命的胜利。现在是社会主义革命和建 设时期，我们要进行第二次结合，找出在中 国怎样建设社会主义的道路。”D 错误。"},
  {id:766,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"从1979年11月起，在邓小平主持下，中共中央着手起草《关于建国以来党的若干历史问题的 决议》。邓小平对《决议》的起草提出了指导原则，其中，最核心的一条是",options:["A. 对建国30年来历史上的大事，要进行实事求是的分析","B. 宜粗不宜细，总结过去是为了引导大家团结一致向前看","C. 确立毛泽东同志的历史地位，坚持和发展毛泽东思想","D. 走自己的路，开辟中国特色社会主义道路"],answer:"C",explanation:"从1979年11 月起，在邓小平主持 下，中共中央着手起草《关于建国以来党的 若干历史问题的决议》。邓小平对《决议》 的起草提出三条指导原则：第一，确立毛泽 东同志的历史地位，坚持和发展毛泽东思 想，这是最核心的一条；第 二 ，对建国30 年来历史上的大事，要进行实事求是的分 析，包括一些负责同志的功过是非，要作出 公正的评价；第三，这个总结宜粗不宜细， 总结过去是为了引导大家团结一致向前看。 C正确，A、B、D不符合题意。"},
  {id:767,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"《关于建国以来党的若干历史问题的决议》对于新时期我国社会主要矛盾作出正确判断，指出 社会主义改造基本完成以后，我国所要解决的主要矛盾是",options:["A. 人民日益增长的物质文化需要同落后的社会生产之间的矛盾","B. 人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾","C. 人民对于建立先进的工业国的要求同落后的农业国的现实之间的矛盾","D. 人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾"],answer:"A",explanation:"A正确。B、C是党的八大对于社会 主义改造基本完成以后我国社会主要矛盾 的提法；D是党的十九大关于我国新时代社 141 1000题 >>> 解析分册 会主要矛盾的判断。B、C、D不符合题意。 华民族伟大复兴提供了更为完善的制度保 证、更为坚实的物质基础、更为主动的精"},
  {id:768,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"1981年，党的十一届六中全会通过了《关于建国以来党的若干历史问题的决议》,具有深远历 史意义。党制定《决议》标志着",options:["A. 党重新确立了马克思主义的思想路线、政治路线、组织路线","B. 党在指导思想上的拨乱反正胜利完成","C. 新中国成立以来党的历史上具有深远意义的伟大转折的实现","D. 我国改革开放和社会主义现代化建设新时期的开启"],answer:"B",explanation:"党制定《关于建国以来党的若干历史 问题的决议》,标志着党在指导思想上的拨 乱反正胜利完成。B 正确。党的十一届三 中全会的胜利召开，结束了粉碎“四人帮”后 党和国家工作在徘徊中前进的局面，标志着 中国共产党重新确立了马克思主义的思想 路线、政治路线、组织路线，实现了新中国成 立以来党的历史上具有深远意义的伟大转 折，开启了我国改革开放和社会主义现代化 建设新时期。A、C、D 错误。"},
  {id:769,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"为了实现中华民族伟大复兴，中国共产党团结带领中国人民，创造了新民主主义革命的伟大成 就、社会主义革命和建设的伟大成就、改革开放和社会主义现代化建设的伟大成就、新时代中 国特色社会主义的伟大成就。其中，为实现中华民族伟大复兴提供了更为完善的制度保证、更 为坚实的物质基础、更为主动的精神力量的是",options:["A. 新民主主义革命的伟大成就","B. 社会主义革命和建设的伟大成就","C. 改革开放和社会主义现代化建设的伟大成就","D. 新时代中国特色社会主义的伟大成就"],answer:"D",explanation:"在习近平新时代中国特色社会主义 思想的指导下，中国共产党团结带领中国人 民，自信自强、守正创新，统揽伟大斗争、伟 大工程、伟大事业、伟大梦想，创造了新时代 中国特色社会主义的伟大成就，为实现中 神力量。D 正确。新民主主义革命的伟大 成就为实现中华民族伟大复兴创造了根本 社会条件。社会主义革命和建设的伟大成 就为实现中华民族伟大复兴奠定了根本政 治前提和制度基础。改革开放和社会主义 现代化建设的伟大成就为实现中华民族伟大 复兴提供了充满新的活力的体制保证和快速 发展的物质条件。A、B、C 不符合题意。"},
  {id:770,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"党的十九大报告提出新时代党的建设总要求，提出要全面推进党的政治建设、思想建设、组织 建设、作风建设、纪律建设，其中摆在首位的是",options:["A. 政治建设","B. 思想建设","C. 组织建设","D. 作风建设"],answer:"A",explanation:"党的十九大报告提出新时代党的建 设总要求，提出把党的政治建设摆在首位， 以政治建设为统领深入推进党的建设，A 正 确，B、C、D错误。"},
  {id:771,chapter:"史纲",sub:"中国近现代史纲要",type:"single",question:"2025 年是“十四五”规划收官之年。科学制定和接续实施五年规划，是我们党治国理政一条 重要经验，也是中国特色社会主义一个重要政治优势。从“一五”到“十四五”,一以贯之的 主题是",options:["A. 不断提高人民生活水平","B. 不断壮大我国综合国力","C. 不断推进中华民族伟大复兴","D. 把我国建设成为社会主义现代化国家"],answer:"D",explanation:"习近平在党的十九届五中全会第二 次全体会议上发表重要讲话指出：“从第一 个五年计划到第十四个五年规划，一以贯之 的主题是把我国建设成为社会主义现代化 国家。”D 正确，A、B、C 错误。"},
  {id:772,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"鸦片战争是中国近代史的起点。鸦片战争之所以成为中国近代史的起点，是因为鸦片战争之后， 随着外国资本主义的入侵",options:["A. 中国的封建社会逐步成为半殖民地半封建社会","B. 中国人民逐渐开始了反帝反封建的资产阶级民主革命","C. 中国人民对帝国主义的认识进到理性的阶段","D. 中国工人阶级开始以独立的姿态登上历史舞台"],answer:"AB",explanation:"1919年的五四运动中，中国工人阶级开始以独 立的姿态登上历史舞台。C、D不符合题意。"},
  {id:773,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"近代以来中华民族面临的两大历史任务，就是争得民族独立、人民解放和实现国家富强、人民幸 福。关于两大历史任务，以下说法正确的是",options:["A. 两大历史任务的内容与实现方式都不一样","B. 前一个任务为后一个任务创造必要的前提","C. 后一个任务是前一个任务的最终目的和必然要求","D. 两大历史任务分别由辛亥革命和新民主主义革命实现"],answer:"ABC",explanation:"随着外国资本主义的入侵，中国的封建 社会逐步成为半殖民地半封建社会，中国人民 逐渐开始了反帝反封建的资产阶级民主革命。 正因为如此，鸦片战争就成为中国近代史的起 点。A、B正确。近代以来，中国人民对帝国主 义的认识经历了两个阶段：第一阶段是表面的 感性认识阶段，这典型地表现在义和团等笼统 的排外主义的斗争上。第二阶段才进到理性 的认识阶段，即看出了帝国主义内部和外部的 两大历史任务的内容与实现方式都不一样，前 一个任务是从根本上推翻半殖民地半封建的 统治秩序，改变落后的生产关系和上层建筑； 后一个任务是要改变近代中国经济、文化落后 的地位和状况，发展社会生产力，实现中国的 现代化。前一个任务为后一个任务扫清障 碍，创造必要的前提；后一个任务是前一个 任务的最终目的和必然要求。A、B、C 正确。 辛亥革命没有改变旧中国半殖民地半封建的 社会性质，没有改变中国人民的悲惨境遇，没 有完成实现民族独立、人民解放的历史任务。 D错误。"},
  {id:774,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"资本-帝国主义列强对中国的侵略，首先和主要的是进行军事侵略。此外，还对中国实行政治控 制、经济掠夺和文化渗透。为了统治中国，资本-帝国主义列强在政治上采取的主要方式有",options:["A. 控制中国的内政、外交","B. 镇压中国人民的反抗","C. 控制中国的通商口岸","D. 扶植、收买代理人"],answer:"ABD",explanation:"为了统治中国，资本-帝国主义列强在政 治上采取的主要方式，是控制中国政府，操纵 中国的内政、外交，把中国当权者变成自己的 代理人和驯服工具，主要包括：控制中国的内 政、外交；镇压中国人民的反抗；扶植、收买代 理人。A、B、D正确。控制中国的通商口岸是 经济掠夺的手段，C错误。"},
  {id:775,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"电影《南京照相馆》导演、编剧申奥在《人民日报》发表题为《让历史真相不被掩盖和遗忘》 的文章，他提到：侵华日军在中国发起的不仅是一场热战，更是一场舆论战、文化战。电影中， 孙中山先生题字的牌匾被肆意涂抹，井上大佐的办公室摆满抢夺来的古玩字画……这些都揭示了 列强文化侵略的意图。鸦片战争以后，资本-帝国主义列强在对中国实行军事侵略、政治控制、 经济掠夺的同时，还对中国进行文化渗透。其进行文化渗透的目的是",options:["A. 宣扬殖民主义奴化思想","B. 麻醉中国人民的精神","C. 摧毁中国人的民族自尊心和自信心","D. 镇压中国人民的反抗"],answer:"ABC",explanation:"资本-帝国主义列强在对中国实行军事 侵略、政治控制、经济掠夺的同时，还对中国进 行文化渗透。例如，1907年美国总统西奥 多 ·罗斯福宣布将退还部分庚子赔款，用于资 助中国政府选派留学生赴美留学，史称“庚款 兴学”。毛泽东在《“友谊”,还是侵略?》一文 中指出，“庚款兴学”的实质是帝国主义的文化 侵略。资本-帝国主义列强对中国进行文化渗 透的目的是宣扬殖民主义奴化思想，麻醉中 国人民的精神，摧毁中国人的民族自尊心和 自信心。A、B、C 正确。镇压中国人民的反抗 是政治控制的方式，D不符合题意。"},
  {id:776,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"19世纪70至80年代，帝国主义列强从侵占中国周边邻国发展到蚕食中国边疆地区，使中国陷入 “边疆危机”。“边疆危机”的主要表现有",options:["A. 英国从印度侵入西藏，从缅甸入侵云南","B. 法国从越南侵犯广西","C. 俄国从中亚入侵新疆","D. 日本吞并琉球、侵犯中国台湾"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:777,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"受到鸦片战争失败的强烈刺激，中国官吏和知识分子中少数爱国的有识之士，开始注意了解国际 形势，研究外国史地，总结失败教训，寻找救国的道路和御敌的方法。郑观应在所著《盛世危 言》中提出了一系列具有重要的思想启蒙意义的主张，主要有",options:["A. 大力发展民族工商业","B. 同西方国家进行“商战”","C. 设立议院","D. 实行共和制度"],answer:"ABC",explanation:"19世纪70年代以后，王韬、薛福成、马 建忠、郑观应等人不仅主张学习西方的科学技 术，同时也要求吸纳西方的政治、经济学说。 他们的共同特点，就是具有比较强烈的反对外 国侵略、追求中国独立富强的爱国思想，以及 具有一定程度反对封建专制的民主思想。如"},
  {id:778,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"19世纪70年代以后，王韬、薛福成、马建忠、郑观应等人不仅主张学习西方的科学技术，同时 也要求吸纳西方的政治、经济学说。他们的共同特点是具有",options:["A. 比较强烈的反对外国侵略的爱国思想","B. 追求中国独立富强的爱国思想","C. 追求实行民主共和制度的思想","D. 一定程度反对封建专制的民主思想"],answer:"ABD",explanation:"（本题解析见原书解析分册）"},
  {id:779,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"130多年前爆发的中日甲午战争是中国近代史上的一个重要时间节点。甲午战争中国战败的影响有",options:["A. 中国开始陷入“边疆危机”","B. 中国人开始有了普遍的民族意识的觉醒","C. 帝国主义列强对中国的争夺和瓜分达到高潮","D. 标志着以“自强”“求富”为目标的洋务运动的失败"],answer:"BCD",explanation:"（本题解析见原书解析分册）"},
  {id:780,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"鸦片战争以后，中国还只是少数人有朦胧的民族觉醒意识。中日甲午战争以后，中国人才开始有 了普遍的民族意识的觉醒。甲午战争促成中国人民的民族意识开始普遍觉醒的主要原因在于",options:["A. 甲午战败和《马关条约》的签订给中国造成了深重的民族灾难","B. 中国的惨败彻底打破了中国传统的夷夏观念","C. 甲午战争以后，先进的中国人开始睁眼看世界了","D. 传统的“天朝上国”的优越感已经荡然无存"],answer:"ABD",explanation:"鸦片战争以后，中国还只是少数人有朦 胧的民族觉醒意识。中日甲午战争以后，当中 华民族面临生死存亡的关头时，中国人才开始 有了普遍的民族意识的觉醒。甲午战争何以 促成中国人民的民族意识开始普遍觉醒?主 要原因在于：甲午战败和《马关条约》的签订 给中国造成了深重的民族灾难；中国的惨败 彻底打破了中国传统的夷夏观念， 传统的 “天朝上国”的优越感已经荡然无存。A、B、 D正确。鸦片战争以后，先进的中国人开始睁 眼看世界了。林则徐是近代中国睁眼看世界 的第一人。C 错误。"},
  {id:781,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"《 天朝田亩制度》是最能体现太平天国社会理想和这次农民起义特色的纲领性文件。《资政新 篇》是太平天国后期颁布的社会发展方案。《资政新篇》",options:["A. 提出了一个以解决土地问题为中心的比较完整的社会改革方案","B. 体现了太平天国起义具有不同于以往农民战争的新的历史特点","C. 是中国近代历史上第一个比较系统的发展资本主义的方案","D. 反映了太平天国某些领导人在后期试图通过向外国学习来寻求出路的一种努力"],answer:"BCD",explanation:"B、C、D 正确。《天朝田亩制度》提出 · 解析分册 了一个以解决土地问题为中心的比较完整的 社会改革方案，《资政新篇》没有涉及农民和 土地问题。A错误。 风气和价值观念开始变化，工商业者的地位 上升。对一部分人来说，西方的各种技术和 器物不再被当作“奇技淫巧”受到排斥，而是 被视为模仿、学习的对象。这一切，都有利于 资本主义经济的发展，也有利于社会风气的 改变。A、C、D正确。 “裁撤绿营，建立新军”是清末“新政”的 内容。甲午战争一役北洋水师全军覆没就说 明洋务运动并没有实现巩固国防和边防的目 的。B 错误。"},
  {id:782,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"在半殖民地半封建的中国，太平天国农民起义及其失败表明",options:["A. 农民具有伟大的革命潜力","B. 农民自身不能担负起领导反帝反封建斗争取得胜利的重任","C. 单纯的农民战争不可能完成争取民族独立和人民解放的历史任务","D. 单纯的农民战争对反帝反封建斗争是没有意义的"],answer:"ABC",explanation:"A、B、C正确。农民阶级不是新的生产 力和生产关系的代表。他们无法克服小生产 者所固有的阶级局限性，因而无法从根本上 提出完整的、正确的政治纲领和社会改革方 案；无法制止和克服领导集团自身腐败现象 的滋长，无法长期保持领导集团的团结。但 单纯的农民战争对反帝反封建斗争仍然具有 重要的意义。D 错误。"},
  {id:783,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"19世纪60—90年代，洋务派举办的洋务事业归纳起来主要有",options:["A. 兴办近代企业","B. 建立新式海陆军","C. 创办新式学堂，派遣留学生","D. 颁布商法商律，奖励工商"],answer:"ABC",explanation:"19世纪60—90年代，洋务派举办的 洋务事业归纳起来有三方面：兴办近代企业； 建立新式海陆军；创办新式学堂，派遣留学 生。A、B、C 正确。“颁布商法商律，奖励工 商”是清末“新政”所推行的改革内容。D 错误。 ，"},
  {id:784,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"洋务运动失败的原因主要是",options:["A. 洋务运动具有封建性","B. 洋务运动对列强具有依赖性","C. 洋务企业的管理具有腐朽性","D. 洋务运动的指导思想具有激进性"],answer:"ABC",explanation:"A、B、C 正确。洋务运动的指导思想是 “中学为体，西学为用”,并不激进，D 错误。"},
  {id:785,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"洋务运动是在19世纪60年代初第二次鸦片战争结束后，在清政府镇压太平天国起义与捻军起 义的过程中兴起的。洋务运动历时30多年， 虽然因北洋海军在甲午战争一役全军覆没而告失 败，但是，洋务运动仍然有它的历史作用，表现在",options:["A. 开办了一批新式学堂，派出了最早的官派留学生，这是中国近代教育的开始","B. 裁撤绿营，建立新军，巩固了国防和边防","C. 传统的“重本抑末”等观念受到冲击，社会风气和价值观念开始变化","D. 客观上对中国的早期工业和民族资本主义的发展起了某些促进作用"],answer:"ACD",explanation:"洋务派提出“自强”“求富”的主张，通 过所掌握的国家权力集中力量优先发展军事 工业，同时也试图“稍分洋商之利”,发展若干 民用企业，在客观上对中国的早期工业和民 族资本主义的发展起了某些促进作用。洋务 运动时期，为了培养通晓洋务的人才，开办了 一批新式学堂，派出了最早的官派留学生， 这是中国近代教育的开始。与此同时，还翻 译了一批近代自然科学书籍，给当时的中国 带来了新的知识，使人们开阔了眼界。洋务 运动时期，伴随着资本主义生产方式的出现，"},
  {id:786,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"下列关于戊戌维新运动中维新派与守旧派论战的表述正确的有",options:["A. 论战的实质是资产阶级思想与封建主义思想在中国的第一次正面交锋","B. 论战主要围绕要不要变法，要不要兴民权、设议院，实行君主立宪，要不要废八股、改科举 和兴西学等问题展开","C. 论战所涉及的领域十分广泛，进一步开阔了新型知识分子的眼界，解放了人们长期受到束缚 的思想","D. 通过论战，划清了革命与改良的界限，维新变法政治运动的帷幕随之拉开"],answer:"ABC",explanation:"A、B、C正确。维新派与守旧派之间的 论战，是维新与守旧的论战，也就是要不要改 良的论战，不涉及革命问题。D 错误。"},
  {id:787,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"19 世纪90年代末中国出现戊戌维新运动不是偶然的，它的发生有着深刻的历史背景，主要是",options:["A. 中国民族资本主义已经成为中国经济的主要形式","B. 新兴的民族资产阶级迫切要求为在中国发展资本主义开辟道路","C. 甲午战争惨败造成的新的民族危机激发了新的民族觉醒","D. 资产阶级改良思想在中国迅速传播"],answer:"BCD",explanation:"B、C、D正确。19世纪90年代以后中 国民族资本主义有了初步发展，但并没有成 为中国经济的主要形式。事实上，中国民族 资本主义后来也没有成为中国经济的主要形 式。A 错误。"},
  {id:788,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1898年的“百日维新”如同昙花一现，只经历了103天就夭折了。除京师大学堂(北京大学的 前身)被保留下来以外，其余新政措施大都被废除。戊戌维新运动的失败，主要是由于维新派 自身的局限和以慈禧太后为首的强大的守旧势力的反对。具体说来，主要有",options:["A. 民族资产阶级力量弱小，又没有发动群众","B. 维新派触及了封建主义的经济基础——封建土地所有制、导致守旧派强烈反扑","C. 维新派没有突破“中体西用”思想的局限，不敢触动君主专制制度","D. 维新派虽然大声疾呼救亡图存，却又幻想西方列强能帮助自己变法维新"],answer:"AD",explanation:"传统的“重本抑末”等观念受到冲击，社 会 144 150"},
  {id:789,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"19 世纪90年代，维新派与守旧派开展了一场实质上是资产阶级思想与封建主义思想在中国的 第一次正面交锋的论战。这场论战围绕的主要问题是",options:["A. 要不要变法","B. 要不要实行民主共和","C. 要不要废八股、改科举和兴西学","D. 要不要实行君主立宪"],answer:"ACD",explanation:"A、C、D正确。资产阶级维新派主张实 行君主立宪，实行民主共和是后来以孙中山 为代表的资产阶级革命派的主张。B 错误。"},
  {id:790,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"戊戌维新运动是一次爱国救亡运动，维新派在民族危亡的关键时刻",options:["A. 高举救亡图存的旗帜","B. 要求通过变法，发展资本主义，使中国走上富强的道路","C. 成功地建立起存在百日的君主立宪制度","D. 其政治实践和思想理论，贯穿着强烈的爱国主义精神，推动了中华民族的觉醒"],answer:"ABD",explanation:"戊戌维新运动是一次爱国救亡运动。 维新派在民族危亡的关键时刻，高举救亡图 存的旗帜，要求通过变法，发展资本主义，使 中国走上富强的道路。维新派的政治实践和 思想理论，不仅贯穿着强烈的爱国主义精神， 而且推动了中华民族的觉醒。A、B、D正确。 戊戌维新运动未能成功地建立起资本主 义的君主立宪制度。“百日维新”期间颁布的 各项政令大多是接受了维新派的建议而制定 的，但是，在光绪皇帝发布的新政诏令中，并 没有采纳维新派多次提出的开国会、定宪法 等政治主张。C 错误。"},
  {id:791,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"戊戌维新虽然失败了，但它在中国近代史上仍然有着重大的历史意义。戊戌维新运动是一次爱 国救亡运动，是一场资产阶级性质的政治改良运动，更是一场思想启蒙运动。维新派大力传播 西方资产阶级的社会政治学说和自然科学知识，宣传自由平等、社会进化观念，批判封建君权 和封建纲常伦理，从而",options:["A. 把顽固的封建主义思想壁垒打开了一个缺口","B. 有利于民主思想在中国的传播和人们的思想解放","C. 使民主共和的观念开始深入人心","D. 使得资产阶级新文化开始打破封建文化独占文化阵地的局面"],answer:"ABD",explanation:"维新派大力传播西方资产阶级的社会 政治学说和自然科学知识，宣传自由平等、社 会进化观念，批判封建君权和封建纲常伦理， 从而把顽固的封建主义思想壁垒打开了一个 缺口，有利于民主思想在中国的传播，有利 于人们的思想解放。在维新派的推动下，“诗 界革命”“文体革命”“小说界革命”“戏剧改 良”“史学革命”等相继而起，形成了广泛的文 化革新运动。以维新运动为起点，资产阶级 新文化开始打破封建文化独占文化阵地的局 面。A、B、D 正确。 辛亥革命结束了中国延续两千多年的封 建君主专制制度，建立了中国历史上第一个 资产阶级共和政府，使民主共和的观念开始 深入人心。C 错误。"},
  {id:792,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"鸦片战争以后，西方列强野蛮入侵，封建统治腐朽无能，国家战乱不已，人民饥寒交迫，中国 人民和中华民族遭受世所罕见的深重苦难。要实现民族独立、人民解放和国家富强、人民幸福， 就必须推翻封建专制统治，对中国社会进行根本变革。辛亥革命的发生，是",options:["A. 当时民族危机加深、社会矛盾激化的结果","B. 当时中国人民争取民族独立、振兴中华深切愿望的集中反映","C. 中国民族资产阶级登上政治舞台的第一次表演","D. 当时中国人民为救亡图存而前赴后继顽强斗争的集中体现"],answer:"ABD",explanation:"A、B、D正确。戊戌维新运动是中国民族 资产阶级登上政治舞台的第一次表演，C 错误。 点拨 中国的资产阶级民主革命是以孙中山 为代表的资产阶级革命派首先发动的。 资 产 阶级革命派的骨干是 一批资产阶级、小资产 阶级知识分子。 这个知识分子群体的出现与 戊戌维新运动及20世纪初清政府兴学堂、派 留学生的措施有关。 这些青年学生接触到近 代西方资本主义的思想文化，其中不少人在 民族危难加深、群众自发斗争高涨形势的推 动下，开始摸索救国救民的新道路。"},
  {id:793,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1905年至1907年间发生的资产阶级革命派与改良派的论战，也暴露了革命派在思想理论方面 的弱点，主要表现在革命派",options:["A. 对“革命是否会招致帝国主义干涉”的问题不敢作出理直气壮的正面回答","B. 所说的“国民”,主要还是指资产阶级及其知识分子，而不是广大的劳动群众","C. 反对贫苦农民“夺富人之田为己有”","D. 只是希望通过“有秩序的革命”来避免动乱和帝国主义的干涉"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:794,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1905年8月， 中国同盟会正式成立。同盟会以《民报》为机关报，并确定了革命纲领。1905 年11月，在同盟会机关报《民报》发刊词中，孙中山将同盟会的纲领概括为三大主义，即民族 主义、民权主义、民生主义，后被称为三民主义。孙中山的三民主义学说",options:["A. 初步描绘出中国还不曾有过的资产阶级共和国方案","B. 是一个比较完整而明确的资产阶级民主革命纲领","C. 从正面鲜明地提出反对帝国主义的主张","D. 对推动革命的发展产生了重大而积极的影响"],answer:"ABD",explanation:"孙中山的三民主义学说，初步描绘出 中国还不曾有过的资产阶级共和国方案，是 一个比较完整而明确的资产阶级民主革命纲 领。它的提出，对推动革命的发展产生了重 大而积极的影响。A、B、D 正确。但是，同盟 会纲领中的民族主义没有从正面鲜明地提出 反对帝国主义的主张。当时的革命派对于帝 国主义的本质认识不清，害怕帝国主义干涉， 甚至幻想以承认不平等条约“继续有效”为条 件来换取列强对自己的支持。同时，他们也 没有明确地把汉族军阀、官僚、地主作为革命 对象，从而给了这部分人后来从内部和外部 破坏革命以可乘之机。C 错误。"},
  {id:795,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1956年，毛泽东在《纪念孙中山先生》一文中指出，纪念伟大的革命先行者孙中山先生，“纪 念他在辛亥革命时期，领导人民推翻帝制、建立共和国的丰功伟绩。”辛亥革命",options:["A. 是资产阶级领导的以反对封建君主专制制度、建立资产阶级共和国为目的的革命","B. 实现了中国人民和中华民族自鸦片战争以来的第一次全面觉醒","C. 是中国人民为救亡图存、振兴中华而奋起革命的一座里程碑","D. 是一次比较完全意义上的资产阶级民主革命"],answer:"ACD",explanation:"， A、C、D正确。辛亥革命激发了人民的 爱国热情和民族觉醒，打开了禁锢思想进步 的闸门。五四运动以全民族的行动激发了追 求真理、追求进步的伟大觉醒，它改变了以往 只有觉悟的革命者而缺少觉醒的人民大众的 斗争状况，实现了中国人民和中华民族自鸦 片战争以来的第一次全面觉醒。B 错误。"},
  {id:796,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"习近平总书记在纪念辛亥革命110周年大会上的讲话中指出，孙中山先生和辛亥革命先驱为中 华民族建立的历史功绩彪炳千秋，在辛亥革命中英勇奋斗和壮烈牺牲的志士们名垂青史，辛亥 革命永远是中华民族伟大复兴征程上一座巍然屹立的里程碑。辛亥革命",options:["A. 传播了民主共和的理念，打开了中国进步潮流的闸门","B. 撼动了反动统治秩序的根基，在中华大地上建立起亚洲第一个共和制国家","C. 推动了中国社会变革，点亮了实现中华民族伟大复兴的灯塔","D. 极大促进了中华民族的思想解放"],answer:"ABD",explanation:"习近平在纪念辛亥革命110周年大会 上的讲话中指出，1911年10月10日，武昌 城头枪声一响，拉开了中国完全意义上的近 代民族民主革命的序幕。辛亥革命极大促进 了中华民族的思想解放，传播了民主共和的 理念，打开了中国进步潮流的闸门，撼动了 反动统治秩序的根基，在中华大地上建立起 亚洲第一个共和制国家，以巨大的震撼力和 深刻的影响力推动了中国社会变革，为实现 中华民族伟大复兴探索了道路。 A、B、D 146"},
  {id:797,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"辛亥革命与戊戌变法的共同点有",options:["A. 都是自上而下的救亡运动","B. 都主张在中国发展资本主义","C. 都主张改革君主专制制度","D. 都未提出彻底的反帝反封建的纲领"],answer:"BD",explanation:"精讲P227 考点25 - 2- (1)-1 B、D正确。辛亥革命不是通过统治者 走自上而下的改良道路，A 错误。戊戌维新 运动主张君主立宪，依靠皇帝变法，而辛亥革 命用暴力推翻了君主专制制度，建立了共和 国 ，C也不是共同点。"},
  {id:798,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"辛亥革命之所以失败，从主观方面来说，在于它的领导者资产阶级革命派本身存在着许多弱点 和错误，主要是",options:["A. 没有提出彻底的反帝反封建的革命纲领","B. 不能充分发动和依靠人民群众","C. 不能建立坚强的革命政党","D. 资本主义的建国方案行不通"],answer:"ABC",explanation:"A、B、C 正确。D 项不是主观原因，而 是失败的根本原因。"},
  {id:799,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"毛泽东在谈到辛亥革命时指出，辛亥革命有它胜利的地方，也有它失败的地方。辛亥革命胜利 的地方主要是指",options:["A. 沉重打击了中外反动势力，为中国人民斗争的发展开辟了道路","B. 结束了封建君主专制制度，建立了中国历史上第一个资产阶级共和政府","C. 推动了中国人民的思想解放和中国的社会变革","D. 不仅在一定程度上打击了帝国主义的侵略势力，而且推动了亚洲各国民族解放运动的高涨"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:800,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"孙中山先生是伟大的民族英雄、伟大的爱国主义者、中国民主革命的伟大先驱，一生以革命为 己任，立志救国救民，为中华民族作出了彪炳史册的贡献。孙中山先生的丰功伟绩表现在",options:["A. 领导了辛亥革命，结束了统治中国几千年的君主专制制度","B. 把旧三民主义发展为新三民主义，实行联俄、联共、扶助农工三大政策","C. 发动了以推翻北洋军阀统治为目标的北伐战争","D. 坚决反对军阀分裂割据，坚定维护民主共和制度和国家完整统一"],answer:"ABD",explanation:"习近平在纪念孙中山先生诞辰150周 年大会上的讲话中指出，孙中山先生为当时 中国的积贫积弱痛心疾首，第一个响亮喊出 “振兴中华”的口号。他创立兴中会、同盟会， 提出民族、民权、民生的三民主义，积极传播 革命思想，广泛联合革命力量，连续发动武装 起义，为推进民主革命四处奔走、大声疾呼。 1911年，在他领导和影响下，震惊世界的辛 亥革命取得成功，推翻了清王朝统治，结束 了统治中国几千年的君主专制制度。他坚 决反对军阀分裂割据，坚定维护民主共和制 度和国家完整统一。中国共产党成立后，孙 中山先生同中国共产党人真诚合作，在中国 共产党帮助下，把旧三民主义发展为新三民 主义，实行联俄、联共、扶助农工三大政策，改 组中国国民党。毛泽东同志把三民主义纲 领、统一战线政策、艰苦奋斗精神并称为孙中 山先生“留给我们的最中心最本质最伟大的 遗产”,是“对于中华民族最伟大的贡献”。 A、B、D正确。以推翻北洋军阀统治为目标的 北伐战争是在孙中山逝世之后发生的，不可 能由孙中山发动。C 错误。"},
  {id:801,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"新文化运动是从1915年9月陈独秀在上海创办《青年杂志》(后改名《新青年》)开始的。新 文化运动是生动活泼的、前进的、革命的，具有重要的意义。新文化运动",options:["A. 通过批判孔学，动摇了封建正统思想的统治地位","B. 在社会上掀起思想解放潮流，冲决了禁锢人们思想的闸门","C. 是资产阶级新文化开始打破封建文化独占文化阵地局面的起点","D. 提倡民主、反对专制，提倡科学、反对迷信盲从，是切中时弊的"],answer:"ABD",explanation:"起一股思想解放的潮流。新文化运动的倡导 者提倡民主、反对专制，提倡科学、反对迷 信盲从，是切中时弊的。事实上，当封建主 义还在政治和社会生活中占据支配地位时， 对资产阶级民主主义的提倡，客观上仍然具 有振聋发聩的作用。新文化运动在社会上掀 起的思想解放潮流，冲决了禁锢人们思想的 闸门。而这个闸门一被打开，各种新思想的 涌流就不仅不可避免，而且是无法遏止的了。 A、B、D正确。以维新运动为起点，资产阶级 新文化开始打破封建文化独占文化阵地的局 面，C错误。"},
  {id:802,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"五四以前的新文化运动主要是资产阶级民主主义的新文化反对封建主义的旧文化的斗争，五四 以后的新文化运动则发展到了一个新阶段，马克思主义开始逐步在思想文化领域中发挥指导作 用。这主要是指中国先进分子在接受马克思主义之后",options:["A. 没有抛弃而是继承了五四运动的民主和科学的精神并赋予它们新的含义","B. 克服了以往启蒙者的弱点，有力推动了反封建的启蒙运动","C. 以唯物史观为武器从反对封建思想入手，进而提出必须反对产生封建思想的社会制度","D. 依靠进步报刊的传播，把改造国民性置于优先地位"],answer:"ABC",explanation:"A、B、C 正确。把改造国民性置于优 先地位是五四以前的新文化运动的主张，D 错误。"},
  {id:803,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"毛泽东指出，俄罗斯以民众大联合打倒贵族、驱逐富人的事实，使全世界为之震动。革命浪潮 风起云涌，“异军特起，更有中华长城渤海之间，发生了‘五四’运动”。这表明",options:["A. 俄国十月革命是五四运动的直接导火线","B. 五四运动是在新的时代条件和社会历史条件下发生的","C. 十月革命使中国人看到了民族解放的新希望","D. 只有社会主义才能救中国成为当时全社会的普遍共识"],answer:"BC",explanation:"五四运动是在新的时代条件和社会历 史条件下发生的。首先，是新的社会力量的 成长、壮大。其次，是新文化运动掀起的思想 解放的潮流。最后，是俄国十月革命对中国 的影响。B正确。1917年俄国爆发的十月社 会主义革命，是一个具有划时代意义的世界 性的历史事件。它昭示人们，资本主义制度 并不是永恒的，无产阶级和其他劳动群众一 旦觉醒起来、组织起来，完全可以依靠自身的 力量创造出维护绝大多数人利益的崭新社会 制度。十月革命发生在中国学习西方的努力 遭到失败、中国先进分子陷于苦闷和彷徨时， 它使中国人看到了民族解放的新希望。C 正 确。五四运动的直接导火线，是巴黎和会上 中国外交的失败。A 错误。十月革命推动中 国先进分子把目光从西方转向东方，从资产 阶级民主主义转向社会主义，但并不是全社 会所有人的普遍共识。D 错误。"},
  {id:804,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1919年爆发的五四运动，是中国近代史上一个划时代的事件，在近代以来中华民族追求民族独 立和发展进步的历史进程中具有里程碑意义。五四运动",options:["A. 是中国旧民主主义革命走向新民主主义革命的转折点，成为中国新民主主义革命的开端","B. 以全民族的力量高举起爱国主义的伟大旗帜，孕育了以爱国、进步、民主、科学为主要内容 的伟大五四精神","C. 以全民族的行动激发了追求真理、追求进步的伟大觉醒，实现了中国人民和中华民族自鸦片 战争以来的第一次全面觉醒","D. 以全民族的搏击培育了永久奋斗的伟大传统，标志着中国青年成为推动中国社会变革的急先锋"],answer:"ABCD",explanation:"· 1000题 解析分册 ·"},
  {id:805,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"由于五四运动是在新的社会历史条件下发生的，它具有以辛亥革命为代表的旧民主主义革命所 不具备的历史特点。五四运动",options:["A. 是一场以先进青年知识分子为先锋、广大人民群众参加的彻底反帝反封建的伟大爱国革命 运动","B. 是一场中国人民为拯救民族危亡、捍卫民族尊严、凝聚民族力量而掀起的伟大社会革命运动","C. 是一场传播新思想、新文化、新知识的伟大思想启蒙运动和新文化运动","D. 以磅礴之力鼓动了中国人民和中华民族实现民族复兴的志向和信心"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:806,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"毛泽东同志当年曾指出，“五四运动时中国无产阶级开始有了觉悟，五四运动发生在一九一九 年，一九二一年便产生了中国共产党”,“我们研究党史，只从一九二一年起还不能完全说明问 题……从五四运动说起可能更好”。习近平深刻指出，认识和把握五四运动“要坚持大历史观”。 这些爪要论述，深刻揭示了五四运动与中国共产党成立的历史关联。五四运动",options:["A. 促进了马克思主义在中国的传播","B. 促进了马克思主义同中国工人运动的结合","C. 为中国共产党的成立作了思想上、干部上的准备","D. 为新的革命力量、革命文化、革命斗争登上历史舞台创造了条件"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:807,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1920年，陈望道翻译的首个中文全译本《共产党宣言》在中国面世，立即受到工人阶级和先进 知识分子的热烈欢迎，初版印了千余本很快销售一空。毛泽东后来回忆起他青年时代信仰马克 思主义的经过时，曾谈及他在这个时期读过陈望道翻译的《共产党宣言》。1920年之所以会在 中国出版首个中文全译本《共产党宣言》,并很快销售一空，是因为",options:["A. 当时的中国社会需要马克思主义","B. 马克思主义提供了中国革命的具体方案","C. 十月革命推动中国的先进分子从资产阶级民主主义转向社会主义","D. 五四运动以后社会主义思潮在中国蓬勃兴起，马克思主义开始在知识界广泛传播"],answer:"ACD",explanation:"“理论在一个国家实现的程度，总是决 定于理论满足这个国家的需要的程度。”产生 于西方的马克思列宁主义之所以能够被中国 的先进分子所接受，是因为“中国的社会条件 有了这种需要，是因为同中国人民革命的实 践发生了联系”。十月革命是一个具有划时 代意义的世界性的历史事件。它推动着中国 的先进分子把自己的目光从西方转向东方， 从资产阶级民主主义转向社会主义。五四运 动以后，社会主义思潮在中国蓬勃兴起，马 克思主义开始在知识界广泛传播。在李大钊 等的影响和当时形势的推动下，一批爱国的 进步青年，尤其是那些具有初步共产主义思 想的知识分子，经过各自的摸索，逐步划清了 资产阶级民主主义和无产阶级社会主义、科 学社会主义和其他社会主义流派的界限，走 上了马克思主义的道路。A、C、D 正确。马克 思主义是行动的指南，不可能提供中国革命 的具体方案。B 错误。"},
  {id:808,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"随着中国工人阶级开始作为独立的政治力量登上历史舞台和马克思主义在中国的逐步传播，建 立一个以马克思主义为指导的工人阶级政党的任务被提上了日程。1920年8月，共产党早期组 织在上海《新青年》编辑部成立。同年10月，李大钊等在北京成立共产党早期组织。从1920 年秋至1921年春，武汉、长沙、济南、广州，都成立了共产党早期组织。在日本、法国成立了 由留学生和华侨中先进分子组成的共产党早期组织。中国共产党早期组织成立后，进行多方面 的活动，使在中国创建共产党的条件基本具备了。共产党早期组织成立后，着重进行的工作主 要有",options:["A. 研究和宜传马克思主义，研究中国实际问题","B. 到工人中去进行宣传和组织工作","C. 提出反帝反封建的民主革命纲领","D. 进行关于建党问题的讨论和实际组织工作"],answer:"ABD",explanation:"A、B、D 正确。中共二大第一次提出了 反帝反封建的民主革命纲领，为中国人民指 出了明确的斗争目标。C 错误。"},
  {id:809,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"中国共产党这个中国近代以来最伟大的创业团队，是1921年在上海的一座石库门小楼里集结出发 的。当年这里是望志路106号.1943年至今是兴业路76号。由“望志”而“兴业”.是历史的巧 合，也寓意着历史的必然。中国共产党是在特定的社会历史条件下成立的。中国共产党一开始",options:["A. 就把党的工作重心放在农村","B. 就义无反顾地肩负起实现中华民族伟大复兴的历史使命","C. 就是一个区别于第二国际旧式社会改良党的新型工人阶级革命政党","D. 就是一个以马克思列宁主义理论为基础的党"],answer:"BCD",explanation:"中国共产党是在特定的社会历史条件 下成立的。中国共产党一开始就是一个以马 克思列宁主义理论为基础的党，是一个区别 于第二国际旧式社会改良党的新型工人阶级 革命政党。中国共产党一经成立，就把实现 共产主义作为党的最高理想和最终目标，义 无反顾肩负起实现中华民族伟大复兴的历史 使命。中国共产党人的初心和使命，就是为 中国人民谋幸福，为中华民族谋复兴。这个 初心和使命是激励中国共产党人不断前进的 根本动力。B、C、D正确。中国共产党成立后 的很长一段时间，是把党的工作重心放在城 市的。大革命失败后，在开辟井冈山革命根 据地的过程中，党才逐步把工作重心转向农 村。A错误。"},
  {id:810,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1922年8月，中共中央一些领导人在杭州开会，讨论国共合作问题。1923年1月，共产国际执 委会作出《关于中国共产党与国民党的关系问题的决议》,对国共合作起了推动作用。1923年6 月在广州举行的中国共产党第三次全国代表大会",options:["A. 正确估计了孙中山的革命立场和国民党进行改革的可能性","B. 强调组成“民主主义的联合战线”,明确提出了统一战线政策","C. 决定共产党员以个人身份加入国民党，以实现国共合作","D. 明确规定共产党员加入国民党时，党必须在政治上、思想上、组织上保持自己的独立性"],answer:"ACD",explanation:"A、C、D正确。中共二大在制定反帝反 封建的民主革命纲领的同时，也强调为实现 反帝反军阀的革命目标，必须联合全国一切 革命党派，联合资产阶级民主派，组成“民主 主义的联合战线”,这标志着党明确提出了统 一战线政策。B 错误。"},
  {id:811,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"为了加强对日益高涨的革命运动的领导，1925年1月，中国共产党第四次全国代表大会在上海 举行。中共四大的重大历史功绩在于",options:["A. 提出了中国无产阶级在民主革命中的领导权问题","B. 提出了工农联盟问题","C. 对中国民主革命的内容作了更加完整的规定","D. 具体回答了如何正确处理同资产阶级争夺领导权过程中遇到的复杂问题"],answer:"ABC",explanation:"为加强对日益高涨的革命运动的领 导，1925年1月，中国共产党第四次全国代 表大会在上海举行。其重大历史功绩是：提 出了无产阶级在民主革命中的领导权问题， 提出了工农联盟问题，对民主革命的内容作 了更加完整的规定。这是对中国革命问题认 识的重大进展。A、B、C 正确。但是，中共四 大对如何实现无产阶级领导权，特别是如何 正确处理同资产阶级争夺领导权过程中遇到 的复杂问题，并没有作出明确的、具体的回 答。D 错误。"},
  {id:812,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1925年5月，英、日等国军警在上海制造枪杀中国民众的五卅惨案，导致五卅运动爆发。以此 为起点，掀起了全国范围的大革命高潮。五卅运动",options:["A. 是中国工人运动史上持续时间最长的一次政治大罢工","B. 冲破了长期笼罩全国的沉闷的政治空气，大大促进了群众的觉醒","C. 显示了各革命阶级、各阶层民众在无产阶级领导下联合斗争的巨大威力","D. 给了帝国主义和军阀势力一次前所未有的打击"],answer:"BCD",explanation:"中国共产党领导的五卅运动，是中华 民族直接反抗帝国主义的伟大运动。它冲破 了长期笼罩全国的沉闷的政治空气，大大促 进了群众的觉醒，显示了各革命阶级、各阶 层民众在无产阶级领导下联合斗争的巨大威 力，给了帝国主义和军阀势力一次前所未有 的打击。B、C、D 正确。1925年6月开始的 · 考研政治 解析分册 · 多 性 省港大罢工，前后坚持了16个月之久，是中 国工人运动史上持续时间最长的一次政治大 罢工。A 错误。"},
  {id:813,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1924 年至1927年中国反帝反封建的革命，之所以被称作大革命，是因为与以往任何一次革命 包括辛亥革命和五四运动相比，有很大的不同，主要是",options:["A. 群众的动员程度更为广泛","B. 斗争的规模更加宏伟","C. 革命的社会内涵更为深刻","D. 革命的背景更加复杂"],answer:"ABC",explanation:"（本题解析见原书解析分册）"},
  {id:814,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"大革命是在国共合作的条件下进行的，没有国共合作，不会在短时间内掀起这样一场革命。在 这场革命中，中国共产党起着独特的、不可代替的作用。没有中国共产党，不会有这场大革命。 中国共产党在大革命中的独特的、不可代替的作用表现在",options:["A. 中国共产党是大革命的政治口号——反对帝国主义、反对军阀—— 的提出者","B. 中国共产党是国共合作的倡导者和统一战线的领导者","C. 中国共产党是人民群众的主要发动者和组织者","D. 中国共产党帮助和推动了国民革命军的建立 ⑦ 考研政治1 0 0 题>>试题分册"],answer:"ACD",explanation:"A、C、D正确。中国共产党是国共合作 的倡导者和统一战线的组织者，但不是统一 战线的领导者。中国共产党的中央领导机关 在大革命的后期犯了以陈独秀为代表的右倾 机会主义的错误，放弃了无产阶级对于农民 群众、城市小资产阶级和民族资产阶级的领 导权，尤其是武装力量的领导权，这是大革命 失败的重要原因之一，B错误。"},
  {id:815,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"大革命失败的原因是",options:["A. 反革命力最强大，蒋介石集团、汪精卫集团先后叛变革命","B. 党当时处于幼年时期，不善于将马列主义基本原理同中国革命具体实际结合起来","C. 党的中央领导机关在大革命的后期犯了以陈独秀为代表的右倾机会主义的错误","D. 共产国际对中国革命作出了一些错误的指导"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:816,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1927年4月12日，蒋介石在上海发动反共政变。同年7月15日，汪精卫在武汉召开“分共” 会议，并在其辖区内对共产党员和革命群众实行搜捕和屠杀，国共合作全面破裂，大革命最终 失败。大革命虽然失败了，但它的历史意义仍然是不可磨灭的。正是在这个时期，中国共产党 人进行了轰轰烈烈的革命工作，领导了全国反帝反封建的伟大斗争，在中国革命史上写下了光 荣的一页，同时",options:["A. 开始探索马克思主义中国化的途径","B. 初步提出了新民主主义革命的基本思想","C. 开始建立人民民主统一战线","D. 开始懂得进行土地革命和掌握革命武装的重要性"],answer:"ABD",explanation:"大革命虽然失败了，但它的历史意义 仍然是不可磨灭的。正是在这个时期，中国 共产党人进行了轰轰烈烈的革命工作，领导 了全国反帝反封建的伟大斗争，在中国革命 史上写下了光荣的一页，同时开始探索马克 思主义中国化的途径，初步提出了新民主主 义革命的基本思想，并从大革命的失败中汲 取深刻历史教训，开始懂得进行土地革命和 掌握革命武装的重要性。A、B、D正确。 新民主主义革命时期，中国共产党先后 经历了第一次国共合作的统一战线(国民革 命联合战线)、工农民主统一战线、抗日民族 统一战线、人民民主统一战线等几个时期，其 中人民民主统一战线是解放战争时期建立 的。C 错误。"},
  {id:817,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"大革命失败后，内战代替了团结，独裁代替了民主，黑暗的中国代替了光明的中国。但是，中 国共产党和中国人民并没有被吓倒，被征服，被杀绝。他们从地下爬起来，揩干净身上的血迹， 掩埋好同伴的尸首，他们又继续战斗了。中国共产党从失败的危局中开出了新局，表现在",options:["A. 举行了武装抵抗，创建了人民军队","B. 建立了农村革命根据地，实行了土地制度的改革","C. 开辟了农村包围城市、武装夺取政权的道路","D. 提出了彻底的民主革命纲领和建立统一战线的主张"],answer:"ABC",explanation:"大革命失败后，1927年8月1 日，周恩 来、贺龙、叶挺、朱德、刘伯承等率领共产党掌 握和影响的军队2万多人，在南昌打响了武 装反抗国民党反动派的第一枪。 这是中国 共产党独立领导革命战争、创建人民军队和 武装夺取政权的开端。9月9日，毛泽东等领 导的湘赣边界秋收起义爆发。在攻打中心城 市长沙遭遇严重挫折后，起义部队决定南下， 向敌人控制比较薄弱的农村转移，并于10月 7日抵达江西省宁冈县茅坪，开始了创建井 冈山农村革命根据地的斗争。 1928年12 月，毛泽东在井冈山主持制定中国共产党历 史上第一个土地法《井冈山土地法》,以立 法的形式，首次肯定了广大农民以革命的手 段获得土地的权利。在创立农村革命根据地 的过程中，开辟了农村包围城市、武装夺取 政权的道路。A、B、C 正确。1922年中共二 大提出了彻底的民主革命纲领和建立统一战 线的主张，是在大革命失败之前。D错误。"},
  {id:818,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1928年10月和11月，毛泽东写了《中国的红色政权为什么能够存在?》和《井冈山的斗争》 两篇文章，论证了红色政权能够长期存在并发展的主客观条件，提出了工农武装割据的思想。 1930年1 月，毛泽东在《星星之火，可以燎原》一文中进一步阐明了中国革命只能走与资本主 义国家不同的道路。这些论述，提出了党把工作重心由城市转移到农村，在农村开展游击战争， 深入进行土地革命，建立和发展红色政权，待条件成熟时再夺取全国政权的中国革命新道路的 思想。农村包围城市、武装夺取政权的理论",options:["A. 是对1927年大革命失败后中国共产党领导的红军和根据地斗争经验的科学概括","B. 是在同当时党内盛行的把马克思主义教条化的错误倾向作坚决斗争的基础上逐步形成的","C. 是在共产国际的直接指导和借鉴苏联经验的基础上逐步形成的","D. 标志着中国化的马克思主义即毛泽东思想的初步形成"],answer:"ABD",explanation:"农村包围城市、武装夺取政权的理论， 是对1927年大革命失败后中国共产党领导 的红军和根据地斗争经验的科学概括。它是 在以毛泽东为主要代表的中国共产党人同当 时党内盛行的把马克思主义教条化、把共产 国际决议和苏联经验神圣化的错误倾向作坚 决斗争的基础上逐步形成的。农村包围城 市、武装夺取政权道路理论的提出，指明了中 国革命胜利的唯一正确道路，标志着中国化 的马克思主义即毛泽东思想的初步形成。A、 B、D正确，C 错误。"},
  {id:819,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1931年11月，中华苏维埃第一次全国代表大会在江西瑞金召开。大会通过了《中华苏维埃共 和国宪法大纲》以及土地法令、劳动法等，选举产生了中华苏维埃共和国中央执行委员会，成 立了中华苏维埃共和国临时中央政府，毛泽东当选为主席。中华苏维埃共和国",options:["A. 是中国历史上第一个全国性的各个革命阶级联合专政的政权","B. 是中国共产党在局部地区执政的重要尝试","C. 扩大了党和红色政权的影响，一定程度上加强了对处于被分割状态的各根据地的中枢指挥作用","D. 推动了各根据地的政权、经济、文化教育和党的自身建设，开创了土地革命战争新局面"],answer:"BCD",explanation:"B、C、D正确。中华苏维埃共和国是中 国历史上第一个全国性的工农民主政权，而 不是各个革命阶级联合专政的政权(民族资 产阶级并没有参加政权),A错误。"},
  {id:820,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1935年1月，中共中央政治局在长征途中举行遵义会议，这在党的历史上是一个生死攸关的转 折点。遵义会议",options:["A. 标志着中国共产党在政治上开始走向成熟","B. 使实事求是的思想路线在全党范围确立起来","C. 确立党中央的正确领导，创造性地制定和实施符合中国革命特点的战略策略","D. 开启了党独立自主解决中国革命实际问题的新阶段"],answer:"ACD",explanation:"遵义会议是党的历史上一个生死攸关 的转折点。这次会议事实上确立了毛泽东在 党中央和红军的领导地位，开始确立以毛泽 东为主要代表的马克思主义正确路线在党中 央的领导地位，开始形成以毛泽东同志为核 心的第一代中央领导集体，在最危急关头挽 救了党、挽救了红军、挽救了中国革命。遵义 会议的鲜明特点是坚持真理、修正错误，确立 党中央的正确领导，创造性地制定和实施符 合中国革命特点的战略策略。遵义会议开启 了中国共产党独立自主解决中国革命实际问 题的新阶段，标志着中国共产党在政治上开 始走向成熟。A、C、D正确。 遵义会议以来，党的路线已走上马克思 主义的正确轨道，但对曾经给党的事业造成 严重危害的主观主义、教条主义还没有来得 及从思想上进行认真清理。1941 年5月，毛 泽东作了《改造我们的学习》的报告。整风运 动首先在党的高级干部中进行。整风运动是 一次深刻的马克思主义思想教育运动，也是 一场伟大的思想解放运动。它坚持马克思主 义同中国实际相结合的正确方向，使实事求 是的思想路线在全党范围确立起来。 B 错误。"},
  {id:821,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1934年9月上旬，国民党军队加紧对中央革命根据地腹地发动进攻，红军已无在原地扭转战局 的可能。10月，中共中央、中革军委率中央红军主力等8.6 万余人踏上战略转移的漫漫征程， 开始了世界历史上前所未有的壮举。中国工农红军长征是一次理想信念的伟大远征，是一次检 验真理的伟大远征，是一次唤醒民众的伟大远征，是一次开创新局的伟大远征。长征的胜利",options:["A. 极大地促进了党在政治上和思想上的成熟","B. 是中国革命转危为安的关键","C. 标志着党在政治上、思想上、组织上走向成熟","D. 是中华民族从近代以来陷入深重危机走向伟大复兴的历史转折点"],answer:"AB",explanation:"长征的胜利，极大地促进了党在政治 上和思想上的成熟。中国共产党进一步认识 到，只有把马克思主义基本原理同中国革命 具体实际结合起来，独立自主解决中国革命 的重大问题，才能把革命事业引向胜利。长 征的胜利，是中国革命转危为安的关键。长 征一结束，中国革命的新局面就开始了。A、B 正确。 中共七大在党的历史上具有重要里程碑 意义，标志着党在政治上、思想上、组织上走 向成熟。C 错误。抗日战争的胜利是中华民 族从近代以来陷入深重危机走向伟大复兴的 历史转折点。D 错误。 中 纲 · 1000题 >>>解析分册 ·"},
  {id:822,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1931年9月18日深夜，日本关东军按照精心策划，炸毁沈阳柳条湖“南满铁路”路轨，并嫁 祸于中国军队，日军以此为借口，炮轰中国东北军北大营，制造了震惊中外的九一八事变。面 对日本的野蛮侵略，中国人民奋起抵抗。中国人民在白山黑水间的奋起抵抗",options:["A. 揭开了世界反法西斯战争的序幕","B. 标志着中国由此进入全民族抗战阶段","C. 成为中国人民抗日战争的起点","D. 直接促成了国共两党的第二次合作"],answer:"AC",explanation:"九一八事变(1931年)后，面对日本的 野蛮侵略，中国人民奋起抵抗，进行了长达14 年艰苦卓绝的抗日战争。中国人民在白山黑 水间的奋起抵抗，成为中国人民抗日战争的 起点，同时揭开了世界反法西斯战争的序幕。 A、C正确。 卢沟桥事变(1937年)爆发后，当地中国 驻军奋起抵抗，中国由此进入全民族抗战阶 段，并开辟了世界反法西斯战争的东方主战 场。B 错误。国共两党的第二次合作是在西 安事变(1936年12月)之后。 D 错误。"},
  {id:823,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1935年12月， 中共中央在陕北瓦窑堡召开政治局扩大会议，讨论全国政治形势和党的策略路 线问题、军事战略问题。会议批评并克服了党内长期存在的“左”倾冒险主义、关门主义错误 倾向，明确提出党的基本策略任务是建立广泛的抗日民族统一战线。瓦窑堡会议是从第五次反 “围剿”失败到全民族抗战兴起过程中召开的一次重要会议，它表明",options:["A. 党在新的历史时期将要到来时掌握了政治上的主动权","B. 党开始努力解决政治路线问题","C. 党正在从中国的实际情况出发，创造性地开展工作","D. 实事求是的思想路线在全党范围确立起来"],answer:"ABC",explanation:"1935年12月，中共中央在陕北瓦窑 堡召开政治局扩大会议，提出党的基本策略 任务是建立广泛的抗日民族统一战线，批评 了党内长期存在的“左”倾冒险主义、关门主 义错误倾向。瓦窑堡会议是从第五次反“围 剿”失败到全民族抗战兴起过程中召开的一 次重要会议，它表明党已经克服“左”倾冒险 主义和关门主义，制定出抗日民族统一战线 的新策略，使党在新的历史时期将要到来时 掌握了政治上的主动权；表明党在遵义会议 着重解决军事路线问题和组织问题之后，开 始努力解决政治路线问题；表明党在总结经 验教训的基础上，正在从中国的实际情况出 发，创造性地开展工作。A、B、C正确。延安 整风运动使实事求是的思想路线在全党范围 确立起来。D 错误。"},
  {id:824,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1937年8月，中国共产党在陕北洛川召开政治局扩大会议(洛川会议)。会议强调要争取抗战 胜利的关键在于使已经发动的抗战成为全面的全民族抗战。会议通过《中国共产党抗日救国十 大纲领》,提出必须实行全国军事总动员、全国人民总动员；必须改革政治机构，给人民以充分 的抗日民主权利，并适当改善工农大众生活。洛川会议制定的党的全面抗战路线",options:["A. 把实行全民族抗战与争取人民民主、改善人民生活结合起来","B. 把反对外敌入侵与推进社会进步统一起来","C. 正确处理了民族矛盾与阶级矛盾的关系","D. 确立了建立广泛的抗日民族统一战线的新策略"],answer:"ABC",explanation:"洛川会议是在全面抗战刚刚爆发的历 史转折关头召开的一次重要会议。会议制定 的党的全面抗战路线，把实行全民族抗战与 争取人民民主、改善人民生活结合起来，把 反对外敌入侵与推进社会进步统一起来，正 确处理了民族矛盾与阶级矛盾的关系。A、B、 C正确。1935年12月，中共中央在陕北瓦窑 堡召开的政治局扩大会议确立了建立广泛的 抗日民族统一战线的新策略。D 错误。"},
  {id:825,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"以国共两党合作为基础的抗日民族统一战线正式形成的标志是",options:["A. 西安事变的和平解决","B. 国民党中央通讯社发表《中共中央为公布国共合作宣言》","C. 蒋介石发表实际上承认中国共产党合法地位的谈话","D. 国民党五届三中全会"],answer:"BC",explanation:"B、C正确。国民党五届三中全会只是 标志着抗日民族统一战线初步形成。"},
  {id:826,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"日本发动全面侵华战争后，中华民族面临空前危机，全国人民最关心的问题是：这场战争能不 能胜利?怎样争取胜利?毛泽东同志科学地回答了这个问题，他在1938年发表的《论持久战》 一文，使全国人民对抗战的进程和前途有了清晰的认识，极大坚定了全国军民坚持抗战的信心。 《论持久战》 一文",options:["A. 分析了中日双方存在着的互相矛盾的四个基本特点","B. 批驳了“亡国论”“速胜论”,明确指出抗日战争是持久的，最后胜利属于中国","C. 科学预见了抗日战争由防御到相持、最后到反攻的三个阶段","D. 强调“兵民是胜利之本”,战胜日本的侵略，必须进行人民战争"],answer:"ABCD",explanation:"1938年5月至6月间，毛泽东发表 《论持久战》的讲演，总结全民族抗战10个月 来的经验，批驳了“亡国论”“速胜论”等错 误观点，系统地阐明了持久战方针。毛泽东 指出，中日战争是半殖民地半封建的中国和 帝国主义的日本之间在20世纪30年代进行 的一个决死的战争。一方面，日本是强国，中 国是弱国，强国弱国的对比，决定了抗日战争 只能是持久战。另一方面，日本是小国，发动 的是退步的、野蛮的侵略战争，在国际上失道 寡助；而中国是大国，进行的是进步的、正义 的反侵略战争，在国际上得道多助。(中日双 方存在着的互相矛盾的四个基本特点)中国 已经有了代表中华民族和中国人民根本利益 的、在政治上成熟的中国共产党及其领导的 抗日根据地和人民军队。因此，最后胜利又 将是属于中国的。毛泽东强调，“兵民是胜 利之本”,战胜日本的侵略，必须进行人民 战争。毛泽东科学预见了抗日战争的发展 进程，即抗日战争将经过战略防御、战略相 持、战略反攻三阶段。《论持久战》系统阐明 了抗日战争的发展规律和坚持抗战、争取抗 战胜利必须实行的战略总方针，是中国共产 党领导抗日战争的纲领性文献，对全国抗战 的战略指导产生了积极影响。 A、B、C、D 全选。"},
  {id:827,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"从传统的战争理论看来，游击战争是个战术问题。但是，在中国人民抗日战争中，游击战被提 到战略地位，具有全局性意义。以下说法正确的有",options:["A. 在战略防御阶段，游击战争担负了抗击日军战略进攻的主要任务","B. 游击战争主要是在外线单独作战，而不是在内线配合正规军的战役作战","C. 在民族战争条件下，游击战争能够大规模地进行","D. 在长期的不断削弱敌人、壮大自己的斗争中，游击军和游击战必将向正规军和运动战发展"],answer:"BCD",explanation:"毛泽东之所以把抗日游击战争提高到 战略地位来考察，是因为：在中国这样一个大 国中，特别是在民族战争条件下，游击战争有 充分的活动地盘和极为广大的群众基础，能 够大规模地进行。抗日游击战争主要不是内 线配合正规军的战役作战，而是在外线单独 作战，并有自己一整套的防御和进攻的战略 战术。抗日战争的长期性，又使得在广泛发 动游击战争中，要解决创建根据地和建立人 民政权的战略任务。在长期的不断削弱敌 人、壮大自己的斗争中，游击军和游击战必 将向正规军和运动战发展，形成为最后战胜 敌人的强大战斗力量。B、C、D 正确。在战略 防御阶段，从全局看，国民党正面战场的正规 战是主要的，敌后游击战是辅助的。日本侵 略者以国民党军队为主要作战对象。以国民 党军队为主体的正面战场担负了抗击日军战 略进攻的主要任务，组织了淞沪、忻口、徐州、 武汉会战等一系列大战役。A 错误。"},
  {id:828,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"为了实现全面抗战路线和持久战战略总方针，毛泽东首次将游击战提高到战略地位。在极为艰 苦的反“扫荡”、反“清乡”斗争中，敌后军民创造了很多极为有效、灵活多样的歼敌方法，如 伏击战、破袭战、地雷战、地道战、麻雀战等，使日军犹如困兽，陷入人民战争的汪洋大海。 独立自主的游击战争",options:["A. 实质上是抗日战争中时间最长、战斗战役持续不断的一场特殊战略大会战","B. 是人民军队发挥政治优势和军事优势最好的作战形式","C. 是坚持持久抗战、最终彻底战胜日本侵略者的唯一正确的政治军事方针","D. 始终是国民党正面战场正规战的重要辅助力量"],answer:"ABC",explanation:"为了实现全面抗战路线和持久战战略 总方针，毛泽东同志首次将游击战提高到战 略地位。与正面战场常规作战的一次次战役 不同，敌后游击战的重点是面而不是点，是持 续而不是阶段，是整体而不是个别，是战略而 不是战役，实质上是抗日战争中时间最长、 战斗战役持续不断的一场特殊战略大会战。 在极为艰苦的反“扫荡”、反“清乡”斗争中， 敌后军民创造了很多极为有效、灵活多样的 歼敌方法，如伏击战、破袭战、地雷战、地道 战、麻雀战等，使日军犹如困兽，陷入人民战 争的汪洋大海。实践证明，独立自主的游击 战争是人民军队发挥政治优势和军事优势最 好的作战形式，是坚持持久抗战、最终彻底 战胜日本侵略者的唯一正确的政治军事方 针。A、B、C 正确。在战略防御阶段，从全局 看，国民党正面战场的正规战是主要的，敌后 游击战是辅助的。在战略相持阶段，敌后游 击战争成为主要的抗日作战方式。D 错误。"},
  {id:829,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"抗日民族统一战线是以国共合作为基础的。中国共产党在统一战线中要坚持独立自主原则，既 统一，又独立。为此，共产党必须",options:["A. 保持在思想上、政治上和组织上的独立性，放手发动群众","B. 坚持对人民军队的绝对领导，努力发展人民武装和抗日根据地","C. 对国民党采取又团结又斗争、以斗争求团结的方针","D. 对中间势力进行有理、有利、有节的斗争"],answer:"ABC",explanation:"A、B、C正确。在抗日民族统一战线内 部，要争取中间势力，同顽固派作斗争，必须 坚持有理、有利、有节的原则，D错误。"},
  {id:830,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"抗日战争相持阶段到来以后，由于以蒋介石为代表的国民 党亲英美派开始推行消极抗日、积极 反共的政策，团结抗战的局面逐步发生严重危机，出现了中途妥协和内部分裂两大危险。针对 这种情况，为了坚决揭露打击汪精卫集团的叛国投降活动，继续争取同蒋介石集团合作抗日， 1939年7月， 中国共产党明确提出的口号有",options:["A. “ 坚持抗战到底，反对中途妥协”","B. “巩固国内团结，反对内部分裂”","C. “坚持全面抗战，反对限共溶共”","D. “ 力求全国进步，反对向后倒退”"],answer:"ABD",explanation:"抗日战争相持阶段到来以后，由于以 蒋介石为代表的国民党亲英美派开始推行消 极抗日、积极反共的政策，团结抗战的局面逐 步发生严重危机，出现了中途妥协和内部分 裂两大危险。针对这种情况，1939年7月， 中国共产党明确提出“坚持抗战到底，反对 中途妥协”“巩固国内团结，反对内部分 裂”“力求全国进步，反对向后倒退”三大 口号，坚决揭露打击汪精卫集团的叛国投降 活动，继续争取同蒋介石集团合作抗日。A、 B、D正确，C错误。"},
  {id:831,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"中国共产党在抗日民族统一战线中坚持的策略总方针是",options:["A. 发展进步势力","B. 争取中间势力","C. 消灭反动势力","D. 孤立顽固势力"],answer:"ABD",explanation:"抗日民族统一战线中的顽固势力不同 于日本帝国主义及其走狗，它有抗日的一面， 因此，对它是孤立而不是消灭，与其斗争应 坚持“有理、有利、有节”原则。A、B、D 正 确，C错误。"},
  {id:832,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"抗日民族统一战线中的中间势力包括",options:["A. 民族资产阶级","B. 城市小资产阶级","C. 地方实力派","D. 开明绅士"],answer:"ACD",explanation:"A、C、D正确。B项“城市小资产阶级” 是坚决要求抗日、赞成民主的，整体属于进步 势力，不是中间势力。"},
  {id:833,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"为了抗日民族统一战线的坚持、扩大和巩固，中国共产党制定了“发展进步势力，争取中间势 力，孤立顽固势力”的策略总方针。同顽固派作斗争必须坚持",options:["A. 有节","B. 有理","C. 有利","D. 有力"],answer:"ABC",explanation:"（本题解析见原书解析分册）"},
  {id:834,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1938年9月29日至11月6日，中国共产党扩大的六届六中全会在延安召开。这是一次具有重 大历史意义的会议，毛泽东后来在党的七大上说：“六中全会是决定中国之命运的。”党的六届 六中全会的重要性体现在",options:["A. 基本纠正了王明在抗日民族统一战线上的“左”倾错误","B. 进一步巩固了毛泽东在全党的领导地位","C. 统一了全党的思想和步调，推动了各项工作迅速发展","D. 毛泽东在全会上明确提出了“马克思主义的中国化”命题"],answer:"BCD",explanation:"1938年9月29日至11月6日，中国 共产党扩大的六届六中全会在延安召开。在 党的六届六中全会上，毛泽东明确提出“马克 思主义的中国化”命题。全会基本纠正了王 明的右倾错误，进一步巩固了毛泽东在全党 的领导地位，统一了全党的思想和步调，推动 了各项工作迅速发展。B、C、D正确。 此前，1937年11月，王明从苏联回国。 他根据共产国际和苏联领导人关于中国抗战 应该依靠国民党的指示精神，主张“一切经 过统一战线”“一切服从抗日”,把共产党和 人民军队的活动限制在国民党允许的范围 内，对洛川会议以来党在统一战线问题上的 许多正确观点和政策提出批评。这些错误观 点受到毛泽东等中央领导人的坚决抵制。 1938年8月，中共驻共产国际代表王稼祥回 国，传达共产国际指示：中共中央的政治路线 是正确的，中共中央要以毛泽东为首来解决 统一领导的问题。党的六届六中全会基本纠 正了王明的右倾错误。A 错误。"},
  {id:835,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1938年，在党的六届六中全会上，毛泽东明确提出“马克思主义的中国化”命题。他强调： “马克思主义的中国化，使之在其每一表现中带着中国的特性，即是说，按照中国的特点去应用 它，成为全党亟待了解并亟须解决的问题。”为了推进马克思主义中国化的事业，毛泽东向全党 提出的任务是",options:["A. 普遍地、深入地学习马克思列宁主义的理论","B. 学习我们的历史遗产并给以批判的总结","C. 调查研究当前运动的特点及其规律性","D. 反对主观主义、宗派主义和党八股"],answer:"ABC",explanation:"A、B、C正确。反对主观主义、宗派主 义和党八股是整风运动的主要内容，D 错误。"},
  {id:836,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1942年2月，毛泽东先后作了《整顿党的作风》和《反对党八股》的讲演，整风运动在全党范 围普遍展开。在全党开展整风运动，原因在于",options:["A. 由于条件的限制，遵义会议以来对曾经给党的事业造成严重危害的主观主义、教条主义，没 有来得及从思想上进行认真的清理","B. 随着党的队伍的扩大，一大批出身农民和其他小资产阶级的新党员身上存在着各种非无产阶 级思想","C. 共产国际解散给党带来的不利影响也需要应对","D. 老党员要适应新形势，也需要进一步提高自己"],answer:"ABD",explanation:"抗日战争以来，中国共产党的组织得到 很大的发展。广大新党员有很强的抗日精神 和革命斗志，但是他们绝大多数出身于农民 及其他小资产阶级，在他们身上存在着各种 非无产阶级思想。老党员要适应新形势， 也需要进一步提高自己。1935年1 月遵义 会议以来，党的路线已经走上马克思主义的 正确轨道，但对曾经给党的事业造成严重危 害的主观主义、教条主义还没有来得及从思 想上进行认真的清理。这就有必要集中开展 一场普遍的马克思主义思想教育运动，总结 和吸取历史上的经验教训，以提高广大党员 的思想理论水平，增强党的凝聚力和战斗力。 为此，在20世纪40年代前期，中国共产党以 延安为中心，在全党范围内开展了一场整风 运动。A、B、D正确。 共产国际是开展全党整风以后的1943 年解散的，C错误。"},
  {id:837,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1941年5月，毛泽东作了《改造我们的学习》 的报告。整风运动首先在党的高级干部中进行。 1942年2月， 毛泽东先后作了《整顿党的作风》和《反对党八股》的讲演，整风运动在全党范 围普遍展开。任弼时在《学习毛泽东整顿三风报告的笔记》中记录了参加整风运动的体会：“毛 泽东同志整顿三风报告中，关于反对主观主义的主要精神，是正确地提出了对待马列主义态度 问题。告诉我们学习马列主义，不是学它的字句， 而是要学会用它的立场、观点和方法去解决 革命中的实际问题，找出革命的发展规律，来便于我们具体决定政策。”整风运动",options:["A. 使实事求是的思想路线在全党范围确立起来","B. 以党的六届七中全会原则通过《关于若干历史问题的决议》而胜利结束","C. 开始了马克思主义与中国实际的“第一次结合”","D. 是一次深刻的马克思主义思想教育运动和思想解放运动"],answer:"ABD",explanation:"A、B、D正确。马克思主义与中国实际的“第 一次结合”是指马克思主义与中国新民主主 义革命相结合，这在中国共产党成立以后，尤 其是在毛泽东探索中国革命新道路的时候就 开始了。C 错误。"},
  {id:838,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"在深入总结历史经验的基础上，1944年5月21 日至1945年4月20日，中共扩大的六届七中 全会在延安召开。会议原则通过了《关于若干历史问题的决议》,对建党以后特别是党的六届四 中全会至遵义会议前这一段党的历史及其经验教训进行了总结，对党的若干重大历史问题作出 结论。《关于若干历史问题的决议》",options:["A. 使全党特别是党的高级干部对中国革命基本问题的认识达到了一致，增强了全党团结","B. 充分肯定了确立毛泽东在全党领导地位的重大意义","C. 为党的七大胜利召开创造了充分条件，有力促进了中国革命事业发展","D. 开启了党独立自主解决中国革命实际问题的新阶段"],answer:"ABC",explanation:"《关于若干历史问题的决议》使全党特 别是党的高级干部对中国革命基本问题的认 识达到了一致，增强了全党团结，为党的七大 胜利召开创造了充分条件，有力促进了中国 154"},
  {id:839,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1945年4月23日至6月11日，中国共产党第七次全国代表大会在延安举行。这次大会以“团 结的大会，胜利的大会”载入党的史册。中共七大",options:["A. 制定了党的政治路线和新民主主义国家在政治、经济、文化方面的纲领","B. 标志着我们党在政治上、思想上、组织上走向了成熟","C. 把党成立以来的历史经验概括为三大法宝","D. 把毛泽东思想确立为党的指导思想并写入党章"],answer:"ABD",explanation:"中共七大制定了党的政治路线，即“放 手发动群众，壮大人民力量，在我党的领导 下，打败日本侵略者，解放全国人民，建立一 个新民主主义的中国”;制定了新民主主义国 家在政治、经济、文化方面的纲领；把党在 长期奋斗中形成的优良作风概括为三大作 风，即理论和实践相结合的作风、和人民群众 紧密联系在一起的作风、自我批评的作风：将 以毛泽东为主要代表的中国共产党人把马克 思列宁主义基本原理同中国具体实际相结合 所创造的理论成果，正式命名为毛泽东思想， 并规定为党的一切工作的指针。把毛泽东思"},
  {id:840,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1945年4月23日至6月11日，中国共产党第七次全国代表大会在延安举行。毛泽东在会上作 了题为《论联合政府》的书面报告和《愚公移山》的闭幕词。中共七大制定了“放手发动群 众，壮大人民力量，在我党的领导下，打败日本侵略者，解放全国人民，建立一个新民主主义 的中国”的政治路线，总结党的建设的历史经验，把党在长期奋斗中形成的优良作风概括为",options:["A. 艰苦奋斗的作风","B. 理论和实践相结合的作风","C. 和人民群众紧密地联系在一起的作风","D. 自我批评的作风"],answer:"BCD",explanation:"（本题解析见原书解析分册）"},
  {id:841,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1945年，包括台湾同胞在内的全体中华儿女前仆后继、浴血奋战，取得中国人民抗日战争暨世 界反法西斯战争的伟大胜利，台湾随之光复，重回祖国怀抱。台湾光复是",options:["A. 中国人民抗日战争胜利的重要成果","B. 中国政府恢复对台湾行使主权的重要铁证","C. 台湾作为中国一部分的历史事实和法理链条的重要一环","D. 两岸同胞的共同荣光和全体中华儿女的民族记忆"],answer:"ABCD",explanation:"第十四届全国人民代表大会常务委员 155 1000题 >>>解析分册 · 区政权，以期不战而控制全中国；三是如果 谈判不成，即放手发动内战，并把战争责任 转嫁给中国共产党。B、C、D 正确。抗战胜利 后，蒋介石集团的既定方针是以武力消灭共 产党及其领导的人民军队和解放区政权，以 便坚持其独裁统治，继续走半殖民地半封建 社会的老路。A 错误。"},
  {id:842,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"中国人民的抗日战争从1931年开始，到1945年结束，前后经历了14年的浴血奋战。在世界反 法西斯战争的进程中，中国人民的抗日战争被称为“最早的抗争，最后的胜利”。中国人民抗日 战争的伟大胜利，是",options:["A. 近代以来中国人民反抗外敌入侵第一次取得完全胜利的民族解放斗争","B. 中华民族从近代以来陷入深重危机走向伟大复兴的历史转折点","C. 世界反法西斯战争胜利的重要组成部分","D. 中国人民的胜利、世界人民的胜利"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:843,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"在艰苦卓绝的抗日战争中，全体中华儿女为国家生存而战、为民族复兴而战、为人类正义而战， 社会动员之广泛，民族觉醒之深刻，战斗意志之顽强，必胜信念之坚定，都达到了空前的高度。 中国人民以铮铮铁骨战强敌、以血肉之躯筑长城、 以前仆后继赴国难，谱写了惊天地、泣鬼神 的雄壮史诗。中国人民抗日战争的伟大胜利",options:["A. 彻底粉碎了日本军国主义殖民奴役中国的图谋，彻底洗刷了近代以来抗击外来侵略屡战屡败 的民族耻辱","B. 对世界各国夺取反法西斯战争的胜利，维护世界和平产生了巨大影响","C. 坚定了中国人民追求民族独立、自由、解放的意志，开启了古老中国凤凰涅槃、浴火重生的 历史新征程","D. 促进了中华民族的大团结，形成了伟大的抗战精神"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:844,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"抗日战争的伟大胜利，是近代以来中国人民反抗外敌入侵第一次取得完全胜利的民族解放斗争。 当年一个积贫积弱的国家，能够战胜不可一世的日本军国主义，原因在于",options:["A. 以爱国主义为核心的民族精神是中国人民抗日战争胜利的决定因素","B. 中国共产党的中流砥柱作用是中国人民抗日战争胜利的关键","C. 全民族抗战是中国人民抗日战争胜利的重要法宝","D. 世界反法西斯力量为中国人民提供了宝贵的人力物力支持"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:845,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"中国共产党的中流砥柱作用是中国人民抗日战争胜利的关键。中国共产党的中流砥柱作用体 现在",options:["A. 在日本帝国主义加紧侵略我国、民族危机空前严重的关头，率先高举武装抗日旗帜","B. 促成西安事变和平解决，对推动国共再次合作、团结抗日起了重大历史作用","C. 坚持全面抗战路线，提出和实施持久战的战略总方针和一整套人民战争的战略战术","D. 开辟广大敌后战场和抗日根据地，领导八路军、新四军、东北抗日联军和其他人民抗日武装 英勇作战"],answer:"ABCD",explanation:"史 织 · 多 性 想确立为党的指导思想并写入党章，是中共 七大的历史性贡献。中共七大标志着我们党 在政治上、思想上、组织上走向了成熟。A、"},
  {id:846,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"抗日战争胜利后，蒋介石集团的既定方针是以武力消灭共产党及其领导的人民军队和解放区政 权。但是，1945年8月，蒋介石还是连发三电，邀请毛泽东赴重庆谈判。这是因为",options:["A. 全国人民强烈要求和平、反对内战","B. 国民党的军队大部分远在西南、西北后方","C. 国民党完成内战部署需要相当的时间","D. 国际上苏联、美国等都表示希望中国能够实行和平建国"],answer:"ABCD",explanation:"由于全国人民强烈要求和平、反对内 战，而国民党的军队大部分远在西南、西北后 方，要把它们运往内战前线、完成内战部署需 要相当的时间，加上国际上苏联、美国等都表 示希望中国能够实行和平建国，所以蒋介石 在积极准备内战的同时，又表示愿意与中共 进行和平谈判。A、B、C、D 全选。 B、D正确。 毛泽东于1939年10月撰写的《<共产党 人>发刊词》,总结中国共产党成立以来的历 史经验，指出统一战线、武装斗争、党的建设 是中国共产党在中国革命中战胜敌人的三个 主要法宝。C 错误。"},
  {id:847,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1946年6月26日，国民党军以进攻中原解放区为起点，挑起了全面内战。为打退国民党对解 放区的军事进攻，中共中央指出，必须",options:["A. 在国际上奉行“一边倒”的外交方针以争取社会主义阵营的广泛支持","B. 争取一切可以争取的人，在党的领导下建立最广泛的人民民主统一战线","C. 采取集中优势兵力、各个歼灭敌人的作战原则","D. 立即以主力打到外线去，将战争引向国民党统治区域"],answer:"BC",explanation:"为打退国民党对解放区的军事进攻， 中共中央指出，在政治上，必须和人民群众亲 密合作，必须争取一切可以争取的人，在党的 领导下建立最广泛的人民民主统一战线；在 军事上，必须采取集中优势兵力、各个歼灭敌 人的作战原则。B、C正确。 1946年6月至1947年6月，人民军队 处于战略防御阶段，战争主要在解放区进行。 “以主力打到外线去，将战争引向国民党统治 区域”是转入战略进攻阶段的做法，D 错误。 “一边倒”的外交方针是1949年才提出来的， A错误。"},
  {id:848,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"全面内战爆发时，中国共产党清醒估计国内外形势，坚决认定，我们必须打败蒋介石，而且能 够打败他。我们能够打败蒋介石，是因为",options:["A. 蒋介石军事力量的优势和美国的援助，只是临时起作用的因素","B. 蒋介石发动的战争的反人民性质，人心的向背，是经常起作用的因素","C. 各民主党派和无党派民主人士公开自愿接受中国共产党的领导，决心走人民革命的道路","D. 人民解放军的战争所具有的爱国的、正义的、革命的性质，必然要获得全国人民的拥护"],answer:"ABD",explanation:"全面内战爆发时，中国共产党面临的 形势极为严峻。中国共产党清醒估计国内外 形势，坚决认定，我们必须打败蒋介石，而且 能够打败他。毛泽东指出：我们必须打败蒋 介石，是因为蒋介石发动的战争，是一个在美 帝国主义指挥之下的反对中国民族独立和中 国人民解放的反革命的战争。我们能够打败 蒋介石，是因为蒋介石军事力量的优势和美 国的援助，只是临时起作用的因素；而蒋介 石发动的战争的反人民性质，人心的向背， 则是经常起作用的因素，在这方面，我们占 着优势。人民解放军的战争所具有的爱国 的、正义的、革命的性质，必然要获得全国 人民的拥护。这就是战胜蒋介石的政治基 础。A、B、D正确。 1949年1月22日，李济深、沈钧儒等民 主党派的领导人和著名的无党派民主人士55 人联合发表《对时局的意见》,一致认定中共 提出的关于召开政治协商会议、成立联合政 府的主张“符合于全国人民大众的要求”,恳 切表示“愿在中共领导下，献其绵薄，共策进 行，以期中国人民民主革命之迅速成功，独 立、自由、和平、幸福的新中国之早日实现”。 这个政治声明表明，中国各民主党派和无党 派民主人士公开自愿接受中国共产党的领 导，决心走人民革命的道路，拥护建立人民 民主的新中国。C 错误。"},
  {id:849,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"毛泽东指出：“如果我们能够普遍地彻底地解决土地问题，我们就获得了足以战胜一切敌人的最 基本的条件。”解放战争时期，为推动解放区土改运动进一步发展，1947年7月至9月，中国 共产党在西柏坡召开全国土地会议，制定和通过了《中国土地法大纲》。土地制度改革",options:["A. 是中国共产党领导广大农民从根本上摧毁中国封建制度根基的社会大变革","B. 使人民解放战争获得源源不断的人力、物力支援","C. 为打败蒋介石、建立新中国奠定了深厚的群众基础","D. 为当代中国的一切发展进步提供了根本政治保障"],answer:"ABC",explanation:"为推动解放区土改运动进一步发展， 1947年7月至9月，中国共产党在西柏坡召 开全国土地会议，制定和通过了《中国土地法 大纲》。《中国土地法大纲》是一个彻底反封 建的土地革命纲领，它指引着在封建制度压 迫下的亿万农民群众，将自己的力量汇入民 主革命的洪流。经过土改运动，到1948年 秋，1亿人口的解放区消灭了封建生产关系。 广大农民的政治觉悟和组织程度空前提高。 人民解放战争获得源源不断的人力、物力支 援。土地制度改革，是中国共产党领导广大 农民从根本上摧毁中国封建制度根基的社会 大变革。它使占中国人口绝大多数的农民进 一步认识到，中国共产党是他们自身利益的 坚决维护者，因而自觉地在党的周围团结起 来。这就为打败蒋介石、建立新中国奠定了 深厚的群众基础。A、B、C正确。 社会主义基本制度的确立为当代中国的 一切发展进步提供了根本政治保障，D错误。"},
  {id:850,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1949年3月召开的中共七届二中全会是新中国成立前中国共产党召开的一次十分重要的会议。 毛泽东在会议上提出了“两个务必”的思想，即“务必使同志们继续地保持谦虚、谨慎、不骄、 不躁的作风，务必使同志们继续地保持艰苦奋斗的作风”。这次会议",options:["A. 规定了党在全国胜利后在政治、经济、外交方面应当采取的基本政策","B. 指出了中国由农业国转变为工业国、由新民主主义社会转变为社会主义社会的发展方向","C. 提出要掌握斗争的方向，不要四面出击","D. 标志着中国革命重心从农村转向城市"],answer:"AB",explanation:"1949 年3月召开的中共七届二中全 会，规定了党在全国胜利后在政治、经济、 外交方面应当采取的基本政策，指出了中国 由农业国转变为工业国、由新民主主义社会 转变为社会主义社会的发展方向。在这次会 议上，毛泽东告诫全党，夺取全国胜利，这只 是万里长征走完了第一步，中国的革命是伟 大的，但革命以后的路更长，工作更伟大，更 艰苦。据此，他提出了“两个务必”的思想。 毛泽东还指出，在胜利面前，必须警惕资产阶 级“糖衣炮弹”的攻击。A、B正确。 中共七届二中全会讨论了党的工作中心 由乡村转移到城市的问题，指出“从现在起， 开始了由城市到乡村并由城市领导乡村的时 期”。1949年3月25日，毛泽东等中央领 导人与中央机关、人民解放军总部进驻北平 (北京)香山，标志着中国革命重心从农村 转向城市。D 错误。中共七届三中全会上毛 泽东作了《不要四面出击》的讲话。C 错误。"},
  {id:851,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"中国共产党与民主党派的合作，对于中国人民解放事业的发展起到了积极的作用。促成中国共 产党与民主党派团结合作的因素有",options:["A. 民主党派主张的“中间路线”与中国共产党主张的新民主主义道路是基本一致的","B. 中国共产党对各民主党派采取了积极的争取和团结的政策","C. 民主党派主张爱国、反对卖国，主张民主、反对独裁","D. 民主党派在斗争的实践中自愿地接受了中国共产党的领导"],answer:"BCD",explanation:"B、C、D 正确。抗日战争胜利后，某些 民主党派的领导人曾经鼓吹的“中间路线”, 实际上是主张在中国建立一个名副其实的资 产阶级共和国，以便使资本主义得到自由的 和充分的发展，使中国成为一个独立的资本 主义社会。这与中国共产党主张的新民主主 义道路是不一致的。A错误。"},
  {id:852,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1949年9月21日，中国人民政治协商会议第一届全体会议在北平(北京)隆重开幕。毛泽东 在开幕词中向全世界豪迈地宣告：“我们的工作将写在人类的历史上，它将表明：占人类总数四 分之一的中国人从此站立起来了。”这次会议",options:["A. 完成了创建新中国的任务","B. 通过了社会主义类型的临时宪法《中国人民政治协商会议共同纲领》","C. 开启了中国共产党领导各党派团体和各族各界人士协商建国、共创伟业的新纪元","D. 标志着中国共产党领导的多党合作和政治协商制度正式确立"],answer:"ACD",explanation:"完成创建新中国的任务，是由中国人 民政治协商会议第一届全体会议来承担的。 会议通过了《中国人民政治协商会议组织法》 《中华人民共和国中央人民政府组织法》《中 国人民政治协商会议共同纲领》,选出政协第 一届全国委员会，成立了中央人民政府。习 近平在庆祝中国人民政治协商会议成立75 周年大会上的讲话中指出，1949年9月，在 中国人民争取民族独立和人民解放运动取得 历史性伟大胜利之际，中国人民政治协商会 议第一届全体会议召开，开启了中国共产党 领导各党派团体和各族各界人士协商建国、 共创伟业的新纪元，标志着中国共产党领导 的多党合作和政治协商制度正式确立。A、C、 D正确。 政协第一届全体会议通过的《中国人民 政治协商会议共同纲领》,成为中国人民的大 宪章，在一个时期内起着新中国临时宪法的 作用。但它还不是社会主义类型的宪法。 1954年9月，中华人民共和国第一届全国人 民代表大会第一次会议通过的《中华人民共 和国宪法》,是一部社会主义类型的宪法，体 现了人民民主原则和社会主义原则。 B 错误。"},
  {id:853,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"随着国民党反动统治的覆灭和中华人民共和国的成立，中国新民主主义革命羸得了基本的胜利。 中国革命胜利具有的伟大意义在于",options:["A. 实现了中国人民梦寐以求的民族独立和人民解放","B. 从根本上改变了中国社会的发展方向，为实现中华民族伟大复兴开辟了广阔道路","C. 是继俄国十月社会主义革命和世界反法西斯战争胜利后世界历史中最重大的事件","D. 毛泽东思想和中国革命道路对于马克思列宁主义的发展是一个重大的贡献"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:854,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"新中国成立初期，面临着许多严重的困难和紧迫的问题。这对于刚刚执掌全国政权的中国共产 党来说，是新的严峻考验。中国共产党和人民政府采取一系列积极稳健的政策措施，有条不紊 地领导全国各族人民进行捍卫巩固新政权、建设新中国的伟大斗争。新中国成立初期面临的严 峻考验有",options:["A. 能不能保卫住革命胜利成果，巩固新生人民政权","B. 能不能战胜严重经济困难，迅速恢复和发展国民经济","C. 能不能巩固民族独立，维护国家主权和安全","D. 能不能经受住全国执政的新考验，继续保持优良传统和作风"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:855,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"在进行社会主义改造、向社会主义过渡的进程中，中国共产党积累了丰富的历史经验，包括坚 持社会主义工业化建设与社会主义改造同时并举，采取积极引导、逐步过渡的方式及用和平方 法进行改造。在以下逐步过渡的方式中，在性质上属于半社会主义性质的形式是",options:["A. 手工业供销合作社","B. 全行业的公私合营","C. 初级农业生产合作社","D. 个别企业的公私合营"],answer:"ACD",explanation:"（本题解析见原书解析分册）"},
  {id:856,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"20世纪50年代中期，社会主义改造基本完成，标志着",options:["A. 社会主义基本制度在我国已经确立","B. 我国进入了社会主义初级阶段","C. 我国步入了社会主义改革时期","D. 我国完成了从新民主主义向社会主义的过渡"],answer:"ABD",explanation:"精讲P117 考点13 -1 20世纪50年代中国进行的生产资 料所有制的社会主义改造取得了伟大的历 史性胜利，中国社会的经济结构发生了根本 的变化，社会主义全民所有制和集体所有制 经济在国民经济中占了绝对优势，成为中国 的经济基础。社会主义改造的胜利，解放了 被束缚的社会生产力，促进了社会生产力的 发展，伴随着社会经济结构的变化，中国社 会的阶级关系也发生了根本变化，广大劳动 人民从此摆脱了受剥削的境遇，成为掌握国 家生产资料的主人，实现了真正的当家作 主。因此，社会主义改造的基本完成，标志 着我国完成了新民主主义向社会主义的过 渡，标志着社会主义基本制度在中国的确 立，标志着我国已经进入了社会主义初级 阶段。因此，本题的正确答案是A、B、D。 我国步入社会主义改革时期是20世纪 70年代末、80年代初的事情。C 错误。 158"},
  {id:857,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"中华人民共和国成立、社会主义制度的建立",options:["A. 是中国历史上最深刻最伟大的社会变革","B. 为当代中国一切发展进步奠定了根本政治前提和制度基础","C. 为中国发展富强、中国人民生活富裕奠定了坚实基础","D. 实现了中华民族由不断衰落到根本扭转命运、持续走向繁荣富强的伟大飞跃"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:858,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1954年9月，中华人民共和国第一届全国人民代表大会第一次会议通过《中华人民共和国宪 法》,标志着人民代表大会制度这一国家根本政治制度正式建立。人民代表大会制度是",options:["A. 中国共产党领导中国人民艰辛探索长期奋斗的成果","B. 从中国土壤中生长起来的全新政治制度","C. 人类政治制度史上的伟大创造","D. 实现我国全过程人民民主的重要制度载体"],answer:"ABCD",explanation:"第一届全国人民代表大会第一次会 议通过《中华人民共和国宪法》,标志着人 民代表大会制度这一国家根本政治制度正 式建立。人民代表大会制度是中国共产党 领导中国人民艰辛探索长期奋斗的成果，是 从中国土壤中生长起来的全新政治制度，是 人类政治制度史上的伟大创造。人民代表 大会制度是实现我国全过程人民民主的重 要制度载体。A、B、C、D全选。"},
  {id:859,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1954年9月，中华人民共和国的缔造者们，同经过普选产生的1200多名全国人大代表一道， 召开了第一届全国人民代表大会第一次会议，讨论并通过了《中华人民共和国宪法》。《中华人 民共和国宪法》",options:["A. 巩固了中国人民革命胜利的历史成果和新中国成立以来政治上、经济上的新胜利","B. 把实际生活中已经发生的重大社会变革用法律的形式肯定下来","C. 是中国走向社会主义民主和法制建设的一个良好开端","D. 是中国进入社会主义社会最主要的标志"],answer:"ABC",explanation:"1 9 5 年 月，中华人民共和国第一 届全国人民代表大会第一次会议在北京召 开。大会讨论并通过了《中华人民共和国宪 法》。这是一部社会主义类型的宪法，体现 了人民民主原则和社会主义原则。《中华人 民共和国宪法》不仅巩固了中国人民革命胜 利的历史成果和新中国成立以来政治上、 经济上的新胜利，而且把实际生活中已经 发生的重大社会变革用法律的形式肯定下 来，反映了过渡时期国家发展的根本要求和 全国人民通过实践形成的建立社会主义社 会的共同意愿。这是中国走向社会主义民 主和法制建设的一个良好开端。A、B、C 正确。 1956年底，随着社会主义改造的完成，以 生产资料公有制、按劳分配和计划经济体制为 特征的社会主义经济制度建立起来，这是中国 进入社会主义社会最主要的标志。D错误。"},
  {id:860,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"毛泽东提出，处理中国共产党与民主党派的关系，应坚持的方针是",options:["A. 长期共存","B. 互相监督","C. 肝胆相照","D. 荣辱与共"],answer:"AB",explanation:"A、B 正确。“肝胆相照、荣辱与共”作 为处理中国共产党与民主党派关系方针的 内容是1982年党的十二大报告增加的，不 是毛泽东提出的。C、D不符合题意。"},
  {id:861,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1956年9月15日至27日，中国共产党第八次全国代表大会在北京举行。这次会议对中国建 设社会主义道路的探索，站在比较高的历史起点上，取得了初步成果，对于党和国家事业发展 具有长远的重要意义。中共八大的初步成果包括",options:["A. 正确分析了国内形势和主要矛盾的变化，明确提出新形势下党和人民的主要任务","B. 坚持党中央提出的既反保守又反冒进，即在综合平衡中稳步前进的经济建设方针","C. 肯定“三个主体，三个补充”思想，突破了苏联计划经济模式，开始经济体制改革","D. 通过中国共产党在全国执政以后制定的第一部党章"],answer:"ABD",explanation:"A、B、D 正确。中共八大肯定“三个 主体，三个补充”思想，即以国家经营和集体 经营、计划生产、国家市场三者为主体，以个 体经营、自由生产、自由市场三者为补充。 这是在理论上突破苏联计划经济模式，探索 经济体制改革的重要尝试。(只是尝试，真 正突破计划经济模式、开始经济体制改革是 在党的十一届三中全会之后)C 错误。"},
  {id:862,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1957年2月，毛泽东作了《关于正确处理人民内部矛盾的问题》的报告，阐明社会主义社会 的重大理论问题，其主要内容有",options:["A. 提出社会主义社会中，基本的矛盾仍然是生产力和生产关系、经济基础和上层建筑之间的矛盾","B. 提出社会主义社会存在着敌我矛盾和人民内部矛盾这两类不同性质的社会矛盾","C. 提出社会主义社会的主要矛盾是人民日益增长的物质文化需要同落后的社会生产之间的矛盾","D. 提出把正确处理人民内部矛盾作为国家政治生活的主题"],answer:"ABD",explanation:"A、B、D正确。“在社会主义改造基 本完成以后，我国所要解决的主要矛盾，是 人民日益增长的物质文化需要同落后的社 会生产之间的矛盾”,这是1981年党的十一 届六中全会通过的《关于建国以来党的若干 历史问题的决议》对我国社会主要矛盾的规 范表述，并不是毛泽东在《关于正确处理人 民内部矛盾的问题》的报告中提出的，C 错误。"},
  {id:863,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1964年底，周恩来在三届全国人大一次会议上郑重提出实现“四个现代化”的历史任务。中 央还确定分两步走实现现代化的战略构想，即从第三个五年计划开始，第一步，经过三个五年 计划时期，建立一个独立的、比较完整的工业体系和国民经济体系；第二步，全面实现农业、 工业、国防和科学技术的现代化，使中国经济走在世界前列。到1978年，我国建立起了独立 的、比较完整的工业体系和国民经济体系。独立的、比较完整的工业体系和国民经济体系的 建立",options:["A. 从根本上解决了工业化中“从无到有”的问题","B. 使中国在赢得政治上的独立后赢得了经济上的独立","C. 为中国以后的发展奠定了牢固的物质技术基础","D. 为中国同世界各国在平等互利的原则下发展对外贸易和经济往来创建了前提"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:864,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"从新中国成立到改革开放前夕，党领导人民完成社会主义革命，消灭一切剥削制度",options:["A. 实现了中华民族有史以来最为广泛而深刻的社会变革","B. 实现了一穷二白、人口众多的东方大国大步迈进社会主义社会的伟大飞跃","C. 为在新的历史时期开创中国特色社会主义提供了宝贵经验、理论准备、物质基础","D. 向世界庄严宣告，只有社会主义才能救中国，只有社会主义才能发展中国"],answer:"ABCD",explanation:"（本题解析见原书解析分册）"},
  {id:865,chapter:"史纲",sub:"中国近现代史纲要",type:"multi",question:"1978年12月，党召开十一届三中全会，实现了新中国成立以来党的历史上具有深远意义的伟 大转折。党的十一届三中全会",options:["A. 重新确立解放思想、实事求是的思想路线","B. 停止使用“以阶级斗争为纲”的错误提法","C. 作出把党和国家工作中心转移到经济建设上来、实行改革开放的历史性决策","D. 成为正本清源、拨乱反正和改革开放的思想先导"],answer:"ABC",explanation:"习近平总书记在纪念邓小平同志诞 辰120周年座谈会上的讲话中指出，在邓小 平指导下，党的十一届三中全会重新确立解 放思想、实事求是的思想路线，停止使用 “以阶级斗争为纲”的错误提法，作出把 党和国家工作中心转移到经济建设上来、 实行改革开放的历史性决策，实现了党的 历史上具有深远意义的伟大转折。A、B、C 正确。 关于真理标准问题的大讨论，是一场深 刻而广泛的马克思主义思想解放运动，成为 正本清源、拨乱反正和改革开放的思想先 导。D 错误。"},
