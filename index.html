<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>考研政治刷题平台 - 肖秀荣1000题</title>
<style>
:root{--pri:#4361ee;--suc:#2ec4b6;--dan:#e63946;--war:#f77f00;--bg:#f0f2f5;--c-bg:#fff;--txt:#2b2d42;--bd:#e0e0e0;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--txt);line-height:1.7;min-height:100vh;}
.header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:20px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.15);}
.header h1{font-size:1.6em;margin-bottom:4px;}
.header p{opacity:.85;font-size:.9em;}
.stats{display:flex;gap:10px;justify-content:center;margin-top:8px;flex-wrap:wrap;}
.stats span{background:rgba(255,255,255,.2);padding:5px 14px;border-radius:20px;font-size:.85em;}

.container{max-width:900px;margin:20px auto;padding:0 16px 40px;}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;padding:12px;background:var(--c-bg);border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.06);}
.controls select,.controls button{padding:7px 12px;border-radius:6px;font-size:.85em;border:1px solid var(--bd);cursor:pointer;background:var(--c-bg);}
.controls .btn-rev{background:#d97706;color:#fff;border:none;}
.controls .btn-pri{background:var(--pri);color:#fff;border:none;}
.controls .btn-dan{background:var(--dan);color:#fff;border:none;}
.controls .btn-suc{background:var(--suc);color:#fff;border:none;}
.controls .btn-war{background:var(--war);color:#fff;border:none;}
.controls button:hover{opacity:.85;}

.pbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:10px 14px;background:var(--c-bg);border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.06);font-size:.85em;}
.pbar .bar{flex:1;height:10px;background:#ddd;border-radius:6px;overflow:hidden;}
.pbar .bar div{height:100%;background:linear-gradient(90deg,var(--pri),var(--suc));border-radius:6px;transition:width .4s;}

.card{background:var(--c-bg);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:20px 22px;margin-bottom:14px;}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.q-badge{padding:4px 12px;border-radius:20px;font-size:.8em;font-weight:600;color:#fff;}
.q-badge.single{background:var(--pri);}
.q-badge.multi{background:var(--dan);}
.q-actions{display:flex;gap:6px;}
.q-btn{padding:4px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--c-bg);cursor:pointer;font-size:.8em;}
.q-btn.fav{background:#ffc107;color:#fff;border-color:#ffa000;}
.q-body{font-size:1.05em;margin-bottom:16px;line-height:1.8;}

.opts{list-style:none;padding:0;margin:0 0 16px 0;}
.opts li{margin-bottom:8px;}
.opts label{display:flex;align-items:center;gap:10px;padding:10px 14px;border:2px solid var(--bd);border-radius:10px;cursor:pointer;transition:all .2s;}
.opts label:hover{border-color:var(--pri);background:#f0f7ff;}
.opts label.sel{border-color:var(--pri);background:#e8f0fe;}
.opts label.correct{border-color:var(--suc);background:#e6f4ea;}
.opts label.wrong{border-color:var(--dan);background:#fce8e6;}
.opts input[type=radio],.opts input[type=checkbox]{margin-right:4px;transform:scale(1.2);}

.result{display:none;padding:14px;border-radius:8px;margin-bottom:12px;font-size:.9em;}
.result.show{display:block;}
.result.right{background:#e6f4ea;border:1px solid var(--suc);}
.result.wrong{background:#fce8e6;border:1px solid var(--dan);}
.explanation{display:none;padding:12px;margin-top:10px;background:#f8f9fa;border-radius:8px;border-left:4px solid var(--pri);font-size:.9em;line-height:1.8;}
.explanation.show{display:block;}
.btn-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.btn-row button{padding:8px 16px;border-radius:6px;font-size:.85em;cursor:pointer;border:none;color:#fff;}
.btn-row .btn-sub{background:var(--pri);}
.btn-row .btn-next{background:var(--suc);}
.btn-row .btn-exp{background:#6c757d;}
.review-bar{display:none;align-items:center;gap:10px;justify-content:space-between;padding:10px 14px;background:#fff7e0;border:1px solid #f0cf7e;border-radius:8px;margin-bottom:12px;font-size:.88em;flex-wrap:wrap;}
.review-bar.show{display:flex;}
.review-bar .rb-info{color:#7a5b12;flex:1;}
.review-bar button{padding:5px 12px;border-radius:6px;border:none;cursor:pointer;background:#d97706;color:#fff;font-size:.82em;white-space:nowrap;}

.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;justify-content:center;align-items:center;}
.modal.show{display:flex;}
.modal-inner{background:#fff;border-radius:12px;padding:20px;max-width:600px;max-height:80vh;overflow-y:auto;width:90%;}
.modal-inner h3{margin-bottom:12px;}
.modal-inner .close{float:right;border:none;background:none;font-size:1.5em;cursor:pointer;}

@media(max-width:600px){.header h1{font-size:1.3em;}.card{padding:14px;}.q-body{font-size:.95em;}}
</style>
</head>
<body>
<div class="header">
  <h1>📚 考研政治刷题平台</h1>
  <p>肖秀荣1000题 · 2027版</p>
  <div class="stats">
    <span>📝 已做: <b id="st-done">0</b></span>
    <span>✅ 正确: <b id="st-ok">0</b></span>
    <span>📊 正确率: <b id="st-rate">0%</b></span>
    <span>⭐ 收藏: <b id="st-fav">0</b></span>
  </div>
</div>

<div class="container">
  <div class="controls">
    <select id="chapter"><option value="all">全部章节</option></select>
    <button class="btn-rev" onclick="startReview()">📅 昨日错题复习</button>
    <button class="btn-pri" onclick="toggleRandom()">🔀 随机模式</button>
    <button class="btn-war" onclick="showWrong()">❌ 错题本</button>
    <button class="btn-war" onclick="showFavorites()">⭐ 收藏夹</button>
    <button class="btn-dan" onclick="resetAll()">🔄 重置数据</button>
  </div>
  <div class="review-bar" id="review-bar">
    <span class="rb-info">📅 <b>昨日错题复习</b> · 第 <b id="review-progress">1/1</b> 题 · 已掌握 <b id="review-mastered">0</b> 题（答对的自动移出错题，仍错的进入明日复习）</span>
    <button onclick="exitReview()">退出复习 ✕</button>
  </div>
  <div class="pbar">
    <span>进度</span>
    <div class="bar"><div id="progress-bar" style="width:0%"></div></div>
    <span id="pct">0%</span>
  </div>
  <div class="card" id="q-card">
    <div class="q-header">
      <span id="q-type" class="q-badge single">单选题</span>
      <span id="q-chapter" style="font-size:.85em;color:#666;"></span>
      <div class="q-actions">
        <button class="q-btn" id="btn-fav" onclick="toggleFav()">⭐</button>
      </div>
    </div>
    <div class="q-body" id="q-body"></div>
    <ul class="opts" id="q-opts"></ul>
    <div class="result" id="q-result"></div>
    <div class="explanation" id="q-exp"></div>
    <div class="btn-row" id="q-btns">
      <button class="btn-sub" id="btn-submit" onclick="submitAnswer()">提交答案</button>
      <button class="btn-next" onclick="nextQuestion()" style="display:none;" id="btn-next">下一题 ▶</button>
      <button class="btn-exp" onclick="toggleExp()" style="display:none;" id="btn-exp">📖 查看解析</button>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-inner">
    <button class="close" onclick="closeModal()">&times;</button>
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// =====================================================
// 题库数据 - 肖秀荣2027考研政治1000题
// 数据结构: {id, chapter, subChapter, type:'single'|'multi', question, options:[], answer, explanation}
// =====================================================
const Q = [
  {id:1,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"1921年中国共产党的成立，是中华民族伟大复兴征程中的一大里程碑。100多年来，不管形势和 任务如何变化，不管遇到什么样的惊涛骇浪，我们党都始终把握历史主动、锚定奋斗目标，沿着 正确方向坚定前行。历史和实践充分证明，我们党坚定信仰信念、把握历史主动的根本所在是",options:["A. 拥有马克思主义科学理论指导","B. 坚持不懈用党的创新理论凝心铸魂","C. 始终把人民放在心中最高位置","D. 科学社会主义提供了解决实际问题的正确答案"],answer:"A",explanation:"马克思主义是引领当代中国实践的行 动指南。马克思主义是我们的“看家本领”,掌 握了这一本领，就能够以更宽广的视野、更长 远的眼光来思考和把握未来发展面临的一系 列重大问题，应对重大挑战，抵御重大风险，克 服重大阻力，解决重大矛盾。拥有马克思主义 科学理论指导是我们党坚定信仰信念、把握 历史主动的根本所在。A 正确。"},
  {id:2,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"马克思、恩格斯并不是先知先觉的圣人，他们从小面对的也是一个充满矛盾的现实世界，在家 庭、学校和社会的影响下，也曾接受过那个时代的唯心主义和资产阶级民主主义思想。但是资本 主义制度的弊端和劳动群众渴求解放的呼声，促使他们立志进行社会变革，并走上求索科学真理 的道路。1844年2月，马克思、恩格斯发表在《德法年鉴》上的论文表明，他们 ①完成了从唯心主义向唯物主义的转变 ②完成了从革命民主主义向共产主义的转变 ③ 实现了历史观上的伟大变革 ④为创立马克思主义奠定了思想前提",options:["A. ①②③","B. ②③④","C. ①③④","D. ①②④"],answer:"D",explanation:"1844年2月，马克思、恩格斯发表在 《德法年鉴》上的论文表明，他们完成了从唯心 主义向唯物主义、从革命民主主义向共产主 义的转变，为创立马克思主义奠定了思想前 提。①②④正确。 1845年，马克思、恩格斯合著的《德意志 意识形态》,首次系统阐述了历史唯物主义的 基本观点，实现了历史观上的伟大变革。③错 误。因此，本题选D。"},
  {id:3,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"马克思主义产生于19世纪40年代，为马克思主义的创立提供了直接的理论来源的是",options:["A. 德国古典哲学、英国古典政治经济学、英法空想社会主义","B. 细胞学说、能量守恒与转化定律、生物进化论","C. 古希腊罗马哲学、文艺复兴运动的思想成果、法国复辟时期历史学家的进步思想","D. 朴素唯物主义、近代形而上学唯物主义、概念辩证法"],answer:"A",explanation:"1 9世纪西欧三大先进思潮为马克思主 义的创立提供了直接的理论来源。德国古典 哲学、英国古典政治经济学、英法空想社会 主义，这三大思潮都是资本主义发展初期的思 想家求索时代课题的尝试，包含许多具有启发 性的思想，比如德国古典哲学的辩证法思想， 英国古典政治经济学对资本主义生产关系的 分析和关于劳动创造价值的思想，英法空想社 会主义对资本主义社会的批判和对未来新社 会的展望等。A正确。 19世纪的三大科学发现，即细胞学说、能 量守恒与转化定律、生物进化论，为马克思主 义的产生提供了自然科学前提。从更广泛的 意义上讲，马克思主义的思想来源不只这些， 还有古希腊罗马哲学、文艺复兴运动的思想成 果、法国复辟时期历史学家的进步思想等。B、 C、D不符合题意。"},
  {id:4,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"1845年，恩格斯在给马克思的一封信中提出：“目前首先需要我们做的，就是写出几本较大的著 作，以便给许许多多非常愿意干但自己又干不好的一知半解的人以一个必要的支点。”由此可见， 马克思、恩格斯之所以要创立马克思主义，是为了",options:["A. 证明社会主义革命可能在一国或数国首先发生并取得胜利","B. 适应无产阶级实际斗争的要求","C. 推动无产阶级从自觉转向自发","D. 将无产阶级夺取政权的成功经验推广到所有国家"],answer:"B",explanation:"19世纪30—40年代，法国、英国、德国 接连爆发了无产阶级反对资本主义制度的斗 争。1831年法国里昂工人举行了第一次起 义，1834年举行了第二次起义；1836年英国爆 发了长达十余年、声势浩大的全国性的工人运 动——宪章运动；1844年德国西里西亚的纺 织工人举行起义。法国、英国、德国工人运动 的兴起，标志着现代无产阶级作为独立的政治 力量登上了历史舞台。觉醒了的无产阶级迫切 1000题 >>>解析分册 · 单 需要总结和升华自身的斗争经验，形成科学的 革命理论，以指导自身的解放斗争。可见，马 克思、恩格斯之所以要创立马克思主义，是为了 适应无产阶级实际斗争的要求。B 正确。 社会主义革命可能在一国或数国首先发 生并取得胜利是列宁的论断，A 错误。无产阶 级在与资产阶级的斗争中从自发走向自觉，而 不是从自觉转向自发，C 错误。无产阶级夺取 政权的第一次伟大尝试是1871年爆发的巴黎 公社革命，俄国十月革命的成功则是在1917 年，D显然错误。"},
  {id:5,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"1844年8月底， 马克思、恩格斯在巴黎会面。这次会面使他们发现彼此的基本观点完全一致，于 是开始了在科学理论研究和革命活动中的长期合作。马克思、恩格斯第一次合作的著作是",options:["A. 《 神圣家族》","B. 《 德意志意识形态》","C. 《哲学的贫困》","D. 《共产党宣言》"],answer:"A",explanation:"1844年8月底，马克思、恩格斯在巴黎 会面。此前他们曾有过一面之缘，但这次会面 使他们发现彼此的基本观点完全一致，并从此 开始了毕生的合作。1844年9月至11 月，他 们在巴黎合写了《神圣家族》一书(第一次 合作的著作),批判青年黑格尔派的主观唯心 主义。接着又在布鲁塞尔合写了《德意志意识 形态》。《德意志意识形态》首次系统阐述了历 史唯物主义的基本观点，实现了历史观上的伟 大变革。A 正确，B 错误。 《哲学的贫困》是1847年马克思为批判蒲 鲁东的《贫困的哲学》而写的著作。这部重要 的著作是马克思主义学说最早发表的文本。 马克思主义的新世界观与马克思主义经济科 学的“决定性的东西”,都是通过这一文本第一 次公开问世的。C 错误。《共产党宣言》发表 于1848年，标志着马克思主义的公开问世。D 错误。"},
  {id:6,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"在人类思想史上，马克思主义第一次站在人民的立场探求人类自由解放的道路，人民性是马克思 主义的",options:["A. 本质属性","B. 首要的和基本的观点","C. 唯一特征","D. 根本价值目标"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:7,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"马克思主义具有鲜明的科学性、人民性、实践性、发展性，这些特征体现了马克思主义的本质和 使命，也展现出马克思主义的理论形象。马克思主义的基本特征，如果用一句话来概括就是",options:["A. 人民性与实践性的统一","B. 科学性与实践性的统一","C. 科学性与革命性的统一","D. 实践性与发展性的统一"],answer:"C",explanation:"马克思主义的基本特征，用一句话概 括 ，就是科学性与革命性的统一。马克思主 义科学理论在指导无产阶级和人民群众进行 伟大社会革命的过程中，其人民性、实践性和 发展性集中地体现为革命性。C 正确。"},
  {id:8,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"辩证唯物主义是中国共产党人的世界观和方法论。辩证唯物主义最基本、最核心的观点是",options:["A. 对立统一规律","B. 世界的物质统一性原理","C. 资本主义必然灭亡，社会主义必然胜利","D. 人民群众创造历史"],answer:"B",explanation:"世界的物质统一性原理是辩证唯物主义 最基本、最核心的观点，是马克思主义的基 石。B正确。对立统一规律是唯物辩证法的 实质和核心。A 错误。“资本主义必然灭亡， 社会主义必然胜利”是科学社会主义的核心命 题。C 错误。人民群众创造历史的观点属于 历史唯物主义范畴，D不符合题意。"},
  {id:9,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"唯物主义和唯心主义这两个专门的哲学术语有着特定的含义和确定的标准，不能随意乱用，也 不 能另立标准，否则会造成混乱。这里所说的特定含义和确定标准是指",options:["A. 对世界本原究竟是物质还是精神的回答","B. 对存在和思维是否具有同一性的回答","C. 对社会存在与社会意识关系的回答","D. 对世界是怎样存在的问题的回答"],answer:"A",explanation:"根据对哲学基本问题第一方面的不同回 答，哲学可划分为唯物主义和唯心主义两种 根本对立的派别。唯物主义把世界的本原归 结为物质，主张物质第一性，意识第二性，意识 是物质的产物；唯心主义把世界的本原归结为 精神，主张意识第一性，物质第二性，物质是意 识的产物。这就是唯物主义和唯心主义这两 个专门的哲学术语的特定的含义和确定的标 准，A正确。 存在和思维是否具有同一性，是哲学基 本问题第二方面的内容，对这个问题的不同 回答，产生了可知论和不可知论的理论分野，B 错误。社会存在与社会意识的关系问题是社 会历史观的基本问题，是区分唯物史观与唯 心史观的标准，唯物史观认为社会存在决定 社会意识，唯心史观认为社会意识决定社会存 在，C错误。哲学除了回答世界的本原是什么 的问题，还要回答世界是怎样存在的问题。根 获取最新、最全考研资料，关注公众号【最强资料库】"},
  {id:10,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"“心诚则灵，心不诚则不灵”的说法是",options:["A. 主张物质和意识具有同一性的辩证唯物主义观点","B. 主张思想就是物质的庸俗唯物主义观点","C. 认为世界是绝对精神外化的客观唯心主义观点","D. 夸大了意识能动作用的唯心主义观点"],answer:"D",explanation:"· 本题题干引用的是列宁的话，其意思 是说，物质和意识的对立只有在何者为第一 性的范围内才有绝对的意义，超出这个范围， 其对立便是相对的。不应当把物质与意识的 对立绝对化，否则，就会陷入二元论或不可 知论。这是因为，虽然物质不依赖于意识而 存在，但意识却依赖于物质，意识是物质的产 物，是人脑对物质的反映，而反映者是不能同 被反映的对象相脱离的，物质和意识之间具 有同一性。因此，正确答案是A。 B是哲学基本问题的第二个方面，即思 维能否正确反映存在，已经超出了物质和意 识何者为第一性的范围，在这方面，物质和意 识的对立是相对的，所以，B 不符合题意。物 “心诚则灵，心不诚则不灵”的意思是 “心”的诚与不诚，能决定事情的成败。这里的 “心”是指意识。显然，此观点是一种夸大意识 能动作用的唯心主义观点。D 符合题意。 A把题干的观点说成是唯物主义，显然 是错误的。B 把题干的观点说成是庸俗唯物 主义，不符合题意。庸俗唯物主义把唯物主 义庸俗化了，它把意识直接归结为物质，或 认为人的精神活动能力只不过是脑物质的分 泌物，说人脑分泌精神就如同肝脏分泌胆汁 一样，或认为思想就是脑髓质的位移。这就 混淆了物质与意识的界限，抹杀了意识与物质 的原则区别。C 把题干的观点说成是客观唯 心主义观点，也与题意不符。客观唯心主义把 精神绝对化为脱离任何个人的独立存在，把虚 构出来的在人以外存在的“客观精神”当作世 界的本原。A、B、C 均不符合题意。"},
  {id:11,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"物质和意识的对立只有在非常有限的范围内才具有绝对的意义，超出这个范围便是相对的了。 这个范围是指",options:["A. 物质和意识何者为第一性","B. 物质和意识是否具有同一性","C. 物质和意识何者更重要","D. 物质和意识何者与社会生活的关系更密切"],answer:"A",explanation:"据对这些问题的不同回答，形成了辩证法和形 而上学两种不同的观点，D错误。"},
  {id:12,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"“少年安得长少年，海波尚变为桑田。”唐代诗人李贺的这一诗句体现了",options:["A. 运动具有一维性","B. 运动是静止的衡量尺度","C. 运动是物质的根本属性","D. 运动是物质的唯一特性"],answer:"C",explanation:"运动是物质的根本属性，C 正确。时间 是指物质运动的持续性、顺序性，特点是一维 性；空间是指物质运动的广延性、伸张性，特 点是三维性。物质运动总是在一定的时间和 考研政治 1000题 解析分册 · 空间中进行的。A 错误。静止是运动的衡量 尺度，B错误。物质的唯一特性是客观实在 性，D错误。"},
  {id:13,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"法国生命哲学家柏格森十分强调运动变化，以至于他的哲学被称为“变的哲学”。在柏格森看 来，“事物和状态不过是我们的心灵所采取的一种观点，事物是不存在的，存在的只有动作。” 这句话的错误在于否认了",options:["A. 世界万物是永恒发展的","B. 运动形式具有多样性","C. 运动是事物的存在方式和唯一属性","D. 物质是运动的承担者"],answer:"D",explanation:"运动是标志一切事物和现象的变化及 其过程的哲学范畴。运动是物质的根本属性 或存在方式，物质和运动是不可分割的。一 方面，运动是物质的运动，物质是一切运动变 化和发展过程的实在基础和承担者，世界上 没有离开物质的运动，任何形式的运动都有 它的物质载体，设想无物质的运动，将导致唯 心主义。另一方面，物质是运动着的物质，脱 离运动的物质是不存在的，设想不运动的物 质，将导致形而上学。柏格森所说的运动变 化不是指任何具体的事物的运动变化，而只 是纯粹的“动作”,是没有物质承担者的运动。 D符合题意，是正确选项。A、B本身内容正确 但不符合题意。运动是物质的根本属性或存 在方式，并不是事物的唯一属性。C错误。"},
  {id:14,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"人们用来测量时间的单位年、月、日等是靠天体在空间中的运动来确定的，测定宇宙天体之间 距离的单位是用光在真空中沿直线传播一年的距离(即“光年”)来衡量的。这说明",options:["A. 时空是一切运动的观念载体","B. 时空与物质运动不可分割","C. 物质运动是绝对的，时空是相对的","D. 物质运动是客观的，时空是主观的"],answer:"B",explanation:"物质运动总是在一定的时间和空间中 进行的，没有离开物质运动的“纯粹”时间和 空间，也没有离开时间和空间的物质运动。 物质运动与时间和空间的不可分割证明了时 间和空间的客观性。人类使用太阳、地球、月 球等天体的运行来确定年、月、日，说明时间 是以物质的空间运动来度量的；人类使用“光 年”这一单位测定宇宙天体之间的距离，说明 空间同样也是以物质在时间中的运动来度量 的 。B正确，D错误。时空既是绝对的，也 是 相对的。物质运动的时间和空间的客观实在 性是绝对的，物质运动的时间和空间的具体 特性是相对的。C 说法不准确，且题干材料也 没有体现时空的相对性。时空具有客观性，不 依赖于人的时空观念或者时空知觉。A 错误。"},
  {id:15,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"古人从日光中意识到，“辉光所烛，万里同晷”。然而同是时间，有人感觉它如年轮，一圈圈积 累成参天大树，也有人感觉它如流沙，飞流不止无可奈何。时间观不同，意义感就大不相同。 同样的时间却可能有着不同的时间观，这是因为",options:["A. 时间的客观性是相对的","B. 时间是意识和观念的产物","C. 人无法认识时间的无限性","D. 人对时间的认识具有能动性"],answer:"D",explanation:"精讲P31 考点31 -3-2 辩证唯物主义认识论认为，认识的本 质是主体在实践基础上对客体的能动反映。 认识的能动反映具有创造性。认识是一种在 思维中的能动的、创造性的活动，而不是主 观对客观对象简单、直接的描摹或照镜子式 的原物映现。因此，不同的人对时间可能产 生不同的时间观。D 正确。物质运动的时间 和空间的客观实在性是绝对的，物质运动的 时间和空间的具体特性是相对的。时间是客 观的，不是观念的产物。A、B 错误。人类认 识按其本性来说，能够正确认识无限发展着 的物质世界。C 错误且与题意不符。"},
  {id:16,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"人类的出现，使世界发生了二重分化，即从自然界中分化出人类社会，从客观世界中分化出主 观世界。自然界与人类社会、客观世界与主观世界相分化的关键是",options:["A. 人的实践活动","B. 人的意识活动","C. 语言文字的出现","D. 人脑的出现"],answer:"A",explanation:"不论是创造人本身的劳动，还是构成 社会存在基础的物质生产，都是人改造世界 的实践活动。人的实践活动是自然界与人类 社会、客观世界与主观世界相分化的关键， 也是它们相统一的关键。A正确。"},
  {id:17,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"人类的出现，特别是人类改造世界的实践活动，极大地改变了世界的面貌，使世界发生了二重 分化，即从自然界中分化出人类社会，从客观世界中分化出主观世界。人类社会与自然界的不 同主要在于",options:["A. 在自然界中一切都是自发产生的，而在人类社会中一切都打着人的意识的印记","B. 自然界受自然规律支配，而人类社会的发展方向是由每一个参与历史的人决定的","C. 在自然界中有“人化自然”,而在人类社会中则没有自然物质和自然力的运用","D. 自然界属于客观世界，而人类社会属于主观世界"],answer:"A",explanation:"人类社会与自然界的不同主要在于， 在自然界中一切都是自发产生的，而在人类 社会中一切都打着人的意识的印记，是人有 目的的实践活动的结果。自然界与人类社会 不是截然分开的，而是交叉重叠和相互作用 的。在自然界中有“人化自然”,即经过人的 改造并体现着人的目的和意志的自然。在社 会中有自然物质和自然力的运用，而构成社 会存在基础的物质生产本身就是人与自然的 物质变换。A正确，C错误。 人民群众创造历史，而不是每一个人创 造历史，人类社会的发展方向要遵循社会发 展的规律。B 错误。客观世界是不依赖于人 的思想意识而存在的现实世界，包括自然界 和人类社会。主观世界是指人的意识、观念 世界，是人的头脑反映和把握物质世界的精 神活动的总和。D 错误。"},
  {id:18,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"不少人体验过这样的小测试：面对同一张人物肖像，有人看到了满脸皱纹的老太太，有人看到 的却是正值青春妙龄的年轻姑娘。关注角度、聚焦方位不同，看到的图像竟也存在天壤之别。 对同一张肖像的两种看法都是",options:["A. 客观事物的主观映象","B. 对现实世界的歪曲反映","C. 人脑中固有形象的表现形式","D. 意识主观自生的产物"],answer:"A",explanation:"意识是人脑的机能和属性，是客观世 界的主观映象。A 正确。人脑是意识的器 官，但不是意识的源泉。C、D 错误。人的反 映不是消极被动的反映，也不是盲目直观的 摹写，而是能动的、创造性的反映。不同的人 看到不同的图像，是意识形式主观性的具体 表现，但并不意味着这种看法就一定是歪曲 的反映。B 错误。"},
  {id:19,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"毕加索是20世纪的艺术大师。一 次，毕加索画一头公牛，他画的第一幅公牛十分写实，结构严 谨而形态逼真。但他并不满足，又相继画了十次。从第一幅到第十一幅，形体逐渐概括，线条 逐步简练，到最后一幅只剩下寥寥几根线条，但那些简单的线条，却精练地表现了公牛的形与 神，看到这幅画的人依然可以轻易地看出这是一头公牛。以上事例说明",options:["A. 客观事物的存在依赖于我们对它的认识","B. 艺术创作的认识过程是非理性因素独立作用的结果","C. 事物的本质可以直接为人的感官所感知","D. 意识活动是一个主动的创造性过程"],answer:"D",explanation:"物质决定意识，意识依赖于物质并反作 用于物质。物质是不依赖于人类的意识而存 在，并能为人类的意识所反映的客观实在。 A错误。非理性因素主要是指认识主体的情 感和意志。从广义上看，非理性因素还包括 认识能力中具有不自觉、非逻辑性等特点的 认识形式，如联想、想象、猜测、直觉、顿悟、灵 感等。人的认识过程是理性因素和非理性因 素协同起作用的结果。B 错误。现象是事物 的外部联系和表面特征，可以直接为人的感官 所感知；本质则是事物的根本性质，是构成事 物的诸要素之间的内在联系，只有通过理性 思维才能把握。C 错误。意识的能动作用的 主要表现之一就是意识具有创造性。D正确。 ·"},
  {id:20,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"定期体检对预防和发现疾病十分重要。很多人都会有意识地参加体检。不过，多数情况下，体 检的内容只包括身体检查，而不包括心理检查。事实上，一个人的健康，既包括身体上的健康， 也包括心理上的健康，二者同样重要。在快节奏的生活、高强度的工作中，一些人面临着比较 沉重的心理压力，如果得不到疏导，轻则影响工作效率，重则可能给身体带来负面影响。“心理 体检”也应该得到重视，因为",options:["A. 感觉和心理是人区别于动物的根本标志","B. 意识具有调控人的行为和生理活动的作用","C. 主观世界与客观世界的发展具有完全同步性","D. 人的本质属性是包括身体和心理在内的各种自然属性之和"],answer:"B",explanation:"意识具有调控人的行为和生理活动的 作用。现代科学和医学实验证明，意识、心理 因素能够对人的行为选择和健康状况产生重 要影响。B正确。意识是自然界长期发展的 产物。它的形成和发展经历了三个阶段：由 一切物质所具有的反应特性到低等生物的刺 激感应性，再到高等动物的感觉和心理，最终 发展为人类的意识。感觉和心理不是人所独 有的，A错误。主观世界从客观世界中分化 出来，具有相对独立性。客观世界与主观世 界具有不同的存在方式，二者的发展也具有 不完全同步性。C 错误。人的本质不是单个 人所固有的抽象物，在其现实性上，它是一切 社会关系的总和。人的本质属性是社会属 性，而不是自然属性。D 错误。"},
  {id:21,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"民间有一种迷信说法叫作“喜鹊叫喜，乌鸦叫丧”。这句话的错误在于否定了联系的",options:["A. 普遍性","B. 多样性","C. 客观性","D. 条件性"],answer:"C",explanation:"联系是指事物内部各要素之间和事物 之间相互影响、相互制约和相互作用的关系。 联系具有客观性、普遍性、多样性、条件性等 特点。事物的联系是事物本身所固有的、不 以人的意志为转移的。联系的客观性要求我 们从客观事物本身固有的联系出发去认识事 物 。“喜鹊叫喜，乌鸦叫丧”用主观臆想的联 系代替事物本身的真实的联系，否定了联系 的客观性。C 正确。"},
  {id:22,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"近年来，微生物处理技术在我国得到了越来越广泛的运用。巧用微生物技术，可以改善水质， 推进资源化利用。传统的污水处理主要有重力沉降、混凝澄清等物理方法，以及化学沉淀、氧 化还原等化学方法。利用微生物来吸附、分解、氧化污水中的有机物，把不稳定的有机物降解 为稳定无害的物质，同样可以使污水得到净化。这意味着人为创造一个适合微生物菌群生长的 生态系统，继而通过微生物之间的协同作用实现能量传递和物质循环。更好认识微生物的特性 和功能，善加利用，可以在处理污水、改善水质上实现更好的效果。巧用微生物改善水环境蕴 含的哲理是",options:["A. 把握自然规律是认识的根本目的","B. 人们可以任意改变事物存在和发展的条件","C. 事物之间的联系都是人为的","D. 人们可以发现并利用规律来实现自己的目的"],answer:"D",explanation:"精讲P30 考点30 -3 实践是认识的目的。人们通过实践获 得认识，其最终目的是为实践服务，指导实 践，以满足人们生活和生产的需要。A 错误。 改变和创造条件不是任意的。必须尊重事物 发展的客观规律，不能强行去改变事物存在 和发展的条件，否则就是揠苗助长。B 错误。 事物的联系可分为自在事物的联系与人为事 物的联系。自在事物是在人产生之前就存在 或仍处在人的活动之外的事物，其机械、物 理、化学、生物的联系无疑不以人的意志为转 6"},
  {id:23,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"异地借牧，指牧民秋冬时节将牛羊从山区草场迁至周边农区，租田放牧，利用农作物采收后留 下的秸秆接羔育肥。时间一般从当年10月至次年3月。“借牧”看上去颇费周折，其实是一笔 多赢的买卖。牧民为冬季的牛羊找到了稳定的饲料供应地；农户挣了笔租地款，还节省了秸秆 处理费；草原上的植被也获得休养生息的机会，生态效益显著。草畜矛盾，秸秆处置，放到一 时一地，可能都是不太容易解决的问题，但通过“借牧”这一经营模式的创新，实现种养结合， 两方面的问题都迎刃而解。“借牧”模式实现了牧民、农户、生态“多赢”,这一成功实践说明",options:["A. 事物发展的根本动力在于外部矛盾的相互转化","B. 任何事物之间都可以通过某一中介或一系列中介发生联系","C. 科学的治理理念是正确发挥人的主观能动性的根本途径","D. 自然界的因果关系是通过人的有目的的活动而实现出来的"],answer:"B",explanation:"事物的普遍联系是通过“中介”实现 的。任何事物之间，不论存在多大差异，都可 以跨越特定时空，通过某一中介或一系列中 介发生联系。“借牧”模式的成功正在于将农 区的秸秆、草场的牛羊等一系列事物联系在 了一起。B正确。事物发展的根本动力是事 物内部矛盾双方的对立统一。A 错误。实践 是正确发挥人的主观能动性的根本途径。正 确的认识要变为现实的物质力量，只能通过 物质的活动即实践才能达到。C 错误。自然 界的因果关系是自发地起作用的，社会领域 中的因果关系则是通过人的有目的的活动而 实现出来的。D 错误。"},
  {id:24,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"发展的实质是新事物的产生和旧事物的灭亡。新、旧事物的区别在于",options:["A. 出现时间的先后","B. 形式的新旧","C. 力量的大小对比","D. 同历史前进方向是否符合"],answer:"D",explanation:"域，新事物是社会上先进的、富有创造力的 人们创造性活动的产物，它从根本上符合人 民群众的利益和要求，能够得到人民群众的 拥护，因而必然战胜旧事物。因此，新、旧事 物的区别不在于出现时间的先后、形式的新 旧及暂时的力量的对比，而在于同历史前进 方向是否符合。D 正确，A、B、C 错误。"},
  {id:25,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"这两年，因为与“呜呼，起飞”谐音，“芜湖起飞”成为一个网络热词。不过，这不只是一个谐 音楔，也是一个真实的发展故事。从零开始，用“十年磨一剑”的精神，安徽芜湖已经形成了 一条涵盖整机组 装、螺旋桨、航电系统等各方面的航空产业链。发展传统产业也好，壮大新兴 产业也罢，都是一件“难而正确”的事，都无法一蹴而就。芜湖有个“1%工作法”,令人印象 深刻。它指的是围绕影响企业利润的技术、用工、物流、制度性交易成本等因素，千方百计帮 助企业在原基础上再提高1%的利润。1%看似不多，但对企业而言，却是在激烈的市场竞争中 站稳脚跟、实现长远发展的重要有利因素，由此带来的复利效应，将是持久且深远的。“十年磨 一剑”的精神和“1%工作法”启示我们，事物的发展",options:["A. 是一个直线上升的过程","B. 取决于外部力量的干预","C. 是通过不断的自我否定进行的","D. 有一个量变的积累过程"],answer:"D",explanation:"·"},
  {id:26,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"习近平在《深入理解新发展理念，推进供给侧结构性改革》一文中指出：“没有需求，供给就无 从实现，新的需求可以催生新的供给；没有供给，需求就无法满足，新的供给可以创造新的需 求。”这一论断蕴含的哲学原理是",options:["A. 没有离开个性的共性，也没有离开共性的个性","B. 矛盾的斗争性是有条件的、相对的","C. 矛盾的同一性在事物发展中具有重要作用","D. 主要矛盾的主要方面决定着事物的性质"],answer:"C",explanation:"矛盾的同一性是指矛盾着的对立面相 互依存、相互贯通的性质和趋势。矛盾的同 一性在事物发展中的作用表现在：1同一性 是事物存在和发展的前提，在矛盾双方中，一 方的发展以另一方的发展为条件，发展是在 矛盾统一体中的发展。2 同一性使矛盾双方 相互吸取有利于自身的因素，在相互作用中 各自得到发展。3同一性规定着事物转化的 可能和发展的趋势。材料中供给和需求相互 依存，一方的发展以另一方的发展为条件，体 现了矛盾同一性的作用。C 正确。矛盾的同 一性是有条件的、相对的，矛盾的斗争性是无 条件的、绝对的。B 错误。材料中没有具体 展现矛盾的普遍性(共性)和特殊性(个性) 的关系，也不涉及主要矛盾。A、D 不符合 题意。"},
  {id:27,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"俗话说，甘蔗没有两头甜，然而云南临沧的甘蔗却通过循环利用甜了两头。初榨得糖为“第一 甜”。糖厂榨糖后，产生的主要废弃物包括蔗渣、糖蜜和滤泥，这些经过处理可以成为化肥生产 中的“宝贝”,蔗渣还可“变身”代塑餐具等创造“第二甜”。对废弃物循环利用可以实现甘蔗 从田间到车间的“两头甜”,这一成功实践说明",options:["A. 矛盾双方相互贯通，并在一定条件下相互转化","B. 事物的发展呈现出不断周而复始循环的总趋势","C. 自然物质的存在和功能依赖于人们对它的认识","D. 事物经过否定之否定的过程向原来出发点回复"],answer:"A",explanation:"矛盾着的对立面相互贯通，在一定条 件下可以相互转化。糖厂榨糖后的废弃物可 以变为有价值的“宝贝”,体现了矛盾双方的 相互转化。A正确。事物的发展呈现出周期 性 ，不同周期的交替使事物的发展呈现出波 浪式前进或螺旋式上升的总趋势。B 错误。 自然物质的存在是客观的，不依赖于人们对 它的认识。C 错误。否定之否定阶段仿佛是 向原来出发点的“回复”,但这是在更高阶段 的“回复”。D说法错误且与材料无关。"},
  {id:28,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"《百喻经》中有一则典故：有个人十分饥饿，就去买饼子吃，他一连吃了六个饼子还是不饱， 就再买第七个吃，刚吃了半个，就觉得很饱了。于是这人非常后悔，说：“前头的六个饼子是多 吃的，吃了一点没有用，我只吃这半个饼就饱了。如果早知如此，就应该先吃这半个饼啊!”这 个人的错误在于没有认识到",options:["A. 可能与现实是相互转化的","B. 事物的发展是前进性和曲折性的统一","C. 量变是质变的必要准备","D. 偶然要通过必然为自己开辟道路"],answer:"C",explanation:"题目材料中提到，1%的提高虽然看上 考研政治 1000题 解析分册 · 量变是质变的必要准备。任何事物的 变化都有一个量变的积累过程，没有量变的 积累，质变就不会发生。题干材料中这个人 的错误就在于只看到最后的质变，忽略了之 前的量变积累，C 正确。必然总是伴随着偶 然，要通过偶然表现出来，并为自己开辟道 路。D 错误。A、B不符合题意。"},
  {id:29,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"“君子以思患而豫防之”,有备才能无患。党的十八大以来，习近平总书记十分重视底线思维， 强调凡事不能超越底线。如法律底线、政策底线、利益底线、道德底线等，一旦被突破，就会 出现无法接受的坏结果。从哲学的角度分析，底线是指",options:["A. 联系的条件性","B. 度的关节点","C. 主要矛盾","D. 事物发展的连续性"],answer:"B",explanation:"所谓底线，就是不可逾越的界限，是 事物发生质变的临界点。底线思维是我们在 认识世界和改造世界的过程中，根据我们的 需要和客观的条件，划清并坚守底线，尽力化 解风险，避免最坏结果，同时争取实现最大期 望值的一种积极的思维。B正确。"},
  {id:30,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"恩格斯指出：“在化学中，燃素说经过上百年的实验工作才提供了一些材料。而拉瓦锡利用这种 材料才在普利斯特列提取出来的氧气中发现了想象中的燃素的实在对立物，从而推翻了全部燃 素说。但是燃素说者的实验成果决不因此就被抛弃。正好相反，这些成果依然存在，只不过其 表述被颠倒过来，从燃素说的语言翻译成了现今通行的化学语言，因此仍然保持着自己的有效 性。”这说明",options:["A. 辩证否定是一事物否定另一事物","B. 新、旧事物是通过否定环节联系起来的","C. 只要敢于否定一切，历史就会向前发展","D. 辩证否定是事物之间的相互否定"],answer:"B",explanation:"辩证否定观认为，否定是新、旧事物 联系的环节，新事物孕育产生于旧事物，新、 旧事物是通过否定环节联系起来的。B 正 确。辩证否定观认为，否定是事物的自我否 定、自我发展，是事物内部矛盾运动的结 果。因此，辩证否定既不是一物否定另一物， 也不是事物之间的相互否定。A、D 错误。形 而上学在绝对不相容的对立中进行思维，其 信条是：“是就是，不是就不是；除此之外，都 是鬼话。”也就是说，只承认克服，不承认保 留，就是否定一切。C 错误。"},
  {id:31,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"“鸡蛋从外面打破是食物，从内部打破是生命。”从哲学上讲，这说明",options:["A. 外因必须通过内因起作用","B. 辩证否定是事物内部矛盾运动的结果","C. 真理是主观性和相对性的辩证统一","D. 必然产生于事物内部的根本矛盾"],answer:"B",explanation:"所谓“鸡蛋从外面打破是食物，从内部 打破是生命”,是指当鸡蛋被当作食物时(如 煎鸡蛋),鸡蛋是从外面打破的，这是对鸡蛋 的外部否定；鸡蛋从内部打破是生命，是指小 鸡破壳而出，这是来自内部的自我否定。鸡 蛋变成食物或者小鸡(生命)都是否定(不再 是鸡蛋了),但前者是外部否定，后者是内部 的自我否定(新陈代谢)。因此，本道题实际 上考查的是辩证否定观的内容。从内部打破 是生命，B 正确。A、D本身内容正确但与题 干无关。C 说法错误(真理具有客观性，是绝 对性和相对性的辩证统一)。"},
  {id:32,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"“知人善察，难眩以伪。”现象有真象和假象之分，假象是",options:["A. 从反面歪曲表现本质的现象","B. 人们在认识中产生的错觉","C. 与本质无关的现象","D. 人们主观自生的观念"],answer:"A",explanation:"本质与现象是既对立又统一的。一方 面，本质与现象是相互区别的。另一方面，本 质与现象又是相互依存的：本质决定现象，现 象的存在和变化归根到底依赖于本质；现象 表现本质，本质总是通过一定的现象表现自 己的存在。不表现为现象的本质和不表现本 质的现象都是不存在的。即使假象也是本质 的表现，不过假象是从反面歪曲表现本质的 现象(真象是从正面直接表现本质的现象), 而错觉不表现事物的本质。所以，A 正确，B、 C、D错误( D 把假象或者现象说成是主观范 畴的观念显然是错误的)。"},
  {id:33,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"现象有真象和假象之分，真象和假象的区别在于",options:["A. 真象从正面表现本质，假象从反面歪曲地表现本质","B. 真象深藏于事物内部，假象外露于事物外部","C. 真象表现本质，假象不表现本质","D. 真象是真实的，假象是一种错觉"],answer:"A",explanation:"现象有真象和假象之分。现象是本质 的外在表现，任何现象都从一定的方面表现 着本质，即使假象也是本质的表现。 C 错 误。只不过，真象是从正面表现本质，假象 是从反面歪曲地表现本质。A 正确。假象与 错觉不是一回事。错觉是主观的，假象是客 观的。D 错误。本质深藏于事物的内部，而 现象则是表面的、外显的。B 错误。"},
  {id:34,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"做事情时要区分可能性和不可能性，二者的区别在于",options:["A. 人的主观努力程度","B. 对人是否有利","C. 现实中有无根据和条件","D. 现实中的根据和条件是否充分"],answer:"C",explanation:"可能性和不可能性的区别在于，在现 实中有无根据和条件，C 正确。现实中没有 根据和条件的，人的主观再努力也不可能变 为现实(如“水中捞月”“挟泰山以超北海”), A错误。对人是否有利是价值判断，不是区 分可能性和不可能性的标准，而是区分好的 可能性和坏的可能性的标准，B 错误。现实 中的根据和条件是否充分是区分现实的可能 性与抽象的(非现实的)可能性的依据， D 错误。"},
  {id:35,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"探月工程叫“嫦娥”、月球车叫“玉兔”、全球定位系统叫“北斗”、载人空间站叫“天宫”…… 有人评价说，古人的浪漫在于妙想，科学家的浪漫在于实干。神舟飞天、嫦娥奔月，近年来， 经过几代中国航天人的接续努力，中华民族的飞天梦、探月梦相继实现，以前在古老传说中才 会有的情形都成为了现实。这对我们在哲学上的启示是",options:["A. 一个事物只要合乎发展的必然性迟早会变成现实","B. 只要充分发挥主观能动性，不可能就会转化为可能","C. 只有对人有利的可能性才会转化为现实","D. 随着科技的发展，任何想象都会变为现实"],answer:"A",explanation:"现实性是和必然性相联系的，现实之 所以成为现实，是由它内部的必然性所决定 的。一个事物，只要它合乎发展的必然性， 迟早会变成现实。A 正确。不可能是指违背 必然性，没有任何根据，因而在任何时候、任 何条件下都不能实现的东西。B 错误。可能 既有好的可能，也有坏的可能。因此，人们 要注意分析事物发展的各种可能，发挥主观 能动性，创造有利条件，争取实现好的可能。 同时也要防止坏的可能向现实转化，并做好 应对这种局面的充分准备。C 错误。只有可 能才可以变为现实，比如制造永动机这种想 象就永远不可能变为现实。D 错误。"},
  {id:36,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"“概念的辩证法本身就变成只是现实世界的辩证运动的自觉的反映，从而黑格尔的辩证法就被 倒转过来了。”这段话表明，主观辩证法与客观辩证法的关系是",options:["A. 反映与被反映的关系","B. 唯心主义与唯物主义的关系","C. 抽象与具体的关系","D. 唯心辩证法与唯物辩证法的关系"],answer:"A",explanation:"唯物辩证法既包含客观辩证法，又包 含主观辩证法，是二者的有机统一。主观辩 证法是客观辩证法在人的思维中的反映，客 观辩证法与主观辩证法在本质上是统一的， 但在表现形式上却是不同的。马克思主义哲 学把人们对事物运动发展的辩证理解即主观 辩证法确立在唯物主义的基础上，承认辩证法 诸规律是自然、人类社会和思维领域的普遍规 律。但它强调这些规律首先是自然界和人类 社会中的客观规律，而思维领域内的辩证法进 程是自然界和人类社会的辩证过程的反映。 也就是说，主观辩证法与客观辩证法是反映与 被反映的关系。可见，A是唯一正确选项。 这里最容易犯的错误是望文生义，把概 念的辩证法(主观辩证法)理解为唯心辩证法 或唯心主义。B、D明显错误。抽象与具体是 辩证思维的方法，C不符合题意，也应排除。"},
  {id:37,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"湖南蓝山县是候鸟迁飞的重要通道。之前，此地捕鸟风气盛行，如今，不仅捕鸟人不见了，他 们还变成了当地的护鸟人。 由“捕”变“护”是怎样实现的呢?思路一变天地宽。在以往重 “整治”、严厉打击捕鸟行为的基础上，蓝山县更加关注“引导”,利用村民对山形地理、鸟类习 性的了解，聘请他们成为职业护鸟人、 候鸟科普宣传员等，保障捕鸟人转行就业。疏堵结合、 双管齐下，取得了良好效果。由“捕”变“护”的成功说明",options:["A. 不仅要看到矛盾双方的对立，而且要看到矛盾双方的统一","B. 评价结果与评价主体直接相关，事物的根本性质取决于评价主体的具体需要","C. 矛盾双方融合成一个新事物是解决矛盾的唯一形式","D. 新事物是在旧事物的“母体”中孕育成熟的，它保留了旧事物的一般特征"],answer:"A",explanation:"事物的性质是由主要矛盾的主要方面所 决定的。B 前半句正确，后半句错误。解决 矛盾的方法不是只有矛盾双方融合成一个新 事物这一种，还有矛盾一方克服另一方、矛盾 双方形成协同运动的新形式、矛盾双方同归 于尽等。C 错误。新事物是在旧事物的“母 体”中孕育成熟的，它既否定了旧事物中消极 腐朽的东西，又保留了旧事物中合理的、适 应新条件的因素，并添加了旧事物所不能容 纳的新内容。D 错误。"},
  {id:38,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"习近平在贵州考察时指出：“要立足县域产业基础，注重分工协作，错位发展、串珠成链。”这 一重要指示为各地区立足自身实际，促进县域经济高质量发展提供了科学指引和根本遵循。“串 珠成链”就是将各具特色、优势互补的“珍珠”(县域特色产业)有效串联、协同整合，形成 价值倍增的“项链”(区域产业集群或经济带),将分散的比较优势凝聚为区域整体竞争优势。 “串珠成链”能够实现价值倍增，是因为",options:["A. 事物的发展是量变和质变的统一","B. 矛盾普遍性通过特殊性表现出来","C. 内部矛盾是事物发展的根本动力","D. 要素的结构性变化引起了整体功能的优化"],answer:"D",explanation:"所谓系统，是指由相互联系、相互作用 的若干要素组成的具有稳定结构和特定功能 的有机整体。只有使系统各要素之间产生相 干效应和协同效应，使系统产生整体性行为 和有序结构，而且朝着使整体功能结构优化 的方向调整，不断产生新的有序机构，系统 才能得以存在和良性发展。“串珠成链”将分 散的县域力量汇聚为区域整体合力，实现从 “单打独斗”到“集群作战”的转变，体现了系 统思维的运用。D正确。A、B、C都与题干材 料表达的意思不符。 · 考研政治1000题 解析分册 ·"},
  {id:39,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"过去一段时问，内蒙古自治区一些地方在改革中缺少协调配套，影响了保护治理的成效。以乌 梁素海为例，此前巴彦淖尔市对其开展了30多项治理工程，但总体上还是“就湖治湖”,效果 一般。从“治湖泊”转向“治流域”,必须勇于打破条块分割的职能边界，形成多元共治工作格 局。内蒙古自治区成立乌梁素海综合治理工作领导小组，组建乌梁素海生态保护中心，开辟 “生态警务”协作新模式，完善“河湖长+检察长”联动机制，并推出自治区第一部专门针对湖 泊流域生态保护的地方性法规《巴彦淖尔市乌梁素海流域生态保护条例》。生态保护“一盘棋”, 凝聚起各项改革举措的合力，让“塞外明珠”更加璀璨。从“治湖泊”转向“治流域”体现了",options:["A. 系统治理的思想","B. 辩证否定的思想","C. 量变质变的思想","D. 底线思维"],answer:"A",explanation:"“就湖治湖”是孤立地看问题，没有把 事物放到普遍联系的系统中来把握；“治流 域”则是把与治理湖泊相关的各个因素当作 “一盘棋”来考虑，体现了系统治理的思想。 A正确。B、C、D不符合题意。"},
  {id:40,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"学习和掌握唯物辩证法的科学思维方法，要求我们在实践中不断增强辩证思维能力。提高辩证 思维能力，要自觉运用对立统一规律，掌握运用好辩证的逻辑思维方法。在这些思维方法中， 人类思维从个别到一般，又由一般到个别的最常见的推理形式是",options:["A. 分析与综合","B. 归纳与演绎","C. 抽象与具体","D. 逻辑与历史"],answer:"B",explanation:"（本题解析见原书解析分册）"},
  {id:41,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"马克思主义理论区别于其他理论的根本特征是",options:["A. 科学性","B. 人民性","C. 实践性","D. 发展性"],answer:"C",explanation:"实践性是马克思主义理论区别于其他 理论的根本特征。实践的观点是马克思主义 的基本观点。C 正确。"},
  {id:42,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"马克思、恩格斯以前的中外哲学都使用过实践的概念。一些思想家对实践也有过不少论述，但 他们都没有真正理解人类实践的本质，没有看到实践在社会生活和认识活动中的决定意义。马 克思在他的著作中系统论述了实践的观点，揭示了科学实践观的基本内容。这个被称为“包含 新世界观天才萌芽的第一个文件”的著作是",options:["A. 《 德意志意识形态》","B. 《 反杜林论》","C. 《 关于费尔巴哈的提纲》","D. 《 路德维希 ·费尔巴哈和德国古典哲学的终结》"],answer:"C",explanation:"在《关于费尔巴哈的提纲》这个包含新 世界观天才萌芽的第一个文件中，马克思系 统论述了实践的观点，揭示了科学实践观的 基本内容。C 正确。马克思、恩格斯合写了 《德意志意识形态》,首次系统阐述了历史唯 物主义的基本观点。1876—1878年，恩格斯 写出了《反杜林论》,全面阐述了马克思主义 理论体系。马克思逝世后，恩格斯承担起指 导国际工人运动的重任，并整理出版了《资本 论》第二、三卷，写出了《家庭、私有制和国家 的起源》《路德维希 · 费尔巴哈和德国古典哲 学的终结》等著作，进一步发展了马克思主义 理论。 A、B、D错误。"},
  {id:43,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"数字孪生水利是指通过人工智能、5 G、大模型等技术，把现实世界的自然水系和水利工程 “搬”到互联网上，实现虚实物体之间仿真模拟，进而开展精准预报、超前预警、快速预演、制 定预案。近年来，水利部门先行完成了94项数字孪生水利建设任务。三峡水利枢纽工程，大 坝、大江和连绵群山——映射到虚拟空间，参数变动，为库容调度、冲淤提供精准方案；南水 北调中线工程，电子围栏、远程控制系统护佑一渠清水北上，全天候监测1400多公里渠道…… 将现实水利工程“搬”到互联网上构建数字孪生体，开展精准预演，这一做法说明",options:["A. 虚拟实践是实践活动的派生形式，同时又对现实的实践活动产生重大影响 B .意识不仅可以反映客观世界，还具有改变物质世界的直接现实性","C. 人类可以凭借技术手段创造独立的虚拟世界，使其完全脱离物质世界的束缚","D. 人们的思想、理论、计划和方案在实践中总是能够得到预想的结果"],answer:"A",explanation:"现代信息技术的发展使得当代社会开 始产生一种新的实践形式，即虚拟实践。虚 拟实践是伴随信息化和网络化发展而产生 的，其实质是主体和客体之间通过数字化中 介系统在虚拟空间进行的双向对象化的活 动，主要活跃于网络世界，具有交互性、开放 性、间接性等特点。虚拟实践是实践活动的 派生形式，同时又对现实的实践活动产生重 大影响。A 正确。意识虽然具有指导实践改 造客观世界的作用，但它必须通过实践才能 使观念的东西变为客观现实。实践具有直接 现实性。实践的直接现实性是它的客观实在 性的具体表现。B 错误。世界统一于物质， 虚拟世界不能脱离物质世界。C 错误。人们 在实践中得来的思想、理论、计划和方案毫无 改变地实现的情况很少。许多时候，经过多 次失败，不断纠错，才能实现主客观的统一， 在实践中得到预想的结果。D 错误。"},
  {id:44,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"中国脱贫攻坚的一个重要特点是，采取一系列有效举措，把扶贫与扶志扶智结合起来，高度重 视精神脱贫、教育脱贫，增强贫困群众自我“造血”的能力与信心。习近平指出：“摆脱贫困首 要并不是摆脱物质的贫困，而是摆脱意识和思路的贫困。”这给我们的启示是",options:["A. 从根本上说认识对实践具有决定作用","B. 事物发展的根本原因在事物的外部","C. 实践主体的能力既包括自然能力也包括精神能力","D. 矛盾的次要方面也能起到支配作用"],answer:"C",explanation:"实践主体是指具有一定的主体能力、 从事现实社会实践活动的人，是实践活动中 自主性和能动性的因素，担负着设定实践目 的、操作实践中介、改造实践客体的任务。实 践主体的能力包括自然能力和精神能力，精 神能力又包括知识性因素和非知识性因素。 其中知识性因素是首要的能力，既包括对理 论知识的掌握，又包括对经验知识的掌握；非 知识性因素主要指情感和意志因素。“扶志” 和“扶智”都是强调对实践主体能力中精神能 力的扶持。C 正确。 实践决定认识，A 显然错误。事物发展 的根本原因不在事物的外部，而在于事物内 部的矛盾性。事物的内部矛盾是事物发展的 内因。内因即内部矛盾是事物存在的基础，是 一事物区别于他事物的内在本质，是事物变化 的根据，它规定着事物发展的方向，所以它是 事物发展的根本原因。B 错误。在每一对矛盾 中，处于支配地位、起着主导作用的一方，是矛 盾的主要方面，处于被支配地位、不起主导作 用的一方，则是矛盾的次要方面。D 错误。"},
  {id:45,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"“不登高山，不知天之高也；不临深溪，不知地之厚也。”这说明",options:["A. 感性认识比理性认识更深刻","B. 实践是改造世界的活动","C. 认识总是落后于实践","D. 认识来源于实践"],answer:"D",explanation:"10 ……… 理性认识是指人们借助抽象思维，在 概括整理大量感性材料的基础上，达到关于 事物的本质、全体、内部联系和事物自身规律 性的认识。理性认识是认识的高级阶段，具 有抽象性和间接性的特点。它以反映事物的 本质为内容，因而是深刻的。A 错误。具体 的认识过程可以与一定的实践不完全同步进 行，如预测、假说、规划等都超前于直接的实 践 ，C错误。B本身内容正确但与题干无关。 D正确。 性与偶然性的界限在 一 定范围内也是确定 的，超出这个范围就成为不确定的了。 ·"},
  {id:46,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"习近平指出：“坚持在干中学、学中干是领导干部成长成才的必由之路。”习近平曾讲述肖劲光 同志的故事。肖劲光同志在新中国成立之初受命担任海军司令员，虽然他从没接触过海军，自 己还是个“旱鸭子”,但是通过边干边学，使我国海军从无到有、迅速壮大，从而不负重托、不 辱使命。坚持在“干中学、学中干”强调的是",options:["A. 正确的理念是认识世界和改造世界统一的基础","B. 真理和谬误没有原则界限","C. 事都必须去直接经验","D. 实践是认识的来源和认识的目的"],answer:"D",explanation:"在“干中学”体现了实践是认识的来 源。认识的内容是在实践活动的基础上产生 和发展的。人们只有通过实践实际地改造和 变革对象，才能准确把握对象的属性、本质和 规律，形成正确的认识，并以这种认识指导人 的实践活动。在“学中干”体现了实践是认 识的目的。人们通过实践获得认识，不是“猎 奇”或“雅兴”,不是为认识而认识，其最终目 的是为实践服务，指导实践，以满足人们生活 和生产的需要。D正确。 认识世界和改造世界统一的基础是实 践。A 错误。在确定的对象和范围内，真理 与谬误的对立是绝对的，与对象相符合的认 识就是真理，与对象不相符合的认识就是谬 误。在确定的条件下，一种认识不能既是真 理又是谬误。也就是说，真理和谬误有着原 则界限。B 错误。就知识的本源来说，任何 知识都不能离开直接经验。但是，这并不意 味着事事都必须去直接经验，“吾生也有涯， 而知也无涯”,一个人的多数知识还是来自间 接经验，是从书本和传授中得来的。C 错误。 点拨 在一定的条件下可以互相转化并不意 味着二者之间无法确定界限，在确定的条件 下(或者一定范围内)二者是有原则界限 的。除了本题中真理与谬误的例子外，必然 考研政治1000题 解析分册 一种科学文化实践活动，教育者的教学活动 并不是纯粹的意识活动，而是通过教书育人 的全过程实际地改变受教育者的存在状态。 A错误。现代信息技术的发展使得当代社会 开始产生一种新的实践形式，即虚拟实践。 虚拟实践是实践活动的派生形式。在虚拟实 践产生之前，科学文化实践早已存在。B 错 误。实践的主体和客体相互作用的关系，包 括实践关系、认识关系、价值关系，其中实践 关系是最根本的关系。D 错误。"},
  {id:47,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"恩格斯在谈到欧洲文艺复兴时期自然科学的迅速发展时指出：“资产阶级为了发展工业生产，需 要科学来查明自然物体的物理特性，弄清自然力的作用方式。”这段话说明",options:["A. 实践是认识发展的动力","B. 认识对实践具有相对独立性","C. 实践是检验认识是否具有真理性的标准","D. 认识对实践具有决定作用"],answer:"A",explanation:"实践是认识发展的动力。实践的需要 推动认识的产生和发展，推动人类的科学发 现和技术发明，推动人类的思想进步和理论 创新。A 正确，B、C 本身内容正确但不符合 题意。实践对认识具有决定作用，D 颠倒了 二者关系，说法错误。"},
  {id:48,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"天空繁星密布，而首先成为天文学研究对象的是与人们确定季节关系密切的星体；地球上的生物 品种难以计数，而人们首先研究的还是与农业和畜牧业有关的为数不多的植物和动物。这说明",options:["A. 实践是认识的起点 ，认识是实践的归宿","B. 实践的需要推动认识的产生和发展","C. 实践锻炼和提高了主体的认识能力","D. 科学研究具有相对独立性"],answer:"B",explanation:"实践是认识的起点，也是认识的归 宿 ，是全部认识的基础。A 错误。实践是认 识发展的动力。科学总是围绕着人类实践的 需要这个中心而形成和发展，以人类实践的 需要为出发点去认识世界。B 正确。C 本身 内容正确但与题干材料无关，故不选。D 不 符合题意。"},
  {id:49,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"近年来，为了向更多人更好地传播科学、艺术、文化等知识，很多地方把博物馆搬到了线上， 借助技术手段，让知识可感、可视。通过虚拟现实技术，游览者可以与展品“零距离”接触。 线上博物馆的发展说明",options:["A. 精神文化的生产是一个纯粹的意识过程","B. 科学文化实践只能通过虚拟实践的方式实现","C. 实践的发展过程是一个范围不断扩大、程度不断加深、效果不断提升的过程","D. 认识关系是实践的主体和客体相互作用关系中最根本的关系"],answer:"C",explanation:"人类的实践活动是不断发展的，它的 发展有自身的特点和规律。实践的发展过程 是一个范围不断扩大、程度不断加深、效果 不断提升的过程，是一个从低级到高级、从 简单到复杂、从自发到自觉的过程。C 正确。 科学文化实践是创造精神文化产品的实 践活动，具有各种不同的形式，其中重要的形 式有科学、艺术、教育等活动。精神文化的生 产不是一个纯粹的意识过程。例如，教育是"},
  {id:50,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"从物到感觉和思想与从思想和感觉到物的对立，反映的是",options:["A. 可知论和不可知论的对立","B. 经验论和唯理论的对立","C. 唯物主义反映论与唯心主义先验论的对立","D. 形而上学与辩证法的对立"],answer:"C",explanation:"从物到感觉和思想与从思想和感觉到 物的对立，反映的是两条认识路线，即唯物 主义反映论与唯心主义先验论的对立。C 正 确。对存在和思维是否具有同一性的回答， 反映了可知论和不可知论的对立；把感性认 识和理性认识割裂开来，在哲学史上表现为 唯理论(轻视感性认识而片面夸大理性认识 的作用)和经验论(轻视理性认识而片面夸大 感性认识的作用);对世界是怎样存在的问 题，即对世界上的事物是联系的还是孤立的， 是发展的还是静止的，是全面的还是片面的 的不同回答，将哲学划分为辩证法与形而上 学。A、B、D不符合题意。"},
  {id:51,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"“调查研究是从实际出发的中心一环。没有调查就没有发言权，没有调查也没有决策权。”调查 才能获得第一手材料，获得感性认识。感性认识的突出特点是 ①直接性 ②深刻性 ③具体性 ④间接性",options:["A. ①③","B. ①②","C. ②③","D. ②④"],answer:"A",explanation:"感性认识是认识的初级阶段，作为“生 动的直观”,直接性、具体性是感性认识的突 出特点。①③正确。理性认识是认识的高级 阶段，具有抽象性、间接性的特点。它以反 映事物的本质为内容，因而是深刻的。②④ 不符合题意。因此，本题选A。"},
  {id:52,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"“具象化”这个词在当今的社交媒体中频繁出现。对于一些只在书本上看到过或者从别人口中 听说过的概念，当人们在现实中碰到相关的真人实物时，往往会因为亲身感受的不同而对这些 概念产生更加深刻的理解。“×x×在这一刻具象化了”的句式正是用来形容这种将概念和实物对 应起来比较的情况。“具象化”描述的这种情景体现了",options:["A. 感性认识和理性认识相互渗透","B. 意识对物质的直观反映","C. 情感在认识活动中的决定作用","D. 认识的直接现实性"],answer:"A",explanation:"感性认识与理性认识相互渗透、相互 包含，既没有纯粹的感性认识，也没有纯粹的 理性认识，对事物的感觉和对事物的理解总 是相互包含、相互制约的。材料中“具象化” 指代人们对某个概念的理解以感性材料为基 础，体现了感性认识与理性认识相互渗透。A 正确。辩证唯物主义认识论认为，认识的本 质是主体在实践基础上对客体的能动反映。 B错误。实践是认识的基础，实践在认识活 动中起着决定性的作用。情感属于认识活动 中的非理性因素。C 错误。实践是主观见之 于客观的活动。实践不仅和认识一样具有普 遍性，而且还具有认识不具备的特点，这就 是直接现实性。D错误。"},
  {id:53,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"感性认识和理性认识是统一的认识过程中的两个阶段，它们既有区别，又有联系。感性认识和 理性认识的区别在于",options:["A. 感性认识反映事物的现象，理性认识反映事物的本质","B. 感性认识来源于社会实践，理性认识来源于抽象思维","C. 感性认识来源于感性具体，理性认识来源于理性具体","D. 感性认识包含错误，理性认识则完全正确"],answer:"A",explanation:"感性认识是在实践中产生的，由感性 认识到理性认识的飞跃也是在实践的基础上 实现的。实践是认识的来源。B、C 错误。理 性认识不可能完全正确，认识的真理性只有 在实践中才能得到检验和发展，D 错误。 A正确。"},
  {id:54,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"地震是一种自然现象。中国古代的主流观点认为，地震是“阴阳失衡”所致，与人类特别是帝 王的不作为有直接关系，是上天对人类的一种警告。随着科技的进步和观测工具的更新，目前 人们已经对地壳运动有了大量的观测数据和理论模型，但仍无法完全掌握地震的规律，也无法 准确预测地震的发生。这说明",options:["A. 人的感官的局限性构成了人的认识能力的局限性","B. 人们只能认识个别的、有限的东西","C. 认识总是要受到主客观条件的限制","D. 人类无法充分认识客观世界"],answer:"C",explanation:"C 正确。人可以利用认识工具(如题 目中提到的观测地震的特殊工具)来延长和 放大自己的感官，极大地提高主体接收、处理 和加工信息的能力，从而突破人的感官的自 然界限。A错误。可知论认为世界是可以被 认识的，不可知论认为世界是不能被人所认 识或不能被完全认识的。我们驳斥不可知 论，证明世界的可知性，并不是说我们现在已 经知道了一切。我们所肯定的是世界上没有 原则上不能认识的东西，人的认识能力没有 原则上不可逾越的界限。B、D 错误。 映自然规律的“二十四节气”后，沿用至今，依 然能在现实中获得与预想基本一致的结果。 B正确。"},
  {id:55,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"调查研究是谋事之基、成事之道。习近平指出，“要了解实际，就要掌握调查研究这个基本功”, 强调“听真话、察真情，真研究问题、研究真问题，不能搞作秀式调研、盆景式调研、蜻蜓点 水式调研”。这是因为",options:["A. 占有了真实的感性材料，就等于抓住了事物的本质","B. 反映和创造是人类认识的两种不同的本质，只有以反映为基础才能创造出新的理论","C. 作出科学合理的决策，需要大量客观、真实、有效的信息","D. 感性中有理性，人的感觉是渗透着理性的感觉"],answer:"C",explanation:"C正确。占有了真实的感性材料，并 不等于抓住了事物的本质。感性认识是认识 的初级阶段，是对事物外部联系的认识，还不 能达到对事物的本质和规律的认识，有待于 发展和深化为理性认识。A 错误。在人的认 识活动中，反映特性与能动的创造特性是不 可分割的。反映和创造不是人类认识的两种 不同的本质，而是同一本质的两个不同的方 面。B 错误。D 说法正确但不符合题意。 · 人的认识过程是一个在实践基础上不断 深化的发展过程，既表现为实践基础上由感 性认识到理性认识，再从理性认识到实践的 具体认识过程；又表现为从实践到认识，再从 认识到实践的循环往复和无限发展的总过 程。从实践到认识，认识的过程还没有完 成。要实现一个完整的认识过程，还必须 由认识再回到实践中去，实现认识的第二次 能动飞跃。理性认识不是认识过程的终点，A 错误。离开实践的认识是不可能产生的。一 切真知都是从直接经验发源的。C 错误。相 对静止是物质运动在一定条件下的稳定状 态，具体包括两种状态：空间的相对位置暂时 不变和事物的根本性质暂时不变。任何事物 内部都包含肯定的方面与否定的方面，一旦 否定方面在发展中取得了支配地位，事物就 会改变自己的根本性质，达到对原有事物的 否定。D 错误。"},
  {id:56,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"一位著名的石油地质学家说过，“我们曾无数次用老方法在新地方发现石油，我们也曾在老地方 用新方法找到了石油，但从来没有在老地方用老方法发现石油。”这句话体现的哲理是",options:["A. 发展的实质就是数量的增减和场所的变更","B. 在科学研究中，经验是不可靠的","C. 真理与谬误之间没有原则的界限","D. 认识需要随着实践的发展而发展"],answer:"D",explanation:"在实践和认识的辩证运动中，主观必 须统一于客观，认识必须统一于实践。由于 客观实践是具体的、历史的，所以，主观认识 也应是具体的、历史的。客观实践变化了， 主观认识也应当随之转变。用老方法无法再 发现石油的时候，就必须推动认识向前发展， 用上新方法才可能在老地方再发现石油。D 正确。物质世界的发展，特别是人类社会的 发展，其实质是新事物的产生和旧事物的灭 亡。量变是事物数量的增减和组成要素排列 次序的变动，是保持事物的质的相对稳定性 的不显著变化，体现了事物发展渐进过程的 连续性。A 错误。在科学研究中，要想得到 关于事物全面、本质的认识，离不开经验，经 验并不是完全不可靠的。B 错误。任何真理 都标志着主观同客观的符合，都包含着不依 赖于任何人的客观内容，都同谬误有原则的 界限。C 错误。"},
  {id:57,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"中国是农业发达的文明古国，春耕、夏耘、秋收、冬藏是农业社会基本的生产实践活动。发轫 于农耕文明的“二十四节气”,是古人观察时令、气候、物候等现象时总结出的时间知识体系， 它能够准确反映自然节律变化，一直沿用至今。现代的人们仍能够通过“二十四节气”指导四 时农耕，说明",options:["A. 理性认识是认识过程的终点","B. 自然规律具有重复性和稳定性","C. 一切真知都是从间接经验发源的","D. 事物的根本性质是永恒不变的"],answer:"B",explanation:"规律具有重复性。只要具备一定的条 件，某种合乎规律的联系就以一种不可抗拒 的趋势重复出现，发生作用。规律具有稳定 性。世界上的事物和现象总是千差万别、变 化不定的，但规律却是变化不定的现象中隐 含着的相对稳定的东西。正是因为自然规律 具有重复性和稳定性，人们在掌握了正确反"},
  {id:58,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"马赫主义认为真理是“思想形式”,是“社会地组织起来的经验”,凡是多数人承认的就是真 理；实用主义认为“有用即真理”,把真理的有用性与真理本身等同起来。它们共同的错误都是 否定真理的",options:["A. 客观性","B. 相对性","C. 能动性","D. 直接现实性"],answer:"A",explanation:"一切唯心主义都否认真理的客观性， 宣扬主观真理论。主观真理论有两种典型表 现：马赫主义认为真理是“思想形式”,是“社 会地组织起来的经验”,凡是多数人承认的就 是真理；实用主义认为“有用即真理”,把真理 的有用性与真理本身等同起来。它们共同的 错误都是否定真理的客观性。A 正确。B、C、 D 错误。"},
  {id:59,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"同一个物理学规律可以用不同的数学公式或语言文字的形式加以表述，而这一规律本身不会随 之改变。这说明",options:["A. 真理标准是确定性与不确定性的统一","B. 真理形式的多样性并不否认真理内容的客观性","C. 真理本身就是客观事物","D. 真理的绝对性寓于真理的相对性之中"],answer:"B",explanation:"题干材料讨论的是在内容不变的情况 下用不同的主观形式描述真理，不涉及检验 真理的问题。B正确，A不符合题意(注：常 用提法为实践标准的确定性与不确定性)。 真理的客观性并不是说真理本身就是客观事 物，也不是说它没有主观形式，而是说真理的 考研政治1000题 解析分册 内容是对客观事物及其规律的正确反映，真 理中包含着不依赖于人和人的意识的客观内 容。C 错误。D 说法正确但与题意不符。"},
  {id:60,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"马克思主义真理精神表现为实践的精神。真理性认识的基础和动力是实践， 检验真理的标准归 根到底也是实践。实践是检验真理的唯一标准，这是因为",options:["A. 实践是人的本质","B. 真理与实践都是绝对的","C. 真理是抽象的，但实践是具体的","D. 只有实践才能把主观认识与客观事物联系起来加以对照"],answer:"D",explanation:"只有那种能够把主观认识与客观事物 联系和沟通起来，从而使人们能够把二者加 以比较和对照的东西，才能充当检验真理的 标准。具有这种特性的东西，只能是作为主 客观联系的桥梁、纽带或“交错点”的社会实 践。D正确。真理是一个发展过程，既是绝 对的，又是相对的，这是真理问题上的辩证 法 。B 错误。真理是具体的，任何真理都是 在一定范围内、一定条件下才能够成立的。 C错误。人的本质是一切社会关系的总和。 A错误。"},
  {id:61,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"实践作为检验真理的标准，既是确定的又是不确定的，其不确定性是因为",options:["A. 有些真理是根本无法通过实践来加以检验的","B. 任何实践检验都需要一定的逻辑证明作为其补充的手段","C. 作为检验真理标准的实践总要受到历史条件的限制","D. 不同的人、不同的阶级各有其不同的实践标准"],answer:"C",explanation:"C 正确。实践标准的确定性即绝对 性，是指实践作为检验真理标准的唯一性、 归根到底性、最终性。即使对于有些认识， 当前的实践不能检验，但不断发展着的实践 终能验证它是否具有真理性。A、D 错误。B 不符合题意。"},
  {id:62,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"习近平在主持召开高标准高质量推进雄安新区建设座谈会上指出：“雄安新区建设不是一天两天 的事，不能当下都吃干榨尽，要留白、留有余地，为远期规划预留项目、地块。要适度超前， 但不能过于超前，防止建成项目‘晒太阳',造成浪费。有的要大举实施，有的要待机而动，有 的要与时俱进，既不能急于求成，也不能无所作为。”这段话说明",options:["A. 事物的根本性质随时随地都在变化，要坚持底线思维","B. 人在一定条件下的认识总是有限度的，要不断深化","C. 事物的变化发展是没有规律的，要全面地考虑各种情况","D. 认识总是超前于直接的实践，要提高战略思维能力"],answer:"B",explanation:"人们在一定条件下对客观事物及其本 质和发展规律的正确认识总是有限度的、不 完善的。要根据时代变化和实践发展，不断 深化认识，不断总结经验，不断进行理论创 新，坚持理论指导和实践探索辩证统一。对 雄安新区的开发不可能一次性完成全部认识 (规划),必然要在发展中进行调整、深化，再 用新的认识指导新的实践，题干中提到的“要 与时俱进”也体现了这一点。B正确。 事物的根本性质是相对稳定的，A 错误。 事物的变化发展是有规律的，唯物辩证法揭 示了事物变化发展的一般规律，即对立统一 规律、量变质变规律和否定之否定规律。C 错误。认识可能与实践完全同步进行，也可 能落后或超前于直接的实践，并不总是超前 于实践。D错误。"},
  {id:63,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"对于真理，不能说“它对谁来说是真理”;对于价值，则必须说“它对谁来说有价值”。这是因为",options:["A. 真理是抽象的，而价值是具体的","B. 真理是一种客观实在，而价值是一种认识性的判断","C. 真理是一元的，而价值是多元的","D. 真理是永恒不变的，而价值是不断发展的"],answer:"C",explanation:"精讲P38 考点39 - 1- (2)-3 真理是一元的，真理本身没有主体的 差别，而价值是多元的，不同的主体有不同 的需要、不同的价值要求和价值选择。C 正 确。真理是具体的。任何真理都是在一定范 围内、一定条件下才能够成立，超出这个范 围，失去特定条件，就会变成谬误。A 错误。 真理的客观性指真理的内容是对客观事物及 其规律的正确反映，真理中包含着不依赖于 人和人的意识的客观内容。不能因为真理的 客观性而把真理等同于客观实在。B 错误。 马克思主义真理观与旧唯物主义真理观的不 同之处就在于，它认为真理与客观事物之间 的符合关系是建立在人类能动地改造客观世 界的实践基础上的，是通过人的能动的反映 活动而实现的，并且必然随着人类实践的发 展而拓展和深化。认为真理是永恒不变的是 绝对主义，实际工作中的教条主义、思想僵化 就是绝对主义的表现。D 错误。"},
  {id:64,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"一束花，能带来何种价值?这需要综合来看。对种花的人来说，一束花意味着收入；对买花的 人来说，一束花表达了感情；对参与花卉交易的人来说，一束花意味着就业。我国是世界最大 的花卉生产国。中国花卉协会统计数据显示，我国现有近22万家种苗花卉企业，花卉产业从业 人员超534万人，年产值5200多亿元。鲜花连着产业与就业，也连着物质消费与精神需求。以 上事例说明",options:["A. 价值是随主体、客体以及主客体关系的变化而变化的","B. 认识和评价可以反映价值，也可以创造价值","C. 价值关系是实践的主体和客体相互作用中最根本的关系","D. 客体能否满足主体需要，是由人的主观愿望决定"],answer:"A",explanation:"一束花对不同的主体来说具有不同的 价值，价值的主体性决定了价值的相对性，即 价值是随主体、客体以及主客体关系的变化 而变化的。A正确。价值的客观性是指在一 定条件下客体对于主体的意义不依赖于主体 的主观意识而存在。价值是一种客观存在， ·"},
  {id:65,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"在四川成都街头漫步，多处小微公共空间改造创意十足。这些由城市中缺乏合理规划、未充分 利用的剩余空间改造而来，可供市民休闲、娱乐、交往的高品质空间，在成都被称作“金角银 边”。出地铁口，邂逅野趣盎然的口袋公园；穿行小巷，遇见与绿植融为一体的彩色墙绘；高架 桥下，体验丰富的运动项目…… ·这些曾经未被科学利用的角落，正以一种意想不到的方式，重 新定义城市空间的价值。没有真正的“无用空间”,只有尚未被发现的价值潜能。“金角银边” 的设计说明",options:["A. 空间的存在与利用状况依赖于人的主观感觉","B. 城市空间的价值通过主体的创造性体现出来","C. 任何一个具体物质形态的时空都是无限的","D. 人类实践的广度和深度不受客观条件的制约"],answer:"B",explanation:"在马克思主义产生之前，唯物论与唯 心论、辩证法与形而上学、可知论与不可知论 的对立就已存在。马克思科学地解决了社会 存在与社会意识的关系问题，发现了人类社 会发展的客观规律，创立了唯物史观，从此开 始出现唯物史观与唯心史观的对立。可见， 正确选项是D。 价值具有主体性。价值关系的形成依 赖于主体的创造，使客体潜在的价值转化为 现实的价值。主客体之间的价值关系不是一 种自然的现成关系，而是主体在实践基础上 确立的与客体之间的一种创造性关系。B 正 确。时间与空间的客观实在性是绝对的、无 条件的，空间的存在不依赖于人的主观感觉。 A错误。具体物质形态的时空是有限的，而 整个物质世界的时空是无限的。C 错误。实 践具有客观实在性。实践的水平、广度、深度 和发展过程，都受着客观条件的制约和客观 规律的支配。D 错误。"},
  {id:66,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"“自由不在于幻想中摆脱自然规律而独立，而在于认识这些规律，从而能够有计划地使自然规 律为一定的目的服务。”这说明自由是",options:["A. 选择的随意性","B. 活动的主动性","C. 摆脱必然性","D. 对必然的认识和对客观世界的改造"],answer:"D",explanation:"马克思主义认为自由是对必然的认识 和对客观世界的改造。人不能摆脱必然性的 制约，只有在认识必然性的基础上才有自由 的活动，这就是人的自由限度，也是自由和 必然的辩证规律。自由是有条件的：一是认 识条件；二是实践条件。不具备这两方面的 条件，就得不到自由。D正确。"},
  {id:67,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"马克思主义哲学创立后，开始出现了",options:["A. 唯物论与唯心论的对立","B. 可知论与不可知论的对立","C. 辩证法与形而上学的对立","D. 唯物史观与唯心史观的对立"],answer:"D",explanation:"独立于人们对它的认识和评价。认识和评价 可以反映价值，但不能创造也不能消灭价值。 B 错误。实践的主体和客体相互作用的关 系，包括实践关系、认识关系和价值关系，其 中实践关系是最根本的关系。C 错误。客体 的存在、属性及作用是客观的。客体能否满 足主体需要，并不由人的主观愿望决定，而是 由客体客观存在的性质、属性等决定。 D 错误。"},
  {id:68,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"全球超过30亿人的生计依赖于海洋和沿海的生物多样性，超过16亿人依靠森林和非木材林产 品谋生。世界上50%以上的药物成分来源于天然动植物。然而，全球物种灭绝速度不断加快， 生物多样性丧失和生态系统退化对人类生存和发展构成重大风险。一个物种就是一个基因库。 如果物种基因还未开发就永远失去，损失无法估量。正是那几株在风中摇曳的青蒿，屠呦呦才 会发现青蒿素，为世界带来全新抗疟药；正是有了野生稻基因留存，袁隆平才培育出杂交水稻， 为中国人的口粮安全带来沉甸甸的保障，为世界粮食安全增添中国贡献。以上材料说明",options:["A. 自然地理环境是人类社会生存和发展永恒的、必要的条件","B. 人类的任何实践活动都会受到自然界的报复","C. 人们不当的实践方式正在改变自然界的客观实在性","D. 保护生态环境是人类其他一切活动的首要前提"],answer:"A",explanation:"A正确。人与自然可以和谐共生，B 错 误。人类的实践活动能够改变自然事物的形 态和面貌，在自然界打上人类的印记，使之成 为人化的自然，但不能改变自然界的客观实 在性。C 错误。物质生产活动及生产方式是 人类社会赖以存在和发展的基础，是人类其 他一切活动的首要前提。D 错误。"},
  {id:69,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"人类自古逐水而居，人类文明伴水而生。但江河来水变幻不定，水多生洪灾，水少成旱灾。早 期，人们在河流特定位置，零星修建水库，除水害、兴水利，但其功能单一。随着人们对水资 源价值认识的不断深入，水库建设逐步从单一功能开发发展为多目标综合开发，实现“一水多 用、 一库多效”。比如，三峡水库具备防洪、发电、航运、供水等综合功能，同时与长江干支流 水库群联合调度，实现效益倍增。人类对水资源价值的认识从单一走向综合，推动水库功能从 “除害兴利”发展为“一库多效”,这一历程表明",options:["A. 实践具有社会历史性，其内容和水平受到特定社会条件的制约","B. 自然地理环境是社会存在和发展的基础及决定力量","C. 价值评价属于知识性认识，其结果的正确与否取决于人对客体属性和规律的认识","D. 随着历史的发展，客体的潜在价值就会自动转变为现实的价值"],answer:"A",explanation:"实践具有社会历史性。实践的内容、 性质、范围、水平以及方式都受一定社会历史 条件的制约，随着一定社会历史条件的变化 而变化。早期人们的生产力水平和社会历史 条件都不可能允许人们利用水库去进行发电 等实践活动。A 正确。物质生产方式是社会 存在和发展的基础及决定力量。B 错误。人 类认识包括知识性认识与评价性认识两个方 面，其中评价性认识也就是价值评价。知识 性认识是人的主观反映客观的过程，认识结 果不以主体意志为转移。价值评价则要揭示 考研政治1000题 解析分册 · 和表达客体对于主体的意义。评价结果的正 确与否依赖于对客体状况和主体需要的认 识。能否作出正确判断，取决于人对客体和 主体的双重认识，这种认识不仅包括对客体 属性和规律的认识，也包括对主体的规定性 和需要等的认识。C 错误。价值关系的形成 依赖于主体的创造，使客体潜在的价值转化 为现实的价值。主客体之间的价值关系不是 一种自然的现成关系，而是主体在实践基础 上确立的与客体之间的一种创造性关系。D 错误。"},
  {id:70,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"在原始社会，人们只有朴素的公有观念，不知“私有”为何物。随着以生产资料私有制为基础的 生产方式的出现和原始社会的瓦解，私有观念以及与此相联系的思想意识才得以产生。这说明",options:["A. 社会意识变化和发展的根源总是深藏于经济事实当中","B. 社会意识的发展变化总是落后于社会存在","C. 社会意识对社会发展总是起着积极的促进作用","D. 社会意识总是消极被动地受制于社会存在"],answer:"A",explanation:"社会意识是具体的、历史的。随着社 会存在的发展，社会意识也相应地或早或迟 地变化和发展，但不管怎样变化和发展，其根 源总是深藏于经济事实当中。A正确。 社会存在决定社会意识，社会意识以理 论、观念、心理等形式反映社会存在。这是社 会意识对社会存在的依赖性。但社会意识并 非消极被动地受制于社会存在，它既依赖于 社会存在，又有其相对独立性。D 错误。社 会意识与社会存在发展具有不完全同步性和 不平衡性。某些经济水平相对落后的国家或 地区，其社会意识的某些方面却可以领先于 经济发达的国家或地区，B 错误。先进的社 会意识反映了社会发展的趋势和要求，对社 会发展起着积极的促进作用；落后的社会意 识不符合社会发展的趋势和要求，对社会发 展起着消极的阻碍作用。C 错误。"},
  {id:71,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"我国古代文论家刘勰在《文心雕龙》中就认识到“时运交移，质文代变”,这是基于朴素唯物 论的文艺观。今天，我们迎来一个伟大的变革时代。习近平指出：“一个时代有一个时代的文 艺，一个时代有一个时代的精神。”“古今中外，文艺无不遵循这样一条规律：因时而兴，乘势 而变，随时代而行，与时代同频共振。”我们的文艺工作者应正确认识文艺与时代的关系，在实 践中丰密和完善艺术理想，积极响应“为时代画像、为时代立传、为时代明德”的号召，拿出 更多艺术精品献给人民和这个伟大的时代。一个时代有一个时代的文艺，一个时代有一个时代 的精神，这说明社会意识对社会存在具有",options:["A. 相对独立性","B. 继承性","C. 不完全同步性","D. 依赖性"],answer:"D",explanation:"社会存在决定社会意识，社会意识以 理论、观念、心理等形式反映社会存在。材料 中的“文艺”“精神”都是“时代”的反映，“时 代”变了，“文艺”“精神”也会随之变化，这是 社会意识对社会存在的依赖性。D 正确。题 判定社会经济结构性质的客观依据。 D 干只强调了处在哪个时代(社会存在)就会有 哪个时代的文艺和精神(社会意识),并没有 涉及社会意识的相对独立性(不完全同步性、 继承性、反作用等)。A、B、C不符合题意。"},
  {id:72,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"炎炎夏日，却不见“汗滴禾下土”。在智慧农场内，农业机器人穿梭田间、巡检苗情，各类传感 器遍布其间，探测墒情、气象、病虫害等信息，并实时传输到后方的指挥中心。农田管理员坐 镇指挥中心，手持平板电脑这个“新农具”,远程操控着整个农场的运行。“犁地不用牛，种地 不跟楼，浇水不拿锨，喷药不进田，收麦不带镰，晒麦不用场，卖麦不用忙”的“新农谚”,成 为乡村新写照。平板电脑变成“新农具”启示我们，区分社会经济时代的客观依据是",options:["A. 生产工具的状况","B. 劳动者的素质","C. 劳动对象的广度和深度","D. 劳动产品的数量和质量"],answer:"A",explanation:"生产力是结构复杂的系统。其基本要 素包括劳动资料(其中最重要的是生产工 具)、劳动对象、劳动者。人们解决社会同自 然矛盾的实际能力如何，主要取决于生产工 具的质量和数量，生产工具是区分社会经济 时代的客观依据(物质标志)。A 正确。B、 C、D不符合题意。"},
  {id:73,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"科技创新是发展新质生产力的核心要素，能够极大拓展劳动对象的范围和类别，为加快形成新 质生产力开辟广阔空间。人工智能、量子科技、生物科技、元宇宙、脑机接口、大数据等新技 术的出现极大丰富了劳动对象的种类和形态，拓展了生产新边界，为生产力发展提供新动力。 比如，数据作为新型生产要素成为重要劳动对象，既直接创造社会价值，又通过与其他生产要 素的结合、融合进一步放大价值创造效应。劳动对象的范围和类别不断扩大说明",options:["A. 哪些客观事物能成为实践的客体完全取决于主体的意愿","B. 人类可以通过劳动不断创造新的物质资料并转化为劳动对象","C. 一切自然物质都是现实的劳动对象","D. 科学技术是生产力中最活跃的因素"],answer:"B",explanation:"一切自然物质都是可能的劳动对象， 其中引入生产过程的部分则是现实的劳动对 象。现实的劳动对象还包括生产深度加工的 对象。随着生产和科学技术的进步，劳动对 象将日益扩大并越来越显示出它的重要作 用。B正确，C 错误。客体的存在、属性及作 用是客观的。客体能否满足主体需要，并不 由人的主观愿望决定，而是由客体客观存在 的性质、属性等决定。哪些客观事物能成为 实践的客体，既取决于客观事物具有哪些可 被人类利用的性质，又取决于人的实践的水 平能否利用客观事物的这些性质。A 错误。 劳动者是生产力中最活跃的因素。D错误。"},
  {id:74,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"马克思指出：“为了进行生产，人们相互之间便发生一定的联系和关系；只有在这些社会联系和 社会关系的范围内，才会有他们对自然界的影响，才会有生产。”在生产关系中，区分不同生产 方式、判定社会经济结构性质的客观依据是",options:["A. 生产中人与人的关系","B. 产品分配关系","C. 阶级关系","D. 生产资料所有制关系"],answer:"D",explanation:"正确。 ·"},
  {id:75,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"习近平强调，发展新质生产力，必须进一步全面深化改革。要深化经济体制改革，着力打通束 缚新质生产力发展的堵点卡点，建立高标准市场体系，创新生产要素配置方式，让各类先进优 质生产要素向发展新质生产力顺畅流动。这一思想背后的哲学依据是",options:["A. 生产关系必须与生产力发展要求相适应","B. 经济基础的变更必然引起上层建筑的变革，并决定其变革的方向","C. 社会生产领域内形式对内容具有决定作用","D. 改革是社会发展的唯一动力"],answer:"A",explanation:"生产力与生产关系的相互关系是：生 产力决定生产关系，而生产关系又反作用于 生产力。生产关系必须与生产力发展要求相 适应。当生产关系不适合生产力发展的客观 要求时，就会阻碍生产力的发展。新质生产 力发展是动态的，这决定了生产关系也要与 时俱进完善发展。要围绕突破束缚新质生产 力发展的堵点卡点，进一步全面深化改革，完 善促进新质生产力发展的体制机制。 A 正确。 题干材料只涉及改革与新质生产力不相 适应的生产关系，没有谈到经济基础与上层 建筑的关系，B内容正确但不符合题意。内 容是事物存在的基础，对形式具有决定作用。 C错误。改革是推动社会发展的重要动力之 一，但不是唯一动力。D 错误。"},
  {id:76,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"在整个上层建筑中，政治上层建筑居于主导地位，政治上层建筑的核心是",options:["A. 国家政权","B. 政治法律思想","C. 道德、艺术","D. 政党"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:77,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"唯物史观视域中的“世界历史”是指各民族、国家通过普遍交往，打破孤立隔绝的状态，进 入 相互依存、相互联系的世界整体化的历史。世界历史形成和发展的基础是",options:["A. 生产方式的发展变革","B. 地理科学的逐渐完善","C. 意识形态的普遍认同","D. 信息技术的广泛应用"],answer:"A",explanation:"在生产关系中，生产资料所有制关系 是最基本的、具有决定意义的方面，它是人们 进行物质资料生产的前提，生产、分配、交换 和消费关系在很大程度上是由这一前提决定 的。生产资料所有制是区分不同生产方式、 生产方式的发展变革是世界历史形成 和发展的基础。普遍交往是世界历史的基本 特征。A正确。"},
  {id:78,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"人类通过实践活动在不断改造世界过程中推动社会发展和进步。社会的发展和进步集中表现为",options:["A. 社会形态的更替","B. 社会生产力的发展","C. 人类自身得到改造和发展","D. 人类对社会规律的认识和改造"],answer:"A",explanation:"人类通过实践活动在不断改造世界过 考研政治1000题 解析分册 · 程中推动社会发展和进步(集中表现为社会 形态的更替),与此同时，人类自身又不断得 到改造和发展，不断实现着人的发展，并最终 实现人类解放。A 正确，B、C不符合题意，D 本身说法错误(规律是无法被改造的)。"},
  {id:79,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"人的发展是一个社会历史过程，既包括人类整体的发展，也包括人类个体的发展。人的发展指 人的体力、智力、个性和交往能力等的发展，其中最根本的是",options:["A. 人的本质力量的对象化、现实化","B. 人类智慧和认知能力的发展","C. 人的自由程度的提高","D. 人的文明程度的提高"],answer:"C",explanation:"（本题解析见原书解析分册）"},
  {id:80,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"马克思指出，“社会形态发展是自然历史过程”,这是指",options:["A. 社会形态的发展与自然界的发展完全一样","B. 社会形态的发展也是自发的过程","C. 社会形态的发展是客观的、有规律的发展过程","D. 社会形态的发展与主体的活动无关"],answer:"C",explanation:"马克思的话强调社会形态的发展具有 客观规律性，这种规律也是一种物质运动的 规律(社会和自然界一样本质上是客观的物 质体系，其存在与发展的基础是每日每时都 必须进行的人与自然之间的物质变换活动), 如同自然界一样，不以人的意志为转移。人 们可以像自然科学研究自然界那样，以精确 的眼光研究人类社会及其发展。C 正确。社 会形态的更替是社会发展的必然性和人们的 历史选择性的统一，是合规律性和合目的性的 统一。人们的历史选择性，归根结底是人民群 众的选择性，A、B、D内容本身就是错误的。"},
  {id:81,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"社会形态更替的必然性，主要是指社会形态依次更替的过程和规律是客观的，其发展的基本趋势 是确定不移的。社会形态更替归根结底是社会基本矛盾运动的结果。其中具有最终决定意义的是",options:["A. 人民的意志和选择","B. 生产资料所有权的归属","C. 生产力的发展","D. 对本民族特点的把握程度"],answer:"C",explanation:"社会形态更替归根结底是社会基本矛 盾运动的结果。其中，生产力的发展具有最 终的决定意义。C 正确。"},
  {id:82,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"马克思认为，资本主义社会的产生有三条道路，即从封建制度的“衰亡”中产生；从奴隶制和 农奴制的“解体”中产生；从原始公有制的“崩溃”中产生。这体现了",options:["A. 社会形态更替的多样性","B. 社会形态跨越的随意性","C. 社会发展规律的主观性","D. 人类历史发展的曲折性"],answer:"A",explanation:"题干材料中，第一条道路是资本主义 社会产生的典型道路，第二条和第三条道路 是在特定的历史条件下形成的资本主义社会 产生的道路，体现了社会形态更替的多样性。 A正确。社会形态的跨越是有条件的，不是随 意的，B错误。规律，不管是自然规律还是社 会规律，都是客观的，C 错误。社会发展过程 的曲折性是指社会前进过程中所出现的反复、 停滞和倒退现象，D不符合题意。"},
  {id:83,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"一个时代有一个时代的文化，一个时代有一个时代的精神。在“中国国家版本馆首批网络数字 版本入藏仪式”上，电视剧《扫黑风暴》、小说《大国重工》、音乐《沪侬江南》等作品入藏。 版本，是记录历史、传承文明的“金种子”。从龟甲金石到竹简布帛，从雕版刻印到活字印刷， 从铅字排印到激光照排，从有形载体到虚拟载体，版本的迭代见证着文明的进步。中华文明的 传承，如同长江黄河一样奔腾不息。每一次新版本的诞生都为这条大江大河注入新的水源，赋 予它更加充沛的力量。以上材料说明",options:["A. 文化是推动社会发展的决定力量","B. 社会存在与社会意识具有完全同步性","C. 精神追求是人类其他一切活动的首要前提","D. 文明反映了人类社会实践活动的积极成果"],answer:"D",explanation:"文明是人类创造的所有物质成果、精 神成果和制度成果的总和，是标志社会进步 程度的范畴，反映了人类社会实践活动的积 极成果。D正确。文化是推动社会发展的重 要力量，物质资料的生产方式是社会发展的 决定力量。A 错误。社会意识与社会存在发 展具有不完全同步性和不平衡性。B 错误。 物质生产活动及生产方式是人类社会赖以存 在和发展的基础，是人类其他一切活动的首 要前提。C 错误。 88, 答 案 C 科学技术是生产力中的重要因素。科 学技术是先进生产力的集中体现和主要标 志，是第一生产力。C 正确。人们解决社会 同自然矛盾的实际能力如何，主要取决于生 产工具的质量和数量，生产工具是区分社会 经济时代的客观依据(物质标志)。D 错 误。物质资料的生产方式构成了人类社会存 在和发展的基础，集中体现着人类社会的物 质性。生产方式是社会历史发展的决定力 量。B 错误。历史是人民群众创造的，人民 群众是社会形态变革的决定力量。A错误。"},
  {id:84,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"冬枣一般在每年10月至11月份自然成熟，而在陕西省大荔县，冬枣最早在5月就已上市，变 成“夏枣”,其最高价格是正常成熟冬枣的30多倍。近几年，市场对冬枣的需求迅猛增长。为 破解冬枣供应期短的难题，科研团队持续攻关，突破了日光温室(温棚)栽培技术，解决了冬 枣提早成熟的难题，并形成了日光温室、钢架棉被棚、双膜冷棚和普通冷棚等栽培模式，冬 枣 的成熟供应期从10月提早到5月，由露地栽培的40天延长到6个月。此后，科研团队运用现 代科技手段发现了冬枣品质形成机制和成熟生理特征，为其优质高效生产奠定了基础。“冬枣变 夏枣”的成功说明",options:["A. 人们可以充分发挥主观能动性去改变现有的自然规律","B. 人们在正确认识客观事物运动发展规律性的基础上可以摆脱必然性的制约","C. 科学技术的发展标志着人类改造自然能力的增强","D. 主体的需要是真理与价值统一的基础"],answer:"C",explanation:"发展过程是有区别的。自然界的发展过程完 全是盲目的、不自觉的，根本无须人的参 与，而社会则离不开人。B 错误。人们行动 的目的是预期的，但在许多个人意志的冲突 中通过相互作用而实现的历史过程和结果， 却受着不以人的意志为转移的客观规律的支 配，所以社会发展并不总是符合人们的预 期。D 错误。"},
  {id:85,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"中秋节是中国传统节日，起源于上古时代，普及于汉代，定型于唐朝初年，盛行于宋朝以后。 在这一天，全球的华人华侨不论身在何处、生活在哪个国家地区，很多家庭都会聚在一起赏月、 吃月饼、庆祝这一古老节日。以上材料说明",options:["A. 建立在一定社会关系基础上的制度体制和风俗习惯是永恒不变的","B. 风俗习惯是社会存在的重要组成部分","C. 文化为社会发展提供凝聚力量","D. 文化在整个上层建筑中居于主导地位"],answer:"C",explanation:"文化是推动社会发展的重要力量，对 社会发展有着巨大的影响：文化为社会发展 提供思想指引；提供精神动力；提供凝聚力 量。C 正确。建立在一定社会关系基础上的 制度体制和风俗习惯，会因人们交往活动的 发展而得以变革和进步。A 错误。风俗习惯 属于社会意识的范畴，它是社会存在的反 映。B错误。在整个上层建筑中，政治上层建 筑居于主导地位，国家政权是政治上层建筑 的核心。D 错误。"},
  {id:86,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"恩格斯在《路德维希 · 费尔巴哈和德国古典哲学的终结》中明确指出，“在社会历史领域内进行 活动的，是具有意识的、经过思虑或凭激情行动的、追求某种目的的人；任何事情的发生都不 是没有自觉的意图，没有预期的目的的。”这说明",options:["A. 社会历史发展是人主观意志的结果","B. 社会发展的过程同自然界的发展过程是一样的","C. 历史是无数个追求着自己目的的人的活动的合力","D. 社会发展总是符合人们的预期的"],answer:"C",explanation:"C 正确。A是唯心史观的观点，不符合 题意。社会发展的自然历史过程同自然界的 考研政治1000题 解析分册 · 们的思想、行为是否符合社会发展规律，是否 符合人民群众的意愿。只有顺应历史发展的 要求和人民群众的意愿，历史人物才能起到 推动社会前进的积极作用。D错误。"},
  {id:87,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"“中华民族伟大复兴势不可挡!”习近平总书记在天安门城楼上的庄严宣示，是历史昭示的真 理，是团结奋进的强音。今天，在全面推进中国式现代化的新征程上，我们比历史上任何时期 都更接近、更有信心和能力实现中华民族伟大复兴的目标，同时必须准备付出更为艰巨、更为 艰苦的努力。推进中华民族伟大复兴历史进程，要求我们增强历史主动、发扬实干精神，这是 因为",options:["A. 每一个人都是历史的创造者","B. 人能够按照自己的需要去认识规律和改造规律","C. 历史规律只有通过人的有目的、有意识的活动才能实现","D. 人们在自己选定的条件下创造历史"],answer:"C",explanation:"自然规律通过盲目的、不自觉的力量 在起作用并实现出来。历史规律则不同。人 的活动是历史规律得以存在并发生作用的前 提、基础和途径，历史规律只有通过人的有目 的、有意识的活动才能实现。中华民族伟大 复兴势不可挡，但也必须通过人的实践奋斗 才能实现。C 正确。 规律是客观的，人们可以认识规律但不 能改造规律。B 错误。人民群众是历史的创 造者。就每一个人而言，他在一定意义上“创 造”了自己的“历史”,即通过自己的人生谱写 了自身个体的“历史”,但这并不能与创造社 会历史画等号。A 错误。马克思指出：“人们 自己创造自己的历史，但是他们并不是随心 所欲地创造，并不是在他们自己选定的条件 下创造，而是在直接碰到的、既定的、从过去 承继下来的条件下创造。”D 错误。 · 科学技术的发展标志着人类改造自然 能力的增强，意味着人们能够创造出更多的 物质财富，对社会发展有巨大的推动作用。C 正确。规律是事物变化发展过程中本身所固 有的内在的、本质的、必然的联系。规律是客 观的，人既不能创造也不可能改变规律。A 错误。必然性即规律性，指的是不依赖于人 的意识而存在的自然和社会发展所固有的客 观规律。人不能摆脱必然性的制约，只有在 认识必然性的基础上才有自由的活动，这就 是人的自由限度，也是自由和必然的辩证规 律。B 错误。实践是人的认识产生和发展的 基础，也是真理与价值统一的基础。D 错误。 点拨 关于“统一的基础”的提法：①实践 是客观规律性与主观能动性统一的基础。 ②实践是认识世界和改造世界统一的基础。 ③实践是真理与价值统一的基础。"},
  {id:88,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"恩格斯说过，恰巧拿破仑做了法国的军事独裁者，是因为当时的法国需要这样的人。假如没有 拿破仑这个人，那么就会有别人来扮演这个角色。这句话蕴含的哲学思想是",options:["A. 任何历史人物的出现都体现了必然性与偶然性的统一","B. 杰出人物的出现纯粹是偶然的","C. 社会历史发展是没有规律的","D. 历史人物都能起到推动社会前进的积极作用"],answer:"A",explanation:"任何历史人物的出现都体现了必然性 与偶然性的统一。时势造英雄，杰出人物是 适应时代的需要而产生的。每一时代一定会 出现自己的杰出人物，这是必然的；但杰出人 物在什么时间、什么地方，以什么方式出现， 由谁来担当杰出人物，则具有一定的偶然性。 A正确，B错误。 社会历史发展是有规律的(生产力与生 产关系矛盾运动的规律、经济基础与上层建 筑矛盾运动的规律是人类社会发展的基本规 律),C错误。历史人物的作用性质取决于他"},
  {id:89,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"唯物史观就是“关于现实的人及其历史发展的科学”。只有把人看作现实的人，才能正确把握人 的本质，把握人与社会历史的关系。人的本质是",options:["A. 从所有个体的人身上抽象出来的共同性","B. 单个人天生就具有的东西","C. 一切社会关系的总和","D. 人的自然属性和社会属性的综合"],answer:"C",explanation:"的本质属性是社会属性，而不是自然属性， 人的本质属性表现在各种社会关系中。这就 是说，人的本质不是单个人天生就具有的东 西，也不是从所有个体的人身上抽象出来的 共同性。现实的人总是处在特定的社会关系 和特定历史条件下的人。因此，要真正达到 对现实的人的认识，应该深入到现实的社会 关系中。因此，正确答案是C。"},
  {id:90,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"商品具有使用价值和价值两个因素或两种属性，是使用价值和价值的矛盾统一体。决定商品交 换的比例的，不是商品的使用价值、而是价值，这是因为",options:["A. 使用价值无法用量来衡量","B. 价值在质上是相同的","C. 使用价值和价值二者不可兼得","D. 价值是交换价值的物质承担者"],answer:"B",explanation:"价值是凝结在商品中的无差别的一般 人类劳动，即人的脑力和体力的耗费。使用 价值不同的商品之所以能按一定比例相交 换，就是因为它们都具有价值。商品的价值 在质上是相同的，因而可以相互比较。B 正 确。使用价值可以用量来衡量(比如一件商 品),劳动生产率越高，单位时间内生产的使 用价值的数量就越多。A 错误。C 本身内容 正确但与题意无关。价值是交换价值的基 础，使用价值是交换价值的物质承担者。D 错误。"},
  {id:91,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"资本主义制度下的社会财富表现为一种惊人的、庞大的商品堆积，单个的商品表现为它的元素 形式。以下说法正确的是",options:["A. 劳动是使用价值的唯一源泉","B. 不论财富的社会的形式如何，使用价值总是构成财富的物质的内容","C. 商品不一定是劳动产品","D. 具体劳动形成商品的价值"],answer:"B",explanation:"使用价值是指商品能满足人的某种需 要的有用性，反映的是人与自然之间的物质 关系，是商品的自然属性，是一切劳动产品所 共有的属性，离开了它商品就不复存在。使 用价值构成社会财富的物质内容。马克思指 出：“不论财富的社会的形式如何，使用价 值总是构成财富的物质的内容。”B正确。 劳动是使用价值的源泉之一，不是唯一 源泉，A错误。商品一定是劳动产品，C错误。 生产商品的具体劳动创造商品的使用价值， 抽象劳动形成商品的价值，D 错误。"},
  {id:92,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"马克思说：“一个物可以是使用价值而不是价值。在这个物并不是由于劳动而对人有用的情况下 就是这样。”这说明",options:["A. 价值和使用价值互为前提","B. 使用价值与价值不可兼得","C. 劳动产品一定是商品","D. 商品一定是劳动产品"],answer:"D",explanation:"（本题解析见原书解析分册）"},
  {id:93,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"“我们从小麦的滋味中尝不出种植小麦的人是俄国的农奴，法国的小农，还是英国的资本家。使 用价值虽然是社会需要的对象，因而处在社会联系之中，但是并不反映任何社会生产关系。”马 克思的这段话表明",options:["A. 商品的使用价值在质上是一样的","B. 商品的使用价值与具体劳动无关","C. 使用价值是历史范畴","D. 使用价值是商品的自然属性"],answer:"D",explanation:"使用价值是指商品能满足人的某种需 要的有用性，反映的是人与自然之间的物质 关系，是商品的自然属性。价值是商品所特 有的社会属性，商品的价值在本质上体现了 20"},
  {id:94,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"马克思说：“就使用价值说，有意义的只是商品中包含的劳动的质；就价值量说，有意义的只是 商品中包含的劳动的量，不过这种劳动已经转化为没有质的区别的人类劳动。”这里所说的“没 有质的区别的人类劳动”是指",options:["A. 抽象劳动","B. 具体劳动","C. 脑力劳动","D. 体力劳动"],answer:"A",explanation:"具体劳动是指生产一定使用价值的具 体形式的劳动，马克思也称之为有用劳动。 抽象劳动是指撇开一切具体形式的、无差别 的一般人类劳动，即人的脑力和体力的耗 费。题干中马克思所说的“没有质的区别的 人类劳动”是指抽象劳动，A正确。"},
  {id:95,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"马克思指出：“在同一时间内，劳动就一种属性来说必然创造价值，就另一种属性来说，必然 保存或转移价值。”这一段话说的是",options:["A. 体力劳动和脑力劳动及其作用","B. 具体劳动和抽象劳动及其作用","C. 私人劳动和抽象劳动及其作用","D. 个别劳动和社会必要劳动及其作用"],answer:"B",explanation:"（本题解析见原书解析分册）"},
  {id:96,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"马克思指出：“如果物没有用，那么其中包含的劳动也就没有用，不能算作劳动，因此不形成 价值。”这段话说明",options:["A. 价值的存在以物的有用性为前提","B. 价值的存在与物的有用性互为前提","C. 物只要有用就有价值","D. 物越是有用就越有价值"],answer:"A",explanation:"作为商品，必须同时具有使用价值和 价值两个因素或两种属性。一种物品如果 没有使用价值，即使人们为它付出了大量的 劳动，也没有价值；一种物品尽管具有使用 价值(有用),但如果不是劳动产品，也没有 价值(因此，不能说物越是有用就越有价 值)。有价值的一定有使用价值(商品的价"},
  {id:97,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"马克思说：“一切商品对它们的所有者是非使用价值，对它们的非所有者是使用价值。”也就是 说，商品的使用价值和价值不可兼得。“不可兼得”的意思是说",options:["A. 要获得商品的价值，就必须放弃商品的使用价值，反之亦然","B. 使用价值和价值没有统一性","C. 没有使用价值就没有价值","D. 价值寓于使用价值之中"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:98,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"任何一种生产商品的劳动，一方面是特殊的具体劳动，另一方面又是一般的抽象劳动，这就是 劳动的二重性。在资本主义生产过程中，工人的劳动作为具体劳动，它",options:["A. 创造商品的价值","B. 转移劳动力自身的价值","C. 新创造劳动力自身的价值","D. 转移生产资料的价值"],answer:"D",explanation:"具体劳动创造商品的使用价值，转 移生产资料的价值。A 错误，D 正确。劳动 力自身的价值不是由具体劳动转移的，也不 是由具体劳动新创造的，而是由抽象劳动新 创造的，劳动力新创造的价值大于劳动力自 身的价值。B、C 错误。"},
  {id:99,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"在商品交换过程中，生产商品使用价值的具体劳动是不能直接进行量的比较的，只有将具体劳 动还原为抽象劳动，也就是从具体劳动中抽象出无差别的一般人类劳动，才能进行量的比较。 具体劳动能否还原为抽象劳动，在根本上取决于",options:["A. 必要劳动和剩余劳动能否实现统一","B. 简单劳动和复杂劳动能否实现统一","C. 私人劳动和社会劳动能否实现统一","D. 体力劳动和脑力劳动能否实现统一"],answer:"C",explanation:"经济其他一切矛盾的基础。具体劳动能否 还原为抽象劳动，在根本上取决于私人劳 动和社会劳动能否实现统一。商品生产者 解析分册 · 的私人劳动生产的产品如果与社会的需求 不相适应，这种私人劳动就不会被承认为社 会劳动，它作为具体劳动的有用性质也就不 会为社会所承认，因而不能还原为抽象劳 动，这意味着商品的价值无法实现，商品的 使用价值和价值之间的矛盾没有得到解决。 C正确，A、B、D不符合题意。"},
  {id:100,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"商品是劳动产品，生产商品的劳动具有二重性，即具体劳动和抽象劳动。具体劳动和抽象劳动 是对立统一的关系，二者的区别体现在",options:["A. 具体劳动和抽象劳动是各自独立存在的两种劳动","B. 具体劳动反映人与自然的关系，抽象劳动反映商品生产者的社会关系","C. 具体劳动和抽象劳动必须在空间上并存、时间上继起","D. 具体劳动创造商品的质，抽象劳动形成商品的量"],answer:"B",explanation:"具体劳动和抽象劳动是对立统一的 关系。一方面，具体劳动和抽象劳动不是各 自独立存在的两种劳动或两次劳动，它们在 时间上和空间上是统一的，是商品生产者的 同一劳动过程不可分割的两个方面；另一方 面，具体劳动与抽象劳动又分别反映劳动的 不同属性，具体劳动所反映的是人与自然的 关系，是劳动的自然属性，而抽象劳动所反 映的是商品生产者的社会关系，是劳动的社 会属性。B正确，A、C 错误。生产商品的具 体劳动创造商品的使用价值，抽象劳动形成 商品的价值。D 错误。"},
  {id:101,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"生产商品所需要的社会必要劳动时间随着劳动生产率的变化而变化。劳动生产率是指",options:["A. 劳动者的劳动强度","B. 劳动者生产使用价值的效率","C. 劳动者生产剩余价值的效率","D. 劳动在整个生产中所占的比例"],answer:"B",explanation:"商品的价值量与生产商品所耗费的 社会必要劳动时间成正比，与劳动生产率成 反比。劳动生产率指的是劳动者生产使用 价值的效率，它的高低可以用单位劳动时间 内生产的商品数量来测量，也可以用单位商 品中所耗费的劳动时间来测量。B 正确。"},
  {id:102,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"在其他条件不变的情况下，随着社会劳动生产率提高而提高的是",options:["A. 单个商品的价值量","B. 单位时间的价值量","C. 单位时间生产的商品数量","D. 单个商品的社会必要劳动时间"],answer:"C",explanation:"劳动生产率是生产使用价值的效 率，所以劳动生产率提高意味着单位时间 内生产更多的商品，C 正确。无论劳动生 产率怎么变化，单位时间内生产的价值(总) 量不变，B 错误。在其他条件不变的情况 下，提高社会劳动生产率会导致单个商品的 价值量降低，也就是说单个商品的社会必要 劳动时间减少，A、D 错误。"},
  {id:103,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"马克思在《资本论》中指出：“不管生产力发生了什么变化，同一劳动在同样的时间内提供的 价值量总是相同的。但它在同样的时间内提供的使用价值量会是不同的：生产力提高时就多 些 ，生产力降低时就少些。”这表明，提高劳动生产率会使单位时间内生产的商品数量和个别 商品的价值量发生变化，即",options:["A. 商品数量增加，个别商品的价值量增大","B. 商品数量增加，单位时间内生产的总价值量增大","C. 商品数量增加，个别商品的价值量不变","D. 商品数量增加，个别商品的价值量减少"],answer:"D",explanation:"D正确。生产商品所需要的社会必 要劳动时间随着劳动生产率的变化而变化。 商品的价值量与生产商品所耗费的社会必 要劳动时间成正比，与劳动生产率成反比。 提高劳动生产率会使单位时间内生产的商 品数量增加，个别商品的价值量减少，但单 位时间内生产的总价值量不变。 A、B、C 错误。"},
  {id:104,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"俗话说：“一分钱一分货”,但是在实际的商品交换过程中，既有“一分钱二分货”的现象， 也有“一分钱半分货”的现象。这说明",options:["A. 价格并不反映价值","B. 价格的变化都是价值变化的表现","C. 价格围绕商品的价值自发波动","D. 供求关系变动决定商品的价值量"],answer:"C",explanation:"（本题解析见原书解析分册）"},
  {id:105,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"近年来，数字货币的概念越来越火热，引起了人们对货币本质的新一轮讨论。有专家指出，随 着经济的发展和技术的进步，货币在发展过程中被不同的价值符号所代表，从金属货币、纸 币、电子货币到数字货币不断转变。每种不同的货币形式代表了人们不同的信任形式。马克思 主义认为，货币是",options:["A. 能够带来剩余价值的价值","B. 资本的唯一物质形态","C. 商品特有的社会属性","D. 固定充当一般等价物的商品"],answer:"D",explanation:"随着货币的产生，整个商品世界分化为两 极：一极是各种各样的具体商品，分别代表 不同的使用价值；另一极是货币，只代表商 品的价值。这样就使商品内在的使用价值 和价值的矛盾发展起来，转化为商品和货币 的外在矛盾。B 错误。C 不符合题意。 货币是在长期交换过程中形成的固 定充当一般等价物的商品。D 正确。资本 是能够带来剩余价值的价值。A 错误。资 本在运动过程中，采取货币、生产资料、商品 等物质形态。B 错误。价值是商品特有的 社会属性。C 错误。"},
  {id:106,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"充当贮藏手段的货币",options:["A. 必须是现实的货币","B. 可以是观念上的货币","C. 必须是足值的金属货币","D. 必须是现实的货币，但不一定是足值的货币"],answer:"C",explanation:"货币作为贮藏手段，必须是足值的金 属货币或金属条块，C 正确。A、D 符合流通 手段，B 符合价值尺度，这三项都与题意 不符。"},
  {id:107,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"消费者的下列经济行为中，属于货币执行价值尺度职能的是",options:["A. 缴纳房屋契税9000元","B. 购买商品房，合同约定房价30万元","C. 在装饰材料市场现购材料5万元","D. 按购房合同约定，第二年付房款10万元"],answer:"B",explanation:"是单位时间内的价值量，正如题干中马克 思这句话所讲，不论劳动生产率怎样变 化，同 一 劳动在同 一 时间内生产的价值量 是不变的，因为商品价值的量是按劳动时 间来计量的，既然单位时间是固定的，那 么 , 单 位 时 间 内 的 价 值 量 也 就 是 固 定 的 了。如果题干问的是单个商品的价值量，则 与劳动生产率成反比， 因为单位时间内生产 的商品数量增加了，而单位时间内的价值量 不变，所以，单个商品的价值量就减少了。 · 货币执行价值尺度职能，就是以货 币作为尺度来衡量和表现一切商品价值的 职能，B 为正确答案。A、D 是货币执行支 付手段职能，即指货币在清偿债务或延期支 付时执行的职能。C 是执行流通手段职能 (注意是现购)。通俗地讲，一手交钱、一手 交货就是流通手段，二者分离(比如本题中 D的延期支付)就是支付手段。"},
  {id:108,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"商品的使用价值和价值的矛盾、生产商品的具体劳动和抽象劳动的矛盾，根源于",options:["A. 生产社会化和生产资料资本主义私人占有之间的矛盾","B. 商品和货币的矛盾","C. 简单劳动和复杂劳动的矛盾","D. 私人劳动和社会劳动的矛盾"],answer:"D",explanation:"商品的使用价值和价值的矛盾、生产 商品的具体劳动和抽象劳动的矛盾，根源于 私人劳动和社会劳动的矛盾。D 正确。私 有制商品经济条件下，私人劳动和社会劳动 之间的矛盾是商品经济的基本矛盾。在资 本主义制度下，这种矛盾进一步发展成资本 主义的基本矛盾，即生产社会化和生产资料 C正确。价格是价值的货币表现， A错误。价格的变化并不都是价值变化的表 现，价值不变的情况下，受供求关系变动影 响，价格也会变化，B错误。商品的价值量由 生产商品的社会必要劳动时间决定，D错误。 点拨 供求关系只是影响商品的价格，不 能决定商品的价值。 资本主义私人占有之间的矛盾。A 错误。"},
  {id:109,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"在以私有制为基础的商品经济中，商品生产者的劳动具有两重性：既是具有社会性质的社会劳 动，又是具有私人性质的私人劳动。商品生产者的劳动的社会性质是由",options:["A. 生产者的阶级地位决定的","B. 社会分工决定的","C. 生产资料所有制决定的","D. 国家法律制度规定的"],answer:"B",explanation:"（本题解析见原书解析分册）"},
  {id:110,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"经济学关于价值的理论，除了马克思的劳动价值论，还有其他几种典型的价值理论，其中就包 括要素价值论。要素价值论认为商品的价值是由各种生产要素共同创造的，土地创造地租，劳 动创造工资，资本创造利润或利息。这种价值论试图用价值分配来解释价值创造，混淆了",options:["A. 价值形成的源泉和价值形成的条件之间的关系","B. 利润和平均利润之间的关系","C. 私人劳动和社会劳动之间的关系","D. 资本技术构成和资本价值构成之间的关系"],answer:"A",explanation:"生产物质资料的劳动过程包括三个 基本要素，即劳动者的劳动、劳动对象和劳 动资料。虽然劳动不是使用价值的唯一源 泉，但是劳动是价值的唯一源泉。要素价值 论混淆了价值形成的源泉和价值形成的条件 之间的关系。A 正确。B、C、D不符合题意。"},
  {id:111,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"在资本主义条件下，劳动是否是生产性的，取决于",options:["A. 劳动是生产物质产品还是提供服务","B. 劳动能否为资本家带来剩余价值","C. 具体劳动能否还原为抽象劳动","D. 劳动力是否为社会生产发展所绝对需要"],answer:"B",explanation:"在资本主义条件下，劳动是否是生产 性的，并不取决于劳动是生产物质产品还是 提供服务，而取决于劳动能否为资本家带来 剩余价值，只有创造剩余价值的劳动才是生 产性劳动。B 正确。"},
  {id:112,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"商品经济是以交换为目的而进行生产的经济形式，它是一定社会历史条件的产物。以私有制为 基础的商品经济的基本矛盾是",options:["A. 生产社会化和生产资料资本主义私人占有之间的矛盾","B. 私人劳动和社会劳动的矛盾","C. 无产阶级和资产阶级的矛盾","D. 商品使用价值和价值之间的矛盾"],answer:"B",explanation:"私人劳动和社会劳动的矛盾构成私 有制基础上商品经济的基本矛盾。B 正确。 在资本主义制度下，这种矛盾进一步发展 成资本主义的基本矛盾，即生产社会化和 生产资料资本主义私人占有之间的矛盾。 资本主义基本矛盾表现在阶级关系上，是 无产阶级和资产阶级的对立。A、C、D不符 合题意。"},
  {id:113,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"商品经济的发展经历了简单商品经济与发达商品经济两个阶段，资本主义商品经济是商品经济 的高级或发达形态。简单商品生产发展到资本主义商品生产的新阶段的标志是",options:["A. 货币的产生和存在","B. 机器大工业代替工场手工业","C. 劳动力成为商品","D. 社会生产划分为两大部类"],answer:"C",explanation:"劳动力成为商品，标志着简单商品生 产发展到资本主义商品生产的新阶段。在这 一阶段，资本家与工人的关系，形式上是“自 由”“平等”的买卖关系，而实质上是资本家 支配和剥削工人的雇佣劳动关系。C正确。"},
  {id:114,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"资本主又的生产过程具有二重杵，其 中 .作为盔本主又生产过程的主要方面的是",options:["A. 价值增殖过程","B. 补筐劳动力的价值形成过程 C 资本家国督下的努动过程 D 创遭出演足人们某种霞要的使用价值的过程"],answer:"A",explanation:"资本主义生产过程是劳动过程和价 值增殖过程的统一。价值增殖过程是剩余 价值的生产过程，这是资本主义生产过程 的主要方面。所谓价值增殖过程，是超过劳 动力价值的补偿这个一定点而延长了的价 值形成过程。A正确。 24"},
  {id:115,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"在资本主又生产过程中，劳助力的价值是居助于",options:["A. 具体劳动转移到新产品中 B 呜食劳动禁移到筋产品中","C. 具体劳动再生产出来而理殖","D. 独食芳动再生产出来而瑁殖"],answer:"D",explanation:"（本题解析见原书解析分册）"},
  {id:116,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"与其他商品相比，劳动力酶品价值的决定的一个重要特点是",options:["A. 由生产它所需要的杜会必要劳动时何决定","B. 可以还原力劳动者维持自已及其家属生存所必罱的生适资科的价值","C. 由劳动力市场的供求关系决定","D. 劳动力价值的构成但含历史和道德的因素"],answer:"D",explanation:"劳动力是特殊的商品，它的价值和使 用价值具有不同于普通商品的特点。由于 劳动力价值的构成包含历史和道德的因素， 在不同的国家或在同一国家的不同历史时 期，劳动者所必需的生活资料的数量和构成 是有区别的，所以劳动力价值的最低界限是 由生活上不可缺少的生活资料的价值决定 的。D正确。 A是所有商品的共同点，不符合题意。 劳动力商品的价值包括维持劳动者本人和 家属生存所必需的生活资料的价值及劳动 者接受教育和训练所支出的费用三个部分， B不准确。认为商品的价值由供求关系决 定是供求价值论的观点，这实际上混淆了价 值源泉和影响价格的因素这两个问题。供 求价值论无法解释在供求相等时商品的价 本家只能通过购买劳动力的方式，将出卖了 劳动力的劳动者与生产资料结合在一起进 行生产并取得剩余价值。C 正确。"},
  {id:117,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"在不同的国家或在同—国家的不同历史时期，劳动力价值的最低翼限是有区别的。一旦劳动力价 值降低到这个最低界履以下，劳动力就只能在蔓馆的状态下维书。劳动力价值的最低界限是由",options:["A. 资本家上观的剥削意愿决定的","B. 劳助者的最征劳动强度决定的","C. 资本循环中能事维持生产的不变资本的价值决定的","D. 生活上不可缺少的生活资料的价值决定的"],answer:"D",explanation:"由于劳动力价值的构成包含历史和 道德的因素，在不同的国家或在同一国家的 不同历史时期，劳动者所必需的生活资料的 数量和构成是有区别的，所以劳动力价值的 最低界限是由生活上不可缺少的生活资料 的价值决定的。一旦劳动力价值降低到这 个界限以下，劳动力就只能在萎缩的状态下 维持。D 正确。"},
  {id:118,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"资本主义生产过程不仅是生产使用价值的劳动过程，同时是生产剌余价值的价值增殖过程。价 值增殖过程是剩余价值的生产过程，这是资本主义生产过程的主要方面。所谓价值增殖过程 . 是超过了一定点而廷长了的价值形成过程，这里的“一定点”指的是雇佣工人",options:["A. 转移生产资料价值的时间","B. 转移劳动力价值的时间","C. 创造使用价值的时间","D. 再生产自己劳动力价值的时间"],answer:"D",explanation:"资本主义生产过程不仅是生产使用 价值的劳动过程，同时是生产剩余价值的价 值增殖过程。在价值增殖过程中，雇佣工 人的劳动时间分为两部分：一部分是必要 劳动时间，用于再生产劳动力的价值；另一 部分是剩余劳动时间，用于无偿地为资本家 生产剩余价值。雇佣工人的劳动超过了用 于再生产自己劳动力价值的时间(必要劳 动时间)这个一定点的时间，都是生产剩 余价值的时间(剩余劳动时间)。剩余价 值是雇佣工人所创造的并被资本家无偿占 有的超过劳动力价值的那部分价值。D 正 确，A、C 错误。生产资料的价值是通过具体 劳动转移到新商品中去的，而劳动力的价值 是由工人的劳动再生产出来的，B错误。"},
  {id:119,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"资本在资本主义生产过程中采取生产资料和劳动力两种形态。马克思将资本划分为不变资本与 可变资本的根据是",options:["A. 资本不同部分在剩余价值生产中的不同作用","B. 资本不同部分在周转中的不同方式","C. 资本在循环中的不同职能","D. 资本不同部分的物质形态是否改变"],answer:"A",explanation:"· 生产资本的组成部分，可以有两种划 分：根据资本在剩余价值生产中所起的不同 在资本主义商品生产条件下，单个资 本家改进技术、改善管理的主观动机是追 求超额剩余价值，但其客观后果则是整个 社会各个生产部门的劳动生产率普遍提 高，导致生活资料的价值下降和补偿劳动 力价值的必要劳动时间缩短，而剩余劳动 时间相对延长，整个资本家阶级普遍获得 更多的相对剩余价值。A 正确，B、D 错误。 在资本主义生产过程中，资本有机构成的 提高是一般趋势，这是由资本的本性决定 的。C 错误。 作用，可以将资本划分为不变资本与可变 资本；根据周转方式或价值转移方式的不 同，可以将资本划分为固定资本与流动资 本。产业资本在它的循环过程中，采取了三 种不同的职能形式：货币资本、生产资本和 商品资本。资本由于投入不同的部门形成 了产业资本等不同形式。A 正确，B、C不符 合题意。虽然以生产资料形式存在的资本 在生产过程中转变了自己的物质形态(比如 面粉厂用小麦作为生产资料进行加工之后 小麦变成了面粉),但这不是划分不变资本 和可变资本的依据。这里的“变”与“不变” 指的是资本的价值是否发生了变化(增殖)。 D不符合题意。"},
  {id:120,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"某资本家经营的企业通过改进技术、提高劳动生产率，使其生产商品花费的劳动时间比社会必 要劳动时间少10%,由此形成商品个别价值低于社会价值的那部分是",options:["A. 超额剩余价值","B. 绝对剩余价值","C. 相对剩余价值","D. 剩余价值"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:121,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"马克思在谈到资本主义生产方式时指出：“生产剩余价值或赚钱，是这个生产方式的绝对规 律。”生产剩余价值有两种基本方法：绝对剩余价值生产和相对剩余价值生产。资本家普遍获 得相对剩余价值是",options:["A. 各个资本家普遍延长雇佣工人工作日的结果","B. 各个资本家普遍提高雇佣工人劳动强度的结果","C. 各个资本家追求超额剩余价值的结果","D. 个别企业提高劳动生产率的结果"],answer:"C",explanation:"在资本主义商品生产条件下，每个资 本家总是力图不断改进技术，改善经营管 理，提高劳动生产率，使其生产的商品的个 别价值低于社会价值，从而获得超额剩余价 值。这个过程的客观后果则是整个社会各 个生产部门的劳动生产率普遍提高，导致 生活资料的价值下降和补偿劳动力价值的 必要劳动时间缩短，剩余劳动时间相对延 长，整个资本家阶级普遍获得更多的相对剩 余价值。C 正确。A、B、D不符合题意。"},
  {id:122,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"资本家为了进一步扩大和加强对工人的剥削和统治，不断地利用无偿占有的工人创造的剩余价 值来扩大自己的资本规模，这就是资本积累的本质。马克思关于资本积累的学说认为，资本积 累的源泉是",options:["A. 资本积聚和资本集中","B. 工人创造的剩余价值","C. 用暴力手段掠夺货币财富","D. 资本主义扩大再生产"],answer:"B",explanation:"超额剩余价值是指企业由于提高劳"},
  {id:123,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"资本的价值构成是指",options:["A. 固定资本与流动资本这两部分资本价值之间的比例","B. 货币资本与生产资本之间的比例","C. 劳动力和劳动对象之间的比例","D. 不变资本和可变资本这两部分资本价值之间的比例"],answer:"D",explanation:"从价值形式上看，资本可分为不变资 本和可变资本，这两部分资本价值之间的比 例，叫作资本的价值构成。D 正确。固定资 本和流动资本的构成会影响资本周转的快 慢；货币资本、生产资本、商品资本是资本循 环三个不同阶段中资本依次执行的三种不 同职能。A、B不符合题意。由生产的技术 水平所决定的生产资料和劳动力之间的比 27 考研政治1 000题>>解析分册 · 例，叫作资本的技术构成。生产资料包括劳 动资料和劳动对象。C内容错误。"},
  {id:124,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"在其他条件不变的情况下，以下选项中会提高资本有机构成的是",options:["A. 生产所用的原材料价格上涨","B. 自动化程度提高导致的裁员","C. 劳动者接受教育和训练所支出的费用增加","D. 为追求更多利润而增加工人的劳动时间"],answer:"B",explanation:"原材料价格上涨并没有改变资本技 术构成，变化的只是资本价值构成。A 错 误。自动化程度提高是一种技术改进，裁员 意味着可变资本部分(w)减少，资本有机构 成(c:v) 相应提高。B 正确。劳动者接受 教育和训练所支出的费用是构成劳动力商 品的价值的三部分之一，其增长意味着可变 资本部分(v)增加，则(c:v) 减少(而且也不 是资本技术构成变化引起的)。C 错误。增 加工人劳动时间与资本有机构成变化无关。 D错误。"},
  {id:125,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"产业资本划分为货币资本、生产资本、商品资本的依据是资本各个部分",options:["A. 在价值增殖过程中的作用不同","B. 价值周转的方式不同","C. 存在的物质形态不同","D. 在循环中执行的职能不同"],answer:"D",explanation:"产业资本从不同的角度可以作不同 的划分：依据它在资本循环过程中的不同阶 段所担负的职能的不同，划分为货币资本、 生产资本和商品资本。D 正确。"},
  {id:126,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"产业资本在资本循环过程中要在不同阶段依次执行不同的职能。其中执行货币资本职能的是",options:["A. 贮藏阶段","B. 生产阶段","C. 购买阶段","D. 售卖阶段"],answer:"C",explanation:"产业资本在循环过程中要经历三个 不同阶段。第一个阶段是购买阶段，产业资 本执行的是货币资本的职能；第二个阶段是 生产阶段，产业资本执行的是生产资本的职 能；第三个阶段是售卖阶段，产业资本执行 的是商品资本的职能。C 正确。"},
  {id:127,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"在英国，从14世纪末到18世纪中叶这段时期，政府曾经颁布过各种劳工法令，强迫工人延长 工作日。在18世纪后期至19世纪上半叶，资本家依然强迫工人每日劳动12、14、16个小时， 有的时候甚至达到18个小时以上。通过这种方式资本家获得的是",options:["A. 超额剩余价值","B. 相对剩余价值","C. 绝对剩余价值","D. 垄断剩余价值"],answer:"C",explanation:"绝对剩余价值是指在必要劳动时间 不变的条件下，由于延长工作日的长度而 生产的剩余价值。提高劳动强度，让工人在 同样长的劳动时间内消耗更多的脑力和体 力，这与延长工作日并没有本质区别。C 正 确。相对剩余价值是指在工作日长度不变 的条件下，通过缩短必要劳动时间而相对延 长剩余劳动时间生产的剩余价值。超额剩 余价值是指企业由于提高劳动生产率而使 商品的个别价值低于社会价值的差额。A、 B不符合题意，D错误。"},
  {id:128,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"某资本家经营的企业原工作时间为每天8小时，其中必要劳动时间为4小时，剩余劳动时间也 为4小时。如果分别采用绝对剩余价值生产方法和相对剩余价值生产方法，使剩余劳动时间各 延长2小时，则它们的剩余价值率分别应为",options:["A. 150%;200%","B. 200%;300%","C. 150%;300%","D. 125%;200%"],answer:"C",explanation:"资本家对工人的剥削程度，可以用剩 余价值率表示：m'=m/v(m 代表剩余价值， ①代表可变资本)。剩余价值率还可以表示 为：m'= 剩余劳动/必要劳动=剩余劳动时 间/必要劳动时间。如果采用绝对剩余价值 生产方法，则必要劳动时间依然为4小时， 剩余劳动时间增加到6小时，总的工作时间 延长为每天10小时，其剩余价值率是6÷ 4×100%=150%。如果采用相对剩余价值 生产方法，则工作日时间不变依然为8小 时，剩余劳动时间延长为6小时，必要劳动 时间缩短到2小时，其剩余价值率是6÷2× 100%=300 %。C 正确。"},
  {id:129,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"某资本家投资100万元，其预付资本的有机构成是3:1,每次投资的剩余价值率为200%,该 资本家每次投资的利润为",options:["A. 20万元","B. 25 万元","C. 50 万元","D. 75万元"],answer:"C",explanation:"精讲P70 考点71 -3 某资本家投资100万元，其中既包括 不变资本(c) 也包括可变资本(w),即 c+v= 100万元。其预付资本的有机构成是3:1, 即 c:v=3:1, 已知c+v=100 万元，则不变 资本c 为75万元，可变资本v 为25万元。 该资本家每次投资的剩余价值率为200%, 即 m/v=200%, 则每次投资的剩余价值 m 为50万元。利润与剩余价值在量上是一样 的，故该资本家每次投资的利润为50万元。 C正确。"},
  {id:130,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"某资本家投资100万元，每次投资的剩余价值率为150%,每次投资的利润为30万元，该资本 家预付资本的有机构成是",options:["A. 3:1","B. 4:1","C. 5÷1","D. 2:1"],answer:"B",explanation:"是再生产过程，只有C 、D 两项用了“再生 产”三个字，这就可以缩小选择范围。 · 某资本家投资100万元，每次投资的 利润为30万元，利润与剩余价值在量上是 一样的，故该资本家每次投资的剩余价值 m为30万元。每次投资的剩余价值率m'为 150%,剩余价值率是剩余价值m 与可变资 本v 之比，即m'=m/v, 则可变资本v 为20 万元。其预付资本为100万元，则不变资本 c为80万元，资本有机构成是不变资本与可 变资本之比，故该资本家预付资本的有机构 成是c:v=4:1 。B 正确。"},
  {id:131,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"资本家瓜分到剩余价值后，如果将其完全用于个人消费，则生产就在原有规模的基础上重复进 行，这叫资本主义简单再生产。资本主义简单再生产，就其实质而言，是",options:["A. 劳动过程和价值形成过程的统一","B. 劳动过程和价值增殖过程的统一","C. 物质资料再生产与资本主义生产关系再生产的统一","D. 再生产物质资料价值与转移劳动力价值的统一"],answer:"C",explanation:"（本题解析见原书解析分册）"},
  {id:132,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"社会生产是连续不断地进行的，这种连续不断重复的生产就是再生产。社会再生产的核心问题是",options:["A. 两大部类在总量上的比例问题","B. 社会总产品的价值补偿和实物补偿问题","C. 工资与剩余价值的分配问题","D. 劳动过程和价值增殖过程的统一问题"],answer:"B",explanation:"精 讲P 7 考点71 -3 社会再生产的核心问题是社会总产 品的实现问题，即社会总产品的价值补偿和 实物补偿问题。B 正确。"},
  {id:133,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"随着资本主义大工业的出现和发展，价值规律的实现形式也发生了变化，商品不再以价值而是 以生产价格为基础进行交换。作为商品价值的转化形式，生产价格是",options:["A. 生产成本与平均利润之和","B. 生产中实际耗费的不变资本和可变资本之和","C. 商品价值与劳动力成本之和","D. 所用资本与所费资本之和"],answer:"A",explanation:"随着利润转化为平均利润，商品价值 · 就转化为生产价格。生产价格是商品价值 的转化形式，是生产成本( c+v) 与平均利 润之和。生产成本是由生产中实际耗费的 不变资本和可变资本所构成的。A 正确，B、 C、D错误。"},
  {id:134,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"在资本主义社会里，资本家雇佣工人进行劳动并支付相应的工资。资本主义工资的本质是",options:["A. 工人全部劳动的报酬","B. 劳动力的价值或价格","C. 资本家预付的不变资本的一部分","D. 工人所创造的剩余价值的一部分"],answer:"B",explanation:"在资本主义制度下，工人的工资是劳 动力的价值或价格，这是资本主义工资的本 质。B 正确。从数量上讲，资本主义工资支 付的仅仅是工人在必要劳动时间内创造的 价值量(劳动力商品的价值),而剩余劳动时 间内创造的剩余价值是被资本家无偿占有 的。A、D 错误。不变资本是以生产资料形 态存在的资本。可变资本是用来购买劳动 力的那部分资本。C 错误。"},
  {id:135,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"资本主义制度下的工资之所以掩盖了资本主义剥削关系，是因为",options:["A. 工资表现为“劳动的价格”","B. 工资表现为劳动力的价值","C. 工资模糊了个别劳动时间和社会必要劳动时间的界限","D. 工资的价值只计算了转移到新产品中去的那一部分"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:136,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"资本主义经济危机爆发的根本原因是资本主义的基本矛盾。经济危机的抽象的一般的可能性首 先是由",options:["A. 社会的绝对的消费能力引起的","B. 货币作为流通手段和支付手段引起的","C. 商品价格和价值之间量的不一致引起的","D. 社会总产品两大部类比例失衡引起的"],answer:"B",explanation:")经济危机的抽象的一般的可能性， 首先是由货币作为流通手段和支付手段引 起的。以货币为媒介的商品买卖在时间上 分为两个相互独立的行为。如果有一些商 品生产者在出卖了自己的商品后不接着购 买他人生产的商品，就会有另一些商品生产 者的商品卖不出去。但是，这仅仅是危机在 形式上的可能性。资本主义经济危机爆发 的根本原因是资本主义的基本矛盾。 B 正确。"},
  {id:137,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"2025年10月，美国联邦政府时隔近7年再度“停摆”。随着联邦政府“停摆”持续，其对美 国社会的影响已从政府系统蔓延至民众日常生活，多项公共服务陷入停滞，弱势群体首当其 冲。在发达资本主义的美国出现的种种社会问题，从一个侧面反映了资本主义固有的、内在的 基本矛盾，即",options:["A. 生产社会化和生产资料资本主义私人占有之间的矛盾","B. 无产阶级与资产阶级之间的矛盾","C. 个别企业内部生产的有组织性和整个社会生产的无政府状态之间的矛盾","D. 生产无限扩大的趋势与劳动人民有支付能力的需求相对缩小的矛盾"],answer:"A",explanation:"在私有制商品经济条件下，私人劳动 和社会劳动之间的矛盾是商品经济的基本 矛盾。在资本主义制度下，这种矛盾进一 步发展成资本主义的基本矛盾，即生产社 会化和生产资料资本主义私人占有之间的 矛盾，正是这一矛盾的不断运动，才使资本 主义制度最终被社会主义制度所代替具有了 客观必然性。A正确。B、C、D是资本主义基 本矛盾在经济和阶级关系上的具体体现。"},
  {id:138,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"当前，百年变局加速演进，世界进入新的动荡变革期。近年来，国际金融市场动荡不安，世界 经济复苏脆弱乏力。有分析指出，经济衰退与扩张交替出现，过去50年里每8年就发生一轮 全球经济衰退，而每一次经济危机都会造成社会财富的巨大浪费。资本主义经济危机的本质特 征是",options:["A. 虚拟经济脱离实体经济","B. 社会生产结构严重失调","C. 周期性爆发","D. 生产相对过剩"],answer:"D",explanation:"生产过剩是资本主义经济危机的本 质特征，但是这种过剩是相对过剩，即相对 于劳动人民有支付能力的需求来说社会生 产的商品显得过剩，而不是与劳动人民的实 际需要相比的绝对过剩。D 正确。资本主 义经济危机具有周期性，这是由资本主义基 本矛盾运动的阶段性决定的。当资本主义 基本矛盾达到尖锐化程度时，社会生产结构 严重失调，引发经济危机。B、C 都不是本质 特征，不符合题意。A 是垄断资本主义的金 融化程度不断提高的表现之一，不符合题意。 点 拨 教材上的原文即“生产过剩是资本 主义经济危机的本质特征”,当然这种过剩 是相对过剩。"},
  {id:139,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"经济危机实际上是资本主义条件下以强制的方式解决社会再生产的实现问题的途径。资本主义 经济危机具有周期性，这是由",options:["A. 社会资本再生产的周期性决定的","B. 资本主义基本矛盾运动的阶段性决定的","C. 工人运动进入低潮和重新高涨的周期运动决定的","D. 货币资本、生产资本、 商品资本三种职能形式在时间上的继起性决定的"],answer:"B",explanation:"（本题解析见原书解析分册）"},
  {id:140,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"资本主义国家的对内职能，主要是",options:["A. 社会管理职能","B. 政治统治的职能","C. 管理通信、交通、水利等事业的职能","D. 管理文教、卫生保健、社会福利等事业的职能"],answer:"B",explanation:"30 36"},
  {id:141,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"据媒体报道，美国教育部下属机构国家教育统计中心网站曾经在“每日语录”一栏中引用毛泽 东“对自己，‘学而不厌’;对人家，‘诲而不倦’”的名言，国家教育统计中心因此遭到猛烈 抨击。有美国参议员出面表示，教育部必须解释为何引用“共产主义者”的话。该中心网站被 迫删除毛泽东的这句话，换成了林肯的一个警句。美国如此“言论自由”的国家，容不下毛泽 东的一句有关学习的语录，不仅显示了美国政治制度在世界多元文化面前的“小气”,也表明 了资本主义国家的社会管理职能与政治统治职能的紧密联系。从根本上说，资本主义国家的社 会管理职能是",options:["A. 与政治统治职能并重的","B. 服务于政治统治职能的","C. 高于政治统治职能的","D. 政治统治职能的核心"],answer:"B",explanation:"常见的垄断组织有卡特尔、辛迪加、 托拉斯和康采恩等。尽管垄断组织的形式 多种多样，且不断变化发展，但它们在本质 上是一样的，即通过联合实现独占和瓜分商 品生产和销售市场，操纵垄断价格，以攫取 高额垄断利润。A正确。 · 资本主义国家的对内职能，主要是政 治统治的职能。国家的社会管理职能，即运 用各种权力和资源对包括通信、交通、水利、 文化教育、卫生保健、社会福利等事业进行 管理，以保证社会生活的正常进行。国家的 社会管理职能与政治统治职能是紧密联系 的，从根本上说国家的社会管理职能是服 务于其政治统治职能的。B正确。"},
  {id:142,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"列宁根据他所处时代的实践曾指出，资本主义发展到垄断资本主义，进而发展到帝国主义，便 具有其基本特征。这些基本特征中，在经济生活中起决定作用的是",options:["A. 金融寡头","B. 资本家国际垄断同盟","C. 资本输出","D. 垄断组织"],answer:"D",explanation:"列宁根据他所处时代的实践曾指出， 资本主义发展到垄断资本主义，进而发展到 帝国主义，便具有五个基本特征：① 垄断组 织在经济生活中起决定作用；②在金融资本 的基础上形成金融寡头的统治；③资本输出 有了特别重要的意义；4瓜分世界的资本家 国际垄断同盟已经形成；5 最大资本主义大 国已把世界上的领土瓜分完毕。这些特征 集中体现了帝国主义的实质，即垄断资本凭 借垄断地位，获取高额垄断利润。D 正确，"},
  {id:143,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"在资本主义的自由竞争中，在剩余价值规律、竞争规律和资本积累规律的作用下，必然引起生 产集中和资本集中，生产集中和资本集中发展到一定阶段必然引起垄断，这是资本主义发展的 客观规律。资本集中是指",options:["A. 国家政权和私人垄断资本融合在一起的过程","B. 大资本吞并小资本，或由许多小资本合并而成大资本的过程","C. 工业垄断资本和银行垄断资本融合在一起的过程","D. 个别资本通过剩余价值的资本化来增大资本的总量"],answer:"B",explanation:"B正确。国家垄断资本主义是国家 政权和私人垄断资本融合在一起的垄断资 本主义，A不符合题意。金融资本是由工业 垄断资本和银行垄断资本融合在一起而形 成的一种垄断资本。C 错误。D 是指资本 积聚。"},
  {id:144,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"垄断是通过一定的垄断组织形式实现的。垄断组织是指在一个或几个经济部门中占据垄断地位 的大企业联合。垄断组织的形式多种多样，而且在各个国家、各个时期也不同。尽管垄断组织 的形式多种多样，且不断变化发展，但它们在本质上是一样的，都是",options:["A. 通过联合来操纵垄断价格以攫取高额垄断利润","B. 通过签订各种协定阻止其他企业进入高利润行业","C. 通过消除竞争达到独自占有市场的目的","D. 通过兼并小企业以达到生产集中和资本集中的目的"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:145,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"金融资本是由工业垄断资本和银行垄断资本融合在一起而形成的一种垄断资本。金融资本的形 成主要是通过",options:["A. 金融联系、资本参与和人事参与","B. 参与制、个人联合、建立政策咨询机构","C. 生产集中、资本集中和金融联系","D. 人事参与、金融创新和金融自由化"],answer:"A",explanation:"金融资本是由工业垄断资本和银行 垄断资本融合在一起而形成的一种垄断资 本。随着生产集中和垄断的发展，银行资本 由集中走向垄断，工业垄断资本对银行的依 赖增强，大银行同大企业的金融联系更加密 切，形成了固定的关系。通过金融联系、资 本参与和人事参与，银行垄断资本和工业垄 断资本密切地融合在一起，产生了一种新型 的垄断资本，即金融资本。A正确。"},
  {id:146,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"金融寡头是指操纵国民经济命脉，并在实际上控制国家政权的少数垄断资本家或垄断资本家集 团。金融寡头在经济领域中的统治主要是通过“参与制”实现的。所谓“参与制”是指金融寡头",options:["A. 通过把自己的代理人送进政府或议会来为其垄断统治服务","B. 通过建立政策咨询机构等方式参与政府的政策制定","C. 通过掌握一定数量的股票来层层控制企业","D. 私人与国家共同投资开办合营企业"],answer:"C",explanation:"金融寡头在经济领域中的统治主要 是通过“参与制”实现的。所谓“参与制”, 即金融寡头通过掌握一定数量的股票来层 层控制企业的制度。C 正确。金融寡头对 国家机器的控制，主要是通过同政府的“个 人联合”来实现的。这种联合有多种途径， 如金融寡头直接把自己的代理人送进政府 或议会，通过掌握政权，利用政治力量为其 垄断统治服务。A 错误。金融寡头还通过 建立政策咨询机构等方式对政府的政策施 加影响。B 错误。“国家和私人共同投资开 办合营企业”是国家垄断资本主义的主要形 式之一。D 错误。 A、B、C错误。"},
  {id:147,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"垄断资本的实质在于获取垄断利润，垄断利润是垄断资本家凭借其在社会生产和流通中的垄断 地位而获得的超过平均利润的高额利润。垄断利润的形成，关键在于",options:["A. 垄断组织能够把包罗万象的社会生产全部包下来","B. 垄断消除了产生竞争的经济条件","C. 垄断条件下的竞争采取的完全是非经济的手段","D. 垄断组织在经济生活中起了决定性作用"],answer:"D",explanation:"垄断资本的实质在于获取垄断利润， 垄断利润是垄断资本家凭借其在社会生产 和流通中的垄断地位而获得的超过平均利 润的高额利润。垄断利润的形成，关键在 于垄断组织在经济生活中起了决定性作用， 际垄断同盟的形式，但不是主要形式。当代 国际垄断同盟的主要形式是国家垄断资本 主义的国际联盟，A 正确。 · 从而阻碍了资本在各部门之间的自由转移， 限制了利润平均化的趋势，这样一来，垄断 资本家有可能长期获得大大超过平均利润 的垄断利润。D 正确。"},
  {id:148,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"第二次世界大战后，在所有发达资本主义国家，国家垄断资本主义无论在广度上还是在深度上 都有了更迅速、更普遍的发展，国家干预深入到资本主义的生产、流通、分配和消费的各个环 节。国家垄断资本主义尽管有各种不同的具体形式，其实质都是",options:["A. 国家政权取代私人垄断资本的一种新型垄断资本主义","B. 国家运用财政政策、货币政策等经济手段，对社会总供求进行调节","C. 私人垄断资本利用国家机器来为其发展服务的手段","D. 国家与私人共有、合营企业"],answer:"C",explanation:"国家垄断资本主义尽管有各种不同 的具体形式，其实质都是私人垄断资本利用 国家机器来为其发展服务的手段，是私人垄 断资本为了维护垄断统治和获取高额垄断 利润，而和国家政权相结合的一种垄断资本 主义形式，C 正确。B 和D 都是国家垄断资 本主义主要形式中的一种，不符合题意。国 家垄断资本主义是国家政权和私人垄断资 本融合在一起的垄断资本主义，A 错误。"},
  {id:149,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"随着资本输出的不断增加和垄断资本势力范围的迅速扩大，各国之间的经济联系日益密切，同 时，彼此间的竞争更为激烈，矛盾和冲突也更为突出。在这一背景下，各资本主义国家的垄断 组织，通过订立协议建立起国际垄断资本的联盟，即国际垄断同盟，以便在世界范围形成垄 断，并在经济上瓜分世界。当代国际垄断同盟的主要形式是",options:["A. 国家垄断资本主义的国际联盟","B. 国际卡特尔","C. 国际托拉斯","D. 国际康采恩"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:150,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"经济全球化是当代世界经济的重要特征之一，也是世界经济发展的重要趋势。为经济全球化提 供了坚实的物质基础和根本的推动力的是",options:["A. 科学技术的进步和生产力的发展","B. 跨国公司在全球范围内的迅速发展","C. 各国经济体制的变革和国际经济组织的发展","D. 金融自由化与金融创新"],answer:"A",explanation:"（本题解析见原书解析分册）"},
  {id:151,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"第二次世界大战后，由于多种社会因素的影响，资本主义发生了一系列变化。在劳资关系方 面 ，劳动对资本的隶属从资本主义发展初期的形式上的隶属逐渐成为实质上的隶属。之所以发 生这种变化，是因为",options:["A. 资本家与雇佣工人的关系从“自由平等”变为人身依附","B. 终身雇佣和职工持股等方式使得劳动者成为资本家的代理人","C. 劳动者个人的技能不再对生产过程和结果具有决定意义","D. 雇佣劳动者的剩余劳动不再是剩余价值的唯一源泉"],answer:"C",explanation:"在资本主义条件下，劳动从进入生产 过程开始，就已经隶属于资本，在表面平等 的交换关系背后，是资本对劳动的实际支配 和控制。在资本主义发展的初期，资本家指 挥下的劳动只是形式上隶属于资本，随着机 器大工业生产体系的建立和生产工具使用 的社会化程度提高，劳动者个人的技能不再 对生产过程和结果具有决定意义，劳动对 资本的隶属就成为实质上的隶属。C 正确。 与以往的剥削制度不同，资本家与雇佣 工人的关系不是完全占有，也不是人身依 附，而是基于劳动者人身自由基础上的 “平等”关系，剥削带有一定的隐蔽性。A 错误。劳动者属于受剥削的阶级，不可能成 为资本家或其代理人。而且终身雇佣和职 工持股也只是让工人产生归属感，从而更加 自觉地服从资本家的统治，与题目所问的劳 动对资本的实质上的隶属不相符。B 错误。 雇佣劳动者的剩余劳动是剩余价值的唯一 源泉。即使是在生产自动化条件下，雇佣工 人的剩余劳动仍然是这种剩余价值的唯一 源泉。D 错误。 垄断是在自由竞争中形成的，是作为自 由竞争的对立面产生的。但是，垄断并不能 消除竞争，反而使竞争变得更加复杂和激 烈。这是因为：1垄断没有消除产生竞争的 经济条件。②垄断必须通过竞争来维持。 社会生产是复杂多样的，任何垄断组织都 不可能把包罗万象的社会生产全部包下来。 A、B错误。垄断条件下的竞争同自由竞争 相比，具有一些新特点。在竞争手段上，自 由竞争主要运用经济手段，如通过改进技 术、提高劳动生产率、降低产品成本等以战 胜对手，而垄断条件下的竞争除了采取各种 形式的经济手段外，还采取非经济的手段， 使竞争变得更加复杂、激烈。C 错误(并不 是“完全”采取非经济的手段)。 鑫兆源"},
  {id:152,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"进入21世纪以来，随着经济全球化的深入发展，新一轮科技革命和产业变革进入空前密集括 跃期、社会化大生产在世界范围内更大规模、更广范围、更深层次展开，世界格局深度调整， 资本主义呈现出一些新变化、新特征。当代资本主义最突出、最鲜明、最主要的特征是",options:["A. 社会阶级层级结构呈现复杂性、多样化","B. 科技创新加速资本主义生产方式变化","C. 国际金融资本的垄断","D. 发达资本主义国家在世界范围内推行霸权主义和强权政治"],answer:"C",explanation:"（本题解析见原书解析分册）"},
  {id:153,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"从空想社会主义诞生到《共产党宣言》问世，其间空想社会主义经历了330多年的发展历程。 空想社会主义的开山之作是",options:["A. 《太阳城》","B. 《乌托邦》","C. 《自然法典》","D. 《 论法制或法律的原则》"],answer:"B",explanation:"托马斯 · 莫尔于1516年发表的《 乌 托邦》是空想社会主义的开山之作。受《乌 托邦》一书的影响，意大利的康帕内拉于 1602年在监狱里写出了《太阳城》,到了 早期的国际垄断同盟的主要形式是 国际卡特尔，其显著特点是它的活动主要是 在流通领域，而不是一种直接的生产上的联 合。国际托拉斯、国际康采恩也是早期的国 32"},
  {id:154,chapter:"马原",sub:"马克思主义基本原理",type:"single",question:"从莫尔1516年发表《乌托邦》到现在，社会主义已经有500多年的历史了。社会主义发展史 上的第一次历史性飞跃是指",options:["A. 19 世纪中叶，社会主义从空想发展到科学","B. 20 世纪初，社会主义从理论发展到建立社会主义制度的实践","C. 社会主义从一国实践发展到多国实践","D. 20 世纪70年代末开始的社会主义改革"],answer:"A",explanation:"· 出结论：社会主义可能首先在少数甚至在 单独一个资本主义国家内获得胜利。”C 正 确，A错误。 社会主义发展史上的第一次历史性 在这一理论的基础上，列宁根据对俄国 国内革命形势和国际状况的科学分析，进一 步得出了社会主义可能在经济文化相对落 后的俄国首先取得胜利的结论，并且将这一 理论付诸实践，在革命形势成熟的条件下， 领导了俄国十月革命。B、D 错误。 飞跃是指19世纪中叶社会主义从空想发展 到科学。A 正确。20世纪初，社会主义从理 论发展到建立社会主义制度的实践，是社会 主义发展史上的第二次历史性飞跃。从 一 国实践发展到多国实践，是社会主义发展进 程中又一次历史性飞跃。20世纪70年代 末开始的社会主义改革，是社会主义向深度 的发展。B、C、D不符合题意。"},
